  /* ---------- 角色创建 ---------- */
  function enterCreation(){
    clearScreen();
    setTag({ title: '角色创建' });
    const cc = story.settings.charCreation;
    const allocAttrs = (story.character.attributes || []).filter(a => a.alloc);
    const allocSkills = (story.character.skills || []).filter(s => s.alloc);
    const alloc = {};
    let pool = +cc.points || 0;
    let portrait = null;

    const elx = $('pText');
    elx.innerHTML = '';
    elx.classList.add('done');   // 创建界面不需要打字光标
    elx.classList.add('creation');
    const wrap = document.createElement('div');
    wrap.className = 'cc';
    wrap.innerHTML = `
      <div class="cc-title mono">◈ 角色创建</div>
      <div class="cc-intro">${esc(cc.intro || '创建你的角色。')}</div>
      ${(cc.portraits && cc.portraits.length) ? `<div class="sec-title">选择立绘</div><div class="cc-thumbs" id="ccThumbs"></div>` : ''}
      <div class="sec-title">身份</div>
      <div class="cc-row"><label>姓名</label><input id="ccName" maxlength="12" placeholder="输入角色姓名"></div>
      ${(cc.profileCats || []).map(cat => cat.type === 'select'
        ? `<div class="cc-row"><label>${esc(cat.name)}</label><select id="cc_${esc(cat.id)}">${(cat.options || []).map(o => `<option>${esc(o)}</option>`).join('')}</select></div>`
        : `<div class="cc-row"><label>${esc(cat.name)}</label><input id="cc_${esc(cat.id)}" maxlength="20" placeholder="自由输入"></div>`).join('')}
      ${(allocAttrs.length + allocSkills.length) ? `<div class="sec-title">能力分配 <span class="mono" id="ccPool">剩余 ${pool} 点</span></div>
        ${allocAttrs.map(a => allocRow(a)).join('')}
        ${allocSkills.map(s => allocRow(s)).join('')}` : ''}
    `;
    elx.appendChild(wrap);

    function allocRow(def){
      return `<div class="cc-row alloc" data-id="${esc(def.id)}">
        <label>${esc(def.name)} <span class="mono dim">基础 ${def.value}</span></label>
        <div class="alloc-ctl"><button class="al-btn" type="button" data-d="-1">－</button>
        <span class="mono al-val" id="al_${esc(def.id)}">0</span>
        <button class="al-btn" type="button" data-d="1">＋</button></div>
      </div>`;
    }
    if (cc.portraits && cc.portraits.length){
      const tb = wrap.querySelector('#ccThumbs');
      cc.portraits.forEach((p, idx) => {
        const t = document.createElement('img');
        t.src = p;
        t.alt = '';
        t.className = 'cc-thumb';
        t.addEventListener('click', () => {
          portrait = p;
          tb.querySelectorAll('.cc-thumb').forEach(x => x.classList.remove('sel'));
          t.classList.add('sel');
        });
        tb.appendChild(t);
      });
    }
    function refreshAlloc(){
      wrap.querySelectorAll('.alloc').forEach(row => {
        const id = row.dataset.id;
        const v = alloc[id] || 0;
        row.querySelector('.al-val').textContent = v;
        row.querySelectorAll('.al-btn').forEach(b => {
          if (+b.dataset.d > 0) b.disabled = pool <= 0;
          else b.disabled = v <= 0;
        });
      });
      const pv = wrap.querySelector('#ccPool');
      if (pv) pv.textContent = '剩余 ' + pool + ' 点';
    }
    wrap.querySelectorAll('.alloc').forEach(row => {
      row.querySelectorAll('.al-btn').forEach(b => b.addEventListener('click', () => {
        const id = row.dataset.id;
        const d = +b.dataset.d;
        const curVal = alloc[id] || 0;
        if (d > 0 && pool <= 0) return;
        if (d < 0 && curVal <= 0) return;
        alloc[id] = curVal + d;
        pool -= d;
        refreshAlloc();
      }));
    });
    refreshAlloc();

    primaryBtn('开始故事 ▸', () => {
      st.profile = { name: (wrap.querySelector('#ccName').value || '').trim() || '无名者', fields: {} };
      (cc.profileCats || []).forEach(cat => {
        const elc = wrap.querySelector('#cc_' + cat.id);
        if (elc) st.profile.fields[cat.id] = elc.value;
      });
      st.portrait = portrait;
      Object.keys(alloc).forEach(id => {
        if (st.attrs[id] != null) st.attrs[id] += alloc[id];
        else if (st.skills[id] != null) st.skills[id] += alloc[id];
      });
      showStatus();
      enterNode(startId());
    });
  }

  /* ---------- 地图菜单 ---------- */
  /* 前往规则：默认只能去已经到访过的地点，避免通过地图跳过剧情 */
  function travelMode(){
    return mapCfg().travelMode === 'always' ? 'always' : 'visited';
  }
  function renderMapModal(){
    const m = mapCfg();
    const pal = ntTilePalette();
    const cell = 26;
    const always = travelMode() === 'always';
    let grid = `<div class="map-grid play" style="--cols:${m.cols};--cell:${cell}px">`;
    for (let y = 0; y < m.rows; y++){
      const row = String(m.tiles[y] || '');
      for (let x = 0; x < m.cols; x++){
        const code = +row[x] || 0;
        const tile = NT_TILES[code] || NT_TILES[0];
        const poi = (m.pois || []).find(p => p.x === x && p.y === y);
        const here = poi && poi.node && poi.node === curId;
        const seen = poi && st.visited[poi.id];
        let inner = tile.g || '';
        if (poi) inner = `<span class="poi${seen ? ' seen' : ''}">◆</span>`;
        grid += `<div class="mcell${poi ? ' has-poi' : ''}${here ? ' here' : ''}" style="background:${pal[code] || pal[0]}" title="${esc(poi ? poi.name + (seen || always ? '' : '（未到访）') : tile.t)}">${inner}</div>`;
      }
    }
    grid += '</div>';
    const herePoi = (m.pois || []).find(p => p.node === curId);
    const pois = (m.pois || []).map(p => {
      const node = p.node && findNode(p.node);
      const here = p.node === curId;
      const visited = !!st.visited[p.id];
      const can = node && (always || visited);
      let state;
      if (!p.node) state = '暂无目的地';
      else if (!node) state = '节点丢失';
      else if (here) state = '当前位置';
      else if (can) state = '可前往';
      else state = '未到访，先走到那里才能传送';
      return `<div class="mrow${here ? ' here' : ''}">
        <div style="flex:1">
          <div class="nm">◆ ${esc(p.name)}${here ? '<span class="tag-here">当前位置</span>' : ''}</div>
          <div class="ds mono">坐标 ${p.x},${p.y} · ${state}${visited ? ' · 已到访' : ''}</div>
        </div>
        ${node && can && !here ? `<div class="ops"><button class="p-btn" data-goto="${esc(p.node)}">前往</button></div>` : ''}
      </div>`;
    }).join('');
    const legend = NT_TILES.map(t =>
      `<span class="lg"><i style="background:${pal[t.v]}"></i>${t.t}</span>`).join('');
    const rule = always ? '可自由前往任意地点' : '只能前往已经到访过的地点';
    return `<div class="map-head mono dim">${m.cols}×${m.rows} · ${rule}${herePoi ? ' · 你在这里：' + esc(herePoi.name) : ''}</div>
      <div class="map-wrap">${grid}</div>
      <div class="map-legend">${legend}</div>
      ${pois ? `<div class="sec-title">地点</div>${pois}` : '<div class="dead">这张地图还没有标注地点。</div>'}`;
  }
  function openMap(){
    const m = mapCfg();
    if (!m || !m.enabled) return;
    ntModal.open(esc(m.title || '地图'), renderMapModal(), [{ label: '关闭' }], { size: 'wide' });
    $('modalBody').querySelectorAll('[data-goto]').forEach(b =>
      b.addEventListener('click', () => { ntModal.close(); enterNode(b.dataset.goto); }));
  }

  /* ---------- 菜单 ---------- */
  function toggleEquip(id){
    const eq = equipDef(id);
    if (!eq) return;
    if (st.equipped[eq.slot] === id) st.equipped[eq.slot] = null;
    else st.equipped[eq.slot] = id;
  }
  function openMenu(kind){
    if (!st){ ntToast('游戏还没开始', 'warn'); return; }
    if (kind === 'bag' && !feat('inventory')){ ntToast('这个游戏没有开启「背包」', 'warn'); return; }
    if (kind === 'quest' && !feat('quests')){ ntToast('这个游戏没有开启「任务」', 'warn'); return; }
    if (kind === 'gallery' && !feat('gallery')){ ntToast('这个游戏没有开启「图鉴」', 'warn'); return; }
    if (kind === 'map' && !(story.settings.map && story.settings.map.enabled)){ ntToast('这个游戏没有开启「地图」', 'warn'); return; }
    if (kind === 'quest'){
      const act = Object.values(st.quests).filter(q => q.status === 'active');
      const done = Object.values(st.quests).filter(q => q.status === 'done');
      let h = act.map(q => `<div class="mrow"><div><div class="nm">◈ ${esc(q.name)}</div><div class="ds">${esc(q.desc || '')}</div></div></div>`).join('');
      h += done.map(q => `<div class="mrow done"><div><div class="nm">✓ ${esc(q.name)}</div><div class="ds">${esc(q.desc || '')}</div></div></div>`).join('');
      ntModal.open('任务日志', h || '<div class="dead">还没有接到任务</div>');
    }
    else if (kind === 'char'){
      let h = '';
      if (st.portrait && story.settings && story.settings.portraits){
        h += `<div class="char-ava"><img src="${st.portrait}" alt=""></div>`;
      }
      h += `<div class="mrow"><div><div class="nm">${esc(st.profile.name || '无名者')}</div>
        <div class="ds">${Object.keys(st.profile.fields || {}).map(k => {
          const cat = ((story.settings.charCreation || {}).profileCats || []).find(c => c.id === k);
          return esc(cat ? cat.name : k) + '：' + esc(st.profile.fields[k]);
        }).join('　·　') || '尚未填写角色设定'}</div></div></div>`;
      h += '<div class="sec-title">属性</div>';
      (story.character.attributes || []).forEach(a => {
        const v = st.attrs[a.id] != null ? st.attrs[a.id] : 0;
        const m = +a.max || 0;
        const pct = m ? Math.min(100, Math.round(v / m * 100)) : 0;
        h += `<div class="mrow"><div style="flex:1"><div class="nm">${esc(a.name)}　<span class="mono">${v}${m ? ' / ' + m : ''}</span></div>
          ${m ? `<div class="q-bar"><i style="width:${pct}%"></i></div>` : ''}</div></div>`;
      });
      h += '<div class="sec-title">技能</div>';
      (story.character.skills || []).forEach(s => {
        h += `<div class="mrow"><div class="nm">${esc(s.name)}　<span class="mono">＋${st.skills[s.id] != null ? st.skills[s.id] : 0}</span></div></div>`;
      });
      if (feat('equipment')){
        h += '<div class="sec-title">装备</div>';
        ['weapon', 'armor', 'accessory'].forEach(slot => {
          const eq = st.equipped[slot] && equipDef(st.equipped[slot]);
          const stTxt = eq ? [
            +eq.atk ? '攻 +' + (+eq.atk) : '',
            +eq.def ? '防 +' + (+eq.def) : ''
          ].filter(Boolean).join(' · ') : '';
          h += `<div class="mrow"><div><div class="nm">${slotName(slot)}　${eq ? esc(eq.name) : '<span class="dim">— 空 —</span>'}</div>
            ${stTxt ? `<div class="ds">${stTxt}</div>` : ''}</div></div>`;
        });
        const eb = equipBonus();
        const total = [eb.atk ? '攻 +' + eb.atk : '', eb.def ? '防 +' + eb.def : ''].filter(Boolean).join(' · ') || '无加成';
        h += `<div class="dim mini" style="margin-top:6px">装备合计：${total}</div>`;
      }
      if (story.character.currency){
        h += `<div class="sec-title">货币</div><div class="mrow"><div class="nm">${esc(story.character.currency.name)}　<span class="mono">${st.currency}</span></div></div>`;
      }
      ntModal.open('角色状态', h);
    }
    else if (kind === 'bag'){
      const counts = {};
      st.inventory.forEach(id => counts[id] = (counts[id] || 0) + 1);
      let h = '';
      if (feat('equipment') && st.gear.length){
        h += '<div class="sec-title">装备</div>';
        st.gear.forEach(id => {
          const eq = equipDef(id);
          if (!eq) return;
          const on = st.equipped[eq.slot] === id;
          const stTxt = [
            +eq.atk ? '攻 +' + (+eq.atk) : '',
            +eq.def ? '防 +' + (+eq.def) : ''
          ].filter(Boolean).join(' · ');
          h += `<div class="mrow${on ? ' here' : ''}"><div style="flex:1">
            <div class="nm">${esc(eq.name)}${on ? ' <span class="tag-here">已装备</span>' : ''}</div>
            <div class="ds">${slotName(eq.slot)}${stTxt ? ' · ' + stTxt : ''}${eq.desc ? ' · ' + esc(eq.desc) : ''}</div>
          </div><div class="ops"><button class="p-btn" data-equip="${esc(id)}">${on ? '卸下' : '装备'}</button></div></div>`;
        });
      }
      const itemRows = Object.keys(counts).map(id => {
        const it = itemDef(id);
        return `<div class="mrow"><div><div class="nm">${esc(it ? it.name : id)}${counts[id] > 1 ? ' ×' + counts[id] : ''}</div>
          <div class="ds">${esc(it && it.desc ? it.desc : '')}</div></div></div>`;
      }).join('');
      if (itemRows) h += '<div class="sec-title">物品</div>' + itemRows;
      ntModal.open('背包', h || '<div class="dead">背包是空的</div>');
      $('modalBody').querySelectorAll('[data-equip]').forEach(b => b.addEventListener('click', () => {
        toggleEquip(b.dataset.equip);
        openMenu('bag');
      }));
    }
    else if (kind === 'gallery'){
      const g = lsGet(gKey()) || {};
      const endings = story.nodes.filter(n => n.type === 'ending');
      const got = endings.filter(n => g[n.id]).length;
      const cells = endings.map(n => {
        const rec = g[n.id];
        return `<div class="gal-cell ${rec ? 'got' : 'lock'}">
          <div class="g-nm">${rec ? esc(n.ending.name || '无名结局') : '？？？'}</div>
          <div class="g-ds">${rec ? esc(n.ending.desc || '') : '尚未达成的结局'}</div>
          ${rec ? `<div class="g-st mono">◈ 达成于 ${new Date(rec.ts).toLocaleString()}</div>` : ''}
        </div>`;
      }).join('');
      ntModal.open(`结局图鉴（${got}/${endings.length}）`,
        endings.length ? `<div class="gal-grid">${cells}</div>` : '<div class="dead">这个游戏还没有结局卡</div>');
    }
    else if (kind === 'map'){
      openMap();
    }
    else if (kind === 'save'){
      let h = '';
      for (let slot = 1; slot <= 3; slot++){
        const d = lsGet(sKey(slot));
        const node = d && findNode(d.node);
        h += `<div class="mrow"><div class="slot-info" style="flex:1">
          ${d ? `<b>存档位 ${slot}</b>　${new Date(d.ts).toLocaleString()}<br>进度：${esc(node ? (node.title || node.id) : d.node)}${d.state && d.state.timeDay ? '　·　第' + d.state.timeDay + '天' : ''}`
              : `<b>存档位 ${slot}</b><br><span class="dim">— 空 —</span>`}
        </div><div class="ops">
          <button class="p-btn" data-slot="${slot}" data-op="save">${d ? '覆盖' : '保存'}</button>
          ${d ? `<button class="p-btn" data-slot="${slot}" data-op="load">读取</button><button class="p-btn warn" data-slot="${slot}" data-op="del">删除</button>` : ''}
        </div></div>`;
      }
      ntModal.open('存档 / 读档', h);
      $('modalBody').querySelectorAll('[data-slot]').forEach(b => {
        b.addEventListener('click', () => {
          const slot = +b.dataset.slot, op = b.dataset.op;
          if (op === 'save'){
            const ok = lsSet(sKey(slot), { ts: Date.now(), node: curId, state: st });
            ntToast(ok ? '已保存到存档位 ' + slot : '保存失败（浏览器存储空间不足）', ok ? '' : 'warn');
            openMenu('save');
          } else if (op === 'load'){
            const d = lsGet(sKey(slot));
            if (!d) return;
            st = d.state;
            st.profile = st.profile || { name: '', fields: {} };
            st.portrait = st.portrait || null;
            st.visited = st.visited || {};
            st.path = st.path || [];
            st.gear = st.gear || [];
            st.equipped = st.equipped || { weapon: null, armor: null, accessory: null };
            st.timeDay = st.timeDay || ((story.settings.time || {}).startDay || 1);
            st.timeMin = st.timeMin || 0;
            showStatus();
            ntModal.close();
            ntToast('已读取存档位 ' + slot);
            enterNode(d.node);
          } else {
            lsDel(sKey(slot));
            openMenu('save');
          }
        });
      });
    }
  }

  /* ---------- 界面大小 ---------- */
  function openUiScale(){
    const cur = ntUiScaleGet('player');
    const rows = NT_UI_SCALES.map(s => {
      const on = Math.abs(s - cur) < 0.001;
      return `<button class="p-btn${on ? ' primary' : ''}" data-scale="${s}">${Math.round(s * 100)}%</button>`;
    }).join('');
    ntModal.open('界面大小（' + ntUiScalePct('player') + '）',
      `<div class="scale-row">${rows}</div>
       <div class="dim mini" style="margin-top:12px">只影响本机显示，不会改变游戏内容或存档。选择后立即生效，并记住你的选择。</div>`,
      [{ label: '关闭' }]);
    $('modalBody').querySelectorAll('[data-scale]').forEach(b => b.addEventListener('click', () => {
      ntUiScaleSet('player', +b.dataset.scale);
      ntUiScaleApply('player');
      ntModal.close();
      ntToast('界面大小：' + ntUiScalePct('player'));
    }));
  }

  /* ---------- 播放器快捷键 ---------- */
  document.addEventListener('keydown', e => {
    if (Engine.view !== 'player') return;
    if (!$('modalRoot').classList.contains('hidden')) return;
    const ae = document.activeElement;
    if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key >= '1' && e.key <= '9'){
      const btns = [...document.querySelectorAll('#pActions .opt-btn')].filter(b => !b.disabled);
      const b = btns[+e.key - 1];
      if (b) b.click();
      return;
    }
    if (e.key === 'Enter' || e.key === ' '){
      const b = document.querySelector('#pActions .cont-btn');
      if (b){ e.preventDefault(); b.click(); return; }
      /* 演出模式：空格 / Enter 也能「点一下翻一页」 */
      if (pageClick){ e.preventDefault(); pageClick(); }
      return;
    }
    const menuKeys = { q: 'quest', c: 'char', b: 'bag', m: 'map', g: 'gallery', s: 'save' };
    const k = e.key.toLowerCase();
    if (menuKeys[k]){ e.preventDefault(); openMenu(menuKeys[k]); }
  });

  /* 编辑器里「试听」用：把一段音效连打几下。
     试听结束后把原来的配置还回去 —— 否则试听会污染正在试玩的存档音效。 */
  function previewSfx(cfg){
    const back = sfxCfg;
    sfxSet(cfg || ntDefaultSfx());
    sfxLast = 0;
    let i = 0;
    const t = setInterval(() => {
      typeTick();
      if (++i >= 10){ clearInterval(t); sfxSet(back); }
    }, 70);
  }

  return {
    start, stop, openMenu, openUiScale, openNpcCard, previewSfx,
    getState: () => st,
    getCurrent: () => curId,
    getPath: () => (st && Array.isArray(st.path) ? st.path.slice() : []),
    getSessionStart: () => sessionStart,
    isStage: () => !!$('pMain') && $('pMain').classList.contains('stage-on')
  };
})();
</script>
