<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A氏的新手教程</title>
<style id="appCss">/* ============================================================
   NEXUS-TEXT · 文字游戏引擎样式
   结构：变量 → 布局 → 编辑器 → 检查器 → 地图 → 播放器 → 弹窗
        → 主题（cyber / cream / minimal / gilt / tactical / moonblue / rebel / ink / letter / crayon）
   ============================================================ */

/* ---------- 基础变量（默认 = 机能风） ---------- */
:root{
  --bg:#0b0f14; --panel:#10161d; --panel2:#0b1118; --deep:#0a1219;
  --btn:#0a1620; --hov:#0e2230; --onacc:#04141b;
  --border:#1f2a36; --acc:#1f4a5a; --over:rgba(10,18,25,.85);
  --txt:#c9d1d9; --dim:#6e8091;
  --cyan:#00d9ff; --cyan-soft:#9feefc; --orange:#ff9e2c;
  --red:#ff7b72; --green:#56d364; --purple:#b7a6ff;
  --edge:#7d8b99;
  --tile-0:#0d1520; --tile-1:#233649; --tile-2:#0f2c3c;
  --tile-3:#2e4416; --tile-4:#161e26; --tile-5:#3a2a14;
  --tc-story:#378ADD; --tc-choice:#7F77DD; --tc-check:#EF9F27; --tc-effect:#0F6E56;
  --tc-quest:#D4537E; --tc-ending:#A32D2D; --tc-jump:#1D9E75; --tc-random:#9C6ADE;
  --tc-cg:#2F7F9E; --tc-battle:#C2410C;
  --radius:6px; --radius-sm:4px;
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --font:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  --font-mono:"Cascadia Code",Consolas,"Courier New",monospace;
  --font-narr:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--txt);
  font-family:var(--font); font-size:14px; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:var(--font-mono)}
.hidden{display:none!important}
button{font-family:inherit;color:inherit}
button:focus{outline:none}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--dim)}
::-webkit-scrollbar-track{background:transparent}
::selection{background:var(--cyan);color:var(--onacc)}

/* ============================================================
   布局
   ============================================================ */
#app{height:100%}
#editorView{display:flex;flex-direction:column;height:100%;background:var(--bg)}
#topbar{
  height:54px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:var(--panel);border-bottom:1px solid var(--border);
}
.brand{color:var(--cyan);font-size:15px;font-weight:700;letter-spacing:2px;white-space:nowrap}
.brand span{color:var(--orange);margin:0 1px}
.title-input{
  background:var(--panel2);border:1px solid var(--border);color:var(--txt);
  padding:7px 11px;font-size:13px;width:190px;border-radius:var(--radius-sm);
}
.title-input:focus{outline:none;border-color:var(--cyan)}
.save-state{
  background:none;border:none;color:var(--dim);font-size:11px;cursor:pointer;
  padding:4px 2px;white-space:nowrap;letter-spacing:.5px;
}
.save-state.ok{color:var(--green)}
.save-state.dirty{color:var(--orange)}
.save-state.err{color:var(--red)}
.save-state:hover{text-decoration:underline}
.ui-scale{
  background:var(--panel2);border:1px solid var(--border);color:var(--dim);
  font:11px var(--mono, monospace);padding:5px 4px;border-radius:var(--radius-sm);
  cursor:pointer;width:64px;flex:none;
}
.ui-scale:focus{outline:none;border-color:var(--cyan)}
.theme-sel{
  background:var(--panel2);border:1px solid var(--border);color:var(--txt);
  font-size:11.5px;padding:5px 6px;border-radius:var(--radius-sm);
  cursor:pointer;width:118px;flex:none;
}
.theme-sel:focus{outline:none;border-color:var(--cyan)}
.scale-row{display:flex;flex-wrap:wrap;gap:8px}
.scale-row .p-btn{min-width:64px}
.feature-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;
  background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:9px 11px;margin-bottom:8px;
}
.feature-grid .chk{margin:0;font-size:12px}
.eq-card{
  background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:7px 8px;margin-bottom:6px;
}
.eq-card .f-row{margin-bottom:4px}
.eq-card .f-row:last-child{margin-bottom:0}
.spacer{flex:1}
.tb-group{display:flex;gap:6px;padding-left:10px;border-left:1px solid var(--border)}
.tb-btn{
  background:var(--btn);border:1px solid var(--border);color:var(--txt);
  padding:7px 12px;font-size:12.5px;cursor:pointer;border-radius:var(--radius-sm);white-space:nowrap;
}
.tb-btn:hover{border-color:var(--dim);color:#fff}
.tb-btn.primary{
  color:var(--onacc);background:var(--cyan);border-color:var(--cyan);font-weight:700;
  padding:8px 18px;letter-spacing:1px;
}
.tb-btn.primary:hover{filter:brightness(1.12)}
.tb-btn.icon{padding:7px 10px;color:var(--dim)}
.tb-btn.icon:hover{color:var(--cyan-soft)}

#editorMain{flex:1;display:flex;min-height:0}

/* 左侧卡片栏 */
#nodeToolbar{
  width:136px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:12px 9px;display:flex;flex-direction:column;overflow-y:auto;
}
.nt-label{color:var(--dim);font-size:10px;letter-spacing:2px;margin:10px 0 6px;white-space:nowrap}
.nt-label:first-child{margin-top:2px}
.nt-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.nt-btn{
  display:flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--border);
  color:var(--txt);padding:6px 7px;font-size:12px;cursor:pointer;border-radius:var(--radius-sm);
  text-align:left;line-height:1.2;
}
.nt-btn:hover{border-color:var(--cyan);color:var(--cyan-soft)}
.nt-btn .dot{width:7px;height:7px;border-radius:2px;flex:none;background:var(--tc,var(--cyan))}
.nt-btn[data-add="story"]{--tc:var(--tc-story)}
.nt-btn[data-add="choice"]{--tc:var(--tc-choice)}
.nt-btn[data-add="check"]{--tc:var(--tc-check)}
.nt-btn[data-add="effect"]{--tc:var(--tc-effect)}
.nt-btn[data-add="quest"]{--tc:var(--tc-quest)}
.nt-btn[data-add="ending"]{--tc:var(--tc-ending)}
.nt-btn[data-add="jump"]{--tc:var(--tc-jump)}
.nt-btn[data-add="random"]{--tc:var(--tc-random)}
.nt-btn[data-add="cg"]{--tc:var(--tc-cg)}
.nt-btn[data-add="battle"]{--tc:var(--tc-battle)}
.nt-btn.sm{font-size:11px;padding:5px 6px;color:var(--dim);justify-content:center}
.nt-row{display:flex;gap:5px}
.nt-row .nt-btn{flex:1}
/* 章节多选筛选 */
#chapterFilter{position:relative}
.cf-btn{
  width:100%;display:flex;justify-content:space-between;align-items:center;gap:6px;
  background:var(--panel2);border:1px solid var(--border);color:var(--txt);
  padding:6px 8px;font-size:12px;border-radius:var(--radius-sm);cursor:pointer;text-align:left;
}
.cf-btn:hover{border-color:var(--cyan)}
.cf-caret{color:var(--dim);font-size:10px;flex:none}
.cf-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cf-menu{
  position:fixed;width:224px;z-index:60;
  background:var(--panel);border:1px solid var(--acc);box-shadow:var(--shadow);
  padding:6px;max-height:300px;overflow:auto;
}
.cf-all{
  width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--border);
  color:var(--cyan-soft);font-size:12px;padding:6px 6px 8px;cursor:pointer;margin-bottom:4px;
}
.cf-all:hover{color:var(--cyan)}
.cf-row{display:flex;align-items:center;gap:7px;padding:5px 6px;font-size:12px;color:var(--txt);cursor:pointer;white-space:nowrap;overflow:hidden}
.cf-row:hover{background:var(--panel2)}
.cf-row input{accent-color:var(--cyan);margin:0;width:auto}
.cf-row span{overflow:hidden;text-overflow:ellipsis}
.cf-empty{color:var(--dim);font-size:11px;padding:6px}

/* 画布 */
#canvasWrap{flex:1;position:relative;overflow:hidden;background:var(--bg)}
#canvas{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#canvas.panning{cursor:grabbing}
#canvasHint{
  position:absolute;left:14px;bottom:12px;right:14px;pointer-events:none;
  color:var(--dim);font-size:11px;line-height:1.7;opacity:.72;
  max-width:520px;
}

/* 框选矩形 */
.select-box{fill:rgba(79,215,242,.10);stroke:var(--cyan);stroke-width:1.2;stroke-dasharray:5 4;pointer-events:none}

/* 多选工具条：选了两张以上才出现 */
#selBar{
  position:absolute;left:50%;top:14px;transform:translateX(-50%);
  display:flex;align-items:center;gap:8px;z-index:6;
  padding:6px 8px 6px 12px;border:1px solid var(--cyan);
  background:rgba(10,15,22,.92);box-shadow:var(--shadow);
  border-radius:var(--radius);
}
#selBar.hidden{display:none}
#selBar .sb-count{font-size:11px;letter-spacing:1px;color:var(--cyan);white-space:nowrap}
#selBar .sel-btn{
  font:inherit;font-size:11px;padding:5px 10px;cursor:pointer;
  border:1px solid var(--border);background:var(--btn);color:var(--txt);
  border-radius:var(--radius-sm);
}
#selBar .sel-btn:hover{border-color:var(--cyan);color:var(--cyan)}
#selBar .sel-btn[data-sel="chapter"]{border-color:var(--cyan);color:var(--cyan)}

/* 存档提醒条（和 #selBar 同一套按钮样式，位置错开） */
#remindBar{
  position:absolute;left:50%;top:58px;transform:translateX(-50%);
  display:flex;align-items:center;gap:8px;z-index:6;
  padding:6px 8px 6px 12px;border:1px solid var(--orange);
  background:rgba(22,17,10,.92);box-shadow:var(--shadow);
  border-radius:var(--radius);
}
#remindBar.hidden{display:none}
#remindBar #remindText{font-size:11px;letter-spacing:.6px;color:var(--orange);white-space:nowrap}
#remindBar .sel-btn{
  font:inherit;font-size:11px;padding:5px 10px;cursor:pointer;
  border:1px solid var(--border);background:var(--btn);color:var(--txt);
  border-radius:var(--radius-sm);
}
#remindBar .sel-btn:hover{border-color:var(--orange);color:var(--orange)}
#remindBar .sel-btn[data-remind="backup"]{border-color:var(--orange);color:var(--orange)}
.ui-ink #remindBar,.ui-letter #remindBar,.ui-cream #remindBar,.ui-minimal #remindBar,.ui-crayon #remindBar{
  background:rgba(255,252,245,.96);border-color:#c9882e;
}
.ui-ink #remindBar #remindText,.ui-letter #remindBar #remindText,.ui-cream #remindBar #remindText,
.ui-minimal #remindBar #remindText,.ui-crayon #remindBar #remindText{color:#9a5c12}

/* 底部状态栏 */
#statusbar{
  height:26px;flex:none;display:flex;align-items:center;gap:16px;padding:0 14px;
  background:var(--panel);border-top:1px solid var(--border);
  font-size:11px;color:var(--dim);letter-spacing:.5px;
}
.sb-issues.ok{color:var(--green)}
.sb-issues.warn{color:var(--orange)}
.sb-issues.bad{color:var(--red)}

/* 画布节点 */
.node-g .body{fill:var(--panel);stroke:var(--border);stroke-width:1}
.node-g.selected .body{stroke:var(--cyan);stroke-width:1.8}
/* 多选：一起拖动的卡片画青色虚线外框 */
.node-g.multi .body{stroke:var(--cyan);stroke-width:1.6;stroke-dasharray:6 4}
.node-g.multi{opacity:.96}
.node-g text{font-size:12px;fill:var(--txt);pointer-events:none}
.node-g .n-head{fill:#fff;font-size:11.5px;font-weight:600;letter-spacing:.5px}
.node-g .n-time{font-size:10px;fill:#fff;opacity:.85}
.node-g .n-badge{font-size:9.5px;fill:var(--onacc);font-weight:700;letter-spacing:1px}
.node-g .n-portlabel{font-size:10px;pointer-events:none}
.ch-label{font-size:12px;font-weight:600;letter-spacing:1px}
.port{fill:var(--bg);stroke:#5f7385;stroke-width:1.5;cursor:crosshair}
.port.port-out{stroke:var(--cyan)}
.port:hover{fill:var(--cyan)}
.edge-line{pointer-events:none}
.edge-line.sel{stroke-dasharray:6 4}
.edge-hit{cursor:pointer}
#canvas .temp-edge{pointer-events:none}

/* ============================================================
   检查器
   ============================================================ */
#sidePanel{
  width:374px;flex:none;background:var(--panel);border-left:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0;
}
#sidePanel.wide{width:440px}
#panelTabs{display:flex;flex:none;border-bottom:1px solid var(--border);background:var(--panel2)}
#panelTabs button{
  flex:1;background:none;border:none;color:var(--dim);padding:11px 0;font-size:12px;
  cursor:pointer;border-bottom:2px solid transparent;letter-spacing:1px;
}
#panelTabs button:hover{color:var(--txt)}
#panelTabs button.active{color:var(--cyan);border-bottom-color:var(--cyan);background:var(--panel)}
#panelBody{flex:1;overflow-y:auto;padding:14px}

.type-line{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.type-line .tag{
  background:var(--tc,#378ADD);color:#fff;font-size:11px;padding:3px 10px;
  letter-spacing:2px;font-weight:600;
}
.type-line .mono{color:var(--dim);font-size:11px}
.empty-hint{
  color:var(--dim);text-align:center;padding:56px 20px;font-size:14px;line-height:2.4;
  border:1px dashed var(--border);border-radius:8px;
}
.empty-hint small{font-size:12px}

.f-field{margin-bottom:11px}
.f-field label{display:block;color:var(--dim);font-size:11px;letter-spacing:.5px;margin-bottom:5px}
.f-field input,.f-field select,.f-field textarea{
  width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--txt);
  padding:7px 9px;font-size:13px;border-radius:var(--radius-sm);
}
.f-field textarea{line-height:1.75;resize:vertical;font-family:inherit;min-height:76px}
.f-field input:focus,.f-field select:focus,.f-field textarea:focus{outline:none;border-color:var(--cyan)}
.f-field select option{background:var(--panel2);color:var(--txt)}
.f-field input[type=number]{font-family:var(--font-mono)}

.sec-title{
  color:var(--cyan);font-size:11px;letter-spacing:2px;margin:18px 0 8px;
  border-bottom:1px dashed var(--acc);padding-bottom:5px;
}
.sec-title:first-child{margin-top:0}
.f-row{display:flex;gap:5px;margin-bottom:6px;align-items:center}
.f-row select,.f-row input{
  flex:1;min-width:0;background:var(--panel2);border:1px solid var(--border);color:var(--txt);
  padding:5px 6px;font-size:12px;border-radius:var(--radius-sm);
}
.f-row select:focus,.f-row input:focus{outline:none;border-color:var(--cyan)}
.row-del{
  flex:none;background:none;border:1px solid var(--border);color:var(--dim);cursor:pointer;
  width:25px;height:25px;border-radius:var(--radius-sm);font-size:13px;line-height:1;padding:0;
}
.row-del:hover{color:var(--red);border-color:var(--red)}
.add-mini{
  background:none;border:1px dashed var(--acc);color:var(--cyan-soft);cursor:pointer;
  padding:7px 12px;font-size:12px;border-radius:var(--radius-sm);width:100%;margin-top:4px;
}
.add-mini:hover{border-color:var(--cyan);background:var(--panel2)}
.mini-btn{
  background:var(--btn);border:1px solid var(--border);color:var(--txt);cursor:pointer;
  padding:5px 10px;font-size:12px;border-radius:var(--radius-sm);white-space:nowrap;
}
.mini-btn:hover{border-color:var(--cyan);color:var(--cyan-soft)}
.mini-btn.primary{background:var(--cyan);color:var(--onacc);border-color:var(--cyan);font-weight:600}
.mini-btn.danger:hover{border-color:var(--red);color:var(--red)}
.mini-btn:disabled{opacity:.4;cursor:not-allowed}
.dim{color:var(--dim)}
.mini{font-size:11.5px}
.hint{margin:-3px 0 10px;line-height:1.7}
.warn-line{color:var(--orange);margin:-4px 0 10px}
.hang{margin:2px 0 5px;letter-spacing:1px}
.ins-card{
  border:1px solid var(--border);background:var(--panel2);padding:10px 12px;
  border-radius:var(--radius-sm);margin-bottom:10px;
}
.ins-card .chk{margin-bottom:4px}
.ins-card .dim{line-height:1.7}
.chk{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--dim);white-space:nowrap;cursor:pointer}
.chk input{width:auto;margin:0;accent-color:var(--cyan)}
.node-ops{display:flex;gap:6px;flex-wrap:wrap;margin-top:20px;padding-top:14px;border-top:1px dashed var(--border)}
.node-ops .mini-btn{flex:1}
.play-here{width:100%;margin:-2px 0 12px;padding:8px 10px;letter-spacing:1px}

/* 立绘页：每个 NPC 收起成一行，点开才展开 */
.npc-block{
  border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:7px;
  background:rgba(255,255,255,.012);overflow:hidden;
}
.npc-block>summary{
  list-style:none;cursor:pointer;user-select:none;display:flex;align-items:center;gap:9px;padding:7px 9px;
}
.npc-block>summary::-webkit-details-marker{display:none}
.npc-block>summary:hover{background:rgba(255,255,255,.04)}
.npc-block[open]>summary{border-bottom:1px solid var(--border)}
.nb-ava{
  flex:none;width:34px;height:40px;border-radius:3px;overflow:hidden;background:var(--panel2);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:9px;
}
.nb-ava img{width:100%;height:100%;object-fit:cover;object-position:50% 10%;display:block}
.nb-ava.shape-round{border-radius:50%;width:34px;height:34px}
.nb-ava.shape-tall{width:30px;height:40px;border-radius:5px}
.nb-name{font-size:12.5px;color:var(--txt);letter-spacing:1px}
.nb-tags{margin-left:auto;font-size:10px;color:var(--dim);letter-spacing:.5px;white-space:nowrap}
.nb-body{padding:9px}
/* 立绘页：对话头像取景（框形状 + 缩放 + 横向 / 纵向） */
.ava-edit{
  margin-top:8px;padding:8px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:rgba(255,255,255,.012);
}
.ava-head{font-size:10.5px;letter-spacing:1px;color:var(--cyan);margin-bottom:7px}
.ava-head .mini{letter-spacing:0;color:var(--dim)}
.ava-body{display:flex;gap:10px;align-items:flex-start}
.ava-preview{
  flex:none;width:64px;height:64px;border-radius:50%;overflow:hidden;position:relative;
  background:var(--deep);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--dim);
}
.ava-preview img{width:100%;height:100%;max-width:none;object-fit:cover;display:block}
.ava-preview.shape-square{border-radius:3px}
.ava-preview.shape-tall{width:52px;height:69px;border-radius:5px}
.ava-ctrl{flex:1;min-width:0}
.ava-ctrl .f-row{margin-bottom:2px}
.ava-ctrl .mini{font-size:9.5px;white-space:nowrap}
.ava-zoomv,.ava-xv,.ava-yv{flex:0 0 40px;text-align:right;font-size:10px;color:var(--dim)}
/* 角色卡弹窗 */
.nc-edit{display:flex;gap:14px;align-items:flex-start}
.nc-edit-fig{flex:0 0 170px}
.nc-full-prev{
  border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--panel2);
  height:230px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:7px;
}
.nc-full-prev img{width:100%;height:100%;object-fit:contain;display:block}
.nc-edit-main{flex:1;min-width:0}

.choice-block{
  border:1px solid var(--border);border-radius:var(--radius);padding:10px;
  margin-bottom:12px;background:var(--panel2);
}
/* 可折叠区块（面板瘦身）：节点面板里的效果 / 条件 / 选项 / 反馈都用它 */
.p-sec{
  border:1px solid var(--border);border-radius:var(--radius-sm);
  margin:10px 0 8px;background:rgba(255,255,255,.012);overflow:hidden;
}
.p-sec>summary{
  list-style:none;cursor:pointer;user-select:none;
  display:flex;align-items:center;gap:6px;padding:8px 10px;
  font-size:11px;letter-spacing:1.2px;color:var(--cyan);
}
.p-sec>summary::-webkit-details-marker{display:none}
.p-sec>summary::before{content:'▸';font-size:9px;color:var(--dim);transition:transform .14s}
.p-sec[open]>summary::before{transform:rotate(90deg)}
.p-sec>summary:hover{color:var(--cyan-soft);background:rgba(255,255,255,.03)}
.p-sec>summary .cnt{margin-left:auto;color:var(--dim);font-size:10px;letter-spacing:0;white-space:nowrap}
.p-sec>summary .pv{
  color:var(--txt);font-size:11px;letter-spacing:0;font-weight:400;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46%;
}
.p-sec-b{padding:2px 10px 10px}
.p-sec .dim.mini{margin:2px 0 6px}
.choice-block.p-sec{background:var(--panel2);padding:0}
.choice-block.p-sec>summary{padding:9px 10px;color:var(--purple);letter-spacing:1px}
.choice-block.p-sec>summary .cnt{color:var(--dim)}
.choice-block.p-sec .p-sec-b{padding:0 10px 10px}
.cb-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;color:var(--purple);font-size:12px;letter-spacing:1px}
.cb-head button{
  background:none;border:1px solid var(--border);color:var(--dim);font-size:11px;
  padding:2px 8px;cursor:pointer;border-radius:var(--radius-sm);
}
.cb-head button:hover{color:var(--red);border-color:var(--red)}
.conn-line{
  font-size:12px;color:var(--dim);margin-top:8px;padding:5px 8px;
  background:var(--panel2);border-left:2px solid var(--acc);
}
.conn-line.linked{color:var(--green);border-left-color:var(--green)}
.formula-preview{
  font-size:13px;color:var(--orange);background:var(--panel2);
  padding:9px 11px;border:1px solid var(--acc);border-radius:var(--radius-sm);margin-bottom:11px;
}

/* 主题选择卡片 */
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px}
.theme-card{
  display:flex;flex-direction:column;gap:4px;padding:8px;border:1px solid var(--border);
  background:var(--panel2);border-radius:var(--radius-sm);cursor:pointer;text-align:left;
}
.theme-card:hover{border-color:var(--dim)}
.theme-card.sel{border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan)}
.theme-card b{font-size:12px;font-weight:600}
.theme-card small{color:var(--dim);font-size:10px}
.sw{display:flex;height:22px;border-radius:3px;overflow:hidden;border:1px solid var(--border)}
.sw i{flex:1;display:block}
.sw-cyber i:nth-child(1){background:#0b0f14}
.sw-cyber i:nth-child(2){background:#00d9ff}
.sw-cyber i:nth-child(3){background:#ff9e2c}
.sw-cream i:nth-child(1){background:#fbf4e6}
.sw-cream i:nth-child(2){background:#b57a4f}
.sw-cream i:nth-child(3){background:#d8c193}
.sw-minimal i:nth-child(1){background:#fff}
.sw-minimal i:nth-child(2){background:#111}
.sw-minimal i:nth-child(3){background:#0a6cff}
.sw-gilt i:nth-child(1){background:#10141c}
.sw-gilt i:nth-child(2){background:#c8a24d}
.sw-gilt i:nth-child(3){background:#2a3852}
.sw-tactical i:nth-child(1){background:#0b0e07}
.sw-tactical i:nth-child(2){background:#f5c400}
.sw-tactical i:nth-child(3){background:#4a4a1c}
.sw-moonblue i:nth-child(1){background:#0a1a33}
.sw-moonblue i:nth-child(2){background:#4fd7f2}
.sw-moonblue i:nth-child(3){background:#2f6fa8}
.sw-rebel i:nth-child(1){background:#111}
.sw-rebel i:nth-child(2){background:#e60012}
.sw-rebel i:nth-child(3){background:#fff}
.sw-ink i:nth-child(1){background:#f8f3e8}
.sw-ink i:nth-child(2){background:#2a2620}
.sw-ink i:nth-child(3){background:#9e2b22}
.sw-letter i:nth-child(1){background:#fbf4e2}
.sw-letter i:nth-child(2){background:#8b5e34}
.sw-letter i:nth-child(3){background:#cbb68c}
.sw-crayon i:nth-child(1){background:#fffdf6}
.sw-crayon i:nth-child(2){background:#2f6fdb}
.sw-crayon i:nth-child(3){background:#f7a325}

/* ============================================================
   立绘 / 角色面板
   ============================================================ */
.npc-row{
  display:flex;gap:10px;border:1px solid var(--border);border-radius:var(--radius);
  padding:10px;margin-bottom:10px;background:var(--panel2);
}
.npc-ava{
  width:72px;height:88px;flex:none;border:1px dashed var(--acc);
  display:flex;align-items:center;justify-content:center;background:var(--deep);
  overflow:hidden;border-radius:var(--radius-sm);position:relative;
}
.npc-ava img{width:100%;height:100%;object-fit:cover}
.npc-main{flex:1;min-width:0}
.npc-main .f-field{margin-bottom:8px}
.thumb-del{position:relative;display:inline-block}
.thumb-del img{height:96px;display:block;border:1px solid var(--acc);background:var(--deep);border-radius:var(--radius-sm)}
.thumb-del button{
  position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;
  background:var(--btn);color:var(--red);border:1px solid var(--red);cursor:pointer;
  font-size:11px;line-height:1;padding:0;
}
.cc-thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}

/* ============================================================
   地图编辑器
   ============================================================ */
.map-tools{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.map-tool{
  display:flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--border);
  color:var(--dim);padding:5px 9px;font-size:12px;cursor:pointer;border-radius:var(--radius-sm);
}
.map-tool:hover{color:var(--txt);border-color:var(--dim)}
.map-tool.sel{border-color:var(--cyan);color:var(--cyan-soft);background:var(--btn)}
.map-tool .sw{width:10px;height:10px;border-radius:2px;border:1px solid rgba(0,0,0,.35)}
.map-bar{display:flex;align-items:center;gap:6px;margin:8px 0 6px;flex-wrap:wrap}
.map-grid{
  display:grid;grid-template-columns:repeat(var(--cols,24),var(--cell,18px));
  gap:1px;width:max-content;background:var(--border);padding:1px;
}
.map-grid .mcell{
  width:var(--cell,18px);height:var(--cell,18px);display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.35);font-size:calc(var(--cell,18px) * .58);user-select:none;
  line-height:1;overflow:hidden;
}
.map-grid.edit .mcell{cursor:crosshair}
.map-grid.edit .mcell:hover{outline:2px solid var(--cyan);outline-offset:-1px;z-index:1}
.map-grid .mcell.same{box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
#mapGridWrap{
  overflow:auto;border:1px solid var(--border);padding:8px;background:var(--deep);
  margin-bottom:8px;max-height:340px;border-radius:var(--radius-sm);
}
.map-zoom{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.map-zoom .spacer{flex:1}
.poi-row{display:flex;gap:5px;align-items:center;margin-bottom:6px}
.poi-row .poi-coord{
  flex:none;width:40px;font-size:10px;color:var(--dim);text-align:center;
  border:1px solid var(--border);padding:4px 0;border-radius:3px;
}
.poi-row input,.poi-row select{
  flex:1;min-width:0;background:var(--panel2);border:1px solid var(--border);color:var(--txt);
  padding:5px 6px;font-size:12px;border-radius:var(--radius-sm);
}
.poi-draft{
  border:1px solid var(--cyan);background:var(--panel2);padding:10px;margin-bottom:10px;
  display:flex;flex-direction:column;gap:7px;border-radius:var(--radius-sm);
}
.poi-draft input,.poi-draft select{
  background:var(--deep);border:1px solid var(--border);color:var(--txt);
  padding:7px 9px;font-size:13px;border-radius:var(--radius-sm);
}
.btn-row-l{display:flex;gap:6px}
.mcell .poi{color:var(--cyan);font-size:1.05em;line-height:1;text-shadow:0 0 6px var(--cyan)}
.map-grid .mcell.here{box-shadow:inset 0 0 0 2px var(--orange);position:relative}

/* ============================================================
   播放器
   ============================================================ */
#playerView{height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
#pTop{
  min-height:58px;flex:none;display:flex;align-items:center;gap:14px;padding:8px 18px;
  background:var(--panel);border-bottom:1px solid var(--acc);position:relative;z-index:5;
  flex-wrap:wrap;
}
#pTitle{color:var(--cyan);font-size:15px;letter-spacing:2px;white-space:nowrap;font-weight:600}
#pAvatar{flex:none;display:flex;align-items:center}
#pAvatar img{
  height:42px;width:42px;object-fit:cover;background:var(--deep);
  border:1px solid var(--acc);border-bottom:2px solid var(--cyan);
}
#pStatus{flex:1;display:flex;gap:7px;flex-wrap:wrap;align-items:center;position:relative;min-width:0}
.chip{
  border:1px solid var(--acc);padding:3px 10px;font-size:12px;color:var(--cyan-soft);
  background:var(--deep);white-space:nowrap;letter-spacing:.5px;
}
.chip.time{color:var(--orange);border-color:rgba(255,158,44,.4)}
.chip.flash{animation:chipFlash .9s}
@keyframes chipFlash{0%{border-color:var(--orange);color:var(--orange);box-shadow:0 0 0 1px rgba(255,158,44,.45)}100%{}}
.float-diff{
  position:absolute;top:100%;margin-top:4px;font-size:12px;color:var(--orange);
  animation:floatUp 1.5s forwards;white-space:nowrap;z-index:9;pointer-events:none;
}
.float-diff.up{color:var(--green)}
@keyframes floatUp{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
#pMenu{display:flex;gap:5px;flex:none;align-items:center;flex-wrap:wrap}
.p-div{width:1px;height:20px;background:var(--border);margin:0 4px}
.p-btn{
  background:var(--btn);border:1px solid var(--acc);color:var(--cyan-soft);padding:6px 12px;
  font-size:12.5px;cursor:pointer;letter-spacing:.5px;
}
.p-btn:hover{border-color:var(--cyan);background:var(--hov);color:#fff}
.p-btn.warn{color:var(--orange);border-color:rgba(255,158,44,.45)}
.p-btn.warn:hover{border-color:var(--orange)}
.p-btn.ghost{color:var(--dim);border-color:transparent;background:none;padding:6px 8px;font-size:14px}
.p-btn.ghost:hover{color:var(--red);border-color:var(--red)}

#pMain{flex:1;overflow-y:auto;padding:40px 8% 90px;position:relative;z-index:2}
#pNodeTag{color:var(--dim);font-size:11px;letter-spacing:3px;margin-bottom:8px;
  width:100%;max-width:840px;margin-left:auto;margin-right:auto}
#pNodeTag::before{content:"» "}
#pSys{min-height:22px;margin-bottom:16px;width:100%;max-width:840px;margin-left:auto;margin-right:auto}
.sys-line{
  display:inline-block;color:var(--orange);font-size:12px;letter-spacing:.5px;
  border:1px solid rgba(255,158,44,.4);background:var(--over);padding:3px 10px;margin:2px 6px 2px 0;
}
.sys-line.quest{color:var(--green);border-color:rgba(86,211,100,.4)}
#pText{
  max-width:840px;margin:0 auto;border-left:2px solid var(--cyan);padding:8px 0 8px 26px;min-height:90px;
}
#pText p{font-family:var(--font-narr);font-size:17px;line-height:2;color:var(--txt);margin:0 0 14px;min-height:1em}
#pText::after{content:"▮";color:var(--cyan);animation:blink 1s infinite;font-size:13px;margin-left:2px}
#pText.done::after{content:""}
@keyframes blink{50%{opacity:0}}

#pActions{max-width:840px;margin:38px auto 0;display:flex;flex-direction:column;gap:12px}
.opt-btn{
  background:var(--btn);border:1px solid var(--acc);color:var(--cyan-soft);padding:14px 20px;
  text-align:left;cursor:pointer;font-size:15px;letter-spacing:.4px;line-height:1.65;
  transition:transform .12s,background .12s,border-color .12s;
}
.opt-btn .key{color:var(--dim);margin-right:8px;font-size:12px}
.opt-btn:hover:not(:disabled){border-color:var(--cyan);background:var(--hov);color:#fff;transform:translateX(6px)}
.opt-btn:disabled{opacity:.4;cursor:not-allowed}
.cont-btn{
  align-self:center;background:transparent;border:1px solid var(--cyan);color:var(--cyan);
  padding:13px 52px;font-size:16px;cursor:pointer;letter-spacing:6px;
}
.cont-btn:hover{background:var(--hov);color:#fff}
.dead{
  text-align:center;color:var(--dim);border:1px dashed var(--border);padding:22px;
  font-size:13px;letter-spacing:1px;border-radius:var(--radius);
}
.btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* 检定 / 结局 */
.check-panel{
  border:1px solid rgba(86,211,100,.35);background:var(--over);
  padding:26px 24px;text-align:center;
}
.check-formula{color:var(--green);font-size:14px;letter-spacing:2px;margin-bottom:10px}
.dice{font-size:54px;color:var(--orange);font-weight:700;line-height:1.2;text-shadow:0 0 18px rgba(255,158,44,.35)}
.dice.ok{color:var(--green);text-shadow:0 0 18px rgba(86,211,100,.4)}
.dice.bad{color:var(--red);text-shadow:0 0 18px rgba(255,123,114,.4)}
.check-result{font-size:14px;color:var(--txt);letter-spacing:1px;min-height:20px;margin-top:8px}
.check-result .ok{color:var(--green)}
.check-result .bad{color:var(--red)}
.ending-panel{
  max-width:620px;margin:10px auto;text-align:center;border:1px solid var(--red);
  padding:46px 36px;background:var(--over);
}
.ending-kicker{color:var(--dim);letter-spacing:8px;font-size:12px;margin-bottom:18px}
.ending-title{font-size:26px;color:var(--red);letter-spacing:8px;margin-bottom:18px;font-weight:600}
.ending-desc{color:var(--txt);font-size:14px;line-height:2;margin-bottom:22px}
.ending-note{color:var(--orange);font-size:12px;letter-spacing:2px}

#scan{
  position:absolute;inset:0;pointer-events:none;z-index:3;display:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 3px);
  mix-blend-mode:overlay;
}

/* 对话 / 角色创建 */
.dlg{display:flex;gap:14px;margin:0 0 16px;align-items:flex-end}
.dlg-portrait{flex:none;max-width:118px}
.dlg-portrait img{
  max-height:156px;max-width:118px;display:block;background:var(--deep);
  border:1px solid var(--acc);border-bottom:2px solid var(--cyan);
}
.dlg-main{
  flex:1;min-width:0;border:1px solid var(--acc);border-left:3px solid var(--cyan);
  background:var(--over);padding:12px 16px;
}
.dlg-name{color:var(--cyan);font-size:12px;letter-spacing:2px;margin-bottom:6px;font-family:var(--font-mono)}
.dlg-name::before{content:"◈ "}
.dlg-text{font-family:var(--font-narr);font-size:16px;line-height:1.9;color:var(--txt);min-height:1em}

.cc{max-width:640px;margin:0 auto;border:1px solid var(--acc);padding:28px;background:var(--over)}
.cc-title{color:var(--cyan);letter-spacing:3px;font-size:13px;margin-bottom:10px}
.cc-intro{color:var(--dim);font-size:13px;line-height:1.9;margin-bottom:6px}
.cc-row{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.cc-row>label{width:128px;flex:none;color:var(--cyan-soft);font-size:13px}
.cc-row input,.cc-row select{
  flex:1;background:var(--deep);border:1px solid var(--acc);color:var(--txt);
  padding:9px 11px;font-size:14px;border-radius:3px;
}
.cc-row input:focus,.cc-row select:focus{outline:none;border-color:var(--cyan)}
.cc-thumb{
  height:124px;cursor:pointer;border:1px solid var(--acc);background:var(--deep);
  transition:border-color .12s;
}
.cc-thumb:hover{border-color:var(--cyan-soft)}
.cc-thumb.sel{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
.alloc-ctl{display:flex;align-items:center;gap:10px;flex:1}
.al-btn{
  width:34px;height:34px;background:var(--btn);border:1px solid var(--acc);color:var(--cyan-soft);
  cursor:pointer;font-size:16px;border-radius:3px;
}
.al-btn:hover:not(:disabled){border-color:var(--cyan);color:#fff}
.al-btn:disabled{opacity:.35;cursor:not-allowed}
.al-val{color:var(--orange);min-width:26px;text-align:center;font-size:15px}
#ccPool{color:var(--orange)}
.char-ava{text-align:center;margin-bottom:14px}
.char-ava img{max-height:190px;border:1px solid var(--acc)}

/* ============================================================
   弹窗 / Toast / 列表
   ============================================================ */
#modalRoot{
  position:fixed;inset:0;background:rgba(3,6,10,.76);display:flex;align-items:center;
  justify-content:center;z-index:100;padding:20px;
}
#modalBox{
  width:min(600px,94vw);max-height:86vh;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--acc);position:relative;
  box-shadow:var(--shadow);
}
#modalBox.size-wide{width:min(880px,94vw)}
#modalHead{
  flex:none;display:flex;align-items:center;padding:14px 18px;
  border-bottom:1px solid var(--border);
}
#modalTitle{flex:1;color:var(--cyan);letter-spacing:3px;font-size:13px}
#modalClose{
  background:none;border:1px solid transparent;color:var(--dim);cursor:pointer;
  width:26px;height:26px;font-size:12px;border-radius:var(--radius-sm);line-height:1;
}
#modalClose:hover{color:var(--red);border-color:var(--red)}
#modalBody{flex:1;overflow-y:auto;padding:18px 20px}
#modalBtns{flex:none;padding:12px 20px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--border)}
.confirm-msg{font-size:14px;line-height:1.9;color:var(--txt)}

.mrow{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  border:1px solid var(--border);border-left:2px solid var(--cyan);
  padding:10px 14px;margin-bottom:9px;background:var(--panel2);
}
.mrow.done{border-left-color:var(--green);opacity:.78}
.mrow.here{border-left-color:var(--orange)}
.mrow .nm{color:var(--cyan-soft);font-size:14px;margin-bottom:3px}
.mrow.done .nm{color:var(--green)}
.mrow .ds{color:var(--dim);font-size:12px;line-height:1.6}
.mrow .ops{display:flex;gap:6px;flex:none}
.tag-here{
  font-size:10px;color:var(--orange);border:1px solid rgba(255,158,44,.5);
  padding:0 5px;margin-left:8px;vertical-align:1px;
}
.q-bar{height:5px;background:var(--deep);border-radius:3px;margin-top:6px;overflow:hidden}
.q-bar i{display:block;height:100%;background:var(--cyan)}
.gal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gal-cell{border:1px solid var(--border);padding:13px 15px;background:var(--panel2)}
.gal-cell.got{border-color:var(--red)}
.gal-cell .g-nm{font-size:14px;color:var(--red);letter-spacing:2px;margin-bottom:5px}
.gal-cell.lock .g-nm{color:var(--dim)}
.gal-cell .g-ds{font-size:12px;color:var(--dim);line-height:1.7}
.gal-cell .g-st{font-size:11px;color:var(--orange);margin-top:6px;letter-spacing:1px}
.slot-info{color:var(--dim);font-size:12px;line-height:1.8}
.slot-info b{color:var(--cyan-soft)}

/* 地图（播放器） */
.map-head{font-size:11px;letter-spacing:2px;margin-bottom:10px}
.map-wrap{overflow:auto;padding:12px;background:var(--deep);border:1px solid var(--border);max-width:100%}
.map-grid.play{margin:0 auto}
.map-grid.play .mcell{color:rgba(255,255,255,.3);font-size:14px}
.map-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:11px;color:var(--dim)}
.map-legend .lg{display:flex;align-items:center;gap:4px}
.map-legend .lg i{width:9px;height:9px;border:1px solid var(--border);display:inline-block}

/* 结构检查 / 帮助 */
.issue-sum{color:var(--dim);font-size:12px;margin-bottom:10px;letter-spacing:1px}
.issue{
  display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:6px;
  border:1px solid var(--border);background:var(--panel2);font-size:13px;
  border-left-width:3px;
}
.issue[data-goto]{cursor:pointer}
.issue[data-goto]:hover{border-color:var(--cyan)}
.issue.err{border-left-color:var(--red)}
.issue.warn{border-left-color:var(--orange)}
.issue.info{border-left-color:var(--dim)}
.issue-tag{flex:none;font-size:10px;letter-spacing:1px;padding:2px 6px;border:1px solid var(--border);color:var(--dim)}
.issue.err .issue-tag{color:var(--red);border-color:var(--red)}
.issue.warn .issue-tag{color:var(--orange);border-color:rgba(255,158,44,.5)}
.issue-msg{flex:1;line-height:1.6}
.issue-go{flex:none;color:var(--cyan);font-size:11px}
.check-ok{color:var(--green);text-align:center;padding:26px;font-size:15px;letter-spacing:1px}
.help-sec{margin-bottom:18px;line-height:1.9;font-size:13px}
.help-sec>b{display:block;color:var(--cyan);letter-spacing:1px;margin-bottom:6px}
.help-sec ol{margin:0;padding-left:20px}
.help-sec li{margin-bottom:4px}
.kbd-row{margin-bottom:4px;color:var(--dim)}
kbd{
  display:inline-block;background:var(--panel2);border:1px solid var(--border);
  border-bottom-width:2px;padding:1px 5px;font-size:11px;font-family:var(--font-mono);
  color:var(--txt);margin:0 1px;
}
code{background:var(--panel2);border:1px solid var(--border);padding:1px 5px;font-size:12px;font-family:var(--font-mono)}
.faq{margin-bottom:8px;color:var(--dim)}
.faq b{color:var(--txt)}
.about-card{border:1px solid var(--acc);background:var(--panel2);padding:12px 14px}
.about-card>b{font-size:15px;color:var(--cyan)}
.about-line{color:var(--dim);font-size:13px;margin-top:6px;line-height:1.9}
.about-line b{color:var(--cyan-soft);font-size:13px}
.legal{color:var(--dim);font-size:13px;line-height:1.9}

/* Toast */
#toastRoot{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{
  background:var(--btn);border:1px solid var(--acc);color:var(--cyan-soft);padding:10px 16px;
  font-size:13px;max-width:340px;box-shadow:var(--shadow);animation:toastIn .25s;
}
.toast.warn{border-color:rgba(255,158,44,.45);color:var(--orange)}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}}

/* ============================================================
   主题 A：机能风（默认，无需覆盖变量）
   ============================================================ */
.ui-cyber :is(.tb-btn.primary,.p-btn,.opt-btn,.cont-btn,.chip,#modalBox,.dlg-main,
  .type-line .tag,.ending-panel,#pAvatar img,.cc,.check-panel,.sys-line,.dz,.theme-card,.ins-card){
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));
}
.ui-cyber #scan{display:block}
.ui-cyber .opt-btn:hover:not(:disabled){box-shadow:0 0 24px rgba(0,217,255,.12)}
.ui-cyber #pTitle{text-shadow:0 0 18px rgba(0,217,255,.35)}
.ui-cyber .chip{background:linear-gradient(180deg,rgba(0,217,255,.06),transparent)}

/* ============================================================
   主题 B：奶油风（暖白、圆润、柔和阴影）
   ============================================================ */
.ui-cream{
  --bg:#f7f1e6; --panel:#fffdf7; --panel2:#fbf5ea; --deep:#f4ecdd;
  --btn:#fffaf0; --hov:#f4e9d6; --onacc:#fffdf8;
  --border:#e7dac4; --acc:#dcc9a5; --over:rgba(255,252,244,.94);
  --txt:#5a4a38; --dim:#a5947c;
  --cyan:#b0703f; --cyan-soft:#7c5a3e; --orange:#c07f2e;
  --red:#b3604f; --green:#6f8f57; --purple:#97799e;
  --edge:#c3ad8c;
  --tile-0:#f6efe1; --tile-1:#cbb79b; --tile-2:#a9c4cc;
  --tile-3:#9db584; --tile-4:#e8dcc6; --tile-5:#cba98b;
  --tc-story:#5b86b8; --tc-choice:#8b7fb8; --tc-check:#c08a3e; --tc-effect:#5f8f7c;
  --tc-quest:#b56a86; --tc-ending:#a75b4d; --tc-jump:#5f9c86; --tc-random:#9074bd;
  --tc-cg:#5b8ba0; --tc-battle:#b5654a;
  --radius:12px; --radius-sm:10px;
  --shadow:0 18px 40px rgba(120,95,60,.16);
  --font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
.ui-cream body,.ui-cream#app{background:linear-gradient(180deg,#f9f3e8,#f1e7d5)}
.ui-cream #topbar,.ui-cream #statusbar,.ui-cream #nodeToolbar,.ui-cream #sidePanel{background:var(--panel)}
.ui-cream :is(.tb-btn.primary,.p-btn,.opt-btn,.cont-btn,.chip,#modalBox,.dlg-main,
  .type-line .tag,.ending-panel,#pAvatar img,.cc,.check-panel,.sys-line,.theme-card,.ins-card,.mrow,.choice-block,.npc-row){
  clip-path:none;border-radius:12px;
}
.ui-cream #pText{border-left:none;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:26px 32px;box-shadow:0 10px 30px rgba(150,120,80,.10)}
.ui-cream #pText p{font-size:17px;line-height:2.1}
.ui-cream .opt-btn{border-width:1px;box-shadow:0 4px 12px rgba(150,120,80,.08)}
.ui-cream .opt-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 20px rgba(150,120,80,.16);color:var(--txt)}
.ui-cream .chip{background:#fffdf6;padding:4px 12px}
.ui-cream .tb-btn.primary{color:#fffdf7}
.ui-cream .ending-title{letter-spacing:6px}
.ui-cream #modalRoot{background:rgba(80,60,35,.28)}
.ui-cream .dlg-portrait img{border-radius:12px 12px 0 0}
.ui-cream #scan{display:none}
.ui-cream .node-g .body{stroke-width:1.2}
.ui-cream .map-grid{background:var(--border)}
.ui-cream .map-grid .mcell{color:rgba(60,45,30,.45)}
.ui-cream .mcell .poi{text-shadow:none;color:#b0703f}
.ui-cream .map-grid .mcell.here{box-shadow:inset 0 0 0 2px #c07f2e}
.ui-cream .sw{border-radius:6px}

   ============================================================ */

  --border:#e3e3e3; --acc:#cfcfcf; --over:rgba(255,255,255,.97);
  --txt:#1d1d1f; --dim:#8e8e93;
  --cyan:#0a6cff; --cyan-soft:#3a3a3c; --orange:#b37613;
  --red:#c0392b; --green:#2f8f5b; --purple:#6c5ce7;
  --edge:#b9b9bd;
  --tile-0:#ffffff; --tile-1:#dcdcdc; --tile-2:#cfe1f7;

  --tc-story:#3f6fa8; --tc-choice:#6b63a8; --tc-check:#a5792a; --tc-effect:#3f7d63;

.ui-minimal .dlg-name{color:#111;letter-spacing:3px}
.ui-minimal .opt-btn{border:1px solid #dcdcdc;background:#fff;color:#1d1d1f;padding:15px 20px}
.ui-minimal .opt-btn .key{color:#9a9a9a}

.ui-minimal .cont-btn{border:1px solid #111;color:#111;letter-spacing:5px}

.ui-minimal .chip{background:#fff;border-color:#dcdcdc;color:#1d1d1f}
.ui-minimal .chip.time{color:#9a6b12;border-color:#e5d3ae}
.ui-minimal .tb-btn.primary{background:#111;border-color:#111;color:#fff}

.ui-minimal .ending-title{color:#111}
.ui-minimal .type-line .tag{background:#111!important;color:#fff}

.ui-minimal #scan{display:none}
.ui-minimal .map-grid .mcell{color:rgba(0,0,0,.35)}

.ui-gilt :is(.tb-btn.primary,.p-btn,.opt-btn,.cont-btn,.chip,#modalBox,.dlg-main,

.ui-gilt #topbar,.ui-gilt #statusbar,.ui-gilt #nodeToolbar,.ui-gilt #sidePanel,
.ui-gilt #pTop{
  background:linear-gradient(180deg,#1a2231 0%,#121824 100%);

}
.ui-gilt #topbar{border-bottom:1px solid rgba(201,168,106,.34)}

}

}

.ui-gilt .dlg-name{color:#d9c285;font-family:Georgia,serif;letter-spacing:3px}
.ui-gilt .dlg-text{font-family:var(--font-narr);font-size:16.5px;color:#e3dcc8}

/* ============================================================
   主题化对话：四套 UI 用四种完全不同的对话框
   ============================================================ */
/* 机能风：切角面板 + 荧光名牌 + 扫描线质感 */
.ui-cyber .dlg-main{
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%);
  padding:13px 18px;background:linear-gradient(180deg,rgba(0,217,255,.06),transparent 40%),var(--over);
  box-shadow:inset 0 1px 0 rgba(0,217,255,.14);
}
.ui-cyber .dlg-name{
  display:inline-block;background:var(--cyan);color:var(--onacc);padding:2px 9px 3px;
  margin-bottom:9px;font-weight:700;letter-spacing:2px;
}
.ui-cyber .dlg-name::before{content:"▚ "}
.ui-cyber .dlg-portrait img{border-bottom:2px solid var(--cyan)}
.ui-cyber .dlg-text{font-size:16px;line-height:1.95}

/* 奶油风：圆角气泡 + 小尾巴 + 柔和阴影 */
.ui-cream .dlg{align-items:flex-start}
.ui-cream .dlg-main{
  border:1px solid #ecdcc2;border-left:1px solid #ecdcc2;border-radius:18px;
  background:#fffdf7;box-shadow:0 10px 26px rgba(150,120,80,.12);
  position:relative;padding:16px 20px;
}
.ui-cream .dlg-main::after{
  content:"";position:absolute;left:-8px;bottom:20px;width:15px;height:15px;
  background:#fffdf7;border-left:1px solid #ecdcc2;border-bottom:1px solid #ecdcc2;
  transform:rotate(45deg);
}
.ui-cream .dlg-name{color:#b0703f;font-family:inherit;font-weight:700;letter-spacing:1px}
.ui-cream .dlg-name::before{content:"❝ "}
.ui-cream .dlg-portrait img{
  border:3px solid #fffdf7;border-radius:14px;border-bottom:3px solid #fffdf7;
  box-shadow:0 8px 20px rgba(150,120,80,.18);
}
.ui-cream .dlg-text{font-size:16px;line-height:1.95;color:#5a4a38}

/* 极简风：不要气泡，一条顶线 + 黑体名 + 灰度图 */
.ui-minimal .dlg{align-items:flex-start;gap:18px}

.ui-minimal .dlg-name::before{content:""}

  border:1px solid #111;border-bottom:1px solid #111;border-radius:0;filter:grayscale(1);
}
.ui-minimal .dlg-text{font-size:16px;line-height:2;color:#1d1d1f}

/* ============================================================
   插图卡（CG）
   ============================================================ */
.cg-figure{margin:0 0 20px;text-align:center}
.cg-figure img{
  max-width:100%;max-height:46vh;display:block;margin:0 auto;cursor:zoom-in;
  border:1px solid var(--acc);background:var(--deep);
}
.cg-figure figcaption{margin-top:10px;color:var(--dim);font-size:12px;letter-spacing:2px}
.cg-empty{
  border:1px dashed var(--border);background:var(--panel2);color:var(--dim);
  padding:64px 20px;font-size:13px;letter-spacing:1px;
}
.cg-text{margin-top:18px}
.cg-viewer img{max-width:100%;max-height:72vh;display:block;margin:0 auto}
.cg-preview{border:1px solid var(--border);background:var(--deep);margin-bottom:8px;overflow:hidden}
.cg-preview img{display:block;width:100%;max-height:170px;object-fit:cover}
.cg-preview.empty{padding:26px 10px;text-align:center;color:var(--dim);font-size:12px;line-height:1.9}

.ui-cyber .cg-figure img{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
.ui-cream .cg-figure img{border-radius:12px;border:1px solid #e7dac4;box-shadow:0 14px 34px rgba(150,120,80,.18)}
.ui-cream .cg-empty{border-radius:12px;background:#fffdf7}
.ui-minimal .cg-figure img{border:1px solid #111}
.ui-minimal .cg-figure figcaption{letter-spacing:2px}
.ui-gilt .cg-figure img{
  border:1px solid rgba(201,168,106,.55);
  box-shadow:0 0 0 4px rgba(8,11,17,.7),0 0 0 5px rgba(201,168,106,.22);
}
.ui-gilt .cg-empty{border-color:rgba(201,168,106,.35);background:rgba(10,14,21,.6)}

/* ============================================================
   战斗卡（单卡回合制）
   ============================================================ */
/* 战斗面板：颜色全部走主题变量。
   想单独给某个主题（或自定义主题包）换一套战斗配色，只要覆盖
   --bt-bg / --bt-bg2 / --bt-border / --bt-txt / --bt-dim / --bt-line
   / --bt-btn-bg / --bt-btn-txt / --bt-hover / --bt-enemy / --bt-me 即可。 */
.battle{
  border:1px solid var(--bt-border, var(--acc));
  background:var(--bt-bg, var(--panel));
  color:var(--bt-txt, var(--txt));
  padding:16px 18px;display:flex;flex-direction:column;gap:12px;
  box-shadow:var(--bt-shadow, 0 14px 34px rgba(0,0,0,.28));
}
.bt-enemy{display:flex;gap:14px;align-items:center}
.bt-glyph{
  width:64px;height:64px;flex:none;display:grid;place-items:center;font-size:26px;font-weight:700;
  border:1px solid var(--bt-border, var(--acc));background:var(--bt-bg2, var(--deep));
  color:var(--bt-enemy, var(--red));
  overflow:hidden;border-radius:var(--radius-sm);position:relative;
}
/* 有立绘就用立绘（裁成方形、对齐头部），没有才退回名字首字 */
.bt-glyph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.bt-glyph.me{color:var(--bt-me, var(--green));border-color:var(--bt-me, var(--green));width:44px;height:44px;font-size:17px}
.bt-main{flex:1;min-width:0}
.bt-name{display:flex;justify-content:space-between;align-items:baseline;gap:10px;color:var(--bt-txt, var(--txt));font-size:15px;margin-bottom:6px}
.bt-hp{color:var(--bt-dim, var(--dim));font-size:12px}
.bt-bar{height:9px;background:var(--bt-bg2, var(--deep));border:1px solid var(--bt-line, var(--border));overflow:hidden}
.bt-bar i{display:block;height:100%;background:var(--bt-enemy, var(--red));transition:width .25s}
.bt-bar.me i{background:var(--bt-me, var(--green))}
.bt-player{border-top:1px dashed var(--bt-line, var(--border));padding-top:10px;display:flex;gap:10px;align-items:center}
.bt-player .bt-name{font-size:13px}
.bt-log{
  max-height:180px;overflow:auto;display:flex;flex-direction:column;gap:6px;
  padding:10px 12px;background:var(--bt-bg2, var(--deep));border:1px solid var(--bt-line, var(--border));
}
.bt-line{font-size:14px;line-height:1.75;color:var(--bt-txt, var(--txt));white-space:pre-line}
.bt-line.sys{color:var(--orange);font-size:12px;letter-spacing:1px}
.bt-line.atk{color:var(--cyan-soft)}
.bt-line.hurt{color:var(--red)}
.bt-line.win{color:var(--green)}
.bt-line.lose{color:var(--red)}
.bt-stats{color:var(--bt-dim, var(--dim));font-size:11px;letter-spacing:.5px}
.bt-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btlabels{margin-bottom:2px}
.btlabels span{flex:1;font-size:10px;letter-spacing:1px}
.bt-btn{
  background:var(--bt-btn-bg, var(--btn));border:1px solid var(--bt-border, var(--acc));
  color:var(--bt-btn-txt, var(--acc));
  padding:10px 26px;font-size:14px;cursor:pointer;letter-spacing:2px;
}
.bt-btn:hover:not(:disabled){border-color:var(--cyan);background:var(--bt-hover, var(--hov));color:var(--bt-txt, var(--txt))}
.bt-btn:disabled{opacity:.4;cursor:not-allowed}
/* 技能 / 道具列表：按钮里放两行文字 */
.bt-line-btn{
  display:flex;flex-direction:column;align-items:flex-start;gap:1px;
  min-width:150px;text-align:left;padding:7px 12px;
}
.btl-name{font-size:13.5px;letter-spacing:1px}
.btl-meta{font-size:10.5px;color:var(--bt-dim, var(--dim));letter-spacing:.5px}
.bt-line-btn:hover:not(:disabled) .btl-meta{color:var(--cyan-soft)}
.bt-back{margin-left:auto}
.bt-none{color:var(--bt-dim, var(--dim));font-size:12px;line-height:1.9;flex:1}
.ui-cyber .battle{clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%)}
.ui-cream .battle{border-radius:14px;background:#fffdf7;box-shadow:0 10px 26px rgba(150,120,80,.1)}
.ui-cream .bt-glyph,.ui-cream .bt-bar,.ui-cream .bt-log{border-radius:8px}
.ui-cream .bt-btn{border-radius:10px}
.ui-minimal .battle{border-color:#111;background:#fff}
.ui-minimal .bt-btn{border-color:#111;background:#fff;color:#111}
.ui-minimal .bt-btn:hover:not(:disabled){background:#111;color:#fff}
.ui-gilt .battle{border-color:rgba(201,168,106,.4);background:linear-gradient(180deg,rgba(22,29,42,.96),rgba(10,14,21,.96))}
.ui-gilt .bt-glyph{border-color:rgba(201,168,106,.5);color:#e0b25e;font-family:Georgia,"Songti SC",serif}
.ui-gilt .bt-bar{border-color:rgba(201,168,106,.25)}
.ui-gilt .bt-btn{border-color:rgba(201,168,106,.4);color:#e2d3a5;background:linear-gradient(180deg,#232c3d,#161d29)}



/* ============================================================
   演出（舞台）模式：背景 + 立绘 + 底部对话框
   —— 和普通的【名字】对话完全不同的版面：整幅背景 + 站位立绘 + 底部对话框
   ============================================================ */
#pStage{
  position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,var(--panel2),var(--deep));
}
#pStage .st-bg{
  position:absolute;inset:0;background-size:cover;background-position:center;
  background-repeat:no-repeat;transform:scale(1.02);
}
/* 插图卡：和演出背景共用同一块整屏版面（默认铺满，作者可改成 contain） */
#pStage .st-bg.cg{
  transform:none;background-size:cover;background-color:#05070a;
  box-shadow:inset 0 0 120px rgba(0,0,0,.75);
}
#pStage .st-zoom{
  position:absolute;right:18px;top:16px;z-index:4;pointer-events:auto;cursor:pointer;
  font:inherit;font-size:11px;letter-spacing:1px;padding:5px 10px;border-radius:3px;
  color:#dfe8ee;background:rgba(6,10,15,.72);border:1px solid rgba(255,255,255,.16);
}
#pStage .st-zoom:hover{background:rgba(6,10,15,.92);border-color:var(--cyan);color:var(--cyan)}
/* 插图卡右上角有「看大图」，把系统提示往下让一让，别叠在一起 */
#pMain.stage-on.stage-cg #pSys{top:56px}
#pStage .st-caption{
  position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:3;text-align:center;
  font-size:11px;letter-spacing:3px;color:rgba(255,255,255,.62);pointer-events:none;
  background:rgba(6,10,15,.55);padding:4px 12px;border-radius:3px;
}
#pStage .st-vignette{
  position:absolute;inset:0;
  background:radial-gradient(125% 95% at 50% 38%,transparent 42%,rgba(0,0,0,.55) 100%);
}
#pStage .st-cast{
  position:absolute;left:0;right:0;bottom:0;height:86%;
}
#pStage .st-actor{
  position:absolute;bottom:0;left:50%;
  height:100%;max-width:38%;
  display:flex;align-items:flex-end;justify-content:center;
  transform:translateX(-50%);
  transition:filter .35s ease,opacity .35s ease,transform .35s ease;
  will-change:transform,filter;
}
#pStage .st-actor img{
  max-height:100%;max-width:100%;object-fit:contain;
  filter:drop-shadow(0 16px 26px rgba(0,0,0,.55));
}
/* 说话的人前置、其余人隐退在后（RPG 常见的做法） */
#pStage .st-actor.dim{
  filter:brightness(.5) saturate(.6);
  opacity:.92;transform:translateX(-50%) scale(.95);z-index:1;
}
#pStage .st-actor.speaking{
  filter:brightness(1.08);transform:translateX(-50%) scale(1.02);z-index:3;
}
#pStage .st-actor.dim img{filter:drop-shadow(0 10px 18px rgba(0,0,0,.4))}
/* 战斗演出：敌人立绘摆正中间、往上抬一截，别被底下的战斗面板压住 */
#pStage .st-enemy-cast{height:62%;bottom:16%}
#pStage .st-enemy-cast .st-actor{max-width:42%;filter:drop-shadow(0 22px 34px rgba(0,0,0,.6))}
#pMain.stage-battle::after{background:linear-gradient(180deg,rgba(0,0,0,0) 44%,rgba(2,5,9,.18) 60%,rgba(2,5,9,.46) 78%,rgba(2,5,9,.72) 100%)}
#pStage img.npc-clickable{pointer-events:auto;cursor:pointer}
#pStage img.npc-clickable:hover{filter:drop-shadow(0 16px 26px rgba(0,0,0,.55)) brightness(1.08)}

#pMain.stage-on{display:flex;flex-direction:column;justify-content:flex-end;padding:0;overflow:hidden}
#pMain.stage-on #pNodeTag{
  position:absolute;left:22px;top:14px;z-index:3;margin:0;width:auto;max-width:72%;
  color:#eef4f8;letter-spacing:3px;padding:4px 11px;border-radius:3px;
  background:rgba(6,10,15,.66);border:1px solid rgba(255,255,255,.13);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);text-shadow:none;
}
.ui-cream #pMain.stage-on #pNodeTag,.ui-minimal #pMain.stage-on #pNodeTag,
.ui-ink #pMain.stage-on #pNodeTag,.ui-letter #pMain.stage-on #pNodeTag,
.ui-crayon #pMain.stage-on #pNodeTag{
  background:rgba(255,252,245,.88);border-color:rgba(0,0,0,.12);color:#3b3327;
}
#pMain.stage-on #pSys{
  position:absolute;right:24px;top:14px;z-index:3;margin:0;width:auto;max-width:56%;
  display:flex;flex-direction:column;align-items:flex-end;gap:3px;
}
#pMain.stage-on #pSys .sys-line{background:rgba(6,10,15,.8)}
#pMain.stage-on #pText{
  position:relative;z-index:2;width:auto;max-width:none;margin:0;
  padding:0 6% 54px;
  border:none;background:none;box-shadow:none;
  color:#eef4f8;text-shadow:0 2px 12px rgba(0,0,0,.9);
}
/* 文字区：不再画「对话框」，改成直接压在画面上的风格化文本 */
#pMain.stage-on .st-body{
  position:relative;max-height:clamp(126px,32vh,300px);overflow:hidden;
  padding:10px 2px 4px;
}
#pMain.stage-on .st-body p.st-nar{
  margin:0 0 10px;color:#e6edf4;font-family:var(--font-narr);
  font-size:16.5px;line-height:1.95;opacity:.94;text-shadow:0 1px 8px rgba(0,0,0,.65);
}
#pMain.stage-on .st-dlg{display:flex;align-items:flex-start;gap:11px;margin:0 0 12px}
#pMain.stage-on .st-ava{
  position:relative;flex:0 0 auto;width:46px;height:46px;overflow:hidden;display:block;
  border-radius:50%;border:1px solid rgba(255,255,255,.4);
  box-shadow:0 4px 14px rgba(0,0,0,.6);background:rgba(8,12,18,.7);
}
/* 框是圆的，里面的图自己裁：形状 + 缩放 + 取景都由 NPC 的「头像裁切」决定 */
#pMain.stage-on .st-ava img{width:100%;height:100%;max-width:none;object-fit:cover;display:block}
#pMain.stage-on .st-ava.shape-square{border-radius:3px}
#pMain.stage-on .st-ava.shape-tall{width:40px;height:54px;border-radius:5px}
#pMain.stage-on .st-say{min-width:0;flex:1}
#pMain.stage-on .st-name{
  display:inline-block;margin-bottom:3px;padding:1px 9px 2px;
  font-size:12px;letter-spacing:2px;color:var(--cyan);
  background:rgba(6,10,15,.6);border-radius:2px;border-left:2px solid var(--cyan);
}
#pMain.stage-on .st-text{color:#f2f6f9;font-size:17px;line-height:1.95;text-shadow:0 1px 8px rgba(0,0,0,.65)}
#pMain.stage-on .st-more{
  display:none;position:absolute;right:6%;bottom:48px;z-index:4;
  color:var(--cyan);font-size:13px;animation:blink 1.1s infinite;
  text-shadow:0 2px 8px #000;
}
#pMain.stage-on #pText.paged .st-more{display:block}
#pMain.stage-on #pText::after{display:none}
#pMain.stage-on .dlg-portrait{display:none}
#pMain.stage-on .dlg{align-items:stretch;gap:0;margin-bottom:14px}
#pMain.stage-on #pActions{
  position:relative;z-index:3;max-width:none;width:auto;margin:0 6% 16px;
  max-height:40vh;overflow:auto;gap:9px;justify-content:flex-end;
}
#pMain.stage-on #pActions .cont-btn{
  align-self:flex-end;background:rgba(10,15,21,.86);color:var(--cyan);
  border:1px solid var(--cyan);border-radius:3px;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
}
#pMain.stage-on #pActions .cont-btn:hover{background:var(--cyan);color:#06121a}
#pMain.stage-on .opt-btn{background:rgba(10,15,21,.86);color:#e9eef2;border-color:rgba(255,255,255,.22)}
#pMain.stage-on .opt-btn:hover:not(:disabled){background:rgba(10,15,21,.96);border-color:var(--cyan);color:#fff;transform:none}
#pMain.stage-on .ending-panel,#pMain.stage-on .check-panel,#pMain.stage-on .cg-figure{
  background:rgba(8,12,18,.9);
}
/* 舞台模式下面板浮在插画上，给它一点阴影就够 —— 配色仍然由主题决定，不再写死深底 */
#pMain.stage-on .battle{box-shadow:0 18px 44px rgba(0,0,0,.5)}
#pMain.stage-on .cg-figure{background:rgba(8,12,18,.9)}
/* 舞台模式下画面底部压一层暗，白字压在插画上也看得清（只压最后三分之一，别糊住立绘） */
#pMain.stage-on::after{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,0) 46%,rgba(2,5,9,.16) 62%,rgba(2,5,9,.48) 78%,rgba(2,5,9,.78) 92%,rgba(2,5,9,.86) 100%);
}

/* ============================================================
   NPC 角色卡（玩家端弹窗）
   ============================================================ */
.dlg-portrait img.npc-clickable{cursor:pointer;transition:filter .15s,transform .15s}
.dlg-portrait img.npc-clickable:hover{filter:brightness(1.12);transform:translateY(-1px)}
.npc-card{display:flex;gap:22px;align-items:flex-start}
.nc-figure{
  flex:0 0 236px;max-width:44%;padding:8px;background:var(--deep);
  border:1px solid var(--border);position:relative;
}
.nc-figure img{display:block;width:100%;max-height:58vh;object-fit:contain;margin:0 auto}
.nc-empty{color:var(--dim);font-size:12px;text-align:center;padding:70px 10px;line-height:1.9}
.nc-main{flex:1;min-width:0}
.nc-name{font-size:22px;color:var(--cyan);letter-spacing:5px;margin-bottom:6px;font-weight:600;line-height:1.3}
.nc-title{color:var(--dim);font-size:12px;letter-spacing:2px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.nc-intro{font-family:var(--font-narr);font-size:14.5px;line-height:2.05;color:var(--txt);margin-bottom:16px;white-space:pre-wrap}
.nc-fields{display:flex;flex-direction:column;border-top:1px solid var(--border)}
.nc-row{display:flex;gap:14px;padding:9px 2px;border-bottom:1px dashed var(--border)}
.nc-k{flex:0 0 92px;color:var(--cyan-soft);font-size:12.5px;letter-spacing:1px;line-height:1.7}
.nc-v{flex:1;font-size:13.5px;line-height:1.8;color:var(--txt);white-space:pre-wrap;word-break:break-word}
.nc-foot{margin-top:16px;color:var(--dim);font-size:11px;letter-spacing:3px}
@media (max-width:680px){
  .npc-card{flex-direction:column;gap:14px}
  .nc-figure{flex:none;max-width:100%;width:100%}
}
.ui-gilt .nc-figure{border-color:rgba(201,168,106,.45);box-shadow:inset 0 0 0 1px rgba(201,168,106,.15)}
.ui-gilt .nc-title{border-bottom-color:rgba(201,168,106,.28)}
.ui-gilt .nc-row{border-bottom-color:rgba(201,168,106,.18)}
.ui-cream .nc-figure{background:#fffdf7;border-color:#e7dac4;border-radius:12px}
.ui-crayon .nc-figure{border:3px solid #2b2b2b;border-radius:14px}

/* ============================================================
   编辑器：富文本工具栏 / 演出区块 / 角色卡编辑 / 主题管理
   ============================================================ */
.rich-bar{
  display:flex;flex-wrap:wrap;align-items:center;gap:6px;
  background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:6px 8px;margin:6px 0 0;
}
.rich-bar .rb-lab{font-size:10px;color:var(--dim);letter-spacing:1px;margin-right:2px}
.rich-bar .rb-sep{width:1px;height:16px;background:var(--border);margin:0 3px}
.rich-sw{
  width:20px;height:20px;border-radius:50%;border:1px solid var(--border);cursor:pointer;
  padding:0;position:relative;flex:none;
}
.rich-sw:hover{transform:scale(1.15);border-color:var(--cyan)}
.rich-sw.hl{border-radius:3px;background-image:linear-gradient(180deg,transparent 44%,var(--hl,currentColor) 44%,var(--hl,currentColor) 86%,transparent 86%)}
.rich-btn{
  background:var(--btn);border:1px solid var(--border);color:var(--txt);border-radius:var(--radius-sm);
  font-size:11px;padding:3px 8px;cursor:pointer;line-height:1.5;white-space:nowrap;
}
.rich-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.rich-btn.on{border-color:var(--cyan);color:var(--cyan)}
.rich-custom{width:24px;height:20px;padding:0;border:1px solid var(--border);border-radius:3px;background:none;cursor:pointer;flex:none}
.rich-hint{font-size:10px;color:var(--dim);line-height:1.7;margin-top:5px}
.rich-bar .rich-hint{flex-basis:100%;margin:1px 0 0}
.rich-preview{
  margin-top:6px;padding:10px 12px;border:1px dashed var(--border);border-radius:var(--radius-sm);
  background:var(--panel2);font-family:var(--font-narr);font-size:14px;line-height:1.95;color:var(--txt);
  max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-word;
}
.rich-preview:empty{display:none}
/* 预览收起：默认不占高度，点开才看 */
.rich-pv{margin-top:6px}
.rich-pv>summary{
  list-style:none;cursor:pointer;user-select:none;font-size:10px;letter-spacing:1px;
  color:var(--dim);padding:4px 0;
}
.rich-pv>summary::-webkit-details-marker{display:none}
.rich-pv>summary::before{content:'▸ ';font-size:9px}
.rich-pv[open]>summary::before{content:'▾ '}
.rich-pv>summary:hover{color:var(--cyan-soft)}

.stage-box{
  background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:10px 11px;margin-bottom:8px;
}
.stage-thumb{
  border:1px solid var(--border);background:var(--deep);overflow:hidden;margin:6px 0;
  aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;
}
.stage-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.stage-thumb.empty{color:var(--dim);font-size:11px;letter-spacing:1px}
.cast-row{display:flex;gap:6px;align-items:center;margin-bottom:5px}
.cast-row .cast-img{width:26px;height:34px;object-fit:cover;border:1px solid var(--border);background:var(--deep);flex:none}
.cast-row .cast-img.empty{display:grid;place-items:center;font-size:9px;color:var(--dim)}

.npc-card-edit{margin-top:6px;padding-top:8px;border-top:1px dashed var(--border)}
.npc-card-wrap{
  margin:-4px 0 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--panel2);
}
.npc-card-wrap>summary{
  cursor:pointer;padding:7px 10px;font-size:11.5px;color:var(--cyan-soft);letter-spacing:1px;
  user-select:none;line-height:1.6;
}
.npc-card-wrap>summary:hover{color:var(--cyan)}
.npc-card-wrap[open]>summary{border-bottom:1px solid var(--border)}
.npc-card-wrap .npc-card-edit{padding:8px 10px 10px;border-top:none;margin-top:0}
/* 角色卡弹窗里的「字段名 / 内容」两列 */
.nc-edit-main .field-row{display:flex;gap:5px;margin-bottom:5px}
.nc-edit-main .field-row input:first-child{flex:0 0 96px}
.nc-edit-main .field-row input:last-of-type{flex:1;min-width:0}
.nc-edit-main .field-row input{
  background:var(--panel2);border:1px solid var(--border);color:var(--txt);
  padding:6px 7px;font-size:12px;border-radius:var(--radius-sm);
}
.nc-edit-main .field-row input:focus{outline:none;border-color:var(--cyan)}
.npc-card-edit .field-row{display:flex;gap:5px;margin-bottom:4px}
.npc-card-edit .field-row input:first-child{flex:0 0 88px}

<script data-mod="data">'use strict';
/* ============ 数据层：节点类型 / 数据工厂 / 内置模板 / 立绘占位 ============ */

function $(id){ return document.getElementById(id); }

/* 应用信息（帮助页 / 品牌 / 导出元信息共用） */
const NT_APP = {
  name: '那什么的文游编辑器',
  version: 'v1.1',
  author: 'ALLESI',
  qq: '256085698'
};

/* 全部界面风格（编辑器外观 / 游戏内 UI 共用这份清单） */
const NT_THEMES = [
  { v: 'cyber',    t: '机能风',     d: '霓虹暗色' },
  { v: 'cream',    t: '奶油风',     d: '暖白圆润' },
  { v: 'minimal',  t: '极简风',     d: '黑白利落' },
  { v: 'gilt',     t: '鎏金风',     d: '深蓝金线' },
  { v: 'tactical', t: '战术终端风', d: '黑黄警示' },
  { v: 'moonblue', t: '月蓝学院风', d: '深蓝青辉' },
  { v: 'rebel',    t: '红黑叛逆风', d: '黑红涂鸦' },
  { v: 'ink',      t: '水墨古风',   d: '宣纸墨色' },
  { v: 'letter',   t: '古典书信风', d: '羊皮信笺' },
  { v: 'crayon',   t: '蜡笔涂鸦风', d: '童趣手绘' }
];
const NT_THEME_IDS = NT_THEMES.map(x => x.v);

/* ============ 主题注册表（内置 + 作者导入的自定义主题） ============ */
function ntCustomThemes(story){
  const s = story && story.settings;
  return (s && Array.isArray(s.customThemes)) ? s.customThemes : [];
}
/* 完整主题清单：设置页的主题卡片、顶栏「编辑外观」都读这里 */
function ntAllThemes(story){
  const out = NT_THEMES.map(t => ({ v: t.v, t: t.t, d: t.d, custom: false }));
  ntCustomThemes(story).forEach(t => out.push({
    v: t.id, t: t.name || t.id, d: t.desc || '自定义主题', custom: true
  }));
  return out;
}
function ntThemeDef(id, story){
  return ntAllThemes(story).find(t => t.v === id) || null;
}
function ntThemeName(id, story){
  const t = ntThemeDef(id, story);
  return t ? t.t : id;
}
function ntIsCustomTheme(id, story){
  return ntCustomThemes(story).some(t => t.id === id);
}

/* ============ 富文本：文字颜色 / 高亮 / 字号（Word 式预设） ============
   标记语法（不会执行 HTML，交给解析器逐段渲染）：
     [c=#ff6600]橙色文字[/c]      自定义颜色（也支持工具栏里的主题色预设）
     [hl=#ff9e2c]高亮文字[/hl]    荧光笔式高亮（下半条底色，不吞掉文字本色）
     [s=1.18]大一号的字[/s]       字号倍率（相对正文）
   只有 c / hl / s 三种标签；写错或未闭合的标签会原样显示，不会丢字。 */
const NT_RICH_KINDS = ['c', 'hl', 's'];

/* 字号预设（十套主题共用，保证排版一致） */
const NT_TEXT_SIZES = [
  { t: '小', v: 0.86 },
  { t: '正常', v: 1 },
  { t: '大', v: 1.18 },
  { t: '特大', v: 1.42 }
];

/* 每套主题自己的配色预设（[名称, 色值]）；导入的自定义主题可覆盖 */
const NT_TEXT_PRESETS_RAW = {
  cyber: {
    colors: [['霓虹青', '#00d9ff'], ['警示橙', '#ff9e2c'], ['警报红', '#ff7b72'], ['荧光绿', '#56d364'], ['幻紫', '#b7a6ff']],
    highlights: [['青色荧光', '#00d9ff'], ['橙色荧光', '#ff9e2c'], ['品红荧光', '#ff5fa2']]
  },
  cream: {
    colors: [['赭石', '#b0703f'], ['蜂蜜', '#c07f2e'], ['陶红', '#b3604f'], ['苔绿', '#6f8f57'], ['紫藤', '#97799e']],
    highlights: [['奶油黄', '#f0c96a'], ['浅杏', '#e8a97e'], ['藕粉', '#e0a0a0']]
  },
  minimal: {
    colors: [['纯黑', '#111111'], ['链接蓝', '#0a6cff'], ['警示红', '#d0021b'], ['中灰', '#7a7a7a'], ['琥珀', '#a86800']],
    highlights: [['浅灰', '#d8d8d8'], ['浅蓝', '#cfe3ff'], ['浅黄', '#ffeaa0']]
  },
  gilt: {
    colors: [['鎏金', '#d4b878'], ['暖金', '#e0b25e'], ['朱砂', '#c0604e'], ['青瓷', '#8fb3cf'], ['象牙', '#efe6cf']],
    highlights: [['金粉', '#d4b878'], ['暗金', '#a8792f'], ['绛红', '#a4402f']]
  },
  tactical: {
    colors: [['警示黄', '#f5c400'], ['熔岩橙', '#ff5a00'], ['战术绿', '#9dff3c'], ['骨白', '#e6e2cc'], ['警戒红', '#ff3b30']],
    highlights: [['黄色荧光', '#f5c400'], ['橙色荧光', '#ff8a00'], ['绿色荧光', '#7ee02a']]
  },
  moonblue: {
    colors: [['月华青', '#4fd7f2'], ['冰蓝', '#8ff0ff'], ['星芒粉', '#ff9ec4'], ['暖阳金', '#ffe08a'], ['夜紫', '#b7a6ff']],
    highlights: [['青色荧光', '#4fd7f2'], ['粉色荧光', '#ff9ec4'], ['金色荧光', '#ffe08a']]
  },
  rebel: {
    colors: [['革命红', '#e60012'], ['墨黑', '#111111'], ['电光蓝', '#1f6feb'], ['炭灰', '#6b6b6b'], ['荧光绿', '#00b34a']],
    highlights: [['红色荧光', '#ff5b5b'], ['黄色荧光', '#ffd93b'], ['蓝色荧光', '#9ecbff']]
  },
  ink: {
    colors: [['朱砂', '#9e2b22'], ['浓墨', '#2a2620'], ['石青', '#4a6a7a'], ['松绿', '#4a6a52'], ['赭石', '#a0792a']],
    highlights: [['藤黄', '#e0c060'], ['胭脂', '#d99a9a'], ['石绿', '#a8c4a0']]
  },
  letter: {
    colors: [['火漆红', '#a8442f'], ['牛皮棕', '#8b5e34'], ['墨褐', '#4a3820'], ['橄榄', '#6f7a4a'], ['灰紫', '#7a6a8a']],
    highlights: [['羊皮黄', '#e8cf9a'], ['淡褐', '#d6bb95'], ['玫瑰灰', '#dbb0a4']]
  },
  crayon: {
    colors: [['蜡笔红', '#e94f37'], ['蜡笔蓝', '#2f6fdb'], ['草绿', '#3fa34d'], ['橘黄', '#f7a325'], ['葡萄紫', '#8a5ad0']],
    highlights: [['亮黄', '#ffe066'], ['水蓝', '#a8d8ff'], ['蜜桃', '#ffc2a8']]
  }
};
function ntPresetList(pairs){
  return (pairs || []).map(p => ({ t: String(p[0] == null ? '' : p[0]), v: String(p[1] == null ? '' : p[1]) }));
}
/* 当前主题的文字预设（自定义主题可带自己的 textPresets） */
function ntTextPresets(themeId, story){
  const ct = ntCustomThemes(story).find(t => t.id === themeId);
  if (ct && ct.textPresets && (ct.textPresets.colors || ct.textPresets.highlights)){
    const c = ct.textPresets.colors || [];
    const h = ct.textPresets.highlights || [];
    if (c.length || h.length) return { colors: c, highlights: h };
  }
  const raw = NT_TEXT_PRESETS_RAW[themeId] || NT_TEXT_PRESETS_RAW.cyber;
  return { colors: ntPresetList(raw.colors), highlights: ntPresetList(raw.highlights) };
}

/* ---------- 富文本解析 ---------- */
function ntRichHex(v){
  return /^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/.test(String(v || '')) ? String(v) : null;
}
function ntRichSize(v){
  const n = parseFloat(v);
  if (!isFinite(n) || n < 0.5 || n > 3) return null;
  return String(Math.round(n * 100) / 100);
}
/* 把一段文字切成 [{t,c,bg,s}]；非法/未闭合标签按普通文字保留 */
function ntParseRich(text){
  const src = String(text == null ? '' : text);
  const runs = [];
  const stack = [];
  let buf = '';
  const styleNow = () => {
    const st = { c: null, bg: null, s: null };
    for (let i = 0; i < stack.length; i++){
      if (stack[i].k === 'c') st.c = stack[i].v;
      else if (stack[i].k === 'hl') st.bg = stack[i].v;
      else st.s = stack[i].v;
    }
    return st;
  };
  const flush = () => {
    if (!buf) return;
    const st = styleNow();
    runs.push({ t: buf, c: st.c, bg: st.bg, s: st.s });
    buf = '';
  };
  const re = /\[(c|hl|s)=([^\[\]\s]{1,32})\]|\[\/(c|hl|s)\]/g;
  let last = 0, m;
  while ((m = re.exec(src))){
    buf += src.slice(last, m.index);
    last = re.lastIndex;
    if (m[1]){
      const v = (m[1] === 's') ? ntRichSize(m[2]) : ntRichHex(m[2]);
      if (v == null){ buf += m[0]; continue; }
      flush();
      stack.push({ k: m[1], v: v });
    } else {
      const k = m[3];
      let idx = -1;
      for (let i = stack.length - 1; i >= 0; i--){ if (stack[i].k === k){ idx = i; break; } }
      if (idx < 0){ buf += m[0]; continue; }
      flush();
      stack.splice(idx, 1);
    }
  }
  buf += src.slice(last);
  flush();
  if (!runs.length) runs.push({ t: '', c: null, bg: null, s: null });
  return runs;
}
/* #rgb / #rrggbb → rgba(...)，高亮用半透明荧光笔效果 */
function ntRgba(hex, a){
  let h = String(hex || '').replace('#', '');
  if (h.length === 3 || h.length === 4) h = h.slice(0, 3).split('').map(c => c + c).join('');
  if (!/^[0-9a-fA-F]{6}$/.test(h)) return 'rgba(255,255,255,' + (a == null ? 1 : a) + ')';
  const n = parseInt(h, 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + (a == null ? 1 : a) + ')';
}
/* 一个 run 的内联样式（运行时与编辑器预览共用，保证「所见即所得」）
   —— 高亮用「荧光笔」横条，但位置/粗细必须用 em 而不是百分比：
      百分比是相对每个 span 自己的内容框高度算的，遇到 [s=1.42] 这种大字号，
      内容框被撑高、基线位置不变，横条就会整体上移且变粗，和正常字号对不齐。
      改成 em 定位后，横条始终在基线下同一位置、粗细随字号等比缩放。
      line-height:1 是为了防止「字号 1.42 继承 line-height:2」把整行撑高。 */
function ntRunStyle(r){
  const out = [];
  if (r.c) out.push('color:' + r.c);
  if (r.bg){
    const col = ntRgba(r.bg, 0.62);
    out.push('background-image:linear-gradient(180deg,transparent .64em,' + col + ' .64em,' + col + ' 1.08em,transparent 1.08em)');
    out.push('-webkit-box-decoration-break:clone');
    out.push('box-decoration-break:clone');
  }
  if (r.s){
    out.push('font-size:' + r.s + 'em');
    out.push('line-height:1');
  }
  return out.join(';');
}
/* 编辑器预览用：把富文本转成安全的 HTML 字符串 */
function ntRichHtml(text){
  const E = s => String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  return ntParseRich(text).map(r => {
    const st = ntRunStyle(r);
    return st ? '<span style="' + st + '">' + E(r.t) + '</span>' : E(r.t);
  }).join('');
}

/* ============ NPC 角色卡 ============ */
/* portrait = 对话里的小立绘（胸像）；card.full = 角色卡里的全身立绘 */
function ntDefaultNpcCard(){
  return { title: '', full: null, intro: '', fields: [] };
}
function ntEnsureNpcCard(npc){
  if (!npc) return null;
  const c = npc.card = Object.assign(ntDefaultNpcCard(), npc.card || {});
  if (typeof c.title !== 'string') c.title = '';
  if (typeof c.intro !== 'string') c.intro = '';
  if (c.full === undefined) c.full = null;
  if (!Array.isArray(c.fields)) c.fields = [];
  c.fields = c.fields.filter(f => f && typeof f === 'object').map(f => ({
    k: String(f.k == null ? '' : f.k).slice(0, 40),
    v: String(f.v == null ? '' : f.v).slice(0, 400)
  }));
  return c;
}
function ntNpcHasCard(npc){
  const c = npc && npc.card;
  if (!c) return false;
  return !!(c.full || c.title || c.intro || (Array.isArray(c.fields) && c.fields.some(f => f.k || f.v)));
}

/* ============ 头像裁切（对话行里的小头像） ============ */
/* 胸像不一定是正方形构图（比如一个圆滚滚的团子，脸只占中间一小块），
   所以每个 NPC 带一组「框形状 + 缩放 + 横向/纵向取景」参数，作者自己把脸卡到框中间。 */
const NT_AVATAR_SHAPES = [
  { v: 'round', t: '圆形' },
  { v: 'square', t: '方形' },
  { v: 'tall', t: '竖长（3:4）' }
];
function ntDefaultAvatar(){
  /* 默认对准胸像的中心：多数人传的是胸像，脸在画面中间偏上 */
  return { shape: 'round', zoom: 1, x: 50, y: 46 };
}
function ntEnsureAvatar(npc){
  if (!npc) return ntDefaultAvatar();
  const a = npc.avatar = Object.assign(ntDefaultAvatar(), npc.avatar || {});
  if (!NT_AVATAR_SHAPES.some(s => s.v === a.shape)) a.shape = 'round';
  const z = +a.zoom;
  a.zoom = (isFinite(z) && z > 0) ? Math.min(3, Math.max(0.6, z)) : 1;
  const x = +a.x, y = +a.y;
  a.x = isFinite(x) ? Math.min(100, Math.max(0, x)) : 50;
  a.y = isFinite(y) ? Math.min(100, Math.max(0, y)) : 12;
  return a;
}
/* 内联样式：object-position 定取景中心，transform 定缩放（以同一个点为中心，方便卡头部） */
function ntAvatarStyle(npc){
  const a = ntEnsureAvatar(npc);
  const px = a.x.toFixed(1), py = a.y.toFixed(1);
  return 'object-position:' + px + '% ' + py + '%;' +
    'transform:scale(' + a.zoom.toFixed(2) + ');' +
    'transform-origin:' + px + '% ' + py + '%';
}
/* 头像框的额外类名（形状） */
function ntAvatarShape(npc){
  return 'shape-' + ntEnsureAvatar(npc).shape;
}

/* ============ 立绘差分（表情拆分） ============ */
/* 对话里写【林晚2】= 林晚的 2 号差分；数字只是序号，显示名字仍然是「林晚」。
   没配这个序号就往前退（3 → 2 → 1），一个都没有就用 NPC 的基础立绘。 */
function ntSplitAlt(who){
  const s = String(who == null ? '' : who).trim();
  const m = s.match(/^(.*?)(\d{1,2})$/);
  if (m && m[1]) return { base: m[1], key: m[2] };
  return { base: s, key: '' };
}
function ntNpcAlts(npc){
  if (!npc) return [];
  if (!Array.isArray(npc.alts)) npc.alts = [];
  return npc.alts;
}
function ntNpcAlt(npc, key){
  if (!npc || !key) return null;
  const k = parseInt(key, 10);
  if (!isFinite(k)) return null;
  const list = ntNpcAlts(npc).filter(a => a && a.k);
  for (let i = k; i >= 1; i--){
    const hit = list.find(a => String(a.k) === String(i));
    if (hit) return hit;
  }
  return null;
}
/* 差分里没传图的那一格，逐级回退到基础立绘 */
function ntNpcBust(npc, key){
  if (!npc) return null;
  const a = ntNpcAlt(npc, key);
  return (a && a.portrait) || npc.portrait || null;
}
function ntNpcFull(npc, key){
  if (!npc) return null;
  const a = ntNpcAlt(npc, key);
  return (a && a.full) || (npc.card && npc.card.full) || npc.portrait || null;
}
/* 舞台立绘的 who 支持 "npc_1#2" 这种写法（id 里本来就有数字，所以用 # 分隔） */
function ntCastWho(cast){
  const raw = String((cast && cast.who) || '');
  const i = raw.indexOf('#');
  return i > 0 ? { who: raw.slice(0, i), key: raw.slice(i + 1) } : { who: raw, key: '' };
}

/* ============ 演出（舞台）背景库 ============ */
function ntStageBgs(story){
  const s = story && story.settings;
  return (s && s.stage && Array.isArray(s.stage.bgs)) ? s.stage.bgs : [];
}
function ntStageBg(story, id){
  return ntStageBgs(story).find(b => b.id === id) || null;
}
/* 节点是否真的走演出模式 */
function ntHasStage(n){
  if (!n || !n.stage || n.stage.on === false) return false;
  return !!(n.stage.bg || (Array.isArray(n.stage.cast) && n.stage.cast.length));
}
function ntDefaultStage(){
  return { on: true, bg: null, cast: [] };
}
/* 舞台立绘：优先全身立绘，退回对话胸像；'__hero' 是主角 */
const NT_HERO_CAST = '__hero';
function ntCastImage(story, cast, heroPortrait){
  if (!cast) return null;
  if (cast.who === NT_HERO_CAST) return heroPortrait || null;
  const p = ntCastWho(cast);
  const npc = (story.npcs || []).find(n => n.id === p.who) || (story.npcs || []).find(n => n.name === p.who)
    || (story.npcs || []).find(n => n.name === ntSplitAlt(p.who).base);
  if (!npc) return null;
  return ntNpcFull(npc, p.key);
}
const NT_CAST_POS = [
  { v: 'left', t: '左' }, { v: 'center', t: '中' }, { v: 'right', t: '右' }
];
/* pos 只是快捷档位，真正的横向位置看 x（百分比，0=最左 100=最右） */
const NT_CAST_X = { left: 24, center: 50, right: 76 };
function ntCastX(cast){
  const raw = cast && cast.x;
  const x = (raw === null || raw === undefined || raw === '') ? NaN : +raw;
  if (isFinite(x) && x >= 0 && x <= 100) return Math.round(x);
  const pos = (cast && cast.pos) || 'center';
  return NT_CAST_X[pos] == null ? 50 : NT_CAST_X[pos];
}
/* 主角的立绘一律排在右半边 */
function ntCastIsHero(cast){ return !!cast && cast.who === NT_HERO_CAST; }
/* 立绘的纵向微调：y = 底边抬起（正）/压下（负）的百分比；h = 立绘高度百分比（100 = 占满舞台） */
function ntCastY(cast){
  const raw = cast && cast.y;
  const v = (raw === null || raw === undefined || raw === '') ? NaN : +raw;
  return isFinite(v) ? Math.min(45, Math.max(-30, Math.round(v))) : 0;
}
function ntCastH(cast){
  const raw = cast && cast.h;
  const v = (raw === null || raw === undefined || raw === '') ? NaN : +raw;
  return isFinite(v) ? Math.min(140, Math.max(50, Math.round(v))) : 100;
}

/* 卡片上的 sfx 为空 = 跟随全局；'off' = 这张卡静音；其它 = 覆盖全局 */
function ntSfxOf(story, node){

  };
