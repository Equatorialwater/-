/* 导入校验：只接受安全的变量名/变量值，避免主题包破坏页面 */
function ntSanitizeThemePack(raw, story){
  const errs = [];
  let pack = raw;
  if (typeof pack === 'string'){
    try { pack = JSON.parse(pack); } catch(e){ return { ok: false, errors: ['JSON 解析失败：' + e.message], pack: null }; }
  }
  if (!pack || typeof pack !== 'object' || Array.isArray(pack)) return { ok: false, errors: ['主题包必须是一个 JSON 对象'], pack: null };
  const fmt = pack.format || NT_THEME_PACK_FORMAT;
  if (fmt !== NT_THEME_PACK_FORMAT) errs.push('format 必须是 "' + NT_THEME_PACK_FORMAT + '"（当前：' + fmt + '）');
  const name = String(pack.name == null ? '' : pack.name).trim();
  if (!name) errs.push('缺少 name（主题显示名）');
  let id = String(pack.id == null ? '' : pack.id).trim().toLowerCase().replace(/\s+/g, '-');
  if (!id) id = 'custom-' + Math.random().toString(36).slice(2, 7);
  if (!/^[a-z0-9][a-z0-9_-]{1,23}$/.test(id)) errs.push('id 只能用小写字母 / 数字 / - / _，长度 2–24（当前：' + id + '）');
  if (NT_THEME_IDS.includes(id)) errs.push('id「' + id + '」和内置主题重名，请换一个');
  const varsIn = pack.vars || pack.cssVars || {};
  if (!varsIn || typeof varsIn !== 'object' || Array.isArray(varsIn)) errs.push('vars 必须是一个对象（CSS 变量 → 值）');
  const vars = {};
  Object.keys(varsIn || {}).forEach(k => {
    const key = String(k).startsWith('--') ? String(k) : '--' + String(k);
    if (!/^--[a-zA-Z0-9-]{1,40}$/.test(key)){ errs.push('变量名不合法：' + k); return; }
    let v = String(varsIn[k] == null ? '' : varsIn[k]).trim();
    if (!v) return;
    if (/[;{}<>\\]/.test(v)){ errs.push('变量 ' + key + ' 的值里有非法字符（; { } < > \\），只能写纯 CSS 值'); return; }
    if (v.length > 200) v = v.slice(0, 200);
    vars[key] = v;
  });
  const missing = NT_THEME_REQUIRED_VARS.filter(k => !vars[k]);
  if (missing.length) errs.push('缺少必需的变量：' + missing.join('、'));
  let css = pack.css == null ? '' : String(pack.css);
  if (css){
    if (css.length > 60000) errs.push('css 太长了（上限 60KB）');
    if (/<\/?\s*script|<\/?\s*style|javascript:|expression\s*\(/i.test(css)) errs.push('css 里不允许出现脚本 / style 标签 / javascript:');
    if (!/\{scope\}|\{body\}/.test(css)) errs.push('css 里必须用 {scope}（=.ui-主题id）或 {body}（=body.ui-主题id）占位符');
  }
  let textPresets = null;
  if (pack.textPresets && typeof pack.textPresets === 'object'){
    const pick = list => (Array.isArray(list) ? list : []).map(x => {
      if (Array.isArray(x)) return { t: String(x[0] || '').slice(0, 12), v: ntRichHex(x[1]) };
      if (x && typeof x === 'object') return { t: String(x.t || x.name || '').slice(0, 12), v: ntRichHex(x.v || x.value) };
      return null;
    }).filter(x => x && x.v).slice(0, 12);
    const c = pick(pack.textPresets.colors);
    const h = pick(pack.textPresets.highlights);
    if (c.length || h.length) textPresets = { colors: c, highlights: h };
  }
  const ct = ntCustomThemes(story);
  if (ct.length >= 20) errs.push('自定义主题最多 20 套，请先删掉用不到的');
  if (errs.length) return { ok: false, errors: errs, pack: null };
  return {
    ok: true, errors: [],
    pack: {
      id: id,
      name: name.slice(0, 24),
      desc: String(pack.desc || '').slice(0, 60),
      author: String(pack.author || '').slice(0, 40),
      vars: vars,
      css: css,
      textPresets: textPresets
    }
  };
}
/* 生成自定义主题的样式表（编辑器与导出共用这一份） */
function ntCustomThemeCss(story){
  const list = ntCustomThemes(story);
  if (!list.length) return '';
  return list.map(t => {
    const sel = '.ui-' + t.id;
    const bodySel = 'body.ui-' + t.id;
    const vars = Object.keys(t.vars || {}).map(k => k + ':' + t.vars[k] + ';').join('');
    let out = '/* ===== 自定义主题：' + String(t.name || t.id).replace(/[*\/]/g, '') + ' ===== */\n';
    out += bodySel + ',' + sel + '{' + vars + '}\n';
    if (t.css) out += t.css.replace(/\{scope\}/g, sel).replace(/\{body\}/g, bodySel) + '\n';
    return out;
  }).join('');
}

/* ============ 界面缩放（编辑器 / 播放器各自记忆，只影响本机显示） ============ */
const NT_UI_SCALES = [0.75, 0.8, 0.9, 1, 1.1, 1.25, 1.5];
function ntUiScaleKey(view){ return 'nt_ui_scale_' + (view === 'player' ? 'player' : 'editor'); }
function ntUiScaleGet(view){
  try {
    const v = parseFloat(localStorage.getItem(ntUiScaleKey(view)));
    if (isFinite(v) && v >= 0.5 && v <= 2) return v;
  } catch(e){}
  return 1;
}
function ntUiScaleSet(view, v){
  const s = Math.min(2, Math.max(0.5, +v || 1));
  try { localStorage.setItem(ntUiScaleKey(view), String(s)); } catch(e){}
  return s;
}
function ntUiScaleApply(view){
  const el = document.getElementById('app');
  const v = ntUiScaleGet(view);
  if (el) el.style.zoom = String(v);
  return v;
}
function ntUiScalePct(view){ return Math.round(ntUiScaleGet(view) * 100) + '%'; }

/* 节点工厂 */
function ntMakeNode(type, id, x, y){
  const base = { id, type, x: Math.round(x), y: Math.round(y), title: '', chapter: '', time: null, stage: null, pageLines: 0 };
  switch(type){
    case 'story':
      return { ...base, title: '新剧情', text: '', effects: [], next: null };
    case 'choice':
      return { ...base, title: '新选项', text: '', lockedMode: 'hide', choices: [
        { text: '选项一', conditions: [], effects: [], next: null },
        { text: '选项二', conditions: [], effects: [], next: null }
      ]};
    case 'check':
      return { ...base, title: '新检定', text: '',
        check: { die: 20, bonus: { type: 'none', id: null }, dc: 12, showRoll: true, successNext: null, failNext: null } };
    case 'effect':
      return { ...base, title: '数值变更', text: '', effects: [], next: null };
    case 'quest':
      return { ...base, title: '任务变更', text: '',
        quest: { action: 'start', id: 'q1', name: '新任务', desc: '' }, next: null };
    case 'ending':
      return { ...base, title: '新结局', text: '', ending: { name: '新结局', desc: '' } };
    case 'jump':
      return { ...base, title: '章节跳转', text: '', target: null };
    case 'random':
      return { ...base, title: '随机事件', text: '',
        outcomes: [ { next: null, weight: 50 }, { next: null, weight: 50 } ] };
    case 'cg':
      return { ...base, title: '新插图', image: null, caption: '', text: '', effects: [], next: null };
    case 'battle':
      return { ...base, title: '新战斗', text: '', effects: [], battle: {
        enemy: { name: '拦路者', hp: 30, atk: 6, def: 1 },
        hpAttr: null,
        atkBonus: { type: 'none', id: null },
        defBonus: { type: 'none', id: null },
        winNext: null, loseNext: null,
        attackLines: ntBattleDefaultLines('attack'),
        hurtLines: ntBattleDefaultLines('hurt'),
        winLine: '{enemy}倒了下去。你喘着气，握紧了手里的东西。',
        loseLine: '视野开始发黑，{enemy}的轮廓在雾里晃动。'
      }};
    default:
      return { ...base, title: type, text: '', next: null };
  }
}

/* 读取当前主题下的 CSS 变量（主题类挂在 body 上） */
function ntCssVar(name, fallback){
  try {
    const v = getComputedStyle(document.body).getPropertyValue(name).trim();
    return v || fallback;
  } catch(e){ return fallback; }
}

/* 当前主题的节点类型色 */
function ntNodePalette(){
  const out = {};
  for (const k in NT_NODE_TYPES) out[k] = ntCssVar('--tc-' + k, NT_NODE_TYPES[k].color);
  return out;
}

  return NT_TILES.map(t => ntCssVar('--tile-' + t.v, t.c));
}

/* SVG 立绘：编码成 dataURI（encodeURIComponent 会处理 # 等字符） */
function ntSvgUri(svg){
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(String(svg).replace(/\s+/g, ' ').trim());
}

/* 演出背景：一间奇怪的书房（教程第一张卡片用，纯矢量，体积很小） */
function ntLibrarySvg(){
  const spine = (x, y, h, w, col) =>
    `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="${col}"/>`;
  const shelf = (x, y, w) => {
    let s = `<rect x="${x}" y="${y}" width="${w}" height="12" rx="3" fill="#6b4a2f"/>`;
    let cx = x + 8;
    const cols = ['#c0533f', '#d98b3a', '#b8892f', '#4f7f6b', '#3f6f9b', '#7a568f', '#a9424a', '#5d7f3f'];
    let i = 0;
    while (cx < x + w - 16){
      const bw = 11 + ((i * 7) % 9);
      const bh = 62 + ((i * 13) % 26);
      s += spine(cx, y + 12 - bh, bh, bw, cols[i % cols.length]);
      s += `<rect x="${cx + 2}" y="${y + 12 - bh + 8}" width="${bw - 5}" height="3" rx="1.5" fill="#f3e2c4" opacity="0.55"/>`;
      cx += bw + 3;
      i++;
    }
    return s;
  };
  const shelfRows = (x, w, y0, n) => {
    let s = '';
    for (let i = 0; i < n; i++) s += shelf(x, y0 + i * 96, w);
    return s;
  };
  return ntSvgUri(`<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="lb_wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a3a2c"/><stop offset="0.55" stop-color="#3a2d23"/><stop offset="1" stop-color="#241b15"/></linearGradient>

    <linearGradient id="lb_win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe6ff"/><stop offset="1" stop-color="#9fc3e6"/></linearGradient>
    <linearGradient id="lb_floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a422d"/><stop offset="1" stop-color="#2b1e15"/></linearGradient>
    <radialGradient id="lb_rug" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#a8503f"/><stop offset="1" stop-color="#6d2f26"/></radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#lb_wall)"/>
  <rect y="700" width="1600" height="200" fill="url(#lb_floor)"/>
  <g stroke="#7a5a3c" stroke-opacity="0.35" stroke-width="3">

/* 按目标尺寸重建地图字符串（保留左上角重叠部分） */function ntResizeTiles(old, cols, rows){
  const out = [];
  for (let y = 0; y < rows; y++){
    const src = String((old && old[y]) || '');
    let line = '';
    for (let x = 0; x < cols; x++){
      const ch = src[x];
      line += (ch >= '1' && ch <= '5') ? ch : '0';
    }
    out.push(line);
  }
  return out;
}

/* 导入图片：压缩到 maxSide 以内，输出 dataURL（内嵌进 story.json，导出不丢） */
function ntImportImage(file, maxSide, cb, mode){
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, (maxSide || 512) / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      const mime = (mode && mode.mime) || 'image/png';
      cb(mode && mode.quality !== undefined
        ? cv.toDataURL(mime, mode.quality)
        : cv.toDataURL(mime));
    };
    img.onerror = () => { if (typeof ntToast !== 'undefined') ntToast('图片读取失败', 'warn'); };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

/* 补齐 story 的可选字段（npcs / settings / 地图），兼容旧版本存档 */
function ntEnsureSettings(story){
  if (!story.meta) story.meta = { title: '', counters: {} };
  const meta = story.meta;
  meta.counters = Object.assign(
    { node: 0, quest: 0, attr: 0, skill: 0, item: 0, eq: 0, npc: 0, poi: 0, cat: 0, ch: 0, bg: 0 },
    meta.counters || {});
  if (!story.character) story.character = {};
  if (!Array.isArray(story.character.attributes)) story.character.attributes = [];
  if (!Array.isArray(story.character.skills)) story.character.skills = [];
  if (!Array.isArray(story.character.items)) story.character.items = [];
  if (!Array.isArray(story.character.equipment)) story.character.equipment = [];
  if (!story.character.currency) story.character.currency = { id: 'cred', name: '货币', value: 0 };
  if (story.character.currency.id === undefined) story.character.currency.id = 'cred';
  story.character.attributes.forEach(a => { if (a.alloc === undefined) a.alloc = false; });
  /* 技能：除检定值外，还能当战斗技能用（combat 打开才出现在战斗菜单） */
  story.character.skills.forEach(s => {
    if (s.alloc === undefined) s.alloc = false;
    s.combat = !!s.combat;
    s.power = Math.max(0, Math.round(+s.power || 0));
    s.cost = Math.max(0, Math.round(+s.cost || 0));
    s.costAttr = s.costAttr || null;
    s.heal = Math.max(0, Math.round(+s.heal || 0));
    if (s.line == null) s.line = '';
  });
  /* 道具：可以带一个战斗内效果 */
  story.character.items.forEach(it => {
    if (!it.use || typeof it.use !== 'object') it.use = { kind: 'none', attr: null, value: 0 };
    if (['none', 'heal', 'damage', 'cure'].indexOf(it.use.kind) < 0) it.use.kind = 'none';
    it.use.attr = it.use.attr || null;
    it.use.value = Math.round(+it.use.value || 0);
  });
  story.character.equipment.forEach(e => {
    if (!e.id) e.id = 'eq_' + Math.random().toString(36).slice(2, 7);
    if (!e.name) e.name = '新装备';
    if (e.desc === undefined) e.desc = '';
    if (!['weapon', 'armor', 'accessory'].includes(e.slot)) e.slot = 'weapon';
    e.atk = +e.atk || 0;
    e.def = +e.def || 0;
  });
  if (!Array.isArray(story.npcs)) story.npcs = [];
  story.npcs = story.npcs.filter(n => n && typeof n === 'object');
  story.npcs.forEach(n => {
    if (!n.id) n.id = 'npc_' + Math.random().toString(36).slice(2, 7);
    if (n.name === undefined || n.name === null) n.name = '新角色';
    if (n.portrait === undefined) n.portrait = null;
    ntEnsureNpcCard(n);
    ntEnsureAvatar(n);
    /* 差分（表情拆分）：k 是序号，1 开始 */
    if (!Array.isArray(n.alts)) n.alts = [];
    n.alts = n.alts.filter(a => a && a.k !== undefined && a.k !== null && String(a.k) !== '')
      .map(a => ({
        k: String(Math.max(1, Math.min(99, parseInt(a.k, 10) || 1))),
        portrait: a.portrait || null,
        full: a.full || null
      }))
      .sort((a, b) => +a.k - +b.k).slice(0, 30);
  });
  const s = story.settings = story.settings || {};
  s.portraits = s.portraits !== false;
  s.features = Object.assign(
    { inventory: true, equipment: true, quests: true, gallery: true, npcCard: true }, s.features || {});
  ['inventory', 'equipment', 'quests', 'gallery', 'npcCard'].forEach(k => {
    if (typeof s.features[k] !== 'boolean') s.features[k] = true;
  });
  /* 自定义 UI 主题：先清洗，再参与 ui 合法性校验 */
  if (!Array.isArray(s.customThemes)) s.customThemes = [];
  s.customThemes = s.customThemes.filter(t => t && typeof t === 'object' && t.id && t.vars)
    .slice(0, 20).map(t => {
      const vars = {};
      Object.keys(t.vars || {}).forEach(k => {
        const key = String(k).startsWith('--') ? String(k) : '--' + k;
        if (/^--[a-zA-Z0-9-]{1,40}$/.test(key)) vars[key] = String(t.vars[k] == null ? '' : t.vars[k]);
      });
      return {
        id: String(t.id).toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 24),
        name: String(t.name || t.id).slice(0, 24),
        desc: String(t.desc || '').slice(0, 60),
        author: String(t.author || '').slice(0, 40),
        vars: vars,
        css: typeof t.css === 'string' ? t.css : '',
        textPresets: (t.textPresets && typeof t.textPresets === 'object') ? t.textPresets : null
      };
    }).filter(t => t.id && !NT_THEME_IDS.includes(t.id));
  /* 演出背景库 */
  s.stage = Object.assign({ bgs: [] }, s.stage || {});
  if (!Array.isArray(s.stage.bgs)) s.stage.bgs = [];
  s.stage.bgs = s.stage.bgs.filter(b => b && b.id && b.image).map(b => ({
    id: String(b.id), name: String(b.name || '背景').slice(0, 40), image: b.image
  }));
  s.charCreation = Object.assign(
    { enabled: false, points: 10, intro: '', portraits: [], profileCats: [] }, s.charCreation || {});
  if (!Array.isArray(s.charCreation.portraits)) s.charCreation.portraits = [];
  if (!Array.isArray(s.charCreation.profileCats)) s.charCreation.profileCats = [];
  s.charCreation.profileCats.forEach(c => {
    if (!c.name) c.name = '类别';
    if (c.type !== 'text' && c.type !== 'select') c.type = 'select';
    if (!Array.isArray(c.options)) c.options = [];
  });
  s.time = Object.assign(
    { enabled: false, startDay: 1, startHour: 9, startMin: 0 }, s.time || {});
  /* 打字音效（全局默认，卡片可覆盖） */
  s.sfx = Object.assign(ntDefaultSfx(), s.sfx || {});
  if (!NT_SFX_PRESETS.some(p => p.v === s.sfx.typing)) s.sfx.typing = 'off';
  s.sfx.volume = Math.min(1, Math.max(0, isFinite(+s.sfx.volume) ? +s.sfx.volume : 0.4));
  if (typeof s.sfx.data !== 'string') s.sfx.data = null;
  if (typeof s.sfx.name !== 'string') s.sfx.name = '';
  s.ui = Object.assign({ editor: 'cyber', player: 'cyber' }, s.ui || {});
  const THEMES = NT_THEME_IDS.concat(s.customThemes.map(t => t.id));
  ['editor', 'player'].forEach(k => {
    if (s.ui[k] === 'ff14') s.ui[k] = 'gilt';          // v3.1：ff14 更名为 gilt
    if (!THEMES.includes(s.ui[k])) s.ui[k] = 'cyber';
  });
  if (!Array.isArray(story.chapters)) story.chapters = [];
  story.chapters.forEach(c => {
    if (!c.id) c.id = 'ch_' + Math.random().toString(36).slice(2, 7);
    if (!c.color) c.color = '#378ADD';
  });
  if (!Array.isArray(story.nodes)) story.nodes = [];
  story.nodes.forEach(n => {
    if (n.chapter === undefined || n.chapter === null) n.chapter = '';
    if (n.time === undefined) n.time = null;
    /* 演出分页：0 = 按对话框高度自动分页，N = 每页最多 N 段 */
    n.pageLines = Math.max(0, Math.min(20, Math.round(+n.pageLines || 0)));
    if (!NT_NODE_TYPES[n.type]) n.type = 'story';          // 未知类型兜底，避免旧档/手改档渲染崩
    /* 卡片级打字音效：'' = 跟随全局 */
    const sfxKeys = NT_SFX_PRESETS.map(p => p.v);
    n.sfx = (n.sfx && n.sfx !== 'inherit' && sfxKeys.indexOf(n.sfx) >= 0) ? n.sfx : '';
    /* 演出（舞台）配置 */
    if (n.stage && typeof n.stage === 'object'){
      n.stage = Object.assign(ntDefaultStage(), n.stage);
      if (n.stage.bg && !ntStageBg(story, n.stage.bg)) n.stage.bg = null;
      if (!Array.isArray(n.stage.cast)) n.stage.cast = [];
      n.stage.cast = n.stage.cast.filter(c => c && c.who).map(c => {
        const x = (c.x === null || c.x === undefined || c.x === '') ? NaN : +c.x;
        const y = (c.y === null || c.y === undefined || c.y === '') ? NaN : +c.y;
        const hh = (c.h === null || c.h === undefined || c.h === '') ? NaN : +c.h;
        return {
          who: String(c.who),
          pos: NT_CAST_POS.some(p => p.v === c.pos) ? c.pos : 'center',
          /* x 是自由调的位置（百分比）；null = 用 pos 档位换算 */
          x: (isFinite(x) && x >= 0 && x <= 100) ? Math.round(x) : null,
          /* y 纵向微调（正数抬高，让头露出来）；h 立绘大小 */
          y: isFinite(y) ? Math.min(45, Math.max(-30, Math.round(y))) : 0,
          h: isFinite(hh) ? Math.min(140, Math.max(50, Math.round(hh))) : 100
        };
      }).slice(0, 4);
    } else n.stage = null;
    if (n.type === 'cg'){
      if (n.image === undefined) n.image = null;
      if (n.caption === undefined) n.caption = '';
      /* 画面填充：默认铺满整屏（和演出模式一样），想完整显示可改成 contain */
      n.cgFit = (n.cgFit === 'contain') ? 'contain' : 'cover';
      if (!Array.isArray(n.effects)) n.effects = [];
      if (n.next === undefined) n.next = null;
    }
    if (n.type === 'battle'){
      const b = n.battle = Object.assign({
        enemy: {}, hpAttr: null,
        atkBonus: { type: 'none', id: null }, defBonus: { type: 'none', id: null },
        winNext: null, loseNext: null,
        attackLines: [], hurtLines: [], winLine: '', loseLine: ''
      }, n.battle || {});
      b.enemy = Object.assign({ name: '拦路者', hp: 30, atk: 6, def: 1, image: null }, b.enemy || {});
      if (b.enemy.image === undefined) b.enemy.image = null;
      /* 战斗演出：敌人立绘放舞台正中；没有图片时退回普通卡片 */
      b.stage = !!b.stage;
      if (!Array.isArray(b.attackLines) || !b.attackLines.length) b.attackLines = ntBattleDefaultLines('attack');
      if (!Array.isArray(b.hurtLines) || !b.hurtLines.length) b.hurtLines = ntBattleDefaultLines('hurt');
      if (b.hpAttr === undefined) b.hpAttr = null;
      if (!b.atkBonus) b.atkBonus = { type: 'none', id: null };
      if (!b.defBonus) b.defBonus = { type: 'none', id: null };
      if (b.winNext === undefined) b.winNext = null;
      if (b.loseNext === undefined) b.loseNext = null;
      if (b.winLine == null) b.winLine = '';
      if (b.loseLine == null) b.loseLine = '';
      if (!Array.isArray(n.effects)) n.effects = [];
    }
  });
  const m = s.map = Object.assign(
    { enabled: false, title: '地图', cols: 24, rows: 14, travelMode: 'visited', pois: [] }, s.map || {});
  if (m.travelMode !== 'always' && m.travelMode !== 'visited') m.travelMode = 'visited';  m.cols = Math.min(40, Math.max(6, parseInt(m.cols, 10) || 24));
  m.rows = Math.min(30, Math.max(4, parseInt(m.rows, 10) || 14));
  const rows = Array.isArray(m.tiles) ? m.tiles : [];
  const tilesOk = rows.length === m.rows && rows.every(r =>
    typeof r === 'string' && r.length === m.cols && /^[0-5]+$/.test(r));
  if (!tilesOk) m.tiles = ntResizeTiles(rows, m.cols, m.rows);
  if (!Array.isArray(m.pois)) m.pois = [];
  m.pois = m.pois.filter(p => p && p.x >= 0 && p.y >= 0 && p.x < m.cols && p.y < m.rows);
  m.pois.forEach(p => {
    if (!p.id) p.id = 'poi_' + Math.random().toString(36).slice(2, 7);
    if (p.node === undefined) p.node = '';
    if (!p.name) p.name = '地点';
  });
  return story;
}

/* 计数器回填（导入/加载后调用，保证自动 id 不冲突） */
function ntRecalcCounters(story){
  const c = story.meta.counters = story.meta.counters || { node:0, quest:0, attr:0, skill:0, item:0, eq:0 };
  c.npc = c.npc || 0; c.poi = c.poi || 0; c.cat = c.cat || 0; c.ch = c.ch || 0; c.eq = c.eq || 0; c.bg = c.bg || 0;
  (story.chapters || []).forEach(ch => {
    const m = String(ch.id).match(/ch_(\d+)/); if (m) c.ch = Math.max(c.ch, +m[1]);
  });
  story.nodes.forEach(n => {
    const m = String(n.id).match(/nd_(\d+)/);
    if (m) c.node = Math.max(c.node, +m[1]);
    if (n.type === 'quest' && n.quest && n.quest.id){
      const q = String(n.quest.id).match(/^q(\d+)$/);
      if (q) c.quest = Math.max(c.quest, +q[1]);
    }
  });
  (story.character.attributes||[]).forEach(a => {
    const m = String(a.id).match(/attr_(\d+)/); if (m) c.attr = Math.max(c.attr, +m[1]);
  });
  (story.character.skills||[]).forEach(s => {
    const m = String(s.id).match(/skill_(\d+)/); if (m) c.skill = Math.max(c.skill, +m[1]);
  });
  (story.character.items||[]).forEach(it => {
    const m = String(it.id).match(/item_(\d+)/); if (m) c.item = Math.max(c.item, +m[1]);
  });
  c.eq = c.eq || 0;
  (story.character.equipment||[]).forEach(eq => {
    const m = String(eq.id).match(/eq_(\d+)/); if (m) c.eq = Math.max(c.eq, +m[1]);
  });
  (story.npcs||[]).forEach(n => {
    const m = String(n.id).match(/npc_(\d+)/); if (m) c.npc = Math.max(c.npc, +m[1]);
  });
  const st = story.settings || {};
  if (st.map && Array.isArray(st.map.pois)) st.map.pois.forEach(p => {
    const m = String(p.id).match(/poi_(\d+)/); if (m) c.poi = Math.max(c.poi, +m[1]);
  });
  if (st.charCreation && Array.isArray(st.charCreation.profileCats)) st.charCreation.profileCats.forEach(cat => {
    const m = String(cat.id).match(/cat_(\d+)/); if (m) c.cat = Math.max(c.cat, +m[1]);
  });
  if (st.stage && Array.isArray(st.stage.bgs)) st.stage.bgs.forEach(b => {
    const m = String(b.id).match(/bg_(\d+)/); if (m) c.bg = Math.max(c.bg, +m[1]);
  });
  return story;
}

/* ============ 通用描述工具（编辑器预览 / 运行时提示共用） ============ */

function ntEffectDesc(story, e){
  const ch = story.character;
  if (e.type === 'attr'){
    const a = (ch.attributes||[]).find(x => x.id === e.id);
    return `${a ? a.name : e.id} ${e.op==='='?'设为':e.op==='-'?'-':'+'}${e.value}`;
  }
  if (e.type === 'skill'){
    const s = (ch.skills||[]).find(x => x.id === e.id);
    return `${s ? s.name : e.id} ${e.op==='='?'设为':e.op==='-'?'-':'+'}${e.value}`;
  }
  if (e.type === 'currency'){
    return `${ch.currency ? ch.currency.name : '货币'} ${e.op==='='?'设为':e.op==='-'?'-':'+'}${e.value}`;
  }
  if (e.type === 'item'){
    const it = (ch.items||[]).find(x => x.id === e.id);
    return `${e.op==='add'?'获得':'失去'}${it ? it.name : e.id}`;
  }
  if (e.type === 'equip'){
    const eq = (ch.equipment||[]).find(x => x.id === e.id);
    return `${e.op==='add'?'获得装备':'失去装备'}${eq ? eq.name : e.id}`;
  }
  return '?';
}

function ntConditionDesc(story, c){
  const ch = story.character;
  if (c.type === 'attr'){
    const a = (ch.attributes||[]).find(x => x.id === c.id);
    return `${a ? a.name : c.id} ${c.op} ${c.value}`;
  }
  if (c.type === 'skill'){
    const s = (ch.skills||[]).find(x => x.id === c.id);
    return `${s ? s.name : c.id} ${c.op} ${c.value}`;
  }
  if (c.type === 'currency'){
    return `${ch.currency ? ch.currency.name : '货币'} ${c.op} ${c.value}`;
  }
  if (c.type === 'item'){
    const it = (ch.items||[]).find(x => x.id === c.id);
    return `${c.op==='has'?'拥有':'未拥有'}${it ? it.name : c.id}`;
  }
  if (c.type === 'equip'){
    const eq = (ch.equipment||[]).find(x => x.id === c.id);
    return `${c.op==='has'?'拥有装备':'未拥有装备'}${eq ? eq.name : c.id}`;
  }
  if (c.type === 'quest'){
    return `任务「${c.id}」${c.op==='active'?'进行中':c.op==='done'?'已完成':'未开始'}`;
  }
  return '?';
}

function ntCheckFormula(story, check){
  const ch = story.character;

    const a = (ch.attributes||[]).find(x => x.id === check.bonus.id);

}

<script data-mod="runtime">'use strict';
/* ============ 运行时：游戏播放器 ============ */

const Game = (() => {
  let story = null;
  let st = null;          // 运行时状态
  let curId = null;
  let sessionStart = null; // 「从此卡试玩」的调试起点（null = 正常从头开始）
  let typerTimer = null;
  let rollTimer = null;
  let laterTimers = [];

  /* ---------- 工具 ---------- */
  function lsGet(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
  function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
  function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const findNode = id => story.nodes.find(n => n.id === id);
  const attrDef = id => (story.character.attributes || []).find(a => a.id === id);
  const skillDef = id => (story.character.skills || []).find(s => s.id === id);
  const itemDef = id => (story.character.items || []).find(i => i.id === id);
  const curDef = () => story.character.currency;
  const gKey = () => 'nt_gallery::' + (story.meta.title || 'untitled');
  const sKey = slot => 'nt_save::' + (story.meta.title || 'untitled') + '::' + slot;
  const isExport = () => (typeof NT_EXPORT !== 'undefined') && NT_EXPORT;
  const mapCfg = () => (story.settings && story.settings.map) || {};

  function later(fn, ms){
    const id = setTimeout(() => {
      laterTimers = laterTimers.filter(x => x !== id);
      fn();
    }, ms);
    laterTimers.push(id);
    return id;
  }
  function clearTimers(){
    if (typerTimer) clearInterval(typerTimer); typerTimer = null;
    if (rollTimer) clearInterval(rollTimer); rollTimer = null;
    laterTimers.forEach(id => clearTimeout(id));
    laterTimers = [];
  }

  /* ---------- 生命周期 ---------- */
  /* startAt：作者调试用——直接从某张卡片开始（跳过角色创建） */
  function start(s, startAt){
    stop();
    story = s;
    sessionStart = (startAt && findNode(startAt)) ? startAt : null;
    resetState();
    $('pTitle').textContent = (story.meta.title || '未命名游戏');
    ntUiScaleApply('player');
    syncMenuButtons();
    clearScreen();
    showStatus();
    if (!startId()){
      $('pText').innerHTML = '<div class="dead">故事还是空的：先在编辑器里加一张卡片。</div>';
      return;
    }
    const cc = story.settings && story.settings.charCreation;
    if (!sessionStart && cc && cc.enabled){
      enterCreation();
    } else {
      enterNode(sessionStart || startId());
    }
  }
  function stop(){ clearTimers(); }
  function feat(key){
    const f = (story.settings && story.settings.features) || {};
    return f[key] !== false;
  }
  /* 玩家顶栏按功能开关显示/隐藏菜单按钮 */
  function syncMenuButtons(){
    const flags = {
      quest: feat('quests'),
      bag: feat('inventory'),
      gallery: feat('gallery'),
      map: !!(story.settings.map && story.settings.map.enabled)
    };
    document.querySelectorAll('#pMenu [data-menu]').forEach(b => {
      const k = b.getAttribute('data-menu');
      if (k in flags) b.classList.toggle('hidden', !flags[k]);
    });
  }
  function equipDef(id){
    return (story.character.equipment || []).find(e => e.id === id) || null;
  }
  function slotName(slot){
    return { weapon: '武器', armor: '护甲', accessory: '饰品' }[slot] || slot;
  }
  function equipBonus(){
    const out = { atk: 0, def: 0 };
    if (!feat('equipment')) return out;
    Object.keys(st.equipped || {}).forEach(slot => {
      const eq = st.equipped[slot] && equipDef(st.equipped[slot]);
      if (eq){ out.atk += +eq.atk || 0; out.def += +eq.def || 0; }
    });
    return out;
  }
  function resetState(){
    const c = story.character;
    const T = (story.settings && story.settings.time) || {};
    st = {
      attrs: {}, skills: {},
      currency: c.currency ? (+c.currency.value || 0) : 0,
      inventory: [], quests: {}, hist: [], path: [],
      gear: [], equipped: { weapon: null, armor: null, accessory: null },
      profile: { name: '', fields: {} },
      portrait: null,
      visited: {},
      timeDay: +T.startDay || 1,
      timeMin: ((+T.startHour || 0) * 60 + (+T.startMin || 0)) % 1440
    };
    (c.attributes || []).forEach(a => st.attrs[a.id] = +a.value || 0);
    (c.skills || []).forEach(s => st.skills[s.id] = +s.value || 0);
  }
  function startId(){
    return (story.startNode && findNode(story.startNode)) ? story.startNode
      : (story.nodes[0] && story.nodes[0].id);
  }

  /* ---------- 时间系统 ---------- */
  function pad2(n){ return String(n).padStart(2, '0'); }
  function fmtTime(){
    if (!st) return '';
    return `第${st.timeDay}天 ${pad2(Math.floor(st.timeMin / 60))}:${pad2(st.timeMin % 60)}`;
  }
  function applyTime(n){
    const T = story.settings && story.settings.time;
    if (!T || !T.enabled) return null;
    const t = +n.time || 0;
    if (t <= 0) return null;
    const m = st.timeMin + t;
    st.timeDay += Math.floor(m / 1440);
    st.timeMin = m % 1440;
    sys('◈ 时间流逝 ' + t + ' 分钟');
    return { k: '__time', label: '时间', d: t };
  }

  /* ---------- 状态栏 ---------- */
  function showStatus(diffs){
    const wrap = $('pStatus');
    const parts = [];
    if (story.settings && story.settings.time && story.settings.time.enabled){
      parts.push(`<span class="chip time" data-k="__time">◷ ${fmtTime()}</span>`);
    }
    (story.character.attributes || []).filter(a => a.showInBar).forEach(a => {
      const v = st.attrs[a.id] != null ? st.attrs[a.id] : 0;
      const m = +a.max || 0;
      parts.push(`<span class="chip" data-k="${esc(a.id)}">${esc(a.name)} ${v}${m ? '/' + m : ''}</span>`);
    });
    if (story.character.currency){
      parts.push(`<span class="chip" data-k="__cur">${esc(story.character.currency.name)} ${st.currency}</span>`);
    }
    wrap.innerHTML = parts.join('');

    const ava = $('pAvatar');
    ava.innerHTML = (st.portrait && story.settings && story.settings.portraits)
      ? `<img src="${st.portrait}" alt="" title="${esc(st.profile.name || '')}">` : '';

    if (diffs){
      diffs.forEach(d => {
        const chip = d.k ? wrap.querySelector(`[data-k="${d.k}"]`) : null;
        if (chip) chip.classList.add('flash');
        const f = document.createElement('span');
        f.className = 'float-diff' + (d.d > 0 ? ' up' : '');
        f.textContent = `${d.label} ${d.d > 0 ? '+' : ''}${d.d}`;
        if (chip) f.style.left = Math.max(0, chip.offsetLeft) + 'px';
        wrap.appendChild(f);
        setTimeout(() => f.remove(), 1600);
      });
    }
  }

  /* ---------- 效果 / 条件 ---------- */
  function calc(old, op, val){
    if (op === '-') return old - (+val || 0);
    if (op === '=') return +val || 0;
    return old + (+val || 0);
  }
  function applyEffects(list){
    const diffs = [];
    (list || []).forEach(e => {
      if (e.type === 'attr'){
        const def = attrDef(e.id);
        const old = st.attrs[e.id] != null ? st.attrs[e.id] : 0;
        let v = calc(old, e.op, e.value);
        if (def && +def.max > 0) v = Math.min(v, +def.max);
        v = Math.max(0, v);
        st.attrs[e.id] = v;
        if (v !== old) diffs.push({ k: e.id, label: def ? def.name : e.id, d: v - old });
      } else if (e.type === 'skill'){
        const def = skillDef(e.id);
        const old = st.skills[e.id] != null ? st.skills[e.id] : 0;
        const v = Math.max(0, calc(old, e.op, e.value));
        st.skills[e.id] = v;
        if (v !== old) diffs.push({ k: null, label: def ? def.name : e.id, d: v - old });
      } else if (e.type === 'currency'){
        const def = curDef();
        const old = st.currency;
        const v = Math.max(0, calc(old, e.op, e.value));
        st.currency = v;
        if (v !== old) diffs.push({ k: '__cur', label: def ? def.name : '货币', d: v - old });
      } else if (e.type === 'item'){
        if (e.op === 'remove') st.inventory = st.inventory.filter(x => x !== e.id);
        else { if (!st.inventory.includes(e.id)) st.inventory.push(e.id); }
      } else if (e.type === 'equip'){
        if (e.op === 'remove'){
          st.gear = st.gear.filter(x => x !== e.id);
          Object.keys(st.equipped || {}).forEach(k => { if (st.equipped[k] === e.id) st.equipped[k] = null; });
        } else if (!st.gear.includes(e.id)) {
          st.gear.push(e.id);
        }
      }
    });
    return diffs;
  }
  function unaffordable(list){
    let cost = 0;
    for (const e of (list || [])){
      if (e.type === 'currency' && e.op === '-') cost += +e.value || 0;
      if (e.type === 'item' && e.op === 'remove' && !st.inventory.includes(e.id)) return true;
    }
    return cost > st.currency;
  }
  function cmp(a, op, b){
    switch(op){
      case '>=': return a >= b; case '<=': return a <= b;
      case '>':  return a > b;  case '<':  return a < b;
      case '==': return a == b; case '!=': return a != b;
    }
    return false;
  }
  function evalCond(c){
    switch(c.type){
      case 'attr':     return cmp(st.attrs[c.id] != null ? st.attrs[c.id] : 0, c.op, +c.value || 0);
      case 'skill':    return cmp(st.skills[c.id] != null ? st.skills[c.id] : 0, c.op, +c.value || 0);
      case 'currency': return cmp(st.currency, c.op, +c.value || 0);
      case 'item':     return c.op === 'has' ? st.inventory.includes(c.id) : !st.inventory.includes(c.id);
      case 'equip':    return c.op === 'has' ? st.gear.includes(c.id) : !st.gear.includes(c.id);
      case 'quest': {
        const q = st.quests[c.id];
        if (c.op === 'none') return !q;
        if (c.op === 'active') return !!(q && q.status === 'active');
        return !!(q && q.status === 'done');
      }
    }
    return false;
  }
  function lockReasons(ch){
    const rs = (ch.conditions || []).filter(c => !evalCond(c)).map(c => '需要 ' + ntConditionDesc(story, c));
    if (unaffordable(ch.effects)){
      (ch.effects || []).forEach(e => {
        if (e.type === 'currency' && e.op === '-') rs.push('需要' + (curDef() ? curDef().name : '货币') + ' ' + e.value);
        if (e.type === 'item' && e.op === 'remove'){
          const it = itemDef(e.id);
          rs.push('需要' + (it ? it.name : e.id));
        }
      });
    }
    return rs.join('；') || '条件未满足';
  }

  /* ---------- 屏幕元素 ---------- */
  function clearScreen(){
    $('pText').innerHTML = '';
    $('pText').classList.remove('done');
    $('pText').classList.remove('paged');
    $('pText').classList.remove('creation');
    $('pText').onclick = null;
    pageClick = null;
    $('pActions').innerHTML = '';
    $('pSys').innerHTML = '';
    $('pNodeTag').textContent = '';
    clearStage();
    const pm = $('pMain');
    if (pm) pm.scrollTop = 0;
  }
  function setTag(n){
    const ch = (story.chapters || []).find(c => c.id === n.chapter);
    $('pNodeTag').textContent = (ch ? ch.name + ' · ' : '') + (n.title || n.id);
  }
  function sys(html, cls){
    if (!html) return;
    const d = document.createElement('div');
    d.className = 'sys-line' + (cls ? ' ' + cls : '');
    d.innerHTML = html;
    $('pSys').appendChild(d);
  }
  function sysEffects(list){
    (list || []).forEach(e => sys('◈ ' + esc(ntEffectDesc(story, e))));
  }
  function primaryBtn(label, cb){
    const b = document.createElement('button');
    b.className = 'cont-btn';
    b.textContent = label;
    b.addEventListener('click', cb);
    $('pActions').appendChild(b);
  }
  function deadEnd(msg){
    const box = $('pActions');
    box.innerHTML = `<div class="dead">${esc(msg)}</div>
      <div class="btn-row">
        <button class="p-btn" id="deRestart">重新开始</button>
        ${isExport() ? '' : '<button class="p-btn warn" id="deBack">返回编辑</button>'}
      </div>`;
    $('deRestart').addEventListener('click', () => start(story, sessionStart));
    const back = $('deBack');
    if (back) back.addEventListener('click', () => App.switchView('editor'));
    const pm = $('pMain'); if (pm) pm.scrollTop = pm.scrollHeight;
  }

  /* ---------- 演出（舞台）模式：背景 + 立绘 + 底部对话框 ---------- */
  /* 只在这些卡片上生效：CG / 战斗 / 结局有自己的版面，仍然走普通渲染 */
  const STAGE_TYPES = ['story', 'effect', 'choice', 'check', 'quest', 'jump', 'random'];
  function stageActive(n){
    return !!n && STAGE_TYPES.indexOf(n.type) >= 0 && ntHasStage(n);
  }
  /* 插图卡（CG）也走演出：整幅插图当背景 + 底部对话框，和背景完全同一块版面 */
  function cgStageActive(n){
    return !!n && n.type === 'cg' && !!n.image;
  }
  function pageModeActive(n){ return stageActive(n) || cgStageActive(n); }
  /* 战斗演出：敌人有立绘，或者这张卡开了「战斗也用舞台」 */
  function battleStageActive(n){
    if (!n || n.type !== 'battle') return false;
    const b = n.battle || {};
    return !!((b.enemy && b.enemy.image) || (b.stage && ntHasStage(n)));
  }
  function clearStage(){
    const pm = $('pMain'), box = $('pStage');
    if (pm){ pm.classList.remove('stage-on', 'stage-cg', 'stage-battle'); pm.onclick = null; }
    if (box){ box.classList.add('hidden'); box.innerHTML = ''; }
  }
  function heroPortrait(){
    const cc = story.settings.charCreation || {};
    return (st && st.portrait) || (cc.portraits && cc.portraits[0]) || null;
  }
  function npcOf(who){
    if (!who) return null;
    const base = ntSplitAlt(who).base;
    return (story.npcs || []).find(x => x.id === who) || (story.npcs || []).find(x => x.name === who)
      || (story.npcs || []).find(x => x.id === base) || (story.npcs || []).find(x => x.name === base) || null;
  }
  /* 当前说话人前置、其他人隐退在后 */
  function highlightCast(who){
    const box = $('pStage');
    if (!box) return;
    const base = who ? ntSplitAlt(who).base : '';
    const speaker = base ? npcOf(who) : null;
    const sid = speaker ? speaker.id : '';
    const list = box.querySelectorAll('.st-actor');
    let any = false;
    list.forEach(el => {
      const w = el.dataset.who || '';
      /* 台上的 dataset.who 存的是角色 id（可能带 #差分），台词里写的是显示名 */
      const hit = !!base && (w === who || w === base || ntSplitAlt(w).base === base ||
        (sid && (w === sid || w.indexOf(sid + '#') === 0)));
      if (hit) any = true;
      el.classList.toggle('speaking', hit);
      el.classList.toggle('dim', !hit);
    });
    if (!any) list.forEach(el => el.classList.remove('dim'));
  }
  /* 角色卡开关关掉后：头像上不挂任何事件，点了也没有反应 */
  function bindNpcCard(img, npc){
    if (!img || !npc) return;
    if (!feat('npcCard')) return;
    img.classList.add('npc-clickable');
    img.title = '点击查看「' + npc.name + '」的角色卡';
    img.addEventListener('click', ev => {
      ev.stopPropagation();
      openNpcCard(npc);
    });
  }
  function applyStage(n){
    const pm = $('pMain'), box = $('pStage');
    if (!pm || !box) return;
    const isCg = cgStageActive(n);
    const isBattle = battleStageActive(n);
    if (!stageActive(n) && !isCg && !isBattle){ clearStage(); return; }
    pm.classList.add('stage-on');
    pm.classList.toggle('stage-cg', isCg);
    pm.classList.toggle('stage-battle', isBattle);
    /* 舞台模式下点画面任意处 = 推进对话（一张卡可以点多次） */
    pm.onclick = () => { if (pageClick) pageClick(); };
    box.classList.remove('hidden');
    box.innerHTML = '';
    /* 背景图层：舞台用背景库里的图（cover），CG 用插图画（contain，不裁切） */
    const bgImg = isCg ? n.image
      : (n.stage && n.stage.bg ? (ntStageBg(story, n.stage.bg) || {}).image : null);
    if (bgImg){
      const d = document.createElement('div');
      d.className = 'st-bg' + (isCg ? ' cg' : '');
      d.style.backgroundImage = 'url("' + bgImg + '")';
      /* 插图卡默认铺满整屏（和演出背景一样）；作者想完整显示可以改成 contain */
      if (isCg) d.style.backgroundSize = (n.cgFit === 'contain') ? 'contain' : 'cover';
      box.appendChild(d);
      const v = document.createElement('div');
      v.className = 'st-vignette';
      box.appendChild(v);
    }
    if (isCg){
      /* CG 模式下点图不再弹放大窗（点击要用来推进对话），改用右下角的小按钮 */
      const zoom = document.createElement('button');
      zoom.className = 'st-zoom';
      zoom.type = 'button';
      zoom.textContent = '⤢ 看大图';
      zoom.addEventListener('click', ev => { ev.stopPropagation(); openCg(n); });
      box.appendChild(zoom);
      if (n.caption){
        const cap = document.createElement('div');
        cap.className = 'st-caption';
        cap.textContent = n.caption;
        box.appendChild(cap);
      }
      return;
    }
    if (isBattle){ box.appendChild(buildEnemyLayer(n)); return; }
    const stg = n.stage;
    const cast = document.createElement('div');
    cast.className = 'st-cast';
    (stg.cast || []).forEach(c => {
      const src = ntCastImage(story, c, heroPortrait());
      if (!src) return;
      const hold = document.createElement('div');
      hold.className = 'st-actor';
      hold.dataset.who = c.who;
      /* 位置：x 百分比优先；主角永远排右半边 */
      let x = ntCastX(c);
      if (ntCastIsHero(c) && x < 50) x = 78;
      hold.style.left = x + '%';
      /* 纵向微调 + 大小：让作者能把「头」从画面外拉回来 */
      hold.style.bottom = ntCastY(c) + '%';
      hold.style.height = ntCastH(c) + '%';
      const img = document.createElement('img');
      img.src = src;
      img.alt = '';
      if (c.who !== NT_HERO_CAST) bindNpcCard(img, npcOf(ntCastWho(c).who));
      hold.appendChild(img);
      cast.appendChild(hold);
    });
    if (cast.childNodes.length) box.appendChild(cast);
  }
  /* 战斗演出：敌人立绘放正中间 */
  function buildEnemyLayer(n){
    const box = $('pStage');
    const wrap = document.createElement('div');
    wrap.className = 'st-cast st-enemy-cast';
    const b = n.battle || {};
    const img0 = (b.enemy && b.enemy.image) || null;
    if (img0){
      const hold = document.createElement('div');
      hold.className = 'st-actor st-enemy speaking';
      hold.style.left = '50%';
      const img = document.createElement('img');
      img.src = img0;
      img.alt = '';
      hold.appendChild(img);
      wrap.appendChild(hold);
    }
    return wrap;
  }

  /* ---------- NPC 角色卡 ---------- */
  function openNpcCard(npc){
    if (!npc) return;
    const c = npc.card || {};
    const full = c.full || npc.portrait || '';
    const fields = (c.fields || []).filter(f => f && (f.k || f.v));
    let h = '<div class="npc-card">';
    h += '<div class="nc-figure">' + (full
      ? '<img src="' + full + '" alt="">'
      : '<div class="nc-empty">这张角色卡还没有全身立绘</div>') + '</div>';
    h += '<div class="nc-main">';
    h += '<div class="nc-name">' + esc(npc.name) + '</div>';
    if (c.title) h += '<div class="nc-title">' + esc(c.title) + '</div>';
    if (c.intro) h += '<div class="nc-intro">' + ntRichHtml(substVars(c.intro)) + '</div>';
    if (fields.length){
      h += '<div class="nc-fields">' + fields.map(f =>
        '<div class="nc-row"><span class="nc-k">' + esc(f.k || '') + '</span>' +
        '<span class="nc-v">' + esc(f.v || '') + '</span></div>').join('') + '</div>';
    } else if (!c.intro){
      h += '<div class="dim mini">作者还没有填写这张角色卡。</div>';
    }
    h += '<div class="nc-foot mono">◈ 角色卡</div>';
    h += '</div></div>';
    ntModal.open(esc(npc.name) + ' · 角色卡', h, [{ label: '关闭' }], { size: 'wide' });
  }

  /* ---------- 文本解析：【名字】开头的行是对话 ---------- */
  /* 玩家名占位符：正文 / 选项 / 任务描述里写 {player} 会被替换成角色创建时起的名字。
     另外兼容 {name} / {you}，方便作者凭直觉写。 */
  function playerName(){
    const nm = (st && st.profile && st.profile.name) ? String(st.profile.name).trim() : '';
    return nm || '你';
  }
  function substVars(text){
    const s = String(text == null ? '' : text);
    if (s.indexOf('{') < 0) return s;
    const nm = playerName();
    return s.replace(/\{(player|name|you)\}/g, nm);
  }
  /* 【林晚2】= 林晚的 2 号差分：显示名字仍然取基础名，差分只影响头像/立绘 */
  function parseSegs(text){
    return substVars(text).split('\n')
      .map(s => s.trim()).filter(Boolean).map(line => {
        const m = line.match(/^【(.+?)】\s*(.*)$/);
        if (!m) return { dlg: false, text: line };
        const alt = ntSplitAlt(m[1]);
        const npc = npcOf(m[1]);
        return {
          dlg: true, who: m[1], key: alt.key,
          label: npc ? npc.name : alt.base,
          text: m[2]
        };
      });
  }
  function portraitOf(who){
    if (!(story.settings && story.settings.portraits)) return null;
    const npc = npcOf(who);
    if (npc){
      const src = ntNpcBust(npc, ntSplitAlt(who).key);
      if (src) return src;
    }
    if (st && st.portrait && (who === '你' || (st.profile && who === st.profile.name))) return st.portrait;
    return null;
  }
  function buildSeg(container, seg){
    const stage = pageModeOn();
    if (!seg.dlg){
      const p = document.createElement('p');
      if (stage) p.className = 'st-nar';
      container.appendChild(p);
      return p;
    }
    const src = portraitOf(seg.who);
    const npc = npcOf(seg.who);
    const d = document.createElement('div');
    if (stage){
      /* 演出模式：不做「对话框里塞头像栏」，改成一句一句的风格化文本；
         头像缩成说话人名字旁的小圆片，旁白则完全不出现头像 */
      d.className = 'st-dlg';
      const name = esc(seg.label || seg.who);
      const avNpc = npc || {};
      d.innerHTML = (src
        ? '<span class="st-ava ' + ntAvatarShape(avNpc) + '"><img src="' + src + '" alt="" style="' + ntAvatarStyle(avNpc) + '"></span>'
        : '') +
        '<div class="st-say"><span class="st-name">' + name + '</span><div class="st-text"></div></div>';
      if (src && npc) bindNpcCard(d.querySelector('.st-ava'), npc);
      container.appendChild(d);
      return d.querySelector('.st-text');
    }
    d.className = 'dlg';
    d.innerHTML = '<div class="dlg-main"><div class="dlg-name">' + esc(seg.label || seg.who) +
      '</div><div class="dlg-text"></div></div>';
    if (src){
      const pc = document.createElement('div');
      pc.className = 'dlg-portrait';
      const im = document.createElement('img');
      im.src = src;
      im.alt = '';
      bindNpcCard(im, npc);
      pc.appendChild(im);
      d.insertBefore(pc, d.firstChild);
    }
    container.appendChild(d);
    return d.querySelector('.dlg-text');
  }
  /* 把一段富文本渲染成若干 span（返回 spans 供打字机逐字填充） */
  function fillRuns(box, text){
    const runs = ntParseRich(text);
    const spans = runs.map(r => {
      const sp = document.createElement('span');
      const st = ntRunStyle(r);
      if (st) sp.setAttribute('style', st);
      box.appendChild(sp);
      return sp;
    });
    return { runs, spans };
  }

  /* ---------- 打字机（支持对话分段与富文本） ---------- */
  /* 演出模式（含 CG）走「一页一页」的 RPG 版面：对话框高度固定，
     文字放不下就自动翻页，作者也可以在正文里写一行 --- 手动断页，
     或者给卡片设「每页最多 N 段」。 */
  const PAGE_BREAK = /^(?:-{3,}|={3,}|—{3,}|＿{3,}|\[分页\]|〔分页〕|【分页】)$/;
  let pageClick = null;          // 当前分页的「点一下」处理（键盘空格 / Enter 共用）

  function pageModeOn(){
    const pm = $('pMain');
    return !!pm && pm.classList.contains('stage-on');
  }
  function overflows(box){ return box.scrollHeight > box.clientHeight + 1; }
  function buildMeasured(host, seg){
    const tb = buildSeg(host, seg);
    const f = fillRuns(tb, seg.text);
    /* fillRuns 建的是空 span（留给打字机逐字填），测量时必须先填满 */
    f.spans.forEach((sp, i) => { sp.textContent = f.runs[i].t; });
    return tb;
  }
  /* 单段就超过一页：二分找到放得下的字数，尽量断在标点处 */
  function splitTextSeg(host, box, seg){
    const full = String(seg.text || '');
    if (!full) return [null, null];
    const fits = n => {
      host.innerHTML = '';
      buildMeasured(host, { dlg: seg.dlg, who: seg.who, text: full.slice(0, n) });
      return !overflows(box);
    };
    let lo = 1, hi = full.length, best = 0;
    while (lo <= hi){
      const mid = (lo + hi) >> 1;
      if (fits(mid)){ best = mid; lo = mid + 1; } else hi = mid - 1;
    }
    if (!best) best = 1;
    const punct = /[。！？…，、；：」』）,.!?;:]/;
    let cut = best;
    for (let k = best; k > Math.max(1, best - 30); k--){
      if (punct.test(full[k - 1])){ cut = k; break; }
    }
    /* 别把富文本标记切开 */
    while (cut > 1 && cut < full.length){
      const head = full.slice(0, cut);
      const opens = (head.match(/\[(?:c|hl|s)=/g) || []).length;
      const closes = (head.match(/\[\/(?:c|hl|s)\]/g) || []).length;
      if (opens <= closes) break;
      cut--;
    }
    return [full.slice(0, cut), full.slice(cut)];
  }
  /* 把分段排成一页一页
     演出版的排版规则：旁白可以几段挤一页（放不下自动拆），
     对话**独占一页** —— 点一下出现下一句，上一句消失（RPG 的演出习惯）。 */
  function paginate(segs, host, box, maxLines){
    const pages = [];
    let cur = [];
    const flush = () => { if (cur.length){ pages.push(cur); cur = []; } };
    const queue = segs.slice();
    for (let i = 0; i < queue.length && i < 8000; i++){
      const seg = queue[i];
      if (!seg.dlg && PAGE_BREAK.test(String(seg.text || '').trim())){ flush(); host.innerHTML = ''; continue; }
      const isDlg = !!seg.dlg;
      if (isDlg) flush();                       /* 对话前面攒的旁白先收掉 */
      buildMeasured(host, seg);
      if (overflows(box)){
        host.innerHTML = '';
        if (cur.length){ flush(); buildMeasured(host, seg); }
        if (overflows(box)){
          host.innerHTML = '';
          const parts = splitTextSeg(host, box, seg);
          host.innerHTML = '';
          if (parts[0]){
            cur.push(Object.assign({}, seg, { text: parts[0] }));
            flush();
            if (parts[1]) queue.splice(i + 1, 0, Object.assign({}, seg, { text: parts[1] }));
          } else {
            cur.push(seg);
          }
        } else {
          cur.push(seg);
        }
      } else {
        cur.push(seg);
      }
      if (isDlg) flush();                       /* 这一句说完就翻页 */
      if (maxLines > 0 && cur.length >= maxLines){ flush(); host.innerHTML = ''; }
    }
    flush();
    host.innerHTML = '';
    return pages.length ? pages : [[]];
  }
  function typePages(text, done){
    if (typerTimer){ clearInterval(typerTimer); typerTimer = null; }
    pageClick = null;
    const elx = $('pText');
    const n = findNode(curId) || {};
    elx.innerHTML = '';
    elx.classList.remove('done');
    const body = document.createElement('div');
    body.className = 'st-body';
    const more = document.createElement('div');
    more.className = 'st-more';
    more.textContent = '▾';
    elx.appendChild(body);
    elx.appendChild(more);
    const ctx = { body };
    const segs = parseSegs(text);
    if (!segs.length){ elx.classList.add('done'); done(); return; }
    const pages = paginate(segs, body, body, +n.pageLines || 0);
    let pi = 0, items = [], typingDone = false, si = 0, ri = 0, ci = 0, spSi = -1;

    const finishTyping = () => {
      if (typerTimer){ clearInterval(typerTimer); typerTimer = null; }
      items.forEach(it => it.spans.forEach((sp, i) => { sp.textContent = it.runs[i].t; }));
      typingDone = true;
      if (pi < pages.length - 1){
        elx.classList.add('paged');
        pageClick = () => { pi++; renderPage(); };
        elx.onclick = pageClick;
      } else {
        elx.classList.remove('paged');
        elx.classList.add('done');
        pageClick = null;
        elx.onclick = null;
        done();
      }
    };
    const renderPage = () => {
      body.innerHTML = '';
      elx.classList.remove('done', 'paged');
      items = pages[pi].map(seg => {
        const tb = buildSeg(body, seg);
        const filled = fillRuns(tb, seg.text);
        return { seg, runs: filled.runs, spans: filled.spans };
      });
      /* 一页里第一个说话人 = 这页的「发言位」，其他人自动隐退 */
      const firstDlg = pages[pi].find(s => s.dlg);
      if (firstDlg) highlightCast(firstDlg.who); else highlightCast('');
      si = 0; ri = 0; ci = 0; spSi = -1; typingDone = false;
      if (typerTimer){ clearInterval(typerTimer); typerTimer = null; }
      typerTimer = setInterval(() => {
        while (si < items.length && ri >= items[si].runs.length){ si++; ri = 0; ci = 0; }
        if (si >= items.length){ finishTyping(); return; }
        if (si !== spSi){
          spSi = si;
          if (items[si].seg.dlg) highlightCast(items[si].seg.who);
        }
        const it = items[si];
        const run = it.runs[ri];
        if (!run) { si++; ri = 0; ci = 0; return; }
        ci++;
        it.spans[ri].textContent = run.t.slice(0, ci);
        typeTick();
        if (ci >= run.t.length){ ri++; ci = 0; }
      }, 24);
      pageClick = () => finishTyping();
      elx.onclick = pageClick;
    };
    renderPage();
  }

  /* ---------- 打字音效 ---------- */
  /* 预设全部用 Web Audio 现场合成，工程里不存音频；只有「自定义」是内嵌的 dataURL。 */
  let actx = null, sfxCfg = null, sfxLast = 0, customAudio = null, sfxMuted = false, audioHooked = false;
  /* 浏览器的自动播放策略：AudioContext 在用户第一次点/按键之前是 suspended 的。
     一旦被挂起（切标签、锁屏、系统静音），后面所有合成音都会「静默排队」，
     听起来就是「打字音突然被吞掉了」。所以每次交互都尝试把它拽回 running。 */
  function resumeAudio(){
    if (!actx) return;
    if (actx.state !== 'running'){ try { actx.resume(); } catch (e){} }
  }
  function hookAudioGesture(){
    if (audioHooked) return;
    audioHooked = true;
    const fn = () => resumeAudio();
    document.addEventListener('pointerdown', fn, true);
    document.addEventListener('keydown', fn, true);
    document.addEventListener('touchstart', fn, true);
  }
  function ensureAudio(){
    if (actx){ resumeAudio(); return actx; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { actx = new AC(); } catch (e){ actx = null; return null; }
    hookAudioGesture();
    resumeAudio();
    return actx;
  }
  function sfxSet(cfg){
    sfxCfg = cfg || null;
    if (customAudio){ try { customAudio.pause(); } catch (e){} }
    customAudio = null;
    if (sfxCfg && sfxCfg.typing === 'custom' && sfxCfg.data){
      try {
        customAudio = new Audio(sfxCfg.data);
        customAudio.preload = 'auto';
        customAudio.volume = Math.min(1, Math.max(0, sfxCfg.volume || 0.4));
      } catch (e){ customAudio = null; }
    }
  }
  function blip(freq, dur, type, gain, slide){
    const c = ensureAudio();
    if (!c) return;
    /* 还没恢复就别往挂起的时钟里塞音 —— 恢复的瞬间会一次性「哗」一下 */
    if (c.state !== 'running'){ resumeAudio(); return; }
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, c.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), c.currentTime + dur);
    g.gain.setValueAtTime(gain, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0008, c.currentTime + dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + dur + 0.01);
  }
  function noiseTick(gain){
    const c = ensureAudio();
    if (!c) return;
    if (c.state !== 'running'){ resumeAudio(); return; }
    const len = Math.floor(c.sampleRate * 0.03);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = 2100; f.Q.value = 0.9;
    g.gain.value = gain;
    src.buffer = buf;
    src.connect(f); f.connect(g); g.connect(c.destination);
    src.start();
  }
  /* 每个字都会调，内部自己做节流，避免声音糊成一片。
     间隔按「大约每 3–4 个字响一下」来定 —— 太快会像机关枪，这也是大多数 RPG 的手感。 */
  function typeTick(){
    if (sfxMuted || !sfxCfg) return;
    const kind = sfxCfg.typing;
    if (!kind || kind === 'off') return;
    const now = Date.now();
    const gap = kind === 'type' ? 96 : (kind === 'bell' ? 150 : 120);
    if (now - sfxLast < gap) return;
    sfxLast = now;
    const vol = Math.min(1, Math.max(0, +sfxCfg.volume || 0.4));
    if (kind === 'custom'){
      if (!customAudio) return;
      try { customAudio.currentTime = 0; customAudio.play(); } catch (e){}
      return;
    }
    if (kind === 'type') noiseTick(0.16 * vol);
    else if (kind === 'soft') blip(680 + Math.random() * 60, 0.035, 'sine', 0.08 * vol);
    else if (kind === 'beep') blip(1180, 0.045, 'square', 0.05 * vol);
    else if (kind === 'wood') blip(320, 0.06, 'triangle', 0.12 * vol, 180);
    else if (kind === 'bell') blip(1560, 0.12, 'sine', 0.05 * vol, 1240);
  }

  function typeText(text, done, append){
    if (pageModeOn()){ typePages(text, done); return; }
    pageClick = null;
    if (typerTimer){ clearInterval(typerTimer); typerTimer = null; }
    const elx = $('pText');
    let host = elx;
    if (append){
      host = document.createElement('div');
      host.className = 'cg-text';
      elx.appendChild(host);
    } else {
      elx.innerHTML = '';
    }
    elx.classList.remove('done');
    const segs = parseSegs(text);
    if (!segs.length){ elx.classList.add('done'); done(); return; }
    const items = segs.map(seg => {
      const box = buildSeg(host, seg);
      const filled = fillRuns(box, seg.text);
      return { box: box, runs: filled.runs, spans: filled.spans };
    });
    let si = 0, ri = 0, ci = 0, finished = false;
    const finish = () => {
      if (finished) return;
      finished = true;
      if (typerTimer){ clearInterval(typerTimer); typerTimer = null; }
      elx.onclick = null;
      items.forEach(it => it.spans.forEach((sp, i) => { sp.textContent = it.runs[i].t; }));
      elx.classList.add('done');
      done();
    };
    typerTimer = setInterval(() => {
      while (si < items.length && ri >= items[si].runs.length){ si++; ri = 0; ci = 0; }
      if (si >= items.length){ finish(); return; }
      const it = items[si];
      const run = it.runs[ri];
      ci++;
      it.spans[ri].textContent = run.t.slice(0, ci);
      typeTick();
      if (ci >= run.t.length){ ri++; ci = 0; }
    }, 24);
    elx.onclick = () => finish();   // 点击跳过
  }

  /* ---------- 节点进入 ---------- */
  function markLocation(id){
    (mapCfg().pois || []).forEach(p => { if (p.node === id) st.visited[p.id] = true; });
  }
  function enterNode(id){
    clearTimers();
    curId = id;
    if (st && Array.isArray(st.path)) st.path.push(id);
    clearScreen();
    const n = findNode(id);
    if (!n){ deadEnd('这一页不存在，可能卡片被删掉了。'); return; }
    setTag(n);
    markLocation(id);
    applyStage(n);
    if (n.type === 'battle') sfxSet(null);
    else { sfxSet(ntSfxOf(story, n)); highlightCast(''); }
    const td = applyTime(n);
    switch(n.type){
      case 'story':
      case 'effect': enterSimple(n, td); break;
      case 'choice': if (td) showStatus([td]); enterChoice(n); break;
      case 'check':  if (td) showStatus([td]); enterCheck(n); break;
      case 'quest':  enterQuest(n, td); break;
      case 'ending': enterEnding(n); break;
      case 'jump':   if (td) showStatus([td]); enterJump(n); break;
      case 'random': if (td) showStatus([td]); enterRandom(n); break;
      case 'cg':     enterCg(n, td); break;
      case 'battle': enterBattle(n, td); break;
    }
  }
  function continueBtn(next){
    if (next && findNode(next)) primaryBtn('继 续 ▸', () => enterNode(next));
    else deadEnd('这里没有后续卡片（未连接）。');
  }

  function enterSimple(n, td){
    const diffs = applyEffects(n.effects);
    if (td) diffs.unshift(td);
    showStatus(diffs);
    sysEffects(n.effects);
    typeText(n.text, () => continueBtn(n.next));
  }

  function enterChoice(n){
    typeText(n.text || '请选择：', () => showOptions(n));
  }
  function showOptions(n){
    const box = $('pActions');
    box.innerHTML = '';
    let shown = 0;
    n.choices.forEach(ch => {
      const ok = (ch.conditions || []).every(evalCond) && !unaffordable(ch.effects);
      if (!ok && (n.lockedMode || 'hide') === 'hide') return;
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerHTML = `<span class="key">[${shown + 1}]</span>${ntRichHtml(substVars(ch.text))}`;
      if (!ok){
        btn.disabled = true;
        btn.title = lockReasons(ch);
      } else {
        btn.addEventListener('click', () => pickChoice(n, ch));
      }
      box.appendChild(btn);
      shown++;
    });
    if (!shown) deadEnd('当前没有可用选项（条件都不满足）。');
  }
  function pickChoice(n, ch){
    st.hist.push({ node: n.id, choice: ch.text });
    const diffs = applyEffects(ch.effects);
    showStatus(diffs);
    sysEffects(ch.effects);
    if (ch.next && findNode(ch.next)) enterNode(ch.next);
    else deadEnd('选项「' + (ch.text || '') + '」没有连接后续卡片。');
  }

  /* ---------- 检定 ---------- */
  function bonusVal(c){
    if (!c.bonus || c.bonus.type === 'none') return 0;
    if (c.bonus.type === 'attr') return st.attrs[c.bonus.id] != null ? st.attrs[c.bonus.id] : 0;
    if (c.bonus.type === 'skill') return st.skills[c.bonus.id] != null ? st.skills[c.bonus.id] : 0;
    return 0;
  }
  function bonusName(c){
    if (!c.bonus || c.bonus.type === 'none') return '';
    if (c.bonus.type === 'attr'){ const a = attrDef(c.bonus.id); return a ? a.name : c.bonus.id; }
    if (c.bonus.type === 'skill'){ const s = skillDef(c.bonus.id); return s ? s.name : c.bonus.id; }
    return '';
  }
  function enterCheck(n){
    const go = () => rollCheck(n);
    typeText(n.text, () => {
      if (n.check.showRoll) primaryBtn('开始检定 · ' + ntCheckFormula(story, n.check), go);
      else go();
    });
  }
  function rollCheck(n){
    const c = n.check;
    const roll = 1 + Math.floor(Math.random() * c.die);
    const bv = bonusVal(c);
    const bn = bonusName(c);
    const total = roll + bv;
    const ok = total >= c.dc;
    const nxt = ok ? c.successNext : c.failNext;
    st.hist.push({ node: n.id, check: `1d${c.die}(${roll})${bv ? '+' + bn + '(' + bv + ')' : ''}=${total} vs DC${c.dc} ${ok ? '成功' : '失败'}` });

    const goNext = () => {
      if (nxt && findNode(nxt)) enterNode(nxt);
      else deadEnd('检定的分支未连接后续卡片。');
    };
    if (!c.showRoll){
      sys('◈ 检定' + (ok ? '成功' : '失败') + '：' + esc(ntCheckFormula(story, c)));
      primaryBtn('继 续 ▸', goNext);
      return;
    }
    const box = $('pActions');
    box.innerHTML = `<div class="check-panel">
      <div class="check-formula mono">${esc(ntCheckFormula(story, c))}</div>
      <div class="dice mono" id="diceNum">--</div>
      <div class="check-result mono" id="checkRes">&nbsp;</div>
    </div>`;
    const dn = $('diceNum');
    let ticks = 0;
    rollTimer = setInterval(() => {
      dn.textContent = 1 + Math.floor(Math.random() * c.die);
      if (++ticks >= 15){
        clearInterval(rollTimer); rollTimer = null;
        dn.textContent = roll;
        dn.classList.add(ok ? 'ok' : 'bad');
        $('checkRes').innerHTML =
          `d${c.die}〈${roll}〉${bv ? ' + ' + esc(bn) + '〈' + bv + '〉' : ''} ＝ ${total} 　vs　 DC ${c.dc}　` +
          (ok ? '<b class="ok">检定成功</b>' : '<b class="bad">检定失败</b>');
        primaryBtn('继 续 ▸', goNext);
      }
    }, 65);
  }

  /* ---------- 插图（CG） ---------- */
  function enterCg(n, td){
    const diffs = applyEffects(n.effects);
    if (td) diffs.unshift(td);
    showStatus(diffs);
    sysEffects(n.effects);
    /* 有插图时：插图铺满整块演出区（和背景同一套版面），正文走 RPG 分页 */
    if (cgStageActive(n)){
      typeText(n.text || '', () => continueBtn(n.next));
      return;
    }
    const elx = $('pText');
    elx.innerHTML = '';
    const fig = document.createElement('figure');
    fig.className = 'cg-figure';
    {
      const ph = document.createElement('div');
      ph.className = 'cg-empty';
      ph.textContent = '（这张插图卡还没有导入图片）';
      fig.appendChild(ph);
    }
    if (n.caption){
      const cap = document.createElement('figcaption');
      cap.textContent = n.caption;
      fig.appendChild(cap);
    }
    elx.appendChild(fig);
    typeText(n.text || '', () => continueBtn(n.next), true);
  }
  function openCg(n){
    if (!n.image) return;
    ntModal.open(esc(n.caption || '插图'),
      `<div class="cg-viewer"><img src="${n.image}" alt=""></div>`, [{ label: '关闭' }], { size: 'wide' });
  }

  /* ---------- 跳转 / 随机 ---------- */
  /* 跳转与随机都先给玩家一个「继续」，读完文字再切场景，避免突兀的自动跳转 */
  function enterJump(n){
    typeText(n.text, () => {
      primaryBtn('继 续 ▸', () => {
        if (n.target && findNode(n.target) && n.target !== n.id) enterNode(n.target);
        else deadEnd('跳转卡没有设置有效目标。');
      });
    });
  }
  function enterRandom(n){
    typeText(n.text, () => {
      primaryBtn('继 续 ▸', () => {
        const os = (n.outcomes || []).filter(o => o.next && findNode(o.next));
        if (!os.length){ deadEnd('随机卡没有任何可用分支。'); return; }
        const ws = os.map(o => (+o.weight > 0 ? +o.weight : 1));
        const sum = ws.reduce((a, b) => a + b, 0);
        let r = Math.random() * sum;
        let pick = os[os.length - 1];
        for (let i = 0; i < os.length; i++){
          r -= ws[i];
          if (r <= 0){ pick = os[i]; break; }
        }
        st.hist.push({ node: n.id, random: pick.next });
        enterNode(pick.next);
      });
    });
  }

  /* ---------- 战斗（单卡回合制） ---------- */
  function battleBonus(def){
    if (!def || def.type === 'none' || !def.id) return 0;
    if (def.type === 'attr') return st.attrs[def.id] != null ? st.attrs[def.id] : 0;
    if (def.type === 'skill') return st.skills[def.id] != null ? st.skills[def.id] : 0;
    return 0;
  }
  function battleLine(tpl, vars){
    return String(tpl == null ? '' : tpl).replace(/\{(dmg|enemy|php|ehp|turn|skill|item)\}/g, (m, k) =>
      vars[k] != null ? String(vars[k]) : m);
  }
  function pickLine(list){
    if (!list || !list.length) return '{enemy}……（-{dmg}）';
    return list[Math.floor(Math.random() * list.length)];
  }
  function enterBattle(n, td){
    const diffs = applyEffects(n.effects);
    if (td) diffs.unshift(td);
    showStatus(diffs);
    sysEffects(n.effects);
    const B = n.battle;
    const attr = (B.hpAttr && attrDef(B.hpAttr)) ? attrDef(B.hpAttr) : ((story.character.attributes || [])[0] || null);
    const hpId = attr ? attr.id : null;
    const emax = Math.max(1, +B.enemy.hp || 1);
    const bt = {
      n, B, hpId,
      maxHp: attr ? (+attr.max || 0) : 0,
      php: hpId ? (st.attrs[hpId] != null ? st.attrs[hpId] : 0) : 100,
      ehp: emax, emax,
      turn: 1, over: false, won: false, lock: false, log: [],
      panel: 'main', guard: false, usedItem: null
    };
    typeText(n.text, () => {
      bt.log.push({ kind: 'sys', text: '战斗开始：' + B.enemy.name });
      renderBattle(bt);
    });
  }
  /* 能在战斗里用的技能 / 道具 */
  function battleSkills(){
    return (story.character.skills || []).filter(s => s && s.combat);
  }
  function battleItems(){
    return (story.character.items || []).filter(it =>
      it && st.inventory.includes(it.id) && it.use && it.use.kind && it.use.kind !== 'none');
  }
  function costPool(bt, sk){
    const id = sk.costAttr || bt.hpId;
    if (!id) return { id: null, cur: 0 };
    return { id: id, cur: st.attrs[id] != null ? st.attrs[id] : 0 };
  }
  function renderBattle(bt){
    const box = $('pActions');
    const e = bt.B.enemy;
    const epct = Math.max(0, Math.round(bt.ehp / bt.emax * 100));
    const ppct = bt.maxHp
      ? Math.max(0, Math.min(100, Math.round(bt.php / bt.maxHp * 100)))
      : Math.max(0, Math.min(100, bt.php));
    const log = bt.log.map(l => `<div class="bt-line ${l.kind}">${esc(l.text)}</div>`).join('');
    let actions;
    if (bt.over){
      actions = '<button class="cont-btn" id="btDone">继 续 ▸</button>';
    } else if (bt.panel === 'skill'){
      const list = battleSkills();
      actions = list.length ? list.map((sk, i) => {
        const pool = costPool(bt, sk);
        const short = pool.id && sk.cost > 0 ? pool.cur < sk.cost : false;
        return `<button class="bt-btn bt-line-btn" data-bt="skill" data-i="${i}"${(bt.lock || short) ? ' disabled' : ''}>
          <span class="btl-name">${esc(sk.name || sk.id)}</span>
          <span class="btl-meta">${sk.cost > 0 ? esc((attrDef(pool.id) || {}).name || '消耗') + ' ' + sk.cost : '无消耗'}${short ? ' · 不够' : ''}</span>
        </button>`;
      }).join('') : '<div class="bt-none">还没有「战斗技能」——去「角色」页把技能勾成战斗技能。</div>';
      actions += '<button class="bt-btn bt-back" data-bt="back">返 回</button>';
    } else if (bt.panel === 'item'){
      const list = battleItems();
      actions = list.length ? list.map((it, i) =>
        `<button class="bt-btn bt-line-btn" data-bt="item" data-i="${i}"${bt.lock ? ' disabled' : ''}>
          <span class="btl-name">${esc(it.name || it.id)}</span>
          <span class="btl-meta">${it.use.kind === 'heal' ? '回复 ' + it.use.value : it.use.kind === 'damage' ? '伤害 ' + it.use.value : '解除'}
          ${it.use.attr ? ' · ' + esc((attrDef(it.use.attr) || {}).name || it.use.attr) : ''}</span>
        </button>`).join('') : '<div class="bt-none">背包里没有能在战斗中使用的东西。</div>';
      actions += '<button class="bt-btn bt-back" data-bt="back">返 回</button>';
    } else {
      actions = `<button class="bt-btn" data-bt="atk"${bt.lock ? ' disabled' : ''}>攻 击</button>
         <button class="bt-btn" data-bt="open-skill"${bt.lock ? ' disabled' : ''}>技 能</button>
         <button class="bt-btn" data-bt="open-item"${bt.lock ? ' disabled' : ''}>道 具</button>
         <button class="bt-btn" data-bt="def"${bt.lock ? ' disabled' : ''}>防 御</button>`;
    }
    const eImg = e.image ? '<img src="' + esc(e.image) + '" alt="">' : esc((e.name || '敌').slice(0, 1));
    const hero = heroPortrait();
    const pName = playerName();
    const pImg = hero ? '<img src="' + esc(hero) + '" alt="">' : esc(pName.slice(0, 1));
    box.innerHTML = `<div class="battle">
      <div class="bt-enemy">
        <div class="bt-glyph${e.image ? ' has-img' : ''}">${eImg}</div>
        <div class="bt-main">
          <div class="bt-name">${esc(e.name)}<span class="mono bt-hp">${bt.ehp} / ${bt.emax}</span></div>
          <div class="bt-bar"><i style="width:${epct}%"></i></div>
          <div class="bt-stats mono">攻击 ${e.atk} · 防御 ${e.def} · 第 ${bt.turn} 回合</div>
        </div>
      </div>
      <div class="bt-player">
        <div class="bt-glyph me${hero ? ' has-img' : ''}">${pImg}</div>
        <div class="bt-main">
          <div class="bt-name">${esc(pName)}<span class="mono bt-hp">${bt.php}${bt.maxHp ? ' / ' + bt.maxHp : ''}</span></div>
          <div class="bt-bar me"><i style="width:${ppct}%"></i></div>
        </div>
      </div>
      <div class="bt-log">${log}</div>
      <div class="bt-actions">${actions}</div>
    </div>`;
    const logEl = box.querySelector('.bt-log');
    if (logEl) logEl.scrollTop = logEl.scrollHeight;
    if (bt.over){
      const done = $('btDone');
      if (done) done.addEventListener('click', () => {
        const next = bt.won ? bt.B.winNext : bt.B.loseNext;
        if (next && findNode(next)) enterNode(next);
        else deadEnd(bt.won ? '战斗胜利了，但没有设置「胜利去向」。' : '战斗失败了，但没有设置「失败去向」。');
      });
    } else {
      box.querySelectorAll('[data-bt]').forEach(b =>
        b.addEventListener('click', () => battleAct(bt, b.dataset.bt, +b.dataset.i)));
    }
  }
  /* damage 用 {dmg} {enemy} {php} {ehp} {turn} {skill} {item} 这些占位符 */
  function battleAct(bt, kind, idx){
    if (bt.over) return;
    const e = bt.B.enemy;
    if (kind === 'open-skill'){ bt.panel = 'skill'; renderBattle(bt); return; }
    if (kind === 'open-item'){ bt.panel = 'item'; renderBattle(bt); return; }
    if (kind === 'back'){ bt.panel = 'main'; renderBattle(bt); return; }
    if (bt.lock) return;
    if (kind === 'def'){
      bt.lock = true; bt.panel = 'main';
      bt.log.push({ kind: 'sys', text: '你压低重心，摆出防御的架势。' });
      renderBattle(bt);
      later(() => { if (!bt.over) enemyTurn(bt, true); }, 320);
      return;
    }
    const atkBonus = battleBonus(bt.B.atkBonus) + equipBonus().atk;
    if (kind === 'skill'){
      const sk = battleSkills()[idx];
      if (!sk) return;
      const pool = costPool(bt, sk);
      if (pool.id && sk.cost > 0 && pool.cur < sk.cost) return;
      bt.lock = true; bt.panel = 'main';
      if (pool.id && sk.cost > 0){
        const before = pool.cur;
        st.attrs[pool.id] = Math.max(0, before - sk.cost);
        showStatus([{ k: pool.id, label: (attrDef(pool.id) || {}).name || '消耗', d: -sk.cost }]);
        if (pool.id === bt.hpId) bt.php = st.attrs[pool.id];
      }
      const nm = sk.name || sk.id;
      if (sk.heal > 0){
        const heal = Math.max(1, sk.heal);
        bt.php = bt.maxHp ? Math.min(bt.maxHp, bt.php + heal) : bt.php + heal;
        if (bt.hpId){ st.attrs[bt.hpId] = bt.php; showStatus([{ k: bt.hpId, label: (attrDef(bt.hpId) || {}).name || 'HP', d: heal }]); }
        bt.log.push({ kind: 'skill', text: battleLine(sk.line || '{skill}：回复了 {dmg} 点。',
          { dmg: heal, enemy: e.name, php: bt.php, ehp: bt.ehp, turn: bt.turn, skill: nm, item: nm }) });
      } else {
        const dmg = Math.max(1, (+sk.power || 0) + (st.skills[sk.id] || 0) + atkBonus + Math.floor(Math.random() * 4) - (+e.def || 0));
        bt.ehp = Math.max(0, bt.ehp - dmg);
        bt.log.push({ kind: 'skill', text: battleLine(sk.line || '{skill}！造成 {dmg} 点伤害。',
          { dmg: dmg, enemy: e.name, php: bt.php, ehp: bt.ehp, turn: bt.turn, skill: nm, item: nm }) });
      }
      renderBattle(bt);
      if (bt.ehp <= 0){ winBattle(bt); return; }
      later(() => { if (!bt.over) enemyTurn(bt, false); }, 420);
      return;
    }
    if (kind === 'item'){
      const it = battleItems()[idx];
      if (!it) return;
      bt.lock = true; bt.panel = 'main';
      st.inventory = st.inventory.filter(x => x !== it.id);
      const nm = it.name || it.id;
      const u = it.use;
      if (u.kind === 'heal'){
        const heal = Math.max(1, +u.value || 1);
        const target = u.attr || bt.hpId;
        if (target){
          const cur = st.attrs[target] != null ? st.attrs[target] : 0;
          const d = attrDef(target) || {};
          st.attrs[target] = Math.max(0, cur + heal);
          showStatus([{ k: target, label: d.name || 'HP', d: heal }]);
          if (target === bt.hpId) bt.php = st.attrs[target];
        } else {
          bt.php += heal;
        }
        bt.log.push({ kind: 'item', text: battleLine('{item}：回复 {dmg} 点。',
          { dmg: heal, enemy: e.name, php: bt.php, ehp: bt.ehp, turn: bt.turn, item: nm }) });
      } else if (u.kind === 'damage'){
        const dmg = Math.max(1, +u.value || 1);
        bt.ehp = Math.max(0, bt.ehp - dmg);
        bt.log.push({ kind: 'item', text: battleLine('{item}：对 {enemy} 造成 {dmg} 点伤害。',
          { dmg: dmg, enemy: e.name, php: bt.php, ehp: bt.ehp, turn: bt.turn, item: nm }) });
      } else {
        bt.php = bt.maxHp || bt.php;
        if (bt.hpId) st.attrs[bt.hpId] = bt.php;
        bt.log.push({ kind: 'item', text: battleLine('{item}：状态恢复了。',
          { dmg: 0, enemy: e.name, php: bt.php, ehp: bt.ehp, turn: bt.turn, item: nm }) });
      }
      renderBattle(bt);
      if (bt.ehp <= 0){ winBattle(bt); return; }
      later(() => { if (!bt.over) enemyTurn(bt, false); }, 420);
      return;
    }
    /* 普通攻击 */
    bt.lock = true;
    const dmg = Math.max(1, 5 + atkBonus + Math.floor(Math.random() * 4) - (+e.def || 0));
    bt.ehp = Math.max(0, bt.ehp - dmg);
    bt.log.push({ kind: 'atk', text: battleLine(pickLine(bt.B.attackLines),
      { dmg, enemy: e.name, php: bt.php, ehp: bt.ehp, turn: bt.turn }) });
    renderBattle(bt);
    if (bt.ehp <= 0){ winBattle(bt); return; }
    later(() => { if (!bt.over) enemyTurn(bt, false); }, 420);
  }
  function enemyTurn(bt, halved){
    const e = bt.B.enemy;
    const def = battleBonus(bt.B.defBonus) + equipBonus().def;
    let dmg = Math.max(1, (+e.atk || 1) + Math.floor(Math.random() * 3) - def);
    if (halved) dmg = Math.max(1, Math.ceil(dmg / 2));
    bt.php = Math.max(0, bt.php - dmg);
    if (bt.hpId){
      st.attrs[bt.hpId] = bt.maxHp ? Math.min(bt.php, bt.maxHp) : bt.php;
      showStatus([{ k: bt.hpId, label: (attrDef(bt.hpId) || {}).name || 'HP', d: -dmg }]);
    }
    bt.log.push({ kind: 'hurt', text: battleLine(pickLine(bt.B.hurtLines),
      { dmg, enemy: e.name, php: bt.php, ehp: bt.ehp, turn: bt.turn }) });
    bt.turn++;
    bt.lock = false;
    renderBattle(bt);
    if (bt.php <= 0) loseBattle(bt);
  }
  function winBattle(bt){
    bt.over = true; bt.won = true; bt.lock = true;
    bt.log.push({ kind: 'sys', text: '◈ 战斗胜利' });
    if (bt.B.winLine) bt.log.push({ kind: 'win', text: battleLine(bt.B.winLine,
      { dmg: 0, enemy: bt.B.enemy.name, php: bt.php, ehp: bt.ehp, turn: bt.turn }) });
    renderBattle(bt);
  }
  function loseBattle(bt){
    bt.over = true; bt.won = false; bt.lock = true;
    bt.log.push({ kind: 'sys', text: '◈ 战斗失败' });
    if (bt.B.loseLine) bt.log.push({ kind: 'lose', text: battleLine(bt.B.loseLine,
      { dmg: 0, enemy: bt.B.enemy.name, php: bt.php, ehp: bt.ehp, turn: bt.turn }) });
    renderBattle(bt);
  }

  /* ---------- 任务 ---------- */
  function enterQuest(n, td){
    const q = n.quest;
    const qd = st.quests[q.id];
    const nm = q.name || q.id;
    if (q.action === 'start'){
      st.quests[q.id] = { name: nm, desc: q.desc || '', status: 'active' };
      sys('◈ 任务开始：' + esc(nm), 'quest');
    } else if (q.action === 'update'){
      if (qd){ qd.desc = q.desc || qd.desc; qd.name = nm || qd.name; }
      else st.quests[q.id] = { name: nm, desc: q.desc || '', status: 'active' };
      sys('◈ 任务更新：' + esc(nm), 'quest');
    } else {
      if (qd) qd.status = 'done';
      else st.quests[q.id] = { name: nm, desc: q.desc || '', status: 'done' };
      sys('◈ 任务完成：' + esc(nm), 'quest');
    }
    const diffs = applyEffects(n.effects);
    if (td) diffs.unshift(td);
    showStatus(diffs);
    sysEffects(n.effects);
    typeText(n.text, () => continueBtn(n.next));
  }
