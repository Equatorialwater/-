  function openMenu(kind){
    if (!st){ ntToast('游戏还没开始', 'warn'); return; }
    if (kind === 'bag' && !feat('inventory')){ ntToast('这个游戏没有开启「背包」', 'warn'); return; }
    if (kind === 'quest' && !feat('quests')){ ntToast('这个游戏没有开启「任务」', 'warn'); return; }
    if (kind === 'gallery' && !feat('gallery')){ ntToast('这个游戏没有开启「图鉴」', 'warn'); return; }
    if (kind === 'map' && !(story.settings.map && story.settings.map.enabled)){ ntToast('这个游戏没有开启「地图」', 'warn'); return; }
    if (kind === 'quest'){
      const act = Object.values(st.quests).filter(q => q.status === 'active');
      const done = Object.values(st.quests).filter(q => q.status === 'done');
      let h = act.map(q => `<div class="mrow"><div><div class="nm">◈ ${esc(q.name)}</div><div class="ds">${esc(q.desc || '')}</div></div></div>`).join('');
      h += done.map(q => `<div class="mrow done"><div><div class="nm">✓ ${esc(q.name)}</div><div class="ds">${esc(q.desc || '')}</div></div></div>`).join('');
      ntModal.open('任务日志', h || '<div class="dead">还没有接到任务</div>');
    }
    else if (kind === 'char'){
      let h = '';
      if (st.portrait && story.settings && story.settings.portraits){
        h += `<div class="char-ava"><img src="${st.portrait}" alt=""></div>`;
      }
      h += `<div class="mrow"><div><div class="nm">${esc(st.profile.name || '无名者')}</div>
        <div class="ds">${Object.keys(st.profile.fields || {}).map(k => {
          const cat = ((story.settings.charCreation || {}).profileCats || []).find(c => c.id === k);
          return esc(cat ? cat.name : k) + '：' + esc(st.profile.fields[k]);
        }).join('　·　') || '尚未填写角色设定'}</div></div></div>`;
      h += '<div class="sec-title">属性</div>';
      (story.character.attributes || []).forEach(a => {
        const v = st.attrs[a.id] != null ? st.attrs[a.id] : 0;
        const m = +a.max || 0;
        const pct = m ? Math.min(100, Math.round(v / m * 100)) : 0;
        h += `<div class="mrow"><div style="flex:1"><div class="nm">${esc(a.name)}　<span class="mono">${v}${m ? ' / ' + m : ''}</span></div>
          ${m ? `<div class="q-bar"><i style="width:${pct}%"></i></div>` : ''}</div></div>`;
      });
      h += '<div class="sec-title">技能</div>';
      (story.character.skills || []).forEach(s => {
        h += `<div class="mrow"><div class="nm">${esc(s.name)}　<span class="mono">＋${st.skills[s.id] != null ? st.skills[s.id] : 0}</span></div></div>`;
      });
      if (feat('equipment')){
        h += '<div class="sec-title">装备</div>';
        ['weapon', 'armor', 'accessory'].forEach(slot => {
          const eq = st.equipped[slot] && equipDef(st.equipped[slot]);
          const stTxt = eq ? [
            +eq.atk ? '攻 +' + (+eq.atk) : '',
            +eq.def ? '防 +' + (+eq.def) : ''
          ].filter(Boolean).join(' · ') : '';
          h += `<div class="mrow"><div><div class="nm">${slotName(slot)}　${eq ? esc(eq.name) : '<span class="dim">— 空 —</span>'}</div>
            ${stTxt ? `<div class="ds">${stTxt}</div>` : ''}</div></div>`;
        });
        const eb = equipBonus();
        const total = [eb.atk ? '攻 +' + eb.atk : '', eb.def ? '防 +' + eb.def : ''].filter(Boolean).join(' · ') || '无加成';
        h += `<div class="dim mini" style="margin-top:6px">装备合计：${total}</div>`;
      }
      if (story.character.currency){
        h += `<div class="sec-title">货币</div><div class="mrow"><div class="nm">${esc(story.character.currency.name)}　<span class="mono">${st.currency}</span></div></div>`;
      }
      ntModal.open('角色状态', h);
    }
    else if (kind === 'bag'){
      const counts = {};
      st.inventory.forEach(id => counts[id] = (counts[id] || 0) + 1);
      let h = '';
      if (feat('equipment') && st.gear.length){
        h += '<div class="sec-title">装备</div>';
        st.gear.forEach(id => {
          const eq = equipDef(id);
          if (!eq) return;
          const on = st.equipped[eq.slot] === id;
          const stTxt = [
            +eq.atk ? '攻 +' + (+eq.atk) : '',
            +eq.def ? '防 +' + (+eq.def) : ''
          ].filter(Boolean).join(' · ');
          h += `<div class="mrow${on ? ' here' : ''}"><div style="flex:1">
            <div class="nm">${esc(eq.name)}${on ? ' <span class="tag-here">已装备</span>' : ''}</div>
            <div class="ds">${slotName(eq.slot)}${stTxt ? ' · ' + stTxt : ''}${eq.desc ? ' · ' + esc(eq.desc) : ''}</div>
          </div><div class="ops"><button class="p-btn" data-equip="${esc(id)}">${on ? '卸下' : '装备'}</button></div></div>`;
        });
      }
      const itemRows = Object.keys(counts).map(id => {
        const it = itemDef(id);
        return `<div class="mrow"><div><div class="nm">${esc(it ? it.name : id)}${counts[id] > 1 ? ' ×' + counts[id] : ''}</div>
          <div class="ds">${esc(it && it.desc ? it.desc : '')}</div></div></div>`;
      }).join('');
      if (itemRows) h += '<div class="sec-title">物品</div>' + itemRows;
      ntModal.open('背包', h || '<div class="dead">背包是空的</div>');
      $('modalBody').querySelectorAll('[data-equip]').forEach(b => b.addEventListener('click', () => {
        toggleEquip(b.dataset.equip);
        openMenu('bag');
      }));
    }
    else if (kind === 'gallery'){
      const g = lsGet(gKey()) || {};
      const endings = story.nodes.filter(n => n.type === 'ending');
      const got = endings.filter(n => g[n.id]).length;
      const cells = endings.map(n => {
        const rec = g[n.id];
        return `<div class="gal-cell ${rec ? 'got' : 'lock'}">
          <div class="g-nm">${rec ? esc(n.ending.name || '无名结局') : '？？？'}</div>
          <div class="g-ds">${rec ? esc(n.ending.desc || '') : '尚未达成的结局'}</div>
          ${rec ? `<div class="g-st mono">◈ 达成于 ${new Date(rec.ts).toLocaleString()}</div>` : ''}
        </div>`;
      }).join('');
      ntModal.open(`结局图鉴（${got}/${endings.length}）`,
        endings.length ? `<div class="gal-grid">${cells}</div>` : '<div class="dead">这个游戏还没有结局卡</div>');
    }
    else if (kind === 'map'){
      openMap();
    }
    else if (kind === 'save'){
      let h = '';
      for (let slot = 1; slot <= 3; slot++){
        const d = lsGet(sKey(slot));
        const node = d && findNode(d.node);
        h += `<div class="mrow"><div class="slot-info" style="flex:1">
          ${d ? `<b>存档位 ${slot}</b>　${new Date(d.ts).toLocaleString()}<br>进度：${esc(node ? (node.title || node.id) : d.node)}${d.state && d.state.timeDay ? '　·　第' + d.state.timeDay + '天' : ''}`
              : `<b>存档位 ${slot}</b><br><span class="dim">— 空 —</span>`}
        </div><div class="ops">
          <button class="p-btn" data-slot="${slot}" data-op="save">${d ? '覆盖' : '保存'}</button>
          ${d ? `<button class="p-btn" data-slot="${slot}" data-op="load">读取</button><button class="p-btn warn" data-slot="${slot}" data-op="del">删除</button>` : ''}
        </div></div>`;
      }
      ntModal.open('存档 / 读档', h);
      $('modalBody').querySelectorAll('[data-slot]').forEach(b => {
        b.addEventListener('click', () => {
          const slot = +b.dataset.slot, op = b.dataset.op;
          if (op === 'save'){
            const ok = lsSet(sKey(slot), { ts: Date.now(), node: curId, state: st });
            ntToast(ok ? '已保存到存档位 ' + slot : '保存失败（浏览器存储空间不足）', ok ? '' : 'warn');
            openMenu('save');
          } else if (op === 'load'){
            const d = lsGet(sKey(slot));
            if (!d) return;
            st = d.state;
            st.profile = st.profile || { name: '', fields: {} };
            st.portrait = st.portrait || null;
            st.visited = st.visited || {};
            st.path = st.path || [];
            st.gear = st.gear || [];
            st.equipped = st.equipped || { weapon: null, armor: null, accessory: null };
            st.timeDay = st.timeDay || ((story.settings.time || {}).startDay || 1);
            st.timeMin = st.timeMin || 0;
            showStatus();
            ntModal.close();
            ntToast('已读取存档位 ' + slot);
            enterNode(d.node);
          } else {
            lsDel(sKey(slot));
            openMenu('save');
          }
        });
      });
    }
  }

      return `<button class="p-btn${on ? ' primary' : ''}" data-scale="${s}">${Math.round(s * 100)}%</button>`;
    }).join('');
    ntModal.open('界面大小（' + ntUiScalePct('player') + '）',

       <div class="dim mini" style="margin-top:12px">只影响本机显示，不会改变游戏内容或存档。选择后立即生效，并记住你的选择。</div>`,
      [{ label: '关闭' }]);
    $('modalBody').querySelectorAll('[data-scale]').forEach(b => b.addEventListener('click', () => {
      ntUiScaleSet('player', +b.dataset.scale);
      ntUiScaleApply('player');
      ntModal.close();
      ntToast('界面大小：' + ntUiScalePct('player'));
    }));
  }

  /* ---------- 播放器快捷键 ---------- */
  document.addEventListener('keydown', e => {
    if (Engine.view !== 'player') return;
    if (!$('modalRoot').classList.contains('hidden')) return;
    const ae = document.activeElement;
    if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key >= '1' && e.key <= '9'){
      const btns = [...document.querySelectorAll('#pActions .opt-btn')].filter(b => !b.disabled);
      const b = btns[+e.key - 1];
      if (b) b.click();
      return;
    }
    if (e.key === 'Enter' || e.key === ' '){
      const b = document.querySelector('#pActions .cont-btn');
      if (b){ e.preventDefault(); b.click(); return; }
      /* 演出模式：空格 / Enter 也能「点一下翻一页」 */
      if (pageClick){ e.preventDefault(); pageClick(); }
      return;
    }
    const menuKeys = { q: 'quest', c: 'char', b: 'bag', m: 'map', g: 'gallery', s: 'save' };
    const k = e.key.toLowerCase();
    if (menuKeys[k]){ e.preventDefault(); openMenu(menuKeys[k]); }
  });

  /* 编辑器里「试听」用：把一段音效连打几下。
     试听结束后把原来的配置还回去 —— 否则试听会污染正在试玩的存档音效。 */
  function previewSfx(cfg){
    const back = sfxCfg;
    sfxSet(cfg || ntDefaultSfx());
    sfxLast = 0;
    let i = 0;
    const t = setInterval(() => {
      typeTick();
      if (++i >= 10){ clearInterval(t); sfxSet(back); }
    }, 70);
  }

  return {
    start, stop, openMenu, openUiScale, openNpcCard, previewSfx,
    getState: () => st,
    getCurrent: () => curId,
    getPath: () => (st && Array.isArray(st.path) ? st.path.slice() : []),
    getSessionStart: () => sessionStart,
    isStage: () => !!$('pMain') && $('pMain').classList.contains('stage-on')
  };
})();
</script>
<script data-mod="app">'use strict';
/* ============ 应用入口：视图切换 / 自动保存 / 导入导出 / 主题 / 弹窗 / 检查 ============ */

/* ---------- 通用弹窗 ---------- */
const ntModal = (() => {
  function open(title, html, buttons, opts){
    const bs = buttons || [{ label: '关闭' }];
    $('modalBox').className = 'size-' + ((opts && opts.size) || 'normal');
    $('modalTitle').innerHTML = title;
    $('modalBody').innerHTML = html;
    $('modalBtns').innerHTML = bs
      .map((b, i) => `<button class="p-btn ${b.cls || ''}" data-mbtn="${i}">${b.label}</button>`)
      .join('');
    $('modalRoot').classList.remove('hidden');
    $('modalBody').scrollTop = 0;
    bs.forEach((b, i) => {
      const el = $('modalBtns').querySelector(`[data-mbtn="${i}"]`);
      if (el) el.addEventListener('click', () => {
        if (b.fn) b.fn();
        if (!b.keepOpen) close();
      });
    });
  }
  function close(){ $('modalRoot').classList.add('hidden'); }
  return { open, close };
})();

function ntConfirm(msg, onOk){
  if (window.NT_AUTOCONFIRM){ onOk(); return; }
  ntModal.open('请确认', `<div class="confirm-msg">${escH(msg)}</div>`, [
    { label: '取消' },
    { label: '确定', cls: 'warn', fn: onOk }
  ]);
}

document.addEventListener('click', e => {
  if (e.target.id === 'modalRoot') ntModal.close();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('modalRoot').classList.contains('hidden')) ntModal.close();
});

/* ---------- Toast ---------- */
function ntToast(msg, type){
  const d = document.createElement('div');
  d.className = 'toast' + (type ? ' ' + type : '');
  d.textContent = msg;
  $('toastRoot').appendChild(d);
  setTimeout(() => d.remove(), 2800);
}

/* ---------- 复制到剪贴板（主题包说明 / AI 提示词用） ---------- */
function ntCopy(text){
  const ok = () => ntToast('已复制到剪贴板');
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(String(text)).then(ok, () => ntCopyFallback(text, ok));
      return true;
    }
  } catch(e){}
  return ntCopyFallback(text, ok);
}
function ntCopyFallback(text, ok){
  try {
    const ta = document.createElement('textarea');
    ta.value = String(text);
    ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    const done = document.execCommand('copy');
    ta.remove();
    if (done) ok();
    else ntToast('复制失败：请手动选中文字复制', 'warn');
    return done;
  } catch(e){
    ntToast('复制失败：请手动选中文字复制', 'warn');
    return false;
  }
}

function escH(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

/* ---------- 应用 ---------- */
const App = (() => {
  const AUTOSAVE_KEY = 'nt_autosave_story';
  const AUTOSAVE_HINT = 'nt_autosave_hint';   // 'idb' = 上次是大工程，存在 IndexedDB 里
  const IDB_NAME = 'nt_editor_db';
  const IDB_STORE = 'kv';
  /* localStorage 大多浏览器只给 5MB；留一点余量给别的键 */
  const LS_LIMIT = 3.4 * 1024 * 1024;
  let dirtyTimer = null;
  let saveWarned = false;
  let lastSize = 0;

  function pad2(n){ return String(n).padStart(2, '0'); }

  /* ---------- IndexedDB：大工程（图片多）的兜底存档 ----------
     10 小时级别的工程图片加起来会超过 localStorage 的 5MB 配额，
     超过 3.4MB 就自动改存到 IndexedDB（配额按磁盘剩余空间算，几个 GB 起）。 */
  function idbOpen(){
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('no indexedDB'));
      const rq = indexedDB.open(IDB_NAME, 1);
      rq.onupgradeneeded = () => {
        const db = rq.result;
        if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
      };
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error || new Error('idb open failed'));
    });
  }
  function idbPut(key, val){
    return idbOpen().then(db => new Promise((res, rej) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(val, key);
      tx.oncomplete = () => { db.close(); res(true); };
      tx.onerror = () => { db.close(); rej(tx.error); };
    }));
  }
  function idbGet(key){
    return idbOpen().then(db => new Promise((res, rej) => {
      const rq = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(key);
      rq.onsuccess = () => { db.close(); res(rq.result); };
      rq.onerror = () => { db.close(); rej(rq.error); };
    }));
  }
  /* 状态栏的「工程 N KB / M B」 */
  function renderSize(bytes){
    const el = $('sbSize');
    if (!el) return;
    let t;
    if (bytes >= 1048576) t = (bytes / 1048576).toFixed(1) + 'MB';
    else t = Math.round(bytes / 1024) + 'KB';
    el.textContent = '工程 ' + t;
    el.className = bytes > LS_LIMIT ? 'warn' : (bytes > LS_LIMIT * 0.7 ? 'near' : '');
    el.title = bytes > LS_LIMIT
      ? '工程已超过 ' + (LS_LIMIT / 1048576).toFixed(1) + 'MB：自动保存改用浏览器数据库（IndexedDB）。建议定期「导出工程」备份。'
      : '工程体积（图片占大头）。超过 ' + (LS_LIMIT / 1048576).toFixed(1) + 'MB 会自动改用浏览器数据库保存。';
  }

  function init(){
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(AUTOSAVE_KEY)); } catch(e){}
    Engine.story = (saved && Array.isArray(saved.nodes) && saved.character)
      ? saved
      : (typeof ntTutorialStory === 'function' ? ntTutorialStory() : ntNewStory());
    ntEnsureSettings(Engine.story);
    ntRecalcCounters(Engine.story);
    Engine.view = 'editor';

    const ti = $('storyTitleInput');
    if (ti) ti.value = Engine.story.meta.title || '';
    const bv = document.querySelector('.brand small');
    if (bv) bv.textContent = NT_APP.version;

    Editor.init();
    Inspector.init();
    applyThemes();
    /* HTML 载体的通病：长按/拖动卡片和连线会选中文字、拖出图片、弹右键菜单，
       顺带把 Ctrl+D / Ctrl+S 之类的浏览器快捷键触发到页面上。统一在这里掐掉。 */
    (function guardNativeGestures(){
      const inField = el => !!(el && el.closest && el.closest('input,textarea,select,[contenteditable="true"]'));
      const inBoard = el => !!(el && el.closest && el.closest('#canvasWrap,#canvas,#world,.node,.node-g,#pStage,#panelBody img,.npc-ava,.nb-ava'));
      document.addEventListener('dragstart', e => {
        if (inBoard(e.target)) e.preventDefault();
      }, true);
      document.addEventListener('selectstart', e => {
        if (inBoard(e.target) && !inField(e.target)) e.preventDefault();
      }, true);
      document.addEventListener('contextmenu', e => {
        if (e.target.closest && e.target.closest('#canvasWrap,#canvas,#world,.node,.node-g')) e.preventDefault();
      }, true);
      /* 有些浏览器长按会触发「文本选择 + 拖拽」的组合手势，mousedown 里再兜一次 */
      document.addEventListener('mousedown', e => {
        if (inBoard(e.target) && !inField(e.target)){
          const t = e.target;
          if (t && t.tagName === 'IMG') t.draggable = false;
        }
      }, true);
      /* 拖卡片时误触的浏览器快捷键（书签/另存/打印…）直接吃掉 */
      document.addEventListener('keydown', e => {
        if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
        if (inField(e.target)) return;
        const k = String(e.key || '').toLowerCase();
        if (k === 's' || k === 'd' || k === 'p' || k === 'o' || k === 'g' || k === 'j' || k === 'u'){
          e.preventDefault();
        }
      }, true);
      /* Ctrl + 滚轮在画布上是缩放，别让浏览器把整页放大 */
      document.addEventListener('wheel', e => {
        if (!e.ctrlKey) return;
        if (e.target && e.target.closest && e.target.closest('#canvasWrap,#canvas,#world')) e.preventDefault();
      }, { capture: true, passive: false });
    })();

    /* 存档提醒条：导出备份 / 稍后再说（#selBar 的按钮由 Editor 自己绑定） */
    loadRemindCfg();
    remindReset();
    lastTick = Date.now();
    setInterval(remindTick, 15000);
    const rb = $('remindBar');
    if (rb){
      rb.addEventListener('click', e => {
        const b = e.target.closest ? e.target.closest('[data-remind]') : null;
        if (!b) return;
        if (b.dataset.remind === 'backup'){ exportJSON(); hideRemind(); remindReset(); }
        else { hideRemind(); remindReset(); }
      });
    }

    // 界面大小（编辑页 / 游玩页各自记忆）
    const us = $('uiScaleSel');
    if (us){
      us.innerHTML = NT_UI_SCALES.map(s =>
        `<option value="${s}">${Math.round(s * 100)}%</option>`).join('');
      us.value = String(ntUiScaleGet('editor'));
      us.addEventListener('change', () => {
        ntUiScaleSet('editor', +us.value);
        ntUiScaleApply('editor');
        ntToast('编辑器界面大小：' + ntUiScalePct('editor'));
      });
    }
    const bui = $('btnUiScale');
    if (bui) bui.addEventListener('click', () => Game.openUiScale());
    ntUiScaleApply('editor');

    // 编辑器外观（只影响编辑页；游玩页 UI 在「设置」里单独选）
    const ets = $('editorThemeSel');
    if (ets){
      refreshThemes();
      ets.addEventListener('change', () => {
        Engine.story.settings.ui.editor = ets.value;
        markDirty();
        const th = ntThemeDef(ets.value, Engine.story);
        ntToast('编辑器外观：' + (th ? th.t : ets.value));
      });
    }

    // 顶栏
    $('btnPlay').addEventListener('click', startPlay);
    $('btnExport').addEventListener('click', exportJSON);
    $('btnImport').addEventListener('click', () => $('fileInput').click());
    $('fileInput').addEventListener('change', importJSON);
    $('btnNew').addEventListener('click', newStory);
    const bex = $('btnExportGame');
    if (bex) bex.addEventListener('click', downloadGameHTML);
    const bchk = $('btnCheck');
    if (bchk) bchk.addEventListener('click', checkStory);
    const bhlp = $('btnHelp');
    if (bhlp) bhlp.addEventListener('click', showHelp);
    const bsave = $('saveState');
    if (bsave) bsave.addEventListener('click', () => {
      if (saveNow()) ntToast('已保存到浏览器本地');
    });
    if (ti) ti.addEventListener('input', e => {
      Engine.story.meta.title = e.target.value;
      markDirty();
    });

    // 节点工具栏
    document.querySelectorAll('#nodeToolbar [data-add]').forEach(b =>
      b.addEventListener('click', () => Editor.addNode(b.dataset.add)));
    $('zoomIn').addEventListener('click', Editor.zoomIn);
    $('zoomOut').addEventListener('click', Editor.zoomOut);
    $('zoomReset').addEventListener('click', Editor.zoomReset);
    const zf = $('zoomFit');
    if (zf) zf.addEventListener('click', Editor.zoomFit);

    // 播放器菜单
    document.querySelectorAll('#pMenu [data-menu]').forEach(b =>
      b.addEventListener('click', () => Game.openMenu(b.dataset.menu)));
    $('btnBackEditor').addEventListener('click', () => switchView('editor'));

    // 通用快捷键
    const mc = $('modalClose');
    if (mc) mc.addEventListener('click', () => ntModal.close());
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')){
        e.preventDefault();
        if (saveNow()) ntToast('已保存');
      }
    });
    window.addEventListener('beforeunload', e => {
      let json = '';
      try { json = JSON.stringify(Engine.story); } catch(err){}
      if (json.length <= LS_LIMIT){
        try { localStorage.setItem(AUTOSAVE_KEY, json); } catch(err){}
        return;
      }
      /* 大工程：关页面前提醒一下，别让作者以为已经存好了 */
      if (window.indexedDB) idbPut('autosave', Engine.story).catch(() => {});
      if (dirtyTimer){
        e.preventDefault();
        e.returnValue = '工程较大，正在写入浏览器数据库。建议先「导出工程」备份。';
        return e.returnValue;
      }
    });

    restoreBigProject();
    saveNow();
    updateIssueBadge();
    if (location.hash === '#play') setTimeout(() => switchView('player'), 30);
  }

  /* ---------- 主题 ---------- */
  let themeClassCache = [];
  function currentTheme(){
    const ui = (Engine.story.settings && Engine.story.settings.ui) || {};
    return Engine.view === 'player' ? (ui.player || 'cyber') : (ui.editor || 'cyber');
  }
  /* 顶栏的「编辑外观」下拉与 story 同步 */
  function syncEditorTheme(){
    const sel = $('editorThemeSel');
    if (sel) sel.value = (Engine.story.settings.ui.editor || 'cyber');
  }
  /* 自定义主题的样式表：插一个 <style>，导出时由 exporter 另带一份 */
  function injectCustomThemeCss(){
    let el = document.getElementById('ntCustomThemeCss');
    const css = ntCustomThemeCss(Engine.story);
    if (!css){
      if (el) el.textContent = '';
      return;
    }
    if (!el){
      el = document.createElement('style');
      el.id = 'ntCustomThemeCss';
      document.head.appendChild(el);
    }
    if (el.textContent !== css) el.textContent = css;
  }
  function applyThemes(){
    const t = currentTheme();
    const app = $('app');
    injectCustomThemeCss();
    const ids = NT_THEME_IDS.concat(ntCustomThemes(Engine.story).map(x => x.id));
    const all = themeClassCache.concat(ids).filter((v, i, a) => a.indexOf(v) === i);
    all.forEach(k => {
      const on = (k === t);
      app.classList.toggle('ui-' + k, on);
      document.body.classList.toggle('ui-' + k, on);
    });
    themeClassCache = ids.slice();
    app.dataset.theme = t;
  }
  /* 导入 / 删除自定义主题后：重建顶栏下拉 + 立刻套用 */
  function refreshThemes(){
    const sel = $('editorThemeSel');
    if (sel){
      const list = ntAllThemes(Engine.story);
      sel.innerHTML = list.map(t => `<option value="${escH(t.v)}">${escH(t.t)}${t.custom ? '（自定义）' : ''}</option>`).join('');
      syncEditorTheme();
      const cur = ntThemeDef(Engine.story.settings.ui.editor, Engine.story);
      sel.title = '编辑器外观（当前：' + (cur ? cur.t : '机能风') + '）';
    }
    applyThemes();
  }

  /* ---------- 视图 ---------- */
  function startPlay(){
    const s = Engine.story;
    if (!s.startNode || !s.nodes.some(n => n.id === s.startNode)){
      ntToast('开始节点无效，请先在「全局」页选一张卡片', 'warn');
      Inspector.setTab('global');
      return;
    }
    switchView('player', null);
  }
  /* 作者调试：直接从当前选中的卡片开始（跳过角色创建、不要求它是开始节点） */
  function startPlayFrom(id){
    const n = Engine.story.nodes.find(x => x.id === id);
    if (!n){ ntToast('找不到这张卡片', 'warn'); return; }
    switchView('player', id);
    ntToast('从「' + (n.title || n.id) + '」开始试玩（已跳过角色创建）');
  }
  function switchView(v, startAt){
    Engine.view = v;
    $('editorView').classList.toggle('hidden', v !== 'editor');
    $('playerView').classList.toggle('hidden', v !== 'player');
    applyThemes();
    ntUiScaleApply(v);
    if (v === 'player') Game.start(Engine.story, startAt === undefined ? null : startAt);
    else Game.stop();
  }

  function afterStoryReplaced(){
    ntEnsureSettings(Engine.story);
    ntRecalcCounters(Engine.story);
    const ti = $('storyTitleInput');
    if (ti) ti.value = Engine.story.meta.title || '';
    refreshThemes();
    Inspector.setCur(null);
    Inspector.setTab('node');
    Editor.render();
    Editor.zoomFit();
    applyThemes();
    saveNow();
    updateIssueBadge();
  }

  /* ---------- 保存状态 ---------- */
  function setSaveState(text, cls){
    const el = $('saveState');
    if (!el) return;
    el.textContent = text;
    el.className = 'save-state' + (cls ? ' ' + cls : '');
  }
  function saveNow(){
    const stamp = () => {
      const d = new Date();
      setSaveState('已保存 ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()), 'ok');
    };
    let json = '';
    try { json = JSON.stringify(Engine.story); } catch(e){ json = ''; }
    lastSize = json.length;
    renderSize(json.length);
    /* 小工程：localStorage（同步、快、刷新立刻能读） */
    if (json.length <= LS_LIMIT){
      try {
        localStorage.setItem(AUTOSAVE_KEY, json);
        localStorage.removeItem(AUTOSAVE_HINT);
        stamp();
        return true;
      } catch(e){ /* 配额被别的页面占了？退到 IndexedDB */ }
    }
    /* 大工程：IndexedDB（异步、按磁盘配额，没有 5MB 限制） */
    if (window.indexedDB){
      idbPut('autosave', Engine.story).then(() => {
        try { localStorage.setItem(AUTOSAVE_HINT, 'idb'); localStorage.removeItem(AUTOSAVE_KEY); } catch(e){}
        setSaveState('已保存（大工程）', 'ok');
      }).catch(() => {
        setSaveState('保存失败', 'err');
        if (!saveWarned){
          saveWarned = true;
          ntToast('自动保存失败：工程太大了。请立刻用「导出工程」备份成文件。', 'warn');
        }
      });
      return true;
    }
    setSaveState('保存失败', 'err');
    if (!saveWarned){
      saveWarned = true;
      ntToast('浏览器存储空间不足，自动保存失败。请用「导出工程」备份，或减少立绘数量。', 'warn');
    }
    return false;
  }
  /* 启动时：如果上次是大工程，从 IndexedDB 恢复 */
  function restoreBigProject(){
    let hint = '';
    try { hint = localStorage.getItem(AUTOSAVE_HINT) || ''; } catch(e){}
    if (hint !== 'idb' || !window.indexedDB) return;
    idbGet('autosave').then(s => {
      if (!s || !Array.isArray(s.nodes) || !s.character) return;
      Engine.story = s;
      ntEnsureSettings(Engine.story);
      ntRecalcCounters(Engine.story);
      afterStoryReplaced();
      ntToast('已从浏览器数据库恢复上次的大工程');
    }).catch(() => {});
  }
  function markDirty(){
    applyThemes();
    setSaveState('保存中…', 'dirty');
    clearTimeout(dirtyTimer);
    dirtyTimer = setTimeout(() => {
      saveNow();
      updateIssueBadge();
    }, 500);
    remindTouch();
  }

  /* ---------- 存档提醒 ----------
     HTML 没有「另存为」的概念，浏览器缓存一清工程就没了。
     这里按「新增了多少张卡」和「连续编辑了多久」两个维度提醒作者导出备份。
     配置放在 localStorage（不进工程文件），阈值可以在「设置」页里改。 */
  const REMIND_KEY = 'nt_remind_cfg';
  /* 提醒音：不引外部音频，用 WebAudio 现场合成几种「系统提示音」风格的声音 */
  const REMIND_SOUNDS = [
    { id: 'off',      name: '静音（不出声）' },
    { id: 'ding',     name: '叮 —— 单音提示' },
    { id: 'chord',    name: '和弦 —— 开机音' },
    { id: 'dingdong', name: '叮咚 —— 门铃' },
    { id: 'pop',      name: '啵 —— 轻弹出' },
    { id: 'notify',   name: '哒哒 —— 通知' },
    { id: 'alarm',    name: '警示 —— 三连' }
  ];
  const REMIND_SOUND_IDS = REMIND_SOUNDS.map(s => s.id);
  let remindCfg = { on: true, cards: 25, minutes: 40, sound: 'chord', volume: 0.55 };
  let remindBase = { cards: 0, ms: 0, nodes: 0 };
  let lastTick = 0, awake = 0;

  let remindCtx = null;
  function remindAc(){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!remindCtx){
      try { remindCtx = new AC(); } catch(e){ return null; }
    }
    if (remindCtx.state === 'suspended') remindCtx.resume();
    return remindCtx;
  }
  function remindTone(ctx, freq, at, dur, type, gain, slideTo){
    const o = ctx.createOscillator(), g = ctx.createGain();
    const t0 = ctx.currentTime + at;
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain), t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }
  /* 播放提醒音；id 省略时用设置里的那一款，id 传 'off' 直接不发声 */
  function playRemindSound(id, vol){
    const name = id || remindCfg.sound;
    if (!name || name === 'off' || REMIND_SOUND_IDS.indexOf(name) < 0) return false;
    const ctx = remindAc();
    if (!ctx) return false;
    const v = Math.max(0.02, Math.min(1, vol == null ? (remindCfg.volume || 0.55) : vol));
    if (name === 'ding'){
      remindTone(ctx, 1568, 0, 0.55, 'sine', 0.22 * v);
      remindTone(ctx, 2349, 0, 0.4, 'sine', 0.05 * v);
    } else if (name === 'chord'){
      [[523.25, 0], [659.25, 0.07], [783.99, 0.14], [1046.5, 0.2]]
        .forEach(([f, t]) => remindTone(ctx, f, t, 0.85, 'triangle', 0.10 * v));
    } else if (name === 'dingdong'){
      remindTone(ctx, 880, 0, 0.42, 'sine', 0.2 * v);
      remindTone(ctx, 659.25, 0.24, 0.6, 'sine', 0.2 * v);
    } else if (name === 'pop'){
      remindTone(ctx, 520, 0, 0.1, 'sine', 0.3 * v, 190);
    } else if (name === 'notify'){
      remindTone(ctx, 1174.7, 0, 0.12, 'square', 0.06 * v);
      remindTone(ctx, 1568, 0.14, 0.16, 'square', 0.05 * v);
    } else if (name === 'alarm'){
      [0, 0.22, 0.44].forEach((t, i) => remindTone(ctx, i === 2 ? 1046.5 : 880, t, 0.15, 'sawtooth', 0.045 * v));
    }
    return true;
  }

  function loadRemindCfg(){
    try {
      const raw = JSON.parse(localStorage.getItem(REMIND_KEY));
      if (raw && typeof raw === 'object'){
        remindCfg.on = raw.on !== false;
        remindCfg.cards = Math.max(1, Math.min(500, +raw.cards || 25));
        remindCfg.minutes = Math.max(1, Math.min(600, +raw.minutes || 40));
        if (REMIND_SOUND_IDS.indexOf(raw.sound) >= 0) remindCfg.sound = raw.sound;
        if (raw.volume != null) remindCfg.volume = Math.max(0.02, Math.min(1, +raw.volume || 0.55));
      }
    } catch(e){}
  }
  function saveRemindCfg(){
    try { localStorage.setItem(REMIND_KEY, JSON.stringify(remindCfg)); } catch(e){}
  }
  function remindReset(){
    remindBase = { cards: 0, ms: 0, nodes: (Engine.story.nodes || []).length };
    awake = 0;
  }
  /* 有编辑动作才算「在干活」：心跳只在最近 90 秒内动过的情况下累计 */
  function remindTouch(){
    if (!remindBase.nodes) remindBase.nodes = (Engine.story.nodes || []).length;
    lastTick = Date.now();
    awake = 0;
  }
  function remindTick(){
    const now = Date.now();
    if (document.hidden){ lastTick = now; return; }
    if (now - lastTick < 90000) remindBase.ms += 15000;
    lastTick = now;
    remindCheck();
  }
  function remindCheck(){
    if (!remindCfg.on) return;
    const added = Math.max(0, (Engine.story.nodes || []).length - remindBase.nodes);
    const mins = Math.floor(remindBase.ms / 60000);
    if (added < remindCfg.cards && mins < remindCfg.minutes) return;
    const why = added >= remindCfg.cards
      ? `这段时间新增了 ${added} 张卡片`
      : `已经连续编辑 ${mins} 分钟`;
    remindReset();
    showRemind(why);
  }
  function showRemind(why){
    const bar = $('remindBar');
    const msg = $('remindText');
    if (msg) msg.textContent = why + ' —— 建议导出一份工程备份';
    if (bar) bar.classList.remove('hidden');
    if (remindCfg.on) playRemindSound();
  }
  function hideRemind(){
    const bar = $('remindBar');
    if (bar) bar.classList.add('hidden');
  }

  /* ---------- 结构检查 ---------- */
  function analyzeStory(){
    const s = Engine.story;
    const list = [];
    const add = (level, msg, node) => list.push({ level, msg, node });
    if (!s.nodes.length){ add('err', '故事还是空的，先加一张卡片'); return list; }
    const ids = {};
    s.nodes.forEach(n => {
      if (ids[n.id]) add('err', '卡片 ID 重复：' + n.id, n.id);
      ids[n.id] = true;
    });
    if (!s.startNode || !ids[s.startNode]) add('err', '开始节点没有设置或指向了不存在的卡片');

    const incoming = {};
    const ref = (from, to) => {
      if (!to) return;
      if (!ids[to]){ add('err', '连向了不存在的卡片：' + to, from); return; }
      incoming[to] = (incoming[to] || 0) + 1;
    };
    const attrIds = {}; (s.character.attributes || []).forEach(a => attrIds[a.id] = true);
    const skillIds = {}; (s.character.skills || []).forEach(a => skillIds[a.id] = true);
    const itemIds = {}; (s.character.items || []).forEach(a => itemIds[a.id] = true);
    const questIds = {};
    s.nodes.forEach(n => { if (n.type === 'quest' && n.quest && n.quest.id) questIds[n.quest.id] = true; });

    s.nodes.forEach(n => {
      if (n.type === 'story' || n.type === 'effect' || n.type === 'quest' || n.type === 'cg'){
        if (n.next) ref(n.id, n.next);
        else add('warn', '没有后续卡片，玩家会停在这里', n.id);
      }
      if (n.type === 'choice'){
        if (!n.choices || !n.choices.length) add('err', '选项卡一个选项都没有', n.id);
        (n.choices || []).forEach((c, i) => {
          if (c.next) ref(n.id, c.next);
          else add('warn', `选项 ${i + 1}「${(c.text || '').slice(0, 12)}」没有去向`, n.id);
        });
      }
      if (n.type === 'check'){
        if (n.check.successNext) ref(n.id, n.check.successNext);
        else add('warn', '检定成功分支没有去向', n.id);
        if (n.check.failNext) ref(n.id, n.check.failNext);
        else add('warn', '检定失败分支没有去向', n.id);
      }
      if (n.type === 'battle'){
        if (n.battle.winNext) ref(n.id, n.battle.winNext);
        else add('warn', '战斗卡没有设置「胜利去向」', n.id);
        if (n.battle.loseNext) ref(n.id, n.battle.loseNext);
        else add('warn', '战斗卡没有设置「失败去向」', n.id);
      }
      if (n.type === 'jump'){
        if (!n.target) add('warn', '跳转卡没有选目标', n.id);
        else ref(n.id, n.target);
      }
      if (n.type === 'random'){
        const os = (n.outcomes || []).filter(o => o.next);
        if (!os.length) add('err', '随机卡没有任何可用分支', n.id);
        (n.outcomes || []).forEach((o, i) => {
          if (o.next) ref(n.id, o.next);
          else add('warn', `随机分支 ${i + 1} 没有去向`, n.id);
          if (+o.weight <= 0) add('info', `随机分支 ${i + 1} 权重为 0`, n.id);
        });
      }
      /* 演出（舞台）配置检查 */
      if (n.stage && n.stage.on !== false){
        if (n.stage.bg && !ntStageBg(s, n.stage.bg)) add('err', '演出的背景在背景库里找不到（可能被删掉了）', n.id);
        (n.stage.cast || []).forEach((c, i) => {
          const ok = c.who === NT_HERO_CAST ||
            (s.npcs || []).some(x => x.id === c.who || x.name === c.who);
          if (!ok) add('warn', `第 ${i + 1} 个出场立绘指向的角色不存在`, n.id);
        });
        if (!ntHasStage(n)) add('info', '开了演出模式，但既没有背景也没有出场立绘', n.id);
      }
      // 效果 / 条件引用检查
      const checkEff = (list2, where) => (list2 || []).forEach(e => {
        if (e.type === 'attr' && e.id && !attrIds[e.id]) add('err', `${where}引用了不存在的属性：${e.id}`, n.id);
        if (e.type === 'skill' && e.id && !skillIds[e.id]) add('err', `${where}引用了不存在的技能：${e.id}`, n.id);
        if (e.type === 'item' && e.id && !itemIds[e.id]) add('err', `${where}引用了不存在的物品：${e.id}`, n.id);
      });
      const checkCond = (list2) => (list2 || []).forEach(c => {
        if (c.type === 'attr' && c.id && !attrIds[c.id]) add('err', '条件引用了不存在的属性：' + c.id, n.id);
        if (c.type === 'skill' && c.id && !skillIds[c.id]) add('err', '条件引用了不存在的技能：' + c.id, n.id);
        if (c.type === 'item' && c.id && !itemIds[c.id]) add('err', '条件引用了不存在的物品：' + c.id, n.id);
        if (c.type === 'quest' && c.id && !questIds[c.id]) add('warn', '条件引用了没有「开始」卡的任务：' + c.id, n.id);
      });
      checkEff(n.effects, '效果');
      (n.choices || []).forEach(c => { checkEff(c.effects, '选项效果'); checkCond(c.conditions); });
    });
    s.nodes.forEach(n => {
      if (n.id !== s.startNode && !incoming[n.id])
        add('info', '没有任何线指向这张卡片，玩家可能走不到', n.id);
      if (n.next === n.id) add('warn', '这张卡片连向了自己，玩家会在这里无限循环', n.id);
      (n.choices || []).forEach(c => { if (c.next === n.id) add('warn', '选项连回了自己这张卡片', n.id); });
    });
    if (!s.nodes.some(n => n.type === 'ending')) add('warn', '还没有结局卡片');
    if (s.settings.time && s.settings.time.enabled){
      s.nodes.forEach(n => { if (n.time == null) add('info', '时间已开启，这张卡片没设耗时（按 0 分钟计）', n.id); });
    }
    const rank = { err: 0, warn: 1, info: 2 };
    list.sort((a, b) => rank[a.level] - rank[b.level]);
    return list;
  }

  function updateIssueBadge(){
    const el = $('sbIssues');
    if (!el) return;
    const list = analyzeStory();
    const errs = list.filter(x => x.level === 'err').length;
    const warns = list.filter(x => x.level === 'warn').length;
    if (errs){ el.textContent = `⚠ ${errs} 个错误 / ${warns} 处待完善`; el.className = 'sb-issues bad'; }
    else if (warns){ el.textContent = `⚠ ${warns} 处待完善`; el.className = 'sb-issues warn'; }
    else { el.textContent = '✓ 结构检查通过'; el.className = 'sb-issues ok'; }
  }

  function checkStory(){
    const list = analyzeStory();
    if (!list.length){
      ntModal.open('结构检查', '<div class="check-ok">✓ 没有发现问题，可以直接试玩或导出。</div>');
      return;
    }
    const label = { err: '错误', warn: '待完善', info: '提示' };
    const counts = { err: 0, warn: 0, info: 0 };
    list.forEach(x => counts[x.level]++);
    const h = `<div class="issue-sum">错误 ${counts.err} · 待完善 ${counts.warn} · 提示 ${counts.info}</div>` +
      list.map(x => `<div class="issue ${x.level}"${x.node ? ` data-goto="${escH(x.node)}"` : ''}>
        <span class="issue-tag">${label[x.level]}</span>
        <span class="issue-msg">${escH(x.msg)}</span>
        ${x.node ? '<span class="issue-go">定位 →</span>' : ''}
      </div>`).join('');
    ntModal.open('结构检查', h, [{ label: '关闭' }], { size: 'wide' });
    $('modalBody').querySelectorAll('[data-goto]').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.dataset.goto;
        if (!Engine.story.nodes.some(n => n.id === id)) return;
        ntModal.close();
        Editor.focusNode(id);
      });
    });
  }

  /* ---------- 工程导入导出（story.json） ---------- */
  function exportJSON(){
    const data = JSON.stringify(Engine.story, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const a = document.createElement('a');
    const name = (Engine.story.meta.title || 'story').replace(/[\\/:*?"<>|]/g, '_');
    a.href = URL.createObjectURL(blob);
    a.download = name + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    ntToast('已导出工程文件（story.json，可再次导入编辑）');
  }

  function importJSON(ev){
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (!data || !Array.isArray(data.nodes) || !data.character){
          ntToast('文件格式不正确：缺少 nodes / character', 'warn');
          return;
        }
        ntConfirm('导入会覆盖当前编辑内容，继续？', () => {
          Engine.story = data;
          afterStoryReplaced();
          ntToast('导入成功：' + ((data.meta && data.meta.title) || '未命名'));
        });
      } catch(err){
        ntToast('JSON 解析失败：' + err.message, 'warn');
      }
    };
    r.readAsText(file, 'utf-8');
  }

  function exportGameHTML(){
    const cssEl = document.querySelector('style#appCss');
    const dataEl = document.querySelector('script[data-mod="data"]');
    const rtEl = document.querySelector('script[data-mod="runtime"]');
    if (!cssEl || !dataEl || !rtEl ||
        !cssEl.textContent.trim() || !dataEl.textContent.trim() || !rtEl.textContent.trim()){
      ntToast('当前环境读不到引擎源码，请直接打开 index.html 再导出', 'warn');
      return null;
    }
    return NtExport.build({
      story: Engine.story,
      css: cssEl.textContent,
      dataSrc: dataEl.textContent,
      runtimeSrc: rtEl.textContent,
      customCss: ntCustomThemeCss(Engine.story),
      generator: NT_APP.name,
      version: NT_APP.version
    });
  }

  function downloadGameHTML(){
    const html = exportGameHTML();
    if (!html) return;
    const blob = new Blob([html], { type: 'text/html' });
    const a = document.createElement('a');
    const name = (Engine.story.meta.title || 'game').replace(/[\\/:*?"<>|]/g, '_');
    a.href = URL.createObjectURL(blob);
    a.download = name + '.game.html';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    ntToast('已导出可游玩的游戏 HTML（双击即玩，不能编辑）');
  }

  return {
    init, markDirty, switchView, loadTutorial, startPlayFrom,
    exportGameHTML, downloadGameHTML, saveNow, analyzeStory, checkStory, updateIssueBadge,
    currentTheme, refreshThemes, applyThemes, exportJSON,
    /* 存档提醒（设置页用） */
    remindConfig: () => remindCfg,
    setRemindConfig: cfg => {
      remindCfg.on = cfg.on !== false;
      remindCfg.cards = Math.max(1, Math.min(500, +cfg.cards || 25));
      remindCfg.minutes = Math.max(1, Math.min(600, +cfg.minutes || 40));
      if (cfg.sound != null && REMIND_SOUND_IDS.indexOf(cfg.sound) >= 0) remindCfg.sound = cfg.sound;
      if (cfg.volume != null) remindCfg.volume = Math.max(0.02, Math.min(1, +cfg.volume || 0.55));
      saveRemindCfg();
      remindReset();
    },
    remindSounds: () => REMIND_SOUNDS,
    playRemindSound,
    remindReset, remindCheck, hideRemind,
    remindTest: (why) => showRemind(why || '这是一次演示提醒')
  };
})();

document.addEventListener('DOMContentLoaded', App.init);
</script>
</body>
</html>
