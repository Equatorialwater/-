<script data-mod="exporter">'use strict';
/* ============ 导出器：把 story + 引擎源码拼装成单文件可玩游戏 ============
   浏览器里由 app.js 调用（读页面内联源码），Node 里由 tools/export-game.js 调用。
   注意：本文件内不能出现字面量的脚本结束标签（构建后会被内联进 script 标签）。 */

var NtExport = (function () {

  /* 玩家端静态骨架（与 index.template.html 的播放器部分保持一致） */
  var PLAYER_DOM = [
    '<div id="app">',
    '  <div id="playerView">',
    '    <div id="pTop">',
    '      <div id="pTitle" class="mono"></div>',
    '      <div id="pAvatar"></div>',
    '      <div id="pStatus" class="mono"></div>',
    '      <div id="pMenu">',
    '        <button class="p-btn" data-menu="quest">任务</button>',
    '        <button class="p-btn" data-menu="char">角色</button>',
    '        <button class="p-btn" data-menu="bag">背包</button>',
    '        <button class="p-btn" data-menu="map" id="mBtnMap">地图</button>',
    '        <button class="p-btn" data-menu="gallery">图鉴</button>',
    '        <button class="p-btn" data-menu="save">存档</button>',
    '        <button class="p-btn ghost" id="btnUiScale" title="界面大小">Aa</button>',
    '        <span class="p-div"></span>',
    '        <button class="p-btn ghost" id="btnBackEditor" title="退出">✕</button>',
    '      </div>',
    '    </div>',
    '    <div id="pMain">',
    '      <div id="pStage" class="hidden"></div>',
    '      <div id="pNodeTag" class="mono"></div>',
    '      <div id="pSys" class="mono"></div>',
    '      <div id="pText"></div>',
    '      <div id="pActions"></div>',
    '    </div>',
    '    <div id="scan"></div>',
    '  </div>',
    '  <div id="modalRoot" class="hidden">',
    '    <div id="modalBox">',
    '      <div id="modalHead"><div id="modalTitle" class="mono"></div><button id="modalClose" title="关闭">✕</button></div>',
    '      <div id="modalBody"></div>',
    '      <div id="modalBtns"></div>',
    '    </div>',
    '  </div>',
    '  <div id="toastRoot"></div>',
    '</div>'
  ].join('\n');

  var BOOT = [
    'var NT_EXPORT = true;',
    'var NT_EXPORT_STORY = __STORY__;',
    '(function(){',
    '  function g(id){ return document.getElementById(id); }',
    '  function closeModal(){ g("modalRoot").classList.add("hidden"); }',
    '  window.ntModal = {',
    '    open: function(title, html, buttons, opts){',
    '      g("modalBox").className = "size-" + ((opts && opts.size) || "normal");',
    '      g("modalTitle").innerHTML = title;',
    '      g("modalBody").innerHTML = html;',
    '      var bs = buttons || [{ label: "关闭" }];',
    '      g("modalBtns").innerHTML = bs.map(function(b, i){',
    '        return \'<button class="p-btn \' + (b.cls || \'\') + \'" data-mbtn="\' + i + \'">\' + b.label + \'</button>\';',
    '      }).join("");',
    '      g("modalRoot").classList.remove("hidden");',
    '      bs.forEach(function(b, i){',
    '        var el = g("modalBtns").querySelector(\'[data-mbtn="\' + i + \'"]\');',
    '        if (el) el.addEventListener("click", function(){ if (b.fn) b.fn(); if (!b.keepOpen) closeModal(); });',
    '      });',
    '    },',
    '    close: closeModal',
    '  };',
    '  window.ntToast = function(msg, type){',
    '    var d = document.createElement("div");',
    '    d.className = "toast" + (type ? " " + type : "");',
    '    d.textContent = msg;',
    '    g("toastRoot").appendChild(d);',
    '    setTimeout(function(){ d.remove(); }, 2800);',
    '  };',
    '  window.App = { markDirty: function(){}, switchView: function(){} };',
    '  function boot(){',
    '    var st = NT_EXPORT_STORY.settings || {};',
    '    var theme = (st.ui && st.ui.player) || "cyber";',
    '    if (theme === "ff14") theme = "gilt";',
    '    Engine.view = "player";',
    '    g("playerView").classList.remove("hidden");',
    '    g("app").className = "ui-" + theme;',
    '    document.body.className = "ui-" + theme;',
    '    if (g("btnBackEditor")){',
    '      var bb = g("btnBackEditor");',
    '      bb.classList.add("hidden");',
    '      if (bb.previousElementSibling) bb.previousElementSibling.classList.add("hidden");',
    '    }',
    '    Array.prototype.forEach.call(document.querySelectorAll("#pMenu [data-menu]"), function(b){',
    '      b.addEventListener("click", function(){ Game.openMenu(b.getAttribute("data-menu")); });',
    '    });',
    '    if (g("btnUiScale")) g("btnUiScale").addEventListener("click", function(){ Game.openUiScale(); });',
    '    if (g("modalClose")) g("modalClose").addEventListener("click", closeModal);',
    '    g("modalRoot").addEventListener("click", function(e){ if (e.target.id === "modalRoot") closeModal(); });',
    '    document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeModal(); });',
    '    Game.start(NT_EXPORT_STORY);',
    '  }',
    '  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);',
    '  else boot();',
    '})();'
  ].join('\n');

  function escH(s){
    return String(s == null ? '' : s).replace(/[&<>"]/g,
      c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  /* opts: { story, css, customCss, dataSrc, runtimeSrc, generator, version } */
  function build(opts){
    var story = opts.story || {};
    var title = (story.meta && story.meta.title) || '文字游戏';
    var storyJSON = JSON.stringify(story).replace(/<\//g, '<\\/');
    var boot = BOOT.replace('__STORY__', function () { return storyJSON; });
    var gen = opts.generator || '那什么的文游编辑器';
    if (opts.version) gen += ' ' + opts.version;
    /* 自定义主题的样式表（作者导入的主题包）跟着游戏一起走 */
    var customCss = String(opts.customCss || '').replace(/<\/style/gi, '');
    var headCss = '<style id="appCss">' + (opts.css || '') + '</style>\n' +
      (customCss ? '<style id="ntCustomThemeCss">' + customCss + '</style>\n' : '');
    return '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="UTF-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n' +
      '<meta name="generator" content="' + escH(gen) + '">\n' +
      '<title>' + escH(title) + '</title>\n' +
      headCss + '</head>\n<body>\n' +
      PLAYER_DOM + '\n' +
      '<script data-mod="data">' + (opts.dataSrc || '') + '<\/script>\n' +
      '<script data-mod="runtime">' + (opts.runtimeSrc || '') + '<\/script>\n' +
      '<script>\n' + boot + '\n<\/script>\n</body>\n</html>';
  }

  return { PLAYER_DOM: PLAYER_DOM, build: build };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = NtExport;
</script>
<script data-mod="editor">'use strict';
/* ============ 编辑器：SVG 节点画布（含章节分区） ============ */

const Editor = (() => {
  const NS = 'http://www.w3.org/2000/svg';
  const NODE_W = 210;

  let svg, worldG, chapterG, edgeG, nodeG, tempEdge = null;
  const view = { x: 40, y: 30, scale: 1 };
  let selNodeId = null;
  let selEdge = null;   // 'nodeId|port'
  let drag = null;
  let chapterFilter = [];   // [] = 显示全部；否则只显示勾选的章节（'' 表示未分章）
  let palette = {};

  const nodes = () => Engine.story.nodes;
  const findNode = id => nodes().find(n => n.id === id);
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g,
      c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function el(tag, attrs){
    const e = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  /* ---------- 初始化 ---------- */
  function init(){
    svg = $('canvas');
    worldG = el('g', { id: 'worldG' });
    chapterG = el('g');
    edgeG = el('g');
    nodeG = el('g');
    worldG.appendChild(chapterG);
    worldG.appendChild(edgeG);
    worldG.appendChild(nodeG);

    const defs = el('defs');
    const grid = el('pattern', { id: 'gridPat', width: 26, height: 26, patternUnits: 'userSpaceOnUse' });
    grid.appendChild(el('path', { d: 'M26 0H0V26', fill: 'none', stroke: 'rgba(120,150,180,.10)', 'stroke-width': 1 }));
    defs.appendChild(grid);
    defs.appendChild(mkMarker('arrGray', '#7d8b99'));
    defs.appendChild(mkMarker('arrG', '#56d364'));
    defs.appendChild(mkMarker('arrR', '#ff7b72'));
    svg.appendChild(defs);

    // 网格背景（pointer-events:none，落在 svg 上则触发平移）
    worldG.appendChild(el('rect', { x: -9000, y: -9000, width: 18000, height: 18000,
      fill: 'url(#gridPat)', 'pointer-events': 'none' }));
    svg.appendChild(worldG);

    svg.addEventListener('mousedown', onDown);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    svg.addEventListener('wheel', onWheel, { passive: false });
    svg.addEventListener('dblclick', onDblClick);
    document.addEventListener('keydown', onKeyDown);

    const cfBtn = $('cfBtn');
    if (cfBtn) cfBtn.addEventListener('click', e => {
      e.stopPropagation();
      const menu = $('cfMenu');
      if (!menu) return;
      if (menu.classList.contains('hidden')){
        const r = cfBtn.getBoundingClientRect();
        const z = uiZoom();
        menu.style.left = Math.max(8 / z, r.left / z) + 'px';
        menu.style.top = (r.bottom / z + 4) + 'px';
        menu.classList.remove('hidden');
      } else {
        menu.classList.add('hidden');
      }
    });
    const cfAll = $('cfAll');
    if (cfAll) cfAll.addEventListener('click', e => {
      e.stopPropagation();
      const keys = chapterKeys();
      chapterFilter = (keys.length && chapterFilter.length === keys.length) ? [] : keys.slice();
      render();
    });
    const cfList = $('cfList');
    if (cfList) cfList.addEventListener('change', e => {
      const cb = e.target.closest('input[type="checkbox"]');
      if (!cb) return;
      const k = cb.value;
      if (cb.checked){ if (!chapterFilter.includes(k)) chapterFilter.push(k); }
      else chapterFilter = chapterFilter.filter(x => x !== k);
      render();
    });
    document.addEventListener('click', e => {
      if (!e.target.closest || !e.target.closest('#chapterFilter')){
        const menu = $('cfMenu');
        if (menu) menu.classList.add('hidden');
      }
    });
    const sb = $('selBar');
    if (sb){
      sb.addEventListener('click', e => {
        const b = e.target.closest ? e.target.closest('[data-sel]') : null;
        if (!b) return;
        if (b.dataset.sel === 'chapter') chapterFromSelection();
        else if (b.dataset.sel === 'clear'){ clearMulti(); updateStatus(); }
      });
    }
    render();
  }

  function mkMarker(id, color){
    const m = el('marker', { id, viewBox: '0 0 10 10', refX: 8, refY: 5,
      markerWidth: 6, markerHeight: 6, orient: 'auto-start-reverse' });
    m.appendChild(el('path', { d: 'M2 1L8 5L2 9', fill: 'none', stroke: color,
      'stroke-width': 1.6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
    return m;
  }

  /* ---------- 章节 ---------- */
  function isHidden(n){
    return chapterFilter.length > 0 && !chapterFilter.includes(n.chapter || '');
  }
  function chapterKeys(){
    const chs = Engine.story.chapters || [];
    const keys = chs.map(c => c.id);
    if (Engine.story.nodes.some(n => !n.chapter)) keys.push('');
    return keys;
  }
  function chapterName(id){
    if (!id) return '未分章';
    const c = (Engine.story.chapters || []).find(x => x.id === id);
    return c ? (c.name || '未命名') : id;
  }
  function updateChapterFilter(){
    const keys = chapterKeys();
    chapterFilter = chapterFilter.filter(k => keys.includes(k));
    const btn = $('cfBtn');
    if (btn){
      let label = '全部章节';
      if (chapterFilter.length === 1) label = chapterName(chapterFilter[0]);
      else if (chapterFilter.length > 1) label = chapterFilter.length + ' 个章节';
      btn.innerHTML = `<span class="cf-label">${esc(label)}</span><span class="cf-caret">▾</span>`;
    }
    const list = $('cfList');
    if (list){
      list.innerHTML = keys.map(k =>
        `<label class="cf-row"><input type="checkbox" value="${esc(k)}"${chapterFilter.includes(k) ? ' checked' : ''}><span>${esc(chapterName(k))}</span></label>`
      ).join('') || '<div class="cf-empty">还没有章节</div>';
    }
    const all = $('cfAll');
    if (all) all.textContent = (keys.length && chapterFilter.length === keys.length) ? '取消全选' : '全选';
  }
  function drawChapters(){
    chapterG.innerHTML = '';
    const chs = Engine.story.chapters || [];
    chs.forEach(ch => {
      const ns = nodes().filter(n => n.chapter === ch.id && !isHidden(n));
      if (!ns.length) return;
      let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
      ns.forEach(n => {
        x1 = Math.min(x1, n.x); y1 = Math.min(y1, n.y);
        x2 = Math.max(x2, n.x + NODE_W); y2 = Math.max(y2, n.y + nodeHeight(n));
      });
      x1 -= 30; y1 -= 42; x2 += 30; y2 += 22;
      const color = ch.color || '#378ADD';
      const g = el('g');
      g.appendChild(el('rect', { x: x1, y: y1, width: x2 - x1, height: y2 - y1, rx: 12,
        fill: color, 'fill-opacity': 0.05, stroke: color, 'stroke-opacity': 0.38,
        'stroke-dasharray': '7 5', 'stroke-width': 1, 'pointer-events': 'none' }));
      const t = el('text', { x: x1 + 12, y: y1 + 19, class: 'ch-label', fill: color, 'pointer-events': 'none' });
      t.textContent = '▣ ' + (ch.name || '未命名章节');
      g.appendChild(t);
      chapterG.appendChild(g);
    });
  }

  /* ---------- 几何 ---------- */
  function nodeHeight(n){
    if (n.type === 'choice') return 44 + n.choices.length * 24;
    if (n.type === 'random') return 44 + (n.outcomes || []).length * 24;
    return 64;
  }
  function portPos(n, port){
    const h = nodeHeight(n);
    if (port === 'in')   return { x: n.x,         y: n.y + h / 2 };
    if (port === 'out')  return { x: n.x + NODE_W, y: n.y + h / 2 };
    if (port === 'succ') return { x: n.x + NODE_W, y: n.y + 34 };
    if (port === 'fail') return { x: n.x + NODE_W, y: n.y + 56 };
    if (port && port.charAt(0) === 'c'){
      const i = +port.slice(1);
      return { x: n.x + NODE_W, y: n.y + 34 + i * 24 };
    }
    return { x: n.x, y: n.y };
  }

  /* ---------- 连线数据 ---------- */
  function getEdges(){
    const list = [];
    for (const n of nodes()){
      if (n.type === 'choice'){
        n.choices.forEach((c, i) => { if (c.next) list.push({ from: n.id, port: 'c' + i, to: c.next }); });
      } else if (n.type === 'random'){
        (n.outcomes || []).forEach((o, i) => { if (o.next) list.push({ from: n.id, port: 'c' + i, to: o.next }); });
      } else if (n.type === 'check'){
        if (n.check && n.check.successNext) list.push({ from: n.id, port: 'succ', to: n.check.successNext });
        if (n.check && n.check.failNext)    list.push({ from: n.id, port: 'fail', to: n.check.failNext });
      } else if (n.type === 'battle'){
        if (n.battle && n.battle.winNext)  list.push({ from: n.id, port: 'succ', to: n.battle.winNext });
        if (n.battle && n.battle.loseNext) list.push({ from: n.id, port: 'fail', to: n.battle.loseNext });
      } else if (n.type !== 'ending' && n.type !== 'jump' && n.next){
        list.push({ from: n.id, port: 'out', to: n.next });
      }
    }
    return list;
  }

  function edgePath(a, b, port){
    const p1 = portPos(a, port), p2 = portPos(b, 'in');
    const dx = Math.max(50, (p2.x - p1.x) * 0.45);
    return `M ${p1.x} ${p1.y} C ${p1.x + dx} ${p1.y}, ${p2.x - dx} ${p2.y}, ${p2.x - 9} ${p2.y}`;
  }

  function drawEdge(e){
    const a = findNode(e.from), b = findNode(e.to);
    if (!a || !b) return;
    if (isHidden(a) || isHidden(b)) return;
    const id = e.from + '|' + e.port;
    const d = edgePath(a, b, e.port);
    const marker = e.port === 'succ' ? 'arrG' : e.port === 'fail' ? 'arrR' : 'arrGray';
    const color  = e.port === 'succ' ? '#56d364' : e.port === 'fail' ? '#ff7b72' : ntCssVar('--edge', '#7d8b99');
    edgeG.appendChild(el('path', { d, class: 'edge-hit', 'data-edge': id,
      stroke: 'transparent', 'stroke-width': 14, fill: 'none', 'pointer-events': 'stroke', cursor: 'pointer' }));
    edgeG.appendChild(el('path', { d, class: 'edge-line' + (selEdge === id ? ' sel' : ''),
      'data-edge': id, stroke: color, 'stroke-width': 1.7, fill: 'none',
      'marker-end': `url(#${marker})`, 'pointer-events': 'none' }));
  }

  /* ---------- 节点绘制 ---------- */
  /* 按显示宽度截断（中文按 2 个单位），避免文字溢出卡片 */
  function strUnits(s){
    const str = String(s == null ? '' : s);
    let u = 0;
    for (let i = 0; i < str.length; i++) u += (str.charCodeAt(i) > 255) ? 2 : 1;
    return u;
  }
  function trunc(s, maxU){
    s = String(s == null ? '' : s);
    if (strUnits(s) <= maxU) return s;
    let u = 0, out = '';
    for (let i = 0; i < s.length; i++){
      const w = (s.charCodeAt(i) > 255) ? 2 : 1;
      if (u + w > maxU - 2) break;
      out += s[i];
      u += w;
    }
    return out + '…';
  }
  function nodeTitleOf(id){ const n = findNode(id); return n ? (n.title || n.id) : null; }

  function previewLines(n){
    switch(n.type){
      case 'story':  return [trunc(n.text || '（空文本）', 30)];
      case 'effect': return n.effects && n.effects.length
        ? [trunc(n.effects.map(e => ntEffectDesc(Engine.story, e)).join('，'), 30)]
        : ['（无数值变更）'];
      case 'choice': return n.choices.map(c => '▸ ' + trunc(c.text || '（未命名选项）', 27));
      case 'random': return (n.outcomes || []).map(o =>
        '▸ ' + (o.weight || 0) + ' 权重 · ' + (nodeTitleOf(o.next) ? '→ ' + trunc(nodeTitleOf(o.next), 10) : '未连接'));
      case 'check':  return [
        trunc(ntCheckFormula(Engine.story, n.check), 28),
        '成→' + trunc(nodeTitleOf(n.check.successNext) || '未连接', 7) + '　败→' + trunc(nodeTitleOf(n.check.failNext) || '未连接', 7)
      ];
      case 'quest': {
        const act = { start: '开始', update: '更新', complete: '完成' }[n.quest.action] || n.quest.action;
        return [`[${act}] ` + trunc(n.quest.name || '（未命名）', 23)];
      }
      case 'jump':   return ['→ ' + (nodeTitleOf(n.target) ? trunc(nodeTitleOf(n.target), 25) : '未设置目标')];
      case 'ending': return ['★ ' + trunc(n.ending.name || '（未命名结局）', 24)];
      case 'cg':     return [(n.image ? '🖼 ' : '（未导入图片）') + trunc(n.caption || 'CG', 22)];
      case 'battle': {
        const b = n.battle || {};
        const e = b.enemy || {};
        return [
          '⚔ ' + trunc(e.name || '敌人', 10) + '　HP ' + (e.hp || 0) + ' · 攻 ' + (e.atk || 0) + ' · 防 ' + (e.def || 0),
          '胜→' + trunc(nodeTitleOf(b.winNext) || '未连接', 7) + '　败→' + trunc(nodeTitleOf(b.loseNext) || '未连接', 7)
        ];
      }
    }
    return [''];
  }

  function drawNode(n){
    const t = NT_NODE_TYPES[n.type] || { label: n.type, color: '#888' };
    const color = palette[n.type] || t.color;
    const h = nodeHeight(n);
    const g = el('g', { class: 'node-g' + (n.id === selNodeId ? ' selected' : ''),
      'data-id': n.id, transform: `translate(${n.x},${n.y})`, cursor: 'move' });

    g.appendChild(el('rect', { class: 'body', width: NODE_W, height: h, rx: 7 }));
    g.appendChild(el('rect', { width: NODE_W, height: 24, rx: 7, fill: color }));
    g.appendChild(el('rect', { y: 12, width: NODE_W, height: 12, fill: color }));
    // 左侧章节色条
    const ch = (Engine.story.chapters || []).find(c => c.id === n.chapter);
    if (ch) g.appendChild(el('rect', { x: 0, y: 4, width: 3, height: h - 8, rx: 1.5, fill: ch.color || '#378ADD', 'fill-opacity': .9 }));

    const head = el('text', { x: 10, y: 12, class: 'n-head', 'dominant-baseline': 'central' });
    head.textContent = trunc((ntHasStage(n) ? '▣ ' : '') + t.label + ' · ' + (n.title || n.id), 22);
    g.appendChild(head);
    if (+n.time > 0){
      const tb = el('text', { x: NODE_W - 10, y: 12, class: 'n-time', 'dominant-baseline': 'central', 'text-anchor': 'end' });
      tb.textContent = +n.time + '′';
      g.appendChild(tb);
    }
    if (n.id === Engine.story.startNode){
      const b = el('text', { x: +n.time > 0 ? NODE_W - 44 : NODE_W - 10, y: 12, class: 'n-badge', 'dominant-baseline': 'central', 'text-anchor': 'end' });
      b.textContent = '起点';
      g.appendChild(b);
    }

    const lines = previewLines(n);
    lines.forEach((line, i) => {
      const y = (n.type === 'choice' || n.type === 'random') ? 34 + i * 24 : 40 + i * 19;
      const tx = el('text', { x: 10, y, 'dominant-baseline': 'central' });
      tx.textContent = line;
      g.appendChild(tx);
    });

    if (n.type === 'check' || n.type === 'battle'){
      const okLabel = n.type === 'battle' ? '胜' : '成功';
      const noLabel = n.type === 'battle' ? '败' : '失败';
      const s1 = el('text', { x: NODE_W - 34, y: 34, class: 'n-portlabel', 'dominant-baseline': 'central', fill: '#56d364' });
      s1.textContent = okLabel;
      const s2 = el('text', { x: NODE_W - 34, y: 56, class: 'n-portlabel', 'dominant-baseline': 'central', fill: '#ff7b72' });
      s2.textContent = noLabel;
      g.appendChild(s1); g.appendChild(s2);
    }

    // 输入端口
    g.appendChild(port('in', n.id, 0, h / 2, 7, 'port-in'));
    // 输出端口
    if (n.type === 'choice'){
      n.choices.forEach((c, i) => g.appendChild(port('c' + i, n.id, NODE_W, 34 + i * 24, 6, 'port-out')));
    } else if (n.type === 'random'){
      (n.outcomes || []).forEach((o, i) => g.appendChild(port('c' + i, n.id, NODE_W, 34 + i * 24, 6, 'port-out')));
    } else if (n.type === 'check'){
      g.appendChild(port('succ', n.id, NODE_W, 34, 6, 'port-out'));
      g.appendChild(port('fail', n.id, NODE_W, 56, 6, 'port-out'));
    } else if (n.type === 'battle'){
      g.appendChild(port('succ', n.id, NODE_W, 34, 6, 'port-out'));
      g.appendChild(port('fail', n.id, NODE_W, 56, 6, 'port-out'));
    } else if (n.type !== 'ending' && n.type !== 'jump'){
      g.appendChild(port('out', n.id, NODE_W, h / 2, 7, 'port-out'));
    }
    nodeG.appendChild(g);
  }

  function port(portId, nodeId, cx, cy, r, cls){
    return el('circle', { class: 'port ' + cls, cx, cy, r, 'data-node': nodeId, 'data-port': portId });
  }

  /* ---------- 渲染 ---------- */
  function render(){
    palette = ntNodePalette();
    edgeG.innerHTML = '';
    nodeG.innerHTML = '';
    updateChapterFilter();
    drawChapters();
    getEdges().forEach(drawEdge);
    nodes().forEach(n => { if (!isHidden(n)) drawNode(n); });
    applyView();
    syncMulti();
    updateStatus();
  }
  function renderEdges(){
    edgeG.innerHTML = '';
    getEdges().forEach(drawEdge);
  }
  function applyView(){
    worldG.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.scale})`);
    const z = $('sbZoom');
    if (z) z.textContent = Math.round(view.scale * 100) + '%';
  }
  function updateStatus(){
    const s = Engine.story;
    const a = $('sbNodes'); if (a) a.textContent = '卡片 ' + s.nodes.length;
    const b = $('sbChapters'); if (b) b.textContent = '章节 ' + (s.chapters || []).length;
    const c = $('sbSel');
    if (c){
      const n = selNodeId ? findNode(selNodeId) : null;
      c.textContent = n ? '已选：' + (n.title || n.id) : '未选中';
    }
    if (selIds.size > 1 && c) c.textContent = '已选 ' + selIds.size + ' 张（Shift 拖拽框选 / 一起拖动）';
    const d = $('sbZoom'); if (d) d.textContent = Math.round(view.scale * 100) + '%';
  }

  /* ---------- 选中 ---------- */
  function selectNode(id, keepMulti){
    if (!keepMulti) clearMulti();
    selNodeId = id;
    selEdge = null;
    nodeG.querySelectorAll('.node-g').forEach(g => g.classList.toggle('selected', g.dataset.id === id));
    edgeG.querySelectorAll('.edge-line').forEach(p => p.classList.remove('sel'));
    updateStatus();
    if (typeof Inspector !== 'undefined') Inspector.showNode(id ? findNode(id) : null);
  }

  /* ---------- 多选：Shift 点选 / Shift 拖空白框选 / 一起拖动 / 建章节 ---------- */
  const selIds = new Set();

  function syncMulti(){
    nodeG.querySelectorAll('.node-g').forEach(g => {
      g.classList.toggle('multi', selIds.has(g.dataset.id) && g.dataset.id !== selNodeId);
    });
    const bar = $('selBar');
    if (bar){
      bar.classList.toggle('hidden', selIds.size < 2);
      const c = bar.querySelector('.sb-count');
      if (c) c.textContent = '已选 ' + selIds.size + ' 张';
    }
    updateStatus();
  }
  function clearMulti(){
    if (selIds.size){ selIds.clear(); syncMulti(); }
  }
  function toggleMulti(id){
    if (selIds.has(id)) selIds.delete(id); else selIds.add(id);
    syncMulti();
  }
  function multiList(){
    return Array.from(selIds).map(findNode).filter(Boolean);
  }

  /* 用选中的卡片建立一个新章节 */
  function chapterFromSelection(){
    const list = multiList();
    if (list.length < 2){ ntToast('至少选两张卡片'); return; }
    const chs = Engine.story.chapters = Engine.story.chapters || [];
    let def = '第' + (chs.length + 1) + '章';
    ntModal.open('用选中的卡片建立章节',
      `<div class="field-row"><label>章节名</label><input id="chNewName" type="text" value="${esc(def)}"></div>
       <p class="hint">选中的 ${list.length} 张卡片会一起归到这个章节（覆盖它们原来的章节归属）。</p>`,
      [{ label: '取消' },
       { label: '建立', cls: 'primary', fn: () => {
         const inp = $('chNewName');
         const name = (inp && inp.value || '').trim();
         if (!name){ ntToast('章节名不能为空'); return; }
         const colors = ['#378ADD', '#f0a05a', '#e06b8b', '#7fd18d', '#b28fe0', '#5ac8c8'];
         const id = 'ch_' + Date.now().toString(36);
         chs.push({ id, name, color: colors[chs.length % colors.length] });
         list.forEach(n => { n.chapter = id; });
         clearMulti();
         render();
         App.markDirty();
         if (typeof Inspector !== 'undefined' && Inspector.rerender) Inspector.rerender();
         ntToast('已建立章节「' + name + '」，共 ' + list.length + ' 张卡片');
       } }], { size: 'narrow' });
    setTimeout(() => { const i = $('chNewName'); if (i){ i.focus(); i.select(); } }, 60);
  }
  function selectEdge(id){
    selEdge = id;
    selNodeId = null;
    nodeG.querySelectorAll('.node-g').forEach(g => g.classList.remove('selected'));
    edgeG.querySelectorAll('.edge-line').forEach(p => p.classList.toggle('sel', p.dataset.edge === id));
    updateStatus();
    if (typeof Inspector !== 'undefined') Inspector.showNode(null);
  }

  /* ---------- 交互 ---------- */
  /* 界面缩放（#app 的 CSS zoom）会让 getBoundingClientRect 变成视觉像素，
     而画布里的 view.x/view.y 是布局像素，所有指针坐标都要先除回去。 */
  function uiZoom(){
    try {
      const app = document.getElementById('app');
      const z = parseFloat(getComputedStyle(app).zoom);
      return (isFinite(z) && z > 0) ? z : 1;
    } catch(e){ return 1; }
  }
  function toWorld(e){
    const r = svg.getBoundingClientRect();
    const z = uiZoom();
    return {
      x: ((e.clientX - r.left) / z - view.x) / view.scale,
      y: ((e.clientY - r.top) / z - view.y) / view.scale
    };
  }

  function onDown(e){
    if (Engine.view !== 'editor' || e.button !== 0) return;
    const t = e.target;
    if (!t || !t.closest) return;

    const po = t.closest('.port-out');
    if (po){ startEdgeDrag(po.dataset.node, po.dataset.port, e); return; }
    if (t.closest('.port-in')) return;

    const ng = t.closest('.node-g');
    if (ng){
      const n = findNode(ng.dataset.id);
      if (!n) return;
      if (e.shiftKey){                        /* Shift 点选：加/减一张，不进拖动 */
        selectNode(n.id, true);
        toggleMulti(n.id);
        return;
      }
      if (!selIds.has(n.id)) clearMulti();
      selectNode(n.id, true);
      const p = toWorld(e);
      const group = (selIds.size > 1 && selIds.has(n.id))
        ? multiList().map(x => ({ id: x.id, x: x.x, y: x.y })) : null;
      drag = { mode: 'node', n, dx: p.x - n.x, dy: p.y - n.y, moved: false,
        group, g0: { x: n.x, y: n.y } };
      return;
    }
    const eh = t.closest('.edge-hit');
    if (eh){ selectEdge(eh.dataset.edge); return; }

    if (e.shiftKey){                          /* Shift 拖空白：框选 */
      const p = toWorld(e);
      const box = el('rect', { class: 'select-box', x: p.x, y: p.y, width: 0, height: 0 });
      worldG.appendChild(box);
      drag = { mode: 'box', x0: p.x, y0: p.y, add: e.ctrlKey || e.metaKey, box, moved: false };
      return;
    }

    clearMulti();
    selectNode(null);
    drag = { mode: 'pan', sx: e.clientX, sy: e.clientY, ox: view.x, oy: view.y };
    svg.classList.add('panning');
  }

  function startEdgeDrag(fromId, portId, e){
    const n = findNode(fromId);
    if (!n) return;
    selectNode(fromId);
    const p1 = portPos(n, portId);
    tempEdge = el('path', { class: 'temp-edge', stroke: 'var(--cyan)', 'stroke-width': 1.7,
      fill: 'none', 'stroke-dasharray': '5 4' });
    worldG.appendChild(tempEdge);
    drag = { mode: 'edge', from: fromId, port: portId, p1 };
    moveTemp(e);
  }
  function moveTemp(e){
    if (!tempEdge || !drag || drag.mode !== 'edge') return;
    const p = toWorld(e);
    drag.p2 = p;
    const dx = Math.max(50, (p.x - drag.p1.x) * 0.45);
    tempEdge.setAttribute('d', `M ${drag.p1.x} ${drag.p1.y} C ${drag.p1.x + dx} ${drag.p1.y}, ${p.x - dx} ${p.y}, ${p.x} ${p.y}`);
  }

  function onMove(e){
    if (!drag) return;
    if (drag.mode === 'pan'){
      const z = uiZoom();
      view.x = drag.ox + (e.clientX - drag.sx) / z;
      view.y = drag.oy + (e.clientY - drag.sy) / z;
      applyView();
    } else if (drag.mode === 'node'){
      const p = toWorld(e);
      const nx = Math.round(p.x - drag.dx), ny = Math.round(p.y - drag.dy);
      if (drag.group){
        const ddx = nx - drag.g0.x, ddy = ny - drag.g0.y;
        if (ddx || ddy) drag.moved = true;
        drag.group.forEach(it => {
          const n = findNode(it.id);
          if (!n) return;
          n.x = it.x + ddx;
          n.y = it.y + ddy;
          const g = nodeG.querySelector(`[data-id="${n.id}"]`);
          if (g) g.setAttribute('transform', `translate(${n.x},${n.y})`);
        });
      } else {
        if (nx !== drag.n.x || ny !== drag.n.y) drag.moved = true;
        drag.n.x = nx;
        drag.n.y = ny;
        const g = nodeG.querySelector(`[data-id="${drag.n.id}"]`);
        if (g) g.setAttribute('transform', `translate(${drag.n.x},${drag.n.y})`);
      }
      renderEdges();
      drawChapters();
    } else if (drag.mode === 'box'){
      const p = toWorld(e);
      const x = Math.min(p.x, drag.x0), y = Math.min(p.y, drag.y0);
      const w = Math.abs(p.x - drag.x0), h = Math.abs(p.y - drag.y0);
      drag.box.setAttribute('x', x);
      drag.box.setAttribute('y', y);
      drag.box.setAttribute('width', w);
      drag.box.setAttribute('height', h);
      if (w > 2 || h > 2) drag.moved = true;
      drag.rect = { x1: x, y1: y, x2: x + w, y2: y + h };
    } else if (drag.mode === 'edge'){
      moveTemp(e);
    }
  }

  function onUp(e){
    if (!drag) return;
    if (drag.mode === 'edge' && tempEdge){
      const t = document.elementFromPoint(e.clientX, e.clientY);
      let targetId = null;
      if (t && t.closest){
        const pi = t.closest('.port-in');
        const ng = t.closest('.node-g');
        if (pi) targetId = pi.dataset.node;
        else if (ng) targetId = ng.dataset.id;
      }
      if (targetId) connect(drag.from, drag.port, targetId);
      tempEdge.remove();
      tempEdge = null;
    } else if (drag.mode === 'node' && drag.moved){
      drawChapters();
      App.markDirty();
    } else if (drag.mode === 'box'){
      if (drag.box) drag.box.remove();
      if (drag.rect && drag.moved){
        if (!drag.add) clearMulti();
        const r = drag.rect;
        const hits = nodes().filter(n => {
          if (isHidden(n)) return false;
          const h = nodeHeight(n);
          return n.x < r.x2 && n.x + NODE_W > r.x1 && n.y < r.y2 && n.y + h > r.y1;
        });
        hits.forEach(n => selIds.add(n.id));
        if (hits.length){
          selectNode(hits[hits.length - 1].id, true);
          syncMulti();
          if (hits.length > 1) ntToast('已选中 ' + hits.length + ' 张卡片 · 拖动可一起移动');
        }
      }
    }
    svg.classList.remove('panning');
    drag = null;
  }

  /* 允许一个节点被多条线指向（剧情汇流是常态） */
  function connect(fromId, portId, toId){
    const from = findNode(fromId), to = findNode(toId);
    if (!from || !to || from.id === to.id) return;
    if (from.type === 'ending' || from.type === 'jump') return;
    if (portId && portId.charAt(0) === 'c'){
      const i = +portId.slice(1);
      if (from.type === 'random'){
        if ((from.outcomes || [])[i]) from.outcomes[i].next = toId;
      } else if (from.choices[i]){
        from.choices[i].next = toId;
      }
    } else if (portId === 'succ'){
      if (from.type === 'battle') from.battle.winNext = toId;
      else from.check.successNext = toId;
    }
    else if (portId === 'fail'){
      if (from.type === 'battle') from.battle.loseNext = toId;
      else from.check.failNext = toId;
    }
    else { from.next = toId; }
    render();
    App.markDirty();
  }

  function clearIncoming(toId){
    for (const n of nodes()){
      if (n.next === toId) n.next = null;
      if (n.type === 'jump' && n.target === toId) n.target = null;
      if (n.type === 'choice') n.choices.forEach(c => { if (c.next === toId) c.next = null; });
      if (n.type === 'random') (n.outcomes || []).forEach(o => { if (o.next === toId) o.next = null; });
      if (n.type === 'check'){
        if (n.check.successNext === toId) n.check.successNext = null;
        if (n.check.failNext === toId) n.check.failNext = null;
      }
      if (n.type === 'battle' && n.battle){
        if (n.battle.winNext === toId) n.battle.winNext = null;
        if (n.battle.loseNext === toId) n.battle.loseNext = null;
      }
    }
  }

  function breakEdge(edgeId){
    const [fromId, portId] = String(edgeId).split('|');
    const n = findNode(fromId);
    if (!n) return;
    if (portId && portId.charAt(0) === 'c'){
      const i = +portId.slice(1);
      if (n.type === 'random'){ if ((n.outcomes || [])[i]) n.outcomes[i].next = null; }
      else if (n.choices[i]) n.choices[i].next = null;
    } else if (portId === 'succ'){
      if (n.type === 'battle') n.battle.winNext = null;
      else n.check.successNext = null;
    }
    else if (portId === 'fail'){
      if (n.type === 'battle') n.battle.loseNext = null;
      else n.check.failNext = null;
    }
    else { n.next = null; }
    selEdge = null;
    render();
    App.markDirty();
  }

  function onDblClick(e){
    if (Engine.view !== 'editor') return;
    const t = e.target;
    if (!t || !t.closest) return;
    const eh = t.closest('.edge-hit');
    if (eh){ breakEdge(eh.dataset.edge); return; }
    const ng = t.closest('.node-g');
    if (ng){ selectNode(ng.dataset.id); }
  }

  function onKeyDown(e){
    if (Engine.view !== 'editor') return;
    if (!$('modalRoot').classList.contains('hidden')) return;
    const ae = document.activeElement;
    if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
    if (e.key === 'Delete' || e.key === 'Backspace'){
      e.preventDefault();
      if (selEdge){ breakEdge(selEdge); return; }
      if (selIds.size > 1){ deleteSelection(); return; }
      if (selNodeId) deleteNode(selNodeId);
      return;
    }
    if (e.key === 'Escape'){
      if (selIds.size){ clearMulti(); updateStatus(); return; }
      if (selEdge || selNodeId){ selectNode(null); render(); }
      return;
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'd' || e.key === 'D')){
      e.preventDefault();
      if (selNodeId) duplicateNode(selNodeId);
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
      e.preventDefault();
      if (selNodeId && typeof App !== 'undefined') App.startPlayFrom(selNodeId);
      return;
    }
    if (selNodeId && /^Arrow/.test(e.key)){
      const n = findNode(selNodeId);
      if (!n) return;
      const step = e.shiftKey ? 10 : 1;
      if (e.key === 'ArrowUp') n.y -= step;
      if (e.key === 'ArrowDown') n.y += step;
      if (e.key === 'ArrowLeft') n.x -= step;
      if (e.key === 'ArrowRight') n.x += step;
      e.preventDefault();
      const g = nodeG.querySelector(`[data-id="${n.id}"]`);
      if (g) g.setAttribute('transform', `translate(${n.x},${n.y})`);
      renderEdges(); drawChapters();
      App.markDirty();
    }
  }

  /* 多选状态下按 Delete：一次性删掉选中的卡片 */
  function deleteSelection(){
    const list = multiList();
    if (!list.length) return;
    ntConfirm(`删除选中的 ${list.length} 张卡片？指向它们的连线也会一并移除。`, () => {
      const ids = list.map(n => n.id);
      Engine.story.nodes = nodes().filter(x => ids.indexOf(x.id) < 0);
      ids.forEach(id => clearIncoming(id));
      if (ids.indexOf(Engine.story.startNode) >= 0){
        Engine.story.startNode = Engine.story.nodes[0] ? Engine.story.nodes[0].id : null;
      }
      clearMulti();
      selNodeId = null;
      render();
      if (typeof Inspector !== 'undefined') Inspector.showNode(null);
      App.markDirty();
    });
  }

  function deleteNode(id){    const n = findNode(id);
    if (!n) return;
    ntConfirm(`删除卡片「${n.title || n.id}」？指向它的连线也会一并移除。`, () => {
      Engine.story.nodes = nodes().filter(x => x.id !== id);
      clearIncoming(id);
      if (Engine.story.startNode === id) Engine.story.startNode = Engine.story.nodes[0] ? Engine.story.nodes[0].id : null;
      if (selNodeId === id) selNodeId = null;
      render();
      if (typeof Inspector !== 'undefined') Inspector.showNode(null);
      App.markDirty();
    });
  }

  function duplicateNode(id){
    const src = findNode(id);
    if (!src) return null;
    const c = Engine.story.meta.counters;
    const copy = JSON.parse(JSON.stringify(src));
    copy.id = 'nd_' + (++c.node);
    copy.x = src.x + 46;
    copy.y = src.y + 46;
    copy.title = (src.title || '未命名') + ' 副本';
    if (copy.type === 'quest' && copy.quest) copy.quest.id = 'q' + (++c.quest);
    nodes().push(copy);
    render();
    selectNode(copy.id);
    App.markDirty();
    return copy;
  }

  /* ---------- 缩放 ---------- */
  function zoomAt(factor, cx, cy){
    const r = svg.getBoundingClientRect();
    const z = uiZoom();
    const mx = (cx == null ? r.width / 2 : cx) / z;
    const my = (cy == null ? r.height / 2 : cy) / z;
    const old = view.scale;
    const ns = Math.min(2.5, Math.max(0.25, old * factor));
    view.x = mx - (mx - view.x) * (ns / old);
    view.y = my - (my - view.y) * (ns / old);
    view.scale = ns;
    applyView();
  }
  function onWheel(e){
    if (Engine.view !== 'editor') return;
    e.preventDefault();
    const r = svg.getBoundingClientRect();
    zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left, e.clientY - r.top);
  }

  function zoomReset(){ view.x = 40; view.y = 30; view.scale = 1; applyView(); }

  function zoomFit(){
    const ns = nodes().filter(n => !isHidden(n));
    if (!ns.length) return zoomReset();
    let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
    ns.forEach(n => {
      x1 = Math.min(x1, n.x); y1 = Math.min(y1, n.y);
      x2 = Math.max(x2, n.x + NODE_W); y2 = Math.max(y2, n.y + nodeHeight(n));
    });
    const r = svg.getBoundingClientRect();
    const z = uiZoom();
    const w = r.width / z, h = r.height / z;
    const pad = 70;
    const sc = Math.min(1.6, Math.max(0.25, Math.min((w - pad * 2) / (x2 - x1), (h - pad * 2) / (y2 - y1))));
    view.scale = sc;
    view.x = (w - (x2 - x1) * sc) / 2 - x1 * sc;
    view.y = (h - (y2 - y1) * sc) / 2 - y1 * sc;
    applyView();
  }

  /* 从「检查」结果里定位到某张卡片 */
  function focusNode(id){
    const n = findNode(id);
    if (!n) return;
    const r = svg.getBoundingClientRect();
    const z = uiZoom();
    view.x = r.width / 2 / z - (n.x + NODE_W / 2) * view.scale;
    view.y = r.height / 2 / z - (n.y + 30) * view.scale;
    applyView();
    selectNode(id);
  }

  /* ---------- 对外 ---------- */
  function addNode(type, opts){
    opts = opts || {};
    const c = Engine.story.meta.counters;
    const id = 'nd_' + (++c.node);
    let x = opts.x, y = opts.y;
    if (x == null || y == null){
      const r = svg.getBoundingClientRect();
      const z = uiZoom();
      x = (r.width / 2 / z - view.x) / view.scale - NODE_W / 2;
      y = (r.height / 2 / z - view.y) / view.scale - 32;
    }
    const n = ntMakeNode(type, id, x, y);
    if (type === 'quest' && !opts.questId) n.quest.id = 'q' + (++c.quest);
    n.chapter = opts.chapter !== undefined ? opts.chapter : (chapterFilter.length === 1 ? chapterFilter[0] : '');
    nodes().push(n);
    render();
    selectNode(id);
    App.markDirty();
    return n;
  }

  return {
    init, render, renderEdges, addNode, deleteNode, duplicateNode, selectNode, focusNode,
    zoomIn: () => zoomAt(1.25), zoomOut: () => zoomAt(0.8), zoomReset, zoomFit, findNode,
    getChapterFilter: () => chapterFilter,
    /* 多选：给自检与外部操作用 */
    getSelection: () => Array.from(selIds),
    setSelection: ids => { clearMulti(); (ids || []).forEach(id => { if (findNode(id)) selIds.add(id); }); syncMulti(); },
    clearSelection: () => { clearMulti(); updateStatus(); },
    chapterFromSelection
  };
})();
</script>
<script data-mod="inspector">'use strict';
/* ============ 检查器：节点属性 / 角色 / 立绘 / 地图 / 设置 / 全局 ============ */

const Inspector = (() => {
  let tab = 'node';
  let cur = null;          // 当前编辑的节点
  let mapTool = 1;         // 绘制工具：数字图块 或 'poi'
  let mapCell = 0;         // 地图格子像素（0 = 自动铺满面板宽度）
  let mapPainting = false;
  let mapUndo = [];        // 地图撤销栈
  let poiDraft = null;     // 正在放置的地点标注

  const body = () => $('panelBody');
  const story = () => Engine.story;

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g,
      c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  /* ---------- 路径解析 ----------
     'n'      → 当前节点
     'n.xxx'  → 当前节点的字段
     '@'      → 整个 story（顶层字段用）
     'meta.x' → story.meta.x，其余同理（相对 story） */
  function resolve(path){
    if (path == null || path === '') return undefined;
    const parts = String(path).split('.');
    let o;
    if (parts[0] === 'n'){ o = cur; parts.shift(); }
    else if (parts[0] === '@'){ o = story(); parts.shift(); }
    else o = story();
    for (let i = 0; i < parts.length; i++){
      if (o == null) return undefined;
      const p = parts[i];
      o = Array.isArray(o) ? o[+p] : o[p];
    }
    return o;
  }

  /* ---------- 下拉选项 ---------- */
  function opts(list, sel){
    return list.map(o => `<option value="${esc(o.v)}"${o.v == sel ? ' selected' : ''}>${esc(o.t)}</option>`).join('');
  }
  const attrOptions = () => (story().character.attributes || []).map(a => ({ v: a.id, t: a.name }));
  const skillOptions = () => (story().character.skills || []).map(s => ({ v: s.id, t: s.name }));
  const curOptions = () => {
    const c = story().character.currency;
    return c ? [{ v: c.id, t: c.name }] : [];
  };
  const itemOptions = () => (story().character.items || []).map(i => ({ v: i.id, t: i.name }));
  const equipOptions = () => (story().character.equipment || []).map(e => ({ v: e.id, t: e.name }));
  function questOptions(){
    const map = {};
    story().nodes.forEach(n => {
      if (n.type === 'quest' && n.quest && n.quest.id) map[n.quest.id] = n.quest.name || n.quest.id;
    });
    return Object.keys(map).map(k => ({ v: k, t: map[k] }));
  }
  const nodeOptions = () => story().nodes.map(n => ({
    v: n.id, t: `${(NT_NODE_TYPES[n.type] || { label: '?' }).label} · ${n.title || n.id}`
  }));
  const chapterOptions = () => (story().chapters || []).map(c => ({ v: c.id, t: c.name || '未命名' }));
  function nodeTitleOf(id){
    const n = story().nodes.find(x => x.id === id);
    return n ? `${n.title || n.id}` : null;
  }

  /* ---------- 初始化与标签页 ---------- */
  function init(){
    document.querySelectorAll('#panelTabs button').forEach(b => {
      b.addEventListener('click', () => setTab(b.dataset.tab));
    });
    body().addEventListener('input', onInput);
    body().addEventListener('change', onChange);
    body().addEventListener('click', onClick);
    window.addEventListener('mouseup', () => { mapPainting = false; });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && poiDraft){ poiDraft = null; rerender(); }
    });
    setTab('node');
  }

  function setTab(t){
    tab = t;
    document.querySelectorAll('#panelTabs button').forEach(b =>
      b.classList.toggle('active', b.dataset.tab === t));
    const panel = $('sidePanel');
    if (panel) panel.classList.toggle('wide', t === 'map');
    if (t === 'node') renderNodePanel();
    else if (t === 'char') renderCharPanel();
    else if (t === 'portrait') renderPortraitPanel();
    else if (t === 'map') renderMapPanel();
    else if (t === 'set') renderSetPanel();
    else renderGlobalPanel();
  }

  function showNode(n){
    if (!n) cur = null;
    else cur = story().nodes.find(x => x.id === n.id) || n;
    if (tab !== 'node') setTab('node');
    else renderNodePanel();
  }
  function refresh(){ setTab(tab); }
  function rerender(){
    const s = body().scrollTop;
    setTab(tab);
    body().scrollTop = s;
  }

  /* ---------- 事件：表单输入（不重建面板，避免丢焦点） ---------- */
  function onInput(e){
    const t = e.target;
    if (t.type === 'checkbox' || t.type === 'select-one' || t.type === 'radio') return;
    if (t.dataset.rich) richPreviewUpdate(t);
    if (t.dataset.f === 'volume01'){
      const s = story();
      s.settings.sfx.volume = Math.min(1, Math.max(0, (+t.value || 0) / 100));
      const lab = t.parentNode && t.parentNode.querySelector('.mini:last-child');
      if (lab) lab.textContent = t.value + '%';
      App.markDirty();
      return;
    }
    if (!writeField(t)) return;
    if (t.dataset.preview === 'cast'){
      const v = t.parentNode && t.parentNode.querySelector('.cast-xv');
      if (v) v.textContent = t.value + '%';
    }
    if (t.dataset.preview === 'casty'){
      const v = t.parentNode && t.parentNode.querySelector('.cast-yv');
      if (v) v.textContent = (t.value > 0 ? '+' : '') + t.value;
    }
    if (t.dataset.preview === 'casth'){
      const v = t.parentNode && t.parentNode.querySelector('.cast-hv');
      if (v) v.textContent = t.value + '%';
    }
    /* 头像裁切：拖动时只改预览图，不整页重绘（否则滑杆会掉焦点） */
    if (t.dataset.preview === 'avatar'){
      const box = t.closest('.ava-edit');
      if (box){
        const npc = story().npcs[+t.dataset.av];
        const img = box.querySelector('.ava-preview img');
        if (npc && img){
          ntEnsureAvatar(npc);
          img.setAttribute('style', ntAvatarStyle(npc));
          const zl = box.querySelector('.ava-zoomv'), xl = box.querySelector('.ava-xv'), yl = box.querySelector('.ava-yv');
          if (zl) zl.textContent = Math.round(npc.avatar.zoom * 100) + '%';
          if (xl) xl.textContent = Math.round(npc.avatar.x) + '%';
          if (yl) yl.textContent = Math.round(npc.avatar.y) + '%';
        }
      }
    }
    if (t.dataset.f === 'title' || t.dataset.f === 'text' || t.dataset.f === 'time') Editor.render();
    if (String(t.dataset.l || '').indexOf('character.') === 0) Editor.render();
    if (t.dataset.l === 'meta' && t.dataset.f === 'title'){
      const ti = $('storyTitleInput');
      if (ti) ti.value = t.value;
    }
    App.markDirty();
  }
  function onChange(e){
    const t = e.target;
    if (t.dataset.remindCfg){
      const c = App.remindConfig();
      const k = t.dataset.remindCfg;
      if (k === 'on') c.on = !!t.checked;
      else if (k === 'sound') c.sound = t.value;
      else c[k] = Math.max(1, +t.value || 1);
      App.setRemindConfig(c);
      rerender();
      return;
    }
    if (t.dataset.rcustom){ richApply({ dataset: { rt: t.dataset.rt, ract: t.dataset.rcustom, rv: t.value } }); return; }
    if (t.dataset.bonus){ applyBonus(t); return; }
    if (!writeField(t)) return;
    if (t.dataset.conn) Editor.render();
    if (t.dataset.f === 'chapter') Editor.render();
    if (t.dataset.l === '@' && t.dataset.f === 'startNode') Editor.render();
    if (t.dataset.rb) rerender();
    App.markDirty();
  }
  function writeField(t){
    const path = t.dataset.l;
    if (!path) return false;
    if (t.dataset.str !== undefined){
      const arr = resolve(path);
      if (!Array.isArray(arr)) return false;
      arr[+t.dataset.i] = t.value;
      return true;
    }
    const i = t.dataset.i;
    const base = resolve(path);
    if (base == null) return false;
    const obj = (i === undefined) ? base : base[+i];
    if (obj == null) return false;
    /* data-fx：数组元素内部的相对路径，例如 npcs[i] 的 card.fields[0].k */
    if (t.dataset.fx){
      const segs = String(t.dataset.fx).split('.');
      let o = obj;
      for (let k = 0; k < segs.length - 1; k++){
        const key = segs[k];
        if (o[key] == null) o[key] = /^\d+$/.test(segs[k + 1]) ? [] : {};
        o = o[key];
        if (o == null) return false;
      }
      o[segs[segs.length - 1]] = t.value;
      return true;
    }
    if (!t.dataset.f) return false;
    let val;
    if (t.type === 'checkbox') val = !!t.checked;
    else if (t.dataset.bool !== undefined) val = (t.value === 'true');
    else if (t.dataset.null !== undefined && t.value === '') val = null;
    else if (t.dataset.split !== undefined) val = t.value.split(/[，,]/).map(x => x.trim()).filter(Boolean);
    else if (t.dataset.num !== undefined) val = t.value.trim() === '' ? 0 : (parseFloat(t.value) || 0);
    else val = t.value;
    /* data-f 也支持 a.b 这种相对路径（比如物品的 use.kind） */
    if (String(t.dataset.f).indexOf('.') > 0){
      const segs = String(t.dataset.f).split('.');
      let o = obj;
      for (let k = 0; k < segs.length - 1; k++){
        const key = segs[k];
        if (o[key] == null) o[key] = /^\d+$/.test(segs[k + 1]) ? [] : {};
        o = o[key];
        if (o == null) return false;
      }
      o[segs[segs.length - 1]] = val;
      return true;
    }
    obj[t.dataset.f] = val;
    return true;
  }
  function applyBonus(sel){
    const v = sel.value;
    const val = v === 'none'
      ? { type: 'none', id: null }
      : { type: v.split(':')[0], id: v.split(':')[1] };
    const kind = sel.dataset.bonus;
    if (kind === 'atk' || kind === 'def'){
      if (!cur || !cur.battle) return;
      cur.battle[kind === 'atk' ? 'atkBonus' : 'defBonus'] = val;
    } else {
      if (!cur || !cur.check) return;
      cur.check.bonus = val;
    }
    Editor.render();
    rerender();
    App.markDirty();
  }

  /* ---------- 图片选择 ---------- */
  function pickImage(cb, maxSide, mode){
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    inp.addEventListener('change', () => {
      const f = inp.files && inp.files[0];
      if (f) ntImportImage(f, maxSide || 512, cb, mode);
    });
    inp.click();
  }

  /* 选一个音频文件转成 dataURL（内嵌进工程，导出不丢） */
  function pickAudio(cb){
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'audio/*';
    inp.addEventListener('change', () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      if (f.size > 400 * 1024){
        ntToast('音频太大了（' + Math.round(f.size / 1024) + 'KB）。打字音效建议 1 秒以内、40KB 以下。', 'warn');
        return;
      }
      const fr = new FileReader();
      fr.onload = () => { cb(String(fr.result)); ntToast('已导入音频：' + f.name); };
      fr.onerror = () => ntToast('音频读取失败', 'error');
      fr.readAsDataURL(f);
    });
    inp.click();
  }

  /* ---------- 事件：结构按钮 ---------- */
  function onClick(e){
    const rb = e.target.closest('[data-ract]');
    if (rb){ richApply(rb); return; }
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const act = btn.dataset.act;
    const path = btn.dataset.l;
    const i = btn.dataset.i;
    const c = story().meta.counters;
    const s = story();

    if (act === 'del'){
      const list = resolve(path);
      if (Array.isArray(list)) list.splice(+i, 1);
    } else if (act === 'add'){
      const list = resolve(path);
      if (!Array.isArray(list)) return;
      if (path.endsWith('.effects') || path === 'n.effects')
        list.push({ type: 'attr', id: (s.character.attributes[0] || {}).id || '', op: '+', value: 1 });
      else if (path.endsWith('.conditions'))
        list.push({ type: 'skill', id: (s.character.skills[0] || {}).id || '', op: '>=', value: 5 });
      else if (path.endsWith('attributes'))
        list.push({ id: 'attr_' + (++c.attr), name: '新属性', value: 10, max: 100, showInBar: false, alloc: false });
      else if (path.endsWith('skills'))
        list.push({ id: 'skill_' + (++c.skill), name: '新技能', value: 1, alloc: false });
      else if (path.endsWith('items'))
        list.push({ id: 'item_' + (++c.item), name: '新物品', desc: '' });
      else if (path.endsWith('equipment'))
        list.push({ id: 'eq_' + (++c.eq), name: '新装备', desc: '', slot: 'weapon', atk: 1, def: 0 });
      else if (path.endsWith('profileCats'))
        list.push({ id: 'cat_' + (++c.cat), name: '新类别', type: 'select', options: ['选项一'] });
      else if (path.endsWith('chapters'))
        list.push({ id: 'ch_' + (++c.ch), name: '新章节',
          color: ['#378ADD', '#EF9F27', '#D4537E', '#0F6E56', '#7F77DD', '#BA7517'][(c.ch - 1) % 6] });
      else if (path.endsWith('outcomes'))
        list.push({ next: null, weight: 50 });
      else if (path.endsWith('attackLines') || path.endsWith('hurtLines'))
        list.push('{enemy}……（-{dmg}）');
    } else if (act === 'addchoice'){
      if (cur && cur.choices) cur.choices.push({ text: '新选项', conditions: [], effects: [], next: null });
    } else if (act === 'delchoice'){
      if (cur && cur.choices) cur.choices.splice(+i, 1);
    } else if (act === 'npc-add'){
      s.npcs.push({ id: 'npc_' + (++c.npc), name: '新角色', portrait: null });
    } else if (act === 'npc-del'){
      s.npcs.splice(+i, 1);
    } else if (act === 'npc-up'){
      pickImage(data => { s.npcs[+i].portrait = data; App.markDirty(); rerender(); });
      return;
    } else if (act === 'npc-clear'){
      s.npcs[+i].portrait = null;
    } else if (act === 'alt-add'){
      const npc = s.npcs[+i];
      if (!npc) return;
      if (!Array.isArray(npc.alts)) npc.alts = [];
      const used = npc.alts.map(a => +a.k || 0);
      let k = 1;
      while (used.indexOf(k) >= 0) k++;
      npc.alts.push({ k: String(k), portrait: null, full: null });
      npc.alts.sort((a, b) => +a.k - +b.k);
    } else if (act === 'alt-del'){
      const npc = s.npcs[+i];
      if (npc) npc.alts = (npc.alts || []).filter(a => String(a.k) !== String(btn.dataset.k));
    } else if (act === 'alt-bust-up'){
      pickImage(data => {
        const npc = s.npcs[+i];
        const a = npc && (npc.alts || []).find(x => String(x.k) === String(btn.dataset.k));
        if (a){ a.portrait = data; App.markDirty(); rerender(); }
      });
      return;
    } else if (act === 'alt-full-up'){
      pickImage(data => {
        const npc = s.npcs[+i];
        const a = npc && (npc.alts || []).find(x => String(x.k) === String(btn.dataset.k));
        if (a){ a.full = data; App.markDirty(); rerender(); }
      }, 1100, { mime: 'image/webp', quality: 0.88 });
      return;
    } else if (act === 'sfx-test'){
      const cfg = ntSfxOf(s, null);
      if (cfg.typing === 'off') ntToast('当前是静音');
      else if (typeof Game !== 'undefined' && Game.previewSfx) Game.previewSfx(cfg);
      return;
    } else if (act === 'sfx-up'){
      pickAudio(data => {
        s.settings.sfx.data = data;
        s.settings.sfx.name = '自定义音频';
        if (s.settings.sfx.typing !== 'custom') s.settings.sfx.typing = 'custom';
        App.markDirty(); rerender();
      });
      return;
    } else if (act === 'sfx-clear'){
      s.settings.sfx.data = null;
      s.settings.sfx.name = '';
      if (s.settings.sfx.typing === 'custom') s.settings.sfx.typing = 'off';
    } else if (act === 'sfx-apply'){
      const mode = btn.dataset.v;
      sfxUndo = s.nodes.map(n => ({ id: n.id, sfx: n.sfx || '' }));
      const chap = cur ? cur.chapter : '';
      s.nodes.forEach(n => {
        if (mode === 'all' || mode === 'clear') n.sfx = '';
        else if (mode === 'chapter' && (n.chapter || '') === (chap || '')) n.sfx = '';
      });
      ntToast(mode === 'chapter' ? '本章卡片的音效已恢复跟随全局' : '全部卡片已恢复跟随全局音效');
    } else if (act === 'sfx-undo'){
      if (sfxUndo){
        sfxUndo.forEach(u => {
          const n = s.nodes.find(x => x.id === u.id);
          if (n) n.sfx = u.sfx || '';
        });
        sfxUndo = null;
        ntToast('已撤销');
      }
      return;
    } else if (act === 'gotab'){
      setTab(btn.dataset.v);
    } else if (act === 'remind-backup'){
      if (typeof App !== 'undefined') App.exportJSON();
      return;
    } else if (act === 'remind-test'){
      if (typeof App !== 'undefined' && App.remindTest) App.remindTest('这是一次演示提醒');
      return;
    } else if (act === 'remind-sound'){
      const c = (typeof App !== 'undefined' && App.remindConfig) ? App.remindConfig() : {};
      if (c.sound === 'off'){ ntToast('当前是静音，先在上面选一款提示音'); return; }
      if (typeof App !== 'undefined' && App.playRemindSound) App.playRemindSound(c.sound, c.volume);
      return;
    } else if (act === 'bt-enemy-up'){
      pickImage(data => {
        if (cur && cur.battle && cur.battle.enemy){ cur.battle.enemy.image = data; App.markDirty(); rerender(); }
      }, 900, { mime: 'image/webp', quality: 0.9 });
      return;
    } else if (act === 'bt-enemy-clear'){
      if (cur && cur.battle && cur.battle.enemy) cur.battle.enemy.image = null;    } else if (act === 'pc-add'){
      pickImage(data => { s.settings.charCreation.portraits.push(data); App.markDirty(); rerender(); });
      return;
    } else if (act === 'pc-del'){
      s.settings.charCreation.portraits.splice(+i, 1);
    } else if (act === 'cg-up'){
      if (!cur) return;
      pickImage(data => { cur.image = data; App.markDirty(); rerender(); }, 1400, { mime: 'image/webp', quality: 0.86 });
      return;
    } else if (act === 'cg-clear'){
      if (cur) cur.image = null;
    } else if (act === 'bt-resetlines'){
      if (cur && cur.battle){
        cur.battle.attackLines = ntBattleDefaultLines('attack');
        cur.battle.hurtLines = ntBattleDefaultLines('hurt');
      }
    } else if (act === 'maptool'){
      mapTool = btn.dataset.tool === 'poi' ? 'poi' : +btn.dataset.tool;
      poiDraft = null;
      rerender(); return;
    } else if (act === 'mapcell'){
      const cur = mapCell || cellPx();
      mapCell = Math.min(30, Math.max(12, cur + (+btn.dataset.d)));
      rerender(); return;
    } else if (act === 'mapundo'){
      if (mapUndo.length){
        s.settings.map.tiles = mapUndo.pop();
        App.markDirty(); rerender();
      } else ntToast('没有可撤销的绘制');
      return;
    } else if (act === 'mapsize'){
      const cols = Math.min(40, Math.max(6, parseInt(($('mapCols') || {}).value, 10) || 24));
      const rows = Math.min(30, Math.max(4, parseInt(($('mapRows') || {}).value, 10) || 14));
      const m = s.settings.map;
      if (cols === m.cols && rows === m.rows){ ntToast('尺寸没有变化'); return; }
      m.tiles = ntResizeTiles(m.tiles, cols, rows);
      m.cols = cols; m.rows = rows;
      m.pois = m.pois.filter(p => p.x < cols && p.y < rows);
      mapUndo = [];
      poiDraft = null;
      App.markDirty(); rerender(); return;
    } else if (act === 'mapclear'){
      ntConfirm('清空地图像素并删除全部地点标注？', () => {
        const m = s.settings.map;
        mapUndo.push(m.tiles.slice());
        m.tiles = Array.from({ length: m.rows }, () => '0'.repeat(m.cols));
        m.pois = [];
        poiDraft = null;
        App.markDirty(); rerender();
      });
      return;
    } else if (act === 'mapfill'){
      if (mapTool === 'poi'){ ntToast('请先选择一个图块'); return; }
      const m = s.settings.map;
      mapUndo.push(m.tiles.slice());
      m.tiles = Array.from({ length: m.rows }, () => String(mapTool).repeat(m.cols));
      App.markDirty(); rerender(); return;
    } else if (act === 'poisave'){
      const nm = ($('poiName') || {}).value || '';
      const nd = ($('poiNode') || {}).value || '';
      if (!nm.trim()){ ntToast('请填写地点名称', 'warn'); return; }
      const m = s.settings.map;
      if (poiDraft && poiDraft.edit !== undefined){
        const p = m.pois[poiDraft.edit];
        if (p){ p.name = nm.trim(); p.node = nd; }
      } else {
        m.pois.push({ id: 'poi_' + (++c.poi), x: poiDraft.x, y: poiDraft.y, name: nm.trim(), node: nd });
      }
      poiDraft = null;
      App.markDirty(); rerender(); return;
    } else if (act === 'poicancel'){
      poiDraft = null; rerender(); return;
    } else if (act === 'poi-del'){
      s.settings.map.pois.splice(+i, 1);
    } else if (act === 'theme'){
      s.settings.ui[btn.dataset.key] = btn.dataset.v;
      App.markDirty();
      rerender();
      return;
    } else if (act === 'loadtut'){
      ntConfirm('载入内置教程将覆盖当前内容（可先导出备份），继续？', () => App.loadTutorial());
      return;
    } else if (act === 'playhere'){
      if (cur) App.startPlayFrom(cur.id);
      return;
    } else if (act === 'delnode'){
      if (cur) Editor.deleteNode(cur.id);
      return;
    } else if (act === 'dupnode'){
      if (cur){ Editor.duplicateNode(cur.id); return; }
    } else if (act === 'newnext'){
      if (cur){
        const prev = cur;
        const n = Editor.addNode('story', { x: prev.x + 300, y: prev.y, chapter: prev.chapter });
        n.title = '后续剧情';
        if ('next' in prev) prev.next = n.id;
        Editor.render();
        Inspector.showNode(n);
        App.markDirty();
      }
      return;
    } else if (act === 'stage-toggle'){
      if (!cur) return;
      if (cur.stage) cur.stage = null;
      else cur.stage = ntDefaultStage();
      App.markDirty(); rerender();
      return;
    } else if (act === 'stage-bg-up'){
      if (!cur) return;
      if (!cur.stage) cur.stage = ntDefaultStage();
      pickImage(data => {
        const cn = story().meta.counters;
        cn.bg = (cn.bg || 0) + 1;
        const id = 'bg_' + cn.bg;
        story().settings.stage.bgs.push({ id: id, name: '背景 ' + cn.bg, image: data });
        cur.stage.bg = id;
        App.markDirty(); rerender();
        ntToast('已导入演出背景，并设为这张卡片的背景');
      }, 1600, { mime: 'image/webp', quality: 0.85 });
      return;
    } else if (act === 'stage-bg-del-current'){
      if (!cur || !cur.stage || !cur.stage.bg) return;
      const bgId = cur.stage.bg;
      ntConfirm('从背景库删除这张背景？用到它的卡片会变回「不设背景」。', () => {
        const list = story().settings.stage.bgs;
        const k = list.findIndex(b => b.id === bgId);
        if (k >= 0) list.splice(k, 1);
        story().nodes.forEach(x => { if (x.stage && x.stage.bg === bgId) x.stage.bg = null; });
        App.markDirty(); rerender();
      });
      return;
    } else if (act === 'stage-bg-add'){
      pickImage(data => {
        const cn = story().meta.counters;
        cn.bg = (cn.bg || 0) + 1;
        story().settings.stage.bgs.push({ id: 'bg_' + cn.bg, name: '背景 ' + cn.bg, image: data });
        App.markDirty(); rerender();
        ntToast('背景已加入背景库');
      }, 1600, { mime: 'image/webp', quality: 0.85 });
      return;
    } else if (act === 'stage-bg-del'){
      const bgId = btn.dataset.v;
      ntConfirm('删除背景「' + bgId + '」？用到它的卡片会变回「不设背景」。', () => {
        const list = story().settings.stage.bgs;
        const k = list.findIndex(b => b.id === bgId);
        if (k >= 0) list.splice(k, 1);
        story().nodes.forEach(x => { if (x.stage && x.stage.bg === bgId) x.stage.bg = null; });
        App.markDirty(); rerender();
      });
      return;
    } else if (act === 'stage-cast-add'){
      if (!cur) return;
      if (!cur.stage) cur.stage = ntDefaultStage();
      cur.stage.cast = cur.stage.cast || [];
      if (cur.stage.cast.length >= 4){ ntToast('最多 4 个出场立绘', 'warn'); return; }
      const npc = (story().npcs || [])[0];
      cur.stage.cast.push({ who: npc ? npc.id : NT_HERO_CAST, pos: cur.stage.cast.length ? 'right' : 'left' });
    } else if (act === 'stage-cast-del'){
      if (cur && cur.stage && Array.isArray(cur.stage.cast)) cur.stage.cast.splice(+i, 1);
    } else if (act === 'npc-card-edit'){
      openNpcCardEditor(+i);
      return;
    } else if (act === 'npc-full-up'){
      pickImage(data => {
        ntEnsureNpcCard(s.npcs[+i]);
        s.npcs[+i].card.full = data;
        App.markDirty(); rerender();
        ntToast('已上传全身立绘');
      }, 720);
      return;
    } else if (act === 'npc-full-clear'){
      ntEnsureNpcCard(s.npcs[+i]).full = null;
    } else if (act === 'npc-field-add'){
      ntEnsureNpcCard(s.npcs[+btn.dataset.n]).fields.push({ k: '新字段', v: '' });
    } else if (act === 'npc-field-del'){
      ntEnsureNpcCard(s.npcs[+btn.dataset.n]).fields.splice(+btn.dataset.fi, 1);
    } else if (act === 'theme-import'){
      openThemeImport('');
      return;
    } else if (act === 'theme-spec'){
      ntModal.open('主题包格式说明',
        `<div class="dim mini" style="margin-bottom:8px">照着这个格式写一个 JSON 就能导入。想省事就用「AI 提示词」让 AI 直接生成。</div>
         <div class="spec-doc">${esc(NT_THEME_PACK_DOC)}</div>`,
        [{ label: '关闭' }, { label: '复制 AI 提示词', cls: 'primary', keepOpen: true, fn: () => ntCopy(ntThemeAiPrompt()) }],
        { size: 'wide' });
      return;
    } else if (act === 'theme-prompt'){
      ntModal.open('让 AI 写一套主题',
        `<div class="dim mini" style="margin-bottom:8px">把下面整段提示词复制给任意 AI，它会输出一个可以直接导入的主题包 JSON。</div>
         <div class="spec-doc">${esc(ntThemeAiPrompt())}</div>`,
        [{ label: '关闭' }, { label: '复制提示词', cls: 'primary', keepOpen: true, fn: () => ntCopy(ntThemeAiPrompt()) }],
        { size: 'wide' });
      return;
    } else if (act === 'theme-export'){
      const pack = ntCustomThemes(story()).find(t => t.id === btn.dataset.v);
      if (!pack) return;
      const blob = new Blob([JSON.stringify(pack, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'theme-' + pack.id + '.json';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 3000);
      ntToast('已导出主题包：theme-' + pack.id + '.json');
      return;
    } else if (act === 'theme-del'){
      const id = btn.dataset.v;
      const pack = ntCustomThemes(story()).find(t => t.id === id);
      ntConfirm('删除自定义主题「' + (pack ? pack.name : id) + '」？已经用它的界面会切回「机能风」。', () => {
        const list = story().settings.customThemes;
        const k = list.findIndex(t => t.id === id);
        if (k >= 0) list.splice(k, 1);
        ['editor', 'player'].forEach(key => {
          if (story().settings.ui[key] === id) story().settings.ui[key] = 'cyber';
        });
        App.markDirty();
        App.refreshThemes();
        rerender();
        ntToast('已删除自定义主题');
      });
      return;
    }
    App.markDirty();
    rerender();
  }

  /* ---------- 通用块 ---------- */
  function field(label, inner, cls){
    return `<div class="f-field${cls ? ' ' + cls : ''}"><label>${label}</label>${inner}</div>`;
  }
  function textarea(path, i, f, val, ph){
    return `<textarea rows="4" data-l="${path}"${i === undefined ? '' : ` data-i="${i}"`} data-f="${f}" placeholder="${esc(ph || '')}">${esc(val)}</textarea>`;
  }
  function textInput(path, i, f, val, ph, num){
    return `<input data-l="${path}"${i === undefined ? '' : ` data-i="${i}"`} data-f="${f}" value="${esc(val)}" placeholder="${esc(ph || '')}"${num ? ' data-num type="number"' : ''}>`;
  }
  function select(path, i, f, val, options, extra){
    return `<select data-l="${path}"${i === undefined ? '' : ` data-i="${i}"`} data-f="${f}"${extra || ''}>${options}</select>`;
  }
  /* 连线选择器：比拖线更直观，二者都能用 */
  function connSelect(path, i, f, val, label){
    const self = cur ? cur.id : null;
    const list = story().nodes.filter(x => x.id !== self)
      .map(x => ({ v: x.id, t: `${(NT_NODE_TYPES[x.type] || { label: '?' }).label} · ${x.title || x.id}` }));
    return `<div class="f-field"><label>${label}</label>
      <select data-l="${path}"${i === undefined ? '' : ` data-i="${i}"`} data-f="${f}" data-conn="1" data-null="1">${opts([{ v: '', t: '— 未连接 —' }, ...list], val || '')}</select></div>`;
  }
  const dlgHint = `<div class="dim mini hint">文本里以【名字】开头的行会渲染成对话框；名字和「立绘」页的 NPC 一致时会显示立绘。选中文字后点上面的色块，可以只给这一段上色 / 加高亮 / 换字号。</div>`;

  /* ---------- 效果行 ---------- */
  function effectRow(e, path, i){
    const types = [
      { v: 'attr', t: '属性' }, { v: 'skill', t: '技能' },
      { v: 'currency', t: '货币' }, { v: 'item', t: '物品' }, { v: 'equip', t: '装备' }
    ];
    let ids = [], ops;
    if (e.type === 'attr'){ ids = attrOptions(); ops = [{ v: '+', t: '＋' }, { v: '-', t: '－' }, { v: '=', t: '＝' }]; }
    else if (e.type === 'skill'){ ids = skillOptions(); ops = [{ v: '+', t: '＋' }, { v: '-', t: '－' }, { v: '=', t: '＝' }]; }
    else if (e.type === 'currency'){ ids = curOptions(); ops = [{ v: '+', t: '＋' }, { v: '-', t: '－' }, { v: '=', t: '＝' }]; }
    else if (e.type === 'equip'){ ids = equipOptions(); ops = [{ v: 'add', t: '获得' }, { v: 'remove', t: '移除' }]; }
    else { ids = itemOptions(); ops = [{ v: 'add', t: '获得' }, { v: 'remove', t: '移除' }]; }
    if (!ids.length) ids = [{ v: e.id || '', t: '（请先在「角色」页定义）' }];
    return `<div class="f-row">
      ${select(path, i, 'type', e.type, opts(types, e.type), ' data-rb="1" style="max-width:62px"')}
      ${select(path, i, 'id', e.id, opts(ids, e.id))}
      ${select(path, i, 'op', e.op, opts(ops, e.op), ' style="max-width:56px"')}
      ${['item', 'equip'].includes(e.type) ? '' : textInput(path, i, 'value', e.value, '', true).replace('>', ' style="max-width:58px">')}
      <button class="row-del" data-act="del" data-l="${path}" data-i="${i}" title="删除这条效果">×</button>
    </div>`;
  }
  /* 可折叠的区块：默认收起，标题右侧显示条数，面板再长也不用一路滚 */
  function secBox(title, inner, open, count){
    const c = (count == null || count === '') ? '' : `<span class="cnt">${count}</span>`;
    return `<details class="p-sec"${open ? ' open' : ''}>
      <summary>${title}${c}</summary>
      <div class="p-sec-b">${inner}</div>
    </details>`;
  }
  function effectsBlock(label, path, list){
    const n = (list || []).length;
    const rows = (list || []).map((e, i) => effectRow(e, path, i)).join('') || '<div class="dim mini">（暂无）</div>';
    return secBox(label, rows + `<button class="add-mini" data-act="add" data-l="${path}">＋ 添加效果</button>`, false, n ? n + ' 条' : '空');
  }

  /* ---------- 条件行 ---------- */
  function numOps(){
    return [
      { v: '>=', t: '≥' }, { v: '<=', t: '≤' }, { v: '>', t: '＞' }, { v: '<', t: '＜' },
      { v: '==', t: '＝' }, { v: '!=', t: '≠' }
    ];
  }
  function condRow(c, path, i){
    const types = [
      { v: 'attr', t: '属性' }, { v: 'skill', t: '技能' }, { v: 'currency', t: '货币' },
      { v: 'item', t: '物品' }, { v: 'equip', t: '装备' }, { v: 'quest', t: '任务' }
    ];
    let ids = [], ops = [];
    if (c.type === 'attr'){ ids = attrOptions(); ops = numOps(); }
    else if (c.type === 'skill'){ ids = skillOptions(); ops = numOps(); }
    else if (c.type === 'currency'){ ids = curOptions(); ops = numOps(); }
    else if (c.type === 'item'){ ids = itemOptions(); ops = [{ v: 'has', t: '拥有' }, { v: 'no', t: '未拥有' }]; }
    else if (c.type === 'equip'){ ids = equipOptions(); ops = [{ v: 'has', t: '拥有' }, { v: 'no', t: '未拥有' }]; }
    else { ids = questOptions(); ops = [{ v: 'active', t: '进行中' }, { v: 'done', t: '已完成' }, { v: 'none', t: '未开始' }]; }
    if (!ids.length) ids = [{ v: c.id || '', t: '（请先定义）' }];
    return `<div class="f-row">
      ${select(path, i, 'type', c.type, opts(types, c.type), ' data-rb="1" style="max-width:62px"')}
      ${select(path, i, 'id', c.id, opts(ids, c.id))}
      ${select(path, i, 'op', c.op, opts(ops, c.op), ' style="max-width:66px"')}
      ${['item', 'equip', 'quest'].includes(c.type) ? '' : textInput(path, i, 'value', c.value, '', true).replace('>', ' style="max-width:58px">')}
      <button class="row-del" data-act="del" data-l="${path}" data-i="${i}" title="删除这条条件">×</button>
    </div>`;
  }
  function conditionsBlock(label, path, list){
    const n = (list || []).length;
    const rows = (list || []).map((c, i) => condRow(c, path, i)).join('') || '<div class="dim mini">（无条件：任何人都能看到这个选项）</div>';
    return secBox(label, rows + `<button class="add-mini" data-act="add" data-l="${path}">＋ 添加条件</button>`, false, n ? n + ' 条' : '无条件');
  }

  /* 字符串数组（战斗反馈文字等）：data-str 直接写数组元素 */
  function linesBlock(path, list){
    const rows = (list || []).map((line, i) => `<div class="f-row">
      <input data-l="${path}" data-i="${i}" data-str="1" value="${esc(line)}" placeholder="一句话，可用 {dmg}/{enemy}">
      <button class="row-del" data-act="del" data-l="${path}" data-i="${i}" title="删除这句">×</button>
    </div>`).join('') +
      `<button class="add-mini" data-act="add" data-l="${path}">＋ 添加一句</button>`;
    return rows;
  }

  /* ---------- 节点面板 ---------- */
  function renderNodePanel(){
    const b = body();
    if (!cur){
      b.innerHTML = `<div class="empty-hint">未选中卡片<br><small>双击画布里的卡片编辑属性<br>或点左侧「添加卡片」新建一张</small></div>`;
      return;
    }
    const n = cur;
    const t = NT_NODE_TYPES[n.type] || { label: n.type, color: '#888' };
    let h = `<div class="type-line" style="--tc:${t.color}"><span class="tag">${t.label}</span><span class="mono">${esc(n.id)}</span></div>`;
    h += `<button class="mini-btn primary play-here" data-act="playhere" title="从这张卡片开始试玩（跳过角色创建）">▶ 从此卡试玩</button>`;
    h += field('卡片标题（只显示在编辑器里）', textInput('n', undefined, 'title', n.title, '例如：雨夜开场'));
    const timeOn = story().settings.time && story().settings.time.enabled;
    h += `<div class="f-field"><label>章节 / 进入时消耗时间</label><div class="f-row">
      ${select('n', undefined, 'chapter', n.chapter || '', opts([{ v: '', t: '不归属章节' }, ...chapterOptions()], n.chapter || ''), ' style="flex:2"')}
      ${textInput('n', undefined, 'time', n.time == null ? '' : n.time, '分钟', true).replace('>', ' style="flex:1;max-width:84px" title="玩家进入这张卡片时消耗的分钟数">')}
    </div></div>${timeOn && n.time == null ? '<div class="dim mini warn-line">⚠ 时间功能已开启，但这张卡片没有设定耗时（按 0 分钟计）</div>' : ''}`;
    if (STAGE_NODE_TYPES.indexOf(n.type) >= 0 || n.type === 'cg') h += stageBlock(n);

    h += `<div class="f-field"><label>这张卡的打字音效</label>
      ${select('n', undefined, 'sfx', n.sfx || '', opts(
        [{ v: '', t: '跟随全局（设置页里改）' }].concat(NT_SFX_PRESETS.map(p => ({ v: p.v, t: p.t }))), n.sfx || ''),
        ' data-null="1" title="只对这一张卡片生效；选「静音」这张卡就不响"')}
      <div class="dim mini hint" style="margin-top:4px">只有演出模式与普通对话的打字会响；战斗里默认静音。</div></div>`;

    switch(n.type){
      case 'story':
        h += field('剧情文本（每行一段）', richInput('n', undefined, 'text', n.text, '玩家将看到的文字…', 5));
        h += dlgHint;
        h += effectsBlock('进入时生效的效果', 'n.effects', n.effects);
        h += connSelect('n', undefined, 'next', n.next, '继续到（下一张卡片）');
        break;

      case 'effect':
        h += field('说明文本（可留空）', richInput('n', undefined, 'text', n.text, '可选：显示一小段文字', 4));
        h += dlgHint;
        h += effectsBlock('数值变更', 'n.effects', n.effects);
        h += connSelect('n', undefined, 'next', n.next, '继续到（下一张卡片）');
        break;

      case 'choice': {
        h += field('引导文本（可留空）', richInput('n', undefined, 'text', n.text, '选项前的引导文字…', 4));
        h += dlgHint;
        h += field('条件不满足的选项', select('n', undefined, 'lockedMode', n.lockedMode, opts([
          { v: 'hide', t: '直接隐藏' }, { v: 'show', t: '灰显，悬停说明原因' }
        ], n.lockedMode)));
        h += `<div class="sec-title">选项列表（每个选项一条出线）</div>`;
        n.choices.forEach((ch, i) => {
          const pv = String(ch.text || '').replace(/\[(?:\/)?(?:c|hl|s)(?:=[^\]]*)?\]/g, '').replace(/\s+/g, ' ').trim();
          const conds = (ch.conditions || []).length;
          const effs = (ch.effects || []).length;
          h += `<details class="choice-block p-sec">
            <summary>选项 ${i + 1}<span class="pv">${esc(pv ? (pv.length > 16 ? pv.slice(0, 16) + '…' : pv) : '（还没写文字）')}</span>
              <span class="cnt">${conds ? conds + ' 条件 · ' : ''}${effs ? effs + ' 效果 · ' : ''}${ch.next ? '已接出线' : '无出线'}</span></summary>
            <div class="p-sec-b">

  /* ---------- 立绘面板 ---------- */
  /* ---------- 角色卡：用弹窗编辑，面板里只留一行 ---------- */
  let npcEditI = -1, npcEditBound = false;
  function bindNpcEditOnce(){
    if (npcEditBound) return;
    npcEditBound = true;
    /* 弹窗不在 #panelBody 里，委托得单独挂一份，否则弹窗里打字写不回数据 */
    $('modalBody').addEventListener('input', onInput);
    $('modalBody').addEventListener('change', onChange);
    $('modalBody').addEventListener('click', ev => {
      const btn = ev.target.closest('[data-mact]');
      if (!btn || npcEditI < 0) return;
      const npc = (story().npcs || [])[npcEditI];
      if (!npc) return;
      ntEnsureNpcCard(npc);
      const act = btn.dataset.mact;
      if (act === 'full-up'){
        const inp = document.createElement('input');
        inp.type = 'file'; inp.accept = 'image/*';
        inp.addEventListener('change', () => {
          const f = inp.files && inp.files[0];
          if (!f) return;
          ntImportImage(f, 900, url => {
            npc.card.full = url;
            App.markDirty();
            rerender();
            openNpcCardEditor(npcEditI);
          }, { mime: 'image/webp', quality: 0.9 });
        });
        inp.click();
      } else if (act === 'full-clear'){
        npc.card.full = null; App.markDirty(); rerender(); openNpcCardEditor(npcEditI);
