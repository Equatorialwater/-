/* ============================================================
   插图卡（CG）
   ============================================================ */
.cg-figure{margin:0 0 20px;text-align:center}
.cg-figure img{
  max-width:100%;max-height:46vh;display:block;margin:0 auto;cursor:zoom-in;
  border:1px solid var(--acc);background:var(--deep);
}
.cg-figure figcaption{margin-top:10px;color:var(--dim);font-size:12px;letter-spacing:2px}
.cg-empty{
  border:1px dashed var(--border);background:var(--panel2);color:var(--dim);
  padding:64px 20px;font-size:13px;letter-spacing:1px;
}
.cg-text{margin-top:18px}
.cg-viewer img{max-width:100%;max-height:72vh;display:block;margin:0 auto}
.cg-preview{border:1px solid var(--border);background:var(--deep);margin-bottom:8px;overflow:hidden}
.cg-preview img{display:block;width:100%;max-height:170px;object-fit:cover}
.cg-preview.empty{padding:26px 10px;text-align:center;color:var(--dim);font-size:12px;line-height:1.9}

.ui-cyber .cg-figure img{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
.ui-cream .cg-figure img{border-radius:12px;border:1px solid #e7dac4;box-shadow:0 14px 34px rgba(150,120,80,.18)}
.ui-cream .cg-empty{border-radius:12px;background:#fffdf7}
.ui-minimal .cg-figure img{border:1px solid #111}
.ui-minimal .cg-figure figcaption{letter-spacing:2px}
.ui-gilt .cg-figure img{
  border:1px solid rgba(201,168,106,.55);
  box-shadow:0 0 0 4px rgba(8,11,17,.7),0 0 0 5px rgba(201,168,106,.22);
}
.ui-gilt .cg-empty{border-color:rgba(201,168,106,.35);background:rgba(10,14,21,.6)}

/* ============================================================
   战斗卡（单卡回合制）
   ============================================================ */
/* 战斗面板：颜色全部走主题变量。
   想单独给某个主题（或自定义主题包）换一套战斗配色，只要覆盖
   --bt-bg / --bt-bg2 / --bt-border / --bt-txt / --bt-dim / --bt-line
   / --bt-btn-bg / --bt-btn-txt / --bt-hover / --bt-enemy / --bt-me 即可。 */
.battle{
  border:1px solid var(--bt-border, var(--acc));
  background:var(--bt-bg, var(--panel));
  color:var(--bt-txt, var(--txt));
  padding:16px 18px;display:flex;flex-direction:column;gap:12px;
  box-shadow:var(--bt-shadow, 0 14px 34px rgba(0,0,0,.28));
}
.bt-enemy{display:flex;gap:14px;align-items:center}
.bt-glyph{
  width:64px;height:64px;flex:none;display:grid;place-items:center;font-size:26px;font-weight:700;
  border:1px solid var(--bt-border, var(--acc));background:var(--bt-bg2, var(--deep));
  color:var(--bt-enemy, var(--red));
  overflow:hidden;border-radius:var(--radius-sm);position:relative;
}
/* 有立绘就用立绘（裁成方形、对齐头部），没有才退回名字首字 */
.bt-glyph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.bt-glyph.me{color:var(--bt-me, var(--green));border-color:var(--bt-me, var(--green));width:44px;height:44px;font-size:17px}
.bt-main{flex:1;min-width:0}
.bt-name{display:flex;justify-content:space-between;align-items:baseline;gap:10px;color:var(--bt-txt, var(--txt));font-size:15px;margin-bottom:6px}
.bt-hp{color:var(--bt-dim, var(--dim));font-size:12px}
.bt-bar{height:9px;background:var(--bt-bg2, var(--deep));border:1px solid var(--bt-line, var(--border));overflow:hidden}
.bt-bar i{display:block;height:100%;background:var(--bt-enemy, var(--red));transition:width .25s}
.bt-bar.me i{background:var(--bt-me, var(--green))}
.bt-player{border-top:1px dashed var(--bt-line, var(--border));padding-top:10px;display:flex;gap:10px;align-items:center}
.bt-player .bt-name{font-size:13px}
.bt-log{
  max-height:180px;overflow:auto;display:flex;flex-direction:column;gap:6px;
  padding:10px 12px;background:var(--bt-bg2, var(--deep));border:1px solid var(--bt-line, var(--border));
}
.bt-line{font-size:14px;line-height:1.75;color:var(--bt-txt, var(--txt));white-space:pre-line}
.bt-line.sys{color:var(--orange);font-size:12px;letter-spacing:1px}
.bt-line.atk{color:var(--cyan-soft)}
.bt-line.hurt{color:var(--red)}
.bt-line.win{color:var(--green)}
.bt-line.lose{color:var(--red)}
.bt-stats{color:var(--bt-dim, var(--dim));font-size:11px;letter-spacing:.5px}
.bt-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btlabels{margin-bottom:2px}
.btlabels span{flex:1;font-size:10px;letter-spacing:1px}
.bt-btn{
  background:var(--bt-btn-bg, var(--btn));border:1px solid var(--bt-border, var(--acc));
  color:var(--bt-btn-txt, var(--acc));
  padding:10px 26px;font-size:14px;cursor:pointer;letter-spacing:2px;
}
.bt-btn:hover:not(:disabled){border-color:var(--cyan);background:var(--bt-hover, var(--hov));color:var(--bt-txt, var(--txt))}
.bt-btn:disabled{opacity:.4;cursor:not-allowed}
/* 技能 / 道具列表：按钮里放两行文字 */
.bt-line-btn{
  display:flex;flex-direction:column;align-items:flex-start;gap:1px;
  min-width:150px;text-align:left;padding:7px 12px;
}
.btl-name{font-size:13.5px;letter-spacing:1px}
.btl-meta{font-size:10.5px;color:var(--bt-dim, var(--dim));letter-spacing:.5px}
.bt-line-btn:hover:not(:disabled) .btl-meta{color:var(--cyan-soft)}
.bt-back{margin-left:auto}
.bt-none{color:var(--bt-dim, var(--dim));font-size:12px;line-height:1.9;flex:1}
.ui-cyber .battle{clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%)}
.ui-cream .battle{border-radius:14px;background:#fffdf7;box-shadow:0 10px 26px rgba(150,120,80,.1)}
.ui-cream .bt-glyph,.ui-cream .bt-bar,.ui-cream .bt-log{border-radius:8px}
.ui-cream .bt-btn{border-radius:10px}
.ui-minimal .battle{border-color:#111;background:#fff}
.ui-minimal .bt-btn{border-color:#111;background:#fff;color:#111}
.ui-minimal .bt-btn:hover:not(:disabled){background:#111;color:#fff}
.ui-gilt .battle{border-color:rgba(201,168,106,.4);background:linear-gradient(180deg,rgba(22,29,42,.96),rgba(10,14,21,.96))}
.ui-gilt .bt-glyph{border-color:rgba(201,168,106,.5);color:#e0b25e;font-family:Georgia,"Songti SC",serif}
.ui-gilt .bt-bar{border-color:rgba(201,168,106,.25)}
.ui-gilt .bt-btn{border-color:rgba(201,168,106,.4);color:#e2d3a5;background:linear-gradient(180deg,#232c3d,#161d29)}



/* ============================================================
   演出（舞台）模式：背景 + 立绘 + 底部对话框
   —— 和普通的【名字】对话完全不同的版面：整幅背景 + 站位立绘 + 底部对话框
   ============================================================ */
#pStage{
  position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,var(--panel2),var(--deep));
}
#pStage .st-bg{
  position:absolute;inset:0;background-size:cover;background-position:center;
  background-repeat:no-repeat;transform:scale(1.02);
}
/* 插图卡：和演出背景共用同一块整屏版面（默认铺满，作者可改成 contain） */
#pStage .st-bg.cg{
  transform:none;background-size:cover;background-color:#05070a;
  box-shadow:inset 0 0 120px rgba(0,0,0,.75);
}
#pStage .st-zoom{
  position:absolute;right:18px;top:16px;z-index:4;pointer-events:auto;cursor:pointer;
  font:inherit;font-size:11px;letter-spacing:1px;padding:5px 10px;border-radius:3px;
  color:#dfe8ee;background:rgba(6,10,15,.72);border:1px solid rgba(255,255,255,.16);
}
#pStage .st-zoom:hover{background:rgba(6,10,15,.92);border-color:var(--cyan);color:var(--cyan)}
/* 插图卡右上角有「看大图」，把系统提示往下让一让，别叠在一起 */
#pMain.stage-on.stage-cg #pSys{top:56px}
#pStage .st-caption{
  position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:3;text-align:center;
  font-size:11px;letter-spacing:3px;color:rgba(255,255,255,.62);pointer-events:none;
  background:rgba(6,10,15,.55);padding:4px 12px;border-radius:3px;
}
#pStage .st-vignette{
  position:absolute;inset:0;
  background:radial-gradient(125% 95% at 50% 38%,transparent 42%,rgba(0,0,0,.55) 100%);
}
#pStage .st-cast{
  position:absolute;left:0;right:0;bottom:0;height:86%;
}
#pStage .st-actor{
  position:absolute;bottom:0;left:50%;
  height:100%;max-width:38%;
  display:flex;align-items:flex-end;justify-content:center;
  transform:translateX(-50%);
  transition:filter .35s ease,opacity .35s ease,transform .35s ease;
  will-change:transform,filter;
}
#pStage .st-actor img{
  max-height:100%;max-width:100%;object-fit:contain;
  filter:drop-shadow(0 16px 26px rgba(0,0,0,.55));
}
/* 说话的人前置、其余人隐退在后（RPG 常见的做法） */
#pStage .st-actor.dim{
  filter:brightness(.5) saturate(.6);
  opacity:.92;transform:translateX(-50%) scale(.95);z-index:1;
}
#pStage .st-actor.speaking{
  filter:brightness(1.08);transform:translateX(-50%) scale(1.02);z-index:3;
}
#pStage .st-actor.dim img{filter:drop-shadow(0 10px 18px rgba(0,0,0,.4))}
/* 战斗演出：敌人立绘摆正中间、往上抬一截，别被底下的战斗面板压住 */
#pStage .st-enemy-cast{height:62%;bottom:16%}
#pStage .st-enemy-cast .st-actor{max-width:42%;filter:drop-shadow(0 22px 34px rgba(0,0,0,.6))}
#pMain.stage-battle::after{background:linear-gradient(180deg,rgba(0,0,0,0) 44%,rgba(2,5,9,.18) 60%,rgba(2,5,9,.46) 78%,rgba(2,5,9,.72) 100%)}
#pStage img.npc-clickable{pointer-events:auto;cursor:pointer}
#pStage img.npc-clickable:hover{filter:drop-shadow(0 16px 26px rgba(0,0,0,.55)) brightness(1.08)}

#pMain.stage-on{display:flex;flex-direction:column;justify-content:flex-end;padding:0;overflow:hidden}
#pMain.stage-on #pNodeTag{
  position:absolute;left:22px;top:14px;z-index:3;margin:0;width:auto;max-width:72%;
  color:#eef4f8;letter-spacing:3px;padding:4px 11px;border-radius:3px;
  background:rgba(6,10,15,.66);border:1px solid rgba(255,255,255,.13);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);text-shadow:none;
}
.ui-cream #pMain.stage-on #pNodeTag,.ui-minimal #pMain.stage-on #pNodeTag,
.ui-ink #pMain.stage-on #pNodeTag,.ui-letter #pMain.stage-on #pNodeTag,
.ui-crayon #pMain.stage-on #pNodeTag{
  background:rgba(255,252,245,.88);border-color:rgba(0,0,0,.12);color:#3b3327;
}
#pMain.stage-on #pSys{
  position:absolute;right:24px;top:14px;z-index:3;margin:0;width:auto;max-width:56%;
  display:flex;flex-direction:column;align-items:flex-end;gap:3px;
}
#pMain.stage-on #pSys .sys-line{background:rgba(6,10,15,.8)}
#pMain.stage-on #pText{
  position:relative;z-index:2;width:auto;max-width:none;margin:0;
  padding:0 6% 54px;
  border:none;background:none;box-shadow:none;
  color:#eef4f8;text-shadow:0 2px 12px rgba(0,0,0,.9);
}
/* 文字区：不再画「对话框」，改成直接压在画面上的风格化文本 */
#pMain.stage-on .st-body{
  position:relative;max-height:clamp(126px,32vh,300px);overflow:hidden;
  padding:10px 2px 4px;
}
#pMain.stage-on .st-body p.st-nar{
  margin:0 0 10px;color:#e6edf4;font-family:var(--font-narr);
  font-size:16.5px;line-height:1.95;opacity:.94;text-shadow:0 1px 8px rgba(0,0,0,.65);
}
#pMain.stage-on .st-dlg{display:flex;align-items:flex-start;gap:11px;margin:0 0 12px}
#pMain.stage-on .st-ava{
  position:relative;flex:0 0 auto;width:46px;height:46px;overflow:hidden;display:block;
  border-radius:50%;border:1px solid rgba(255,255,255,.4);
  box-shadow:0 4px 14px rgba(0,0,0,.6);background:rgba(8,12,18,.7);
}
/* 框是圆的，里面的图自己裁：形状 + 缩放 + 取景都由 NPC 的「头像裁切」决定 */
#pMain.stage-on .st-ava img{width:100%;height:100%;max-width:none;object-fit:cover;display:block}
#pMain.stage-on .st-ava.shape-square{border-radius:3px}
#pMain.stage-on .st-ava.shape-tall{width:40px;height:54px;border-radius:5px}
#pMain.stage-on .st-say{min-width:0;flex:1}
#pMain.stage-on .st-name{
  display:inline-block;margin-bottom:3px;padding:1px 9px 2px;
  font-size:12px;letter-spacing:2px;color:var(--cyan);
  background:rgba(6,10,15,.6);border-radius:2px;border-left:2px solid var(--cyan);
}
#pMain.stage-on .st-text{color:#f2f6f9;font-size:17px;line-height:1.95;text-shadow:0 1px 8px rgba(0,0,0,.65)}
#pMain.stage-on .st-more{
  display:none;position:absolute;right:6%;bottom:48px;z-index:4;
  color:var(--cyan);font-size:13px;animation:blink 1.1s infinite;
  text-shadow:0 2px 8px #000;
}
#pMain.stage-on #pText.paged .st-more{display:block}
#pMain.stage-on #pText::after{display:none}
#pMain.stage-on .dlg-portrait{display:none}
#pMain.stage-on .dlg{align-items:stretch;gap:0;margin-bottom:14px}
#pMain.stage-on #pActions{
  position:relative;z-index:3;max-width:none;width:auto;margin:0 6% 16px;
  max-height:40vh;overflow:auto;gap:9px;justify-content:flex-end;
}
#pMain.stage-on #pActions .cont-btn{
  align-self:flex-end;background:rgba(10,15,21,.86);color:var(--cyan);
  border:1px solid var(--cyan);border-radius:3px;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
}
#pMain.stage-on #pActions .cont-btn:hover{background:var(--cyan);color:#06121a}
#pMain.stage-on .opt-btn{background:rgba(10,15,21,.86);color:#e9eef2;border-color:rgba(255,255,255,.22)}
#pMain.stage-on .opt-btn:hover:not(:disabled){background:rgba(10,15,21,.96);border-color:var(--cyan);color:#fff;transform:none}
#pMain.stage-on .ending-panel,#pMain.stage-on .check-panel,#pMain.stage-on .cg-figure{
  background:rgba(8,12,18,.9);
}
/* 舞台模式下面板浮在插画上，给它一点阴影就够 —— 配色仍然由主题决定，不再写死深底 */
#pMain.stage-on .battle{box-shadow:0 18px 44px rgba(0,0,0,.5)}
#pMain.stage-on .cg-figure{background:rgba(8,12,18,.9)}
/* 舞台模式下画面底部压一层暗，白字压在插画上也看得清（只压最后三分之一，别糊住立绘） */
#pMain.stage-on::after{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,0) 46%,rgba(2,5,9,.16) 62%,rgba(2,5,9,.48) 78%,rgba(2,5,9,.78) 92%,rgba(2,5,9,.86) 100%);
}

/* ============================================================
   NPC 角色卡（玩家端弹窗）
   ============================================================ */
.dlg-portrait img.npc-clickable{cursor:pointer;transition:filter .15s,transform .15s}
.dlg-portrait img.npc-clickable:hover{filter:brightness(1.12);transform:translateY(-1px)}
.npc-card{display:flex;gap:22px;align-items:flex-start}
.nc-figure{
  flex:0 0 236px;max-width:44%;padding:8px;background:var(--deep);
  border:1px solid var(--border);position:relative;
}
.nc-figure img{display:block;width:100%;max-height:58vh;object-fit:contain;margin:0 auto}
.nc-empty{color:var(--dim);font-size:12px;text-align:center;padding:70px 10px;line-height:1.9}
.nc-main{flex:1;min-width:0}
.nc-name{font-size:22px;color:var(--cyan);letter-spacing:5px;margin-bottom:6px;font-weight:600;line-height:1.3}
.nc-title{color:var(--dim);font-size:12px;letter-spacing:2px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.nc-intro{font-family:var(--font-narr);font-size:14.5px;line-height:2.05;color:var(--txt);margin-bottom:16px;white-space:pre-wrap}
.nc-fields{display:flex;flex-direction:column;border-top:1px solid var(--border)}
.nc-row{display:flex;gap:14px;padding:9px 2px;border-bottom:1px dashed var(--border)}
.nc-k{flex:0 0 92px;color:var(--cyan-soft);font-size:12.5px;letter-spacing:1px;line-height:1.7}
.nc-v{flex:1;font-size:13.5px;line-height:1.8;color:var(--txt);white-space:pre-wrap;word-break:break-word}
.nc-foot{margin-top:16px;color:var(--dim);font-size:11px;letter-spacing:3px}
@media (max-width:680px){
  .npc-card{flex-direction:column;gap:14px}
  .nc-figure{flex:none;max-width:100%;width:100%}
}
.ui-gilt .nc-figure{border-color:rgba(201,168,106,.45);box-shadow:inset 0 0 0 1px rgba(201,168,106,.15)}
.ui-gilt .nc-title{border-bottom-color:rgba(201,168,106,.28)}
.ui-gilt .nc-row{border-bottom-color:rgba(201,168,106,.18)}
.ui-cream .nc-figure{background:#fffdf7;border-color:#e7dac4;border-radius:12px}
.ui-crayon .nc-figure{border:3px solid #2b2b2b;border-radius:14px}

/* ============================================================
   编辑器：富文本工具栏 / 演出区块 / 角色卡编辑 / 主题管理
   ============================================================ */
.rich-bar{
  display:flex;flex-wrap:wrap;align-items:center;gap:6px;
  background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:6px 8px;margin:6px 0 0;
}
.rich-bar .rb-lab{font-size:10px;color:var(--dim);letter-spacing:1px;margin-right:2px}
.rich-bar .rb-sep{width:1px;height:16px;background:var(--border);margin:0 3px}
.rich-sw{
  width:20px;height:20px;border-radius:50%;border:1px solid var(--border);cursor:pointer;
  padding:0;position:relative;flex:none;
}
.rich-sw:hover{transform:scale(1.15);border-color:var(--cyan)}
.rich-sw.hl{border-radius:3px;background-image:linear-gradient(180deg,transparent 44%,var(--hl,currentColor) 44%,var(--hl,currentColor) 86%,transparent 86%)}
.rich-btn{
  background:var(--btn);border:1px solid var(--border);color:var(--txt);border-radius:var(--radius-sm);
  font-size:11px;padding:3px 8px;cursor:pointer;line-height:1.5;white-space:nowrap;
}
.rich-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.rich-btn.on{border-color:var(--cyan);color:var(--cyan)}
.rich-custom{width:24px;height:20px;padding:0;border:1px solid var(--border);border-radius:3px;background:none;cursor:pointer;flex:none}
.rich-hint{font-size:10px;color:var(--dim);line-height:1.7;margin-top:5px}
.rich-bar .rich-hint{flex-basis:100%;margin:1px 0 0}
.rich-preview{
  margin-top:6px;padding:10px 12px;border:1px dashed var(--border);border-radius:var(--radius-sm);
  background:var(--panel2);font-family:var(--font-narr);font-size:14px;line-height:1.95;color:var(--txt);
  max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-word;
}
.rich-preview:empty{display:none}
/* 预览收起：默认不占高度，点开才看 */
.rich-pv{margin-top:6px}
.rich-pv>summary{
  list-style:none;cursor:pointer;user-select:none;font-size:10px;letter-spacing:1px;
  color:var(--dim);padding:4px 0;
}
.rich-pv>summary::-webkit-details-marker{display:none}
.rich-pv>summary::before{content:'▸ ';font-size:9px}
.rich-pv[open]>summary::before{content:'▾ '}
.rich-pv>summary:hover{color:var(--cyan-soft)}

.stage-box{
  background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:10px 11px;margin-bottom:8px;
}
.stage-thumb{
  border:1px solid var(--border);background:var(--deep);overflow:hidden;margin:6px 0;
  aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;
}
.stage-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.stage-thumb.empty{color:var(--dim);font-size:11px;letter-spacing:1px}
.cast-row{display:flex;gap:6px;align-items:center;margin-bottom:5px}
.cast-row .cast-img{width:26px;height:34px;object-fit:cover;border:1px solid var(--border);background:var(--deep);flex:none}
.cast-row .cast-img.empty{display:grid;place-items:center;font-size:9px;color:var(--dim)}

.npc-card-edit{margin-top:6px;padding-top:8px;border-top:1px dashed var(--border)}
.npc-card-wrap{
  margin:-4px 0 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--panel2);
}
.npc-card-wrap>summary{
  cursor:pointer;padding:7px 10px;font-size:11.5px;color:var(--cyan-soft);letter-spacing:1px;
  user-select:none;line-height:1.6;
}
.npc-card-wrap>summary:hover{color:var(--cyan)}
.npc-card-wrap[open]>summary{border-bottom:1px solid var(--border)}
.npc-card-wrap .npc-card-edit{padding:8px 10px 10px;border-top:none;margin-top:0}
/* 角色卡弹窗里的「字段名 / 内容」两列 */
.nc-edit-main .field-row{display:flex;gap:5px;margin-bottom:5px}
.nc-edit-main .field-row input:first-child{flex:0 0 96px}
.nc-edit-main .field-row input:last-of-type{flex:1;min-width:0}
.nc-edit-main .field-row input{
  background:var(--panel2);border:1px solid var(--border);color:var(--txt);
  padding:6px 7px;font-size:12px;border-radius:var(--radius-sm);
}
.nc-edit-main .field-row input:focus{outline:none;border-color:var(--cyan)}
.npc-card-edit .field-row{display:flex;gap:5px;margin-bottom:4px}
.npc-card-edit .field-row input:first-child{flex:0 0 88px}
.npc-card-edit .field-row input:last-of-type{flex:1;min-width:0}
.npc-full-preview{
  height:120px;display:flex;align-items:center;justify-content:center;gap:10px;
  border:1px solid var(--border);background:var(--deep);margin-bottom:6px;
}
.npc-full-preview img{height:112px;width:auto;max-width:46%;object-fit:contain;display:block}
.npc-full-preview .dim{font-size:10px}

.theme-mgr{margin-top:8px}
.tm-row{
  display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:6px;
  border:1px solid var(--border);border-left:3px solid var(--cyan);background:var(--panel2);
}
.tm-main{flex:1;min-width:0}
.tm-name{font-size:12.5px;color:var(--cyan-soft);line-height:1.5;word-break:break-all}
.tm-desc{font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.5}
.tm-ops{display:flex;gap:4px;flex:none}
.tm-empty{font-size:11px;color:var(--dim);line-height:1.8}
.pack-ta{
  width:100%;min-height:230px;resize:vertical;background:var(--deep);border:1px solid var(--border);
  color:var(--txt);font-family:var(--font-mono);font-size:11.5px;line-height:1.6;padding:10px;border-radius:3px;
}
.spec-doc{
  white-space:pre-wrap;font-family:var(--font-mono);font-size:11.5px;line-height:1.75;
  color:var(--txt);background:var(--panel2);border:1px solid var(--border);padding:12px 14px;
  max-height:56vh;overflow:auto;border-radius:3px;
}
.spec-err{color:var(--red);font-size:12px;line-height:1.9;margin:8px 0;padding:8px 10px;
  border:1px solid rgba(255,123,114,.4);background:rgba(255,123,114,.06)}
.spec-ok{color:var(--green);font-size:12px;line-height:1.9;margin:8px 0}

/* ============================================================
   响应式
   ============================================================ */
#pText.creation{border:none!important;background:none!important;padding:0!important;min-height:0}
#pText.creation::before,#pText.creation::after{display:none!important}
@media (max-width:1180px){
  #sidePanel{width:340px}
  #nodeToolbar{width:124px}
}
@media (max-width:980px){
  #topbar{height:auto;padding:8px 12px;gap:8px}
  .title-input{width:150px}
  .brand{display:none}
  #pTitle{display:none}
  #pTop{gap:10px}
  #pStatus{order:3;width:100%;flex:0 0 100%}
}
@media (max-width:760px){
  #nodeToolbar{width:96px}
  .nt-grid{grid-template-columns:1fr}
  #sidePanel{width:300px}
  #panelTabs button{font-size:11px;padding:9px 0}
  .tb-group{border-left:none;padding-left:0}
  #pMenu{width:100%}
}

/* ============================================================
   HTML 载体的手感修补：画布/立绘上禁止选中文字与原生拖拽
   ============================================================ */
#canvasArea,#world,.node,#stageArea,#pStage,#panelBody img{
  -webkit-user-select:none;-moz-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}
#canvasArea img,.node img,#pStage img,#panelBody img{-webkit-user-drag:none;user-drag:none}
.node .head,.node .meta,.node .preview{cursor:default}

/* 立绘差分编辑 */
.alts-box{margin-top:10px;padding:8px 9px;border:1px dashed var(--border);border-radius:var(--radius-sm);background:rgba(255,255,255,.012)}
.alts-head{display:flex;align-items:baseline;gap:8px;font-size:11px;letter-spacing:1px;color:var(--cyan);margin-bottom:6px}
.alts-head .mini{font-size:10px;letter-spacing:0}
.alt-row{display:flex;align-items:center;gap:5px;margin-bottom:4px}
.alt-k{flex:0 0 18px;text-align:center;color:var(--cyan-soft);font-size:11px}
.alt-thumb{flex:0 0 30px;height:34px;display:flex;align-items:center;justify-content:center;background:var(--deep);border:1px solid var(--border);overflow:hidden}
.alt-thumb img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.alt-row .mini-btn{padding:3px 7px;font-size:10.5px}

/* 立绘站位滑杆 */
.cast-main{flex:1;min-width:0}
.cast-x{display:flex;align-items:center;gap:6px;margin-top:3px}
.cast-x input[type=range]{
  flex:1;min-width:0;height:3px;-webkit-appearance:none;appearance:none;
  background:var(--border);border-radius:2px;outline:none;
}
.cast-x input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:11px;height:11px;border-radius:50%;
  background:var(--cyan);cursor:pointer;border:none;
}
.cast-x input[type=range]::-moz-range-thumb{width:11px;height:11px;border:none;border-radius:50%;background:var(--cyan);cursor:pointer}
.cast-xv,.cast-yv,.cast-hv{flex:0 0 34px;text-align:right;font-size:10px;color:var(--dim)}

/* 设置页：打字音效 */
.sfx-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.sfx-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sfx-acts .mini-btn{flex:1 1 auto;min-width:96px}

/* 节点面板：敌人立绘 */
.enemy-thumb{width:74px;height:74px;object-fit:contain;background:var(--deep);border:1px solid var(--border);border-radius:var(--radius-sm);display:block}
.enemy-thumb.empty{display:flex;align-items:center;justify-content:center;font-size:9.5px;color:var(--dim)}
</style>
</head>
<body>
<div id="app" class="ui-cyber">

  <!-- ==================== 编辑器 ==================== -->
  <div id="editorView">
    <header id="topbar">
      <div class="brand">那什么的文游编辑器<small></small></div>
      <input id="storyTitleInput" class="title-input" placeholder="未命名游戏" title="游戏标题（自动保存）">
      <button id="saveState" class="save-state ok" title="点击立即保存（Ctrl+S）">已保存</button>
      <select id="uiScaleSel" class="ui-scale" title="界面大小（只影响本机显示）"></select>
      <select id="editorThemeSel" class="theme-sel" title="编辑器外观（只影响编辑器，游戏内 UI 在设置里选）"></select>
      <div class="spacer"></div>
      <div class="tb-group">
        <button id="btnNew" class="tb-btn" title="新建空白工程">新建工程</button>
        <button id="btnImport" class="tb-btn" title="导入 story.json 工程文件">导入工程</button>
        <button id="btnExport" class="tb-btn" title="导出 story.json 工程文件">导出工程</button>
        <button id="btnExportGame" class="tb-btn" title="导出可直接游玩的单文件 HTML">导出游戏</button>
      </div>
      <button id="btnCheck" class="tb-btn icon" title="检查故事结构">检查</button>
      <button id="btnHelp" class="tb-btn icon" title="帮助与快捷键">?</button>
      <button id="btnPlay" class="tb-btn primary">▶ 试玩</button>
    </header>

    <div id="editorMain">
      <aside id="nodeToolbar">
        <div class="nt-label">添加卡片</div>
        <div class="nt-grid">
          <button class="nt-btn" data-add="story" title="一段旁白 / 对话"><span class="dot"></span>剧情</button>
          <button class="nt-btn" data-add="choice" title="给玩家几个选项"><span class="dot"></span>选项</button>
          <button class="nt-btn" data-add="check" title="掷骰子判定成功 / 失败"><span class="dot"></span>检定</button>
          <button class="nt-btn" data-add="effect" title="只改数值的一步"><span class="dot"></span>数值</button>
          <button class="nt-btn" data-add="quest" title="开始 / 更新 / 完成任务"><span class="dot"></span>任务</button>
          <button class="nt-btn" data-add="ending" title="一个结局"><span class="dot"></span>结局</button>
          <button class="nt-btn" data-add="jump" title="不连线，直接跳到某张卡"><span class="dot"></span>跳转</button>
          <button class="nt-btn" data-add="random" title="按权重随机分支"><span class="dot"></span>随机</button>
          <button class="nt-btn" data-add="cg" title="导入一张 CG 插图"><span class="dot"></span>插图</button>
          <button class="nt-btn" data-add="battle" title="单卡回合制战斗（可录入敌人）"><span class="dot"></span>战斗</button>
        </div>
        <div class="nt-label">章节筛选</div>
        <div id="chapterFilter" class="cf">
          <button id="cfBtn" class="cf-btn" type="button" title="勾选要显示的章节；「全选」点两下可以全不选">全部章节 <span class="cf-caret">▾</span></button>
          <div id="cfMenu" class="cf-menu hidden">
            <button id="cfAll" class="cf-all" type="button">全选</button>
            <div id="cfList"></div>
          </div>
        </div>
        <div class="nt-label">画布视图</div>
        <div class="nt-row">
          <button class="nt-btn sm" id="zoomOut" title="缩小">－</button>
          <button class="nt-btn sm" id="zoomIn" title="放大">＋</button>
        </div>
        <div class="nt-row" style="margin-top:5px">
          <button class="nt-btn sm" id="zoomFit" title="适应全部卡片">适应</button>
          <button class="nt-btn sm" id="zoomReset" title="恢复 100% 并回到左上角">100%</button>
        </div>
      </aside>

      <div id="canvasWrap">
        <svg id="canvas"></svg>
        <div id="canvasHint">滚轮缩放 · 拖空白平移 · 双击卡片编辑 · Shift 拖空白框选 · 拖右侧圆点连线 · Delete 删除</div>
        <div id="selBar" class="hidden">
          <span class="sb-count">已选 0 张</span>
          <button class="sel-btn" data-sel="chapter">用这些卡片建章节</button>
          <button class="sel-btn" data-sel="clear">取消选择</button>
        </div>
        <div id="remindBar" class="hidden">
          <span id="remindText">建议导出一份工程备份</span>
          <button class="sel-btn" data-remind="backup">导出工程备份</button>
          <button class="sel-btn" data-remind="later">稍后再说</button>
        </div>
      </div>

      <aside id="sidePanel">
        <div id="panelTabs">
          <button data-tab="node" class="active" title="当前卡片属性">节点</button>
          <button data-tab="char" title="属性 / 技能 / 货币 / 物品">角色</button>
          <button data-tab="portrait" title="NPC 与主角立绘">立绘</button>
          <button data-tab="map" title="绘制地图与地点标注">地图</button>
          <button data-tab="set" title="立绘 / 时间 / 主题 / 章节">设置</button>
          <button data-tab="global" title="标题 / 开始节点 / 角色创建">全局</button>
        </div>
        <div id="panelBody"></div>
      </aside>
    </div>

    <footer id="statusbar">
      <span id="sbNodes">卡片 0</span>
      <span id="sbChapters">章节 0</span>
      <span id="sbSel">未选中</span>
      <span id="sbIssues" class="sb-issues ok"></span>
      <div class="spacer"></div>
      <span id="sbSize" title="工程体积（图片占大头）。超过 3MB 会自动改用浏览器数据库保存。">工程 0KB</span>
      <span id="sbZoom">100%</span>
    </footer>
  </div>

  <!-- ==================== 播放器 ==================== -->
  <div id="playerView" class="hidden">
    <div id="pTop">
      <div id="pTitle" class="mono"></div>
      <div id="pAvatar"></div>
      <div id="pStatus" class="mono"></div>
      <div id="pMenu">
        <button class="p-btn" data-menu="quest">任务</button>
        <button class="p-btn" data-menu="char">角色</button>
        <button class="p-btn" data-menu="bag">背包</button>
        <button class="p-btn" data-menu="map" id="mBtnMap">地图</button>
        <button class="p-btn" data-menu="gallery">图鉴</button>
        <button class="p-btn" data-menu="save">存档</button>
        <button class="p-btn ghost" id="btnUiScale" title="界面大小">Aa</button>
        <span class="p-div"></span>
        <button class="p-btn ghost" id="btnBackEditor" title="退出试玩，回到编辑器">✕</button>
      </div>
    </div>
    <div id="pMain">
      <div id="pStage" class="hidden"></div>
      <div id="pNodeTag" class="mono"></div>
      <div id="pSys" class="mono"></div>
      <div id="pText"></div>
      <div id="pActions"></div>
    </div>
    <div id="scan"></div>
  </div>

  <!-- ==================== 通用弹窗 ==================== -->
  <div id="modalRoot" class="hidden">
    <div id="modalBox">
      <div id="modalHead">
        <div id="modalTitle" class="mono"></div>
        <button id="modalClose" title="关闭（Esc）">✕</button>
      </div>
      <div id="modalBody"></div>
      <div id="modalBtns"></div>
    </div>
  </div>
  <div id="toastRoot"></div>
  <input type="file" id="fileInput" accept=".json,application/json" class="hidden">
</div>

<script data-mod="data">'use strict';
/* ============ 数据层：节点类型 / 数据工厂 / 内置模板 / 立绘占位 ============ */

function $(id){ return document.getElementById(id); }

/* 应用信息（帮助页 / 品牌 / 导出元信息共用） */
const NT_APP = {
  name: '那什么的文游编辑器',
  version: 'v1.1',
  author: 'ALLESI',
  qq: '256085698'
};

/* 全部界面风格（编辑器外观 / 游戏内 UI 共用这份清单） */
const NT_THEMES = [
  { v: 'cyber',    t: '机能风',     d: '霓虹暗色' },
  { v: 'cream',    t: '奶油风',     d: '暖白圆润' },
  { v: 'minimal',  t: '极简风',     d: '黑白利落' },
  { v: 'gilt',     t: '鎏金风',     d: '深蓝金线' },
  { v: 'tactical', t: '战术终端风', d: '黑黄警示' },
  { v: 'moonblue', t: '月蓝学院风', d: '深蓝青辉' },
  { v: 'rebel',    t: '红黑叛逆风', d: '黑红涂鸦' },
  { v: 'ink',      t: '水墨古风',   d: '宣纸墨色' },
  { v: 'letter',   t: '古典书信风', d: '羊皮信笺' },
  { v: 'crayon',   t: '蜡笔涂鸦风', d: '童趣手绘' }
];
const NT_THEME_IDS = NT_THEMES.map(x => x.v);

/* ============ 主题注册表（内置 + 作者导入的自定义主题） ============ */
function ntCustomThemes(story){
  const s = story && story.settings;
  return (s && Array.isArray(s.customThemes)) ? s.customThemes : [];
}
/* 完整主题清单：设置页的主题卡片、顶栏「编辑外观」都读这里 */
function ntAllThemes(story){
  const out = NT_THEMES.map(t => ({ v: t.v, t: t.t, d: t.d, custom: false }));
  ntCustomThemes(story).forEach(t => out.push({
    v: t.id, t: t.name || t.id, d: t.desc || '自定义主题', custom: true
  }));
  return out;
}
function ntThemeDef(id, story){
  return ntAllThemes(story).find(t => t.v === id) || null;
}
function ntThemeName(id, story){
  const t = ntThemeDef(id, story);
  return t ? t.t : id;
}
function ntIsCustomTheme(id, story){
  return ntCustomThemes(story).some(t => t.id === id);
}

/* ============ 富文本：文字颜色 / 高亮 / 字号（Word 式预设） ============
   标记语法（不会执行 HTML，交给解析器逐段渲染）：
     [c=#ff6600]橙色文字[/c]      自定义颜色（也支持工具栏里的主题色预设）
     [hl=#ff9e2c]高亮文字[/hl]    荧光笔式高亮（下半条底色，不吞掉文字本色）
     [s=1.18]大一号的字[/s]       字号倍率（相对正文）
   只有 c / hl / s 三种标签；写错或未闭合的标签会原样显示，不会丢字。 */
const NT_RICH_KINDS = ['c', 'hl', 's'];

/* 字号预设（十套主题共用，保证排版一致） */
const NT_TEXT_SIZES = [
  { t: '小', v: 0.86 },
  { t: '正常', v: 1 },
  { t: '大', v: 1.18 },
  { t: '特大', v: 1.42 }
];

/* 每套主题自己的配色预设（[名称, 色值]）；导入的自定义主题可覆盖 */
const NT_TEXT_PRESETS_RAW = {
  cyber: {
    colors: [['霓虹青', '#00d9ff'], ['警示橙', '#ff9e2c'], ['警报红', '#ff7b72'], ['荧光绿', '#56d364'], ['幻紫', '#b7a6ff']],
    highlights: [['青色荧光', '#00d9ff'], ['橙色荧光', '#ff9e2c'], ['品红荧光', '#ff5fa2']]
  },
  cream: {
    colors: [['赭石', '#b0703f'], ['蜂蜜', '#c07f2e'], ['陶红', '#b3604f'], ['苔绿', '#6f8f57'], ['紫藤', '#97799e']],
    highlights: [['奶油黄', '#f0c96a'], ['浅杏', '#e8a97e'], ['藕粉', '#e0a0a0']]
  },
  minimal: {
    colors: [['纯黑', '#111111'], ['链接蓝', '#0a6cff'], ['警示红', '#d0021b'], ['中灰', '#7a7a7a'], ['琥珀', '#a86800']],
    highlights: [['浅灰', '#d8d8d8'], ['浅蓝', '#cfe3ff'], ['浅黄', '#ffeaa0']]
  },
  gilt: {
    colors: [['鎏金', '#d4b878'], ['暖金', '#e0b25e'], ['朱砂', '#c0604e'], ['青瓷', '#8fb3cf'], ['象牙', '#efe6cf']],
    highlights: [['金粉', '#d4b878'], ['暗金', '#a8792f'], ['绛红', '#a4402f']]
  },
  tactical: {
    colors: [['警示黄', '#f5c400'], ['熔岩橙', '#ff5a00'], ['战术绿', '#9dff3c'], ['骨白', '#e6e2cc'], ['警戒红', '#ff3b30']],
    highlights: [['黄色荧光', '#f5c400'], ['橙色荧光', '#ff8a00'], ['绿色荧光', '#7ee02a']]
  },
  moonblue: {
    colors: [['月华青', '#4fd7f2'], ['冰蓝', '#8ff0ff'], ['星芒粉', '#ff9ec4'], ['暖阳金', '#ffe08a'], ['夜紫', '#b7a6ff']],
    highlights: [['青色荧光', '#4fd7f2'], ['粉色荧光', '#ff9ec4'], ['金色荧光', '#ffe08a']]
  },
  rebel: {
    colors: [['革命红', '#e60012'], ['墨黑', '#111111'], ['电光蓝', '#1f6feb'], ['炭灰', '#6b6b6b'], ['荧光绿', '#00b34a']],
    highlights: [['红色荧光', '#ff5b5b'], ['黄色荧光', '#ffd93b'], ['蓝色荧光', '#9ecbff']]
  },
  ink: {
    colors: [['朱砂', '#9e2b22'], ['浓墨', '#2a2620'], ['石青', '#4a6a7a'], ['松绿', '#4a6a52'], ['赭石', '#a0792a']],
    highlights: [['藤黄', '#e0c060'], ['胭脂', '#d99a9a'], ['石绿', '#a8c4a0']]
  },
  letter: {
    colors: [['火漆红', '#a8442f'], ['牛皮棕', '#8b5e34'], ['墨褐', '#4a3820'], ['橄榄', '#6f7a4a'], ['灰紫', '#7a6a8a']],
    highlights: [['羊皮黄', '#e8cf9a'], ['淡褐', '#d6bb95'], ['玫瑰灰', '#dbb0a4']]
  },
  crayon: {
    colors: [['蜡笔红', '#e94f37'], ['蜡笔蓝', '#2f6fdb'], ['草绿', '#3fa34d'], ['橘黄', '#f7a325'], ['葡萄紫', '#8a5ad0']],
    highlights: [['亮黄', '#ffe066'], ['水蓝', '#a8d8ff'], ['蜜桃', '#ffc2a8']]
  }
};
function ntPresetList(pairs){
  return (pairs || []).map(p => ({ t: String(p[0] == null ? '' : p[0]), v: String(p[1] == null ? '' : p[1]) }));
}
/* 当前主题的文字预设（自定义主题可带自己的 textPresets） */
function ntTextPresets(themeId, story){
  const ct = ntCustomThemes(story).find(t => t.id === themeId);
  if (ct && ct.textPresets && (ct.textPresets.colors || ct.textPresets.highlights)){
    const c = ct.textPresets.colors || [];
    const h = ct.textPresets.highlights || [];
    if (c.length || h.length) return { colors: c, highlights: h };
  }
  const raw = NT_TEXT_PRESETS_RAW[themeId] || NT_TEXT_PRESETS_RAW.cyber;
  return { colors: ntPresetList(raw.colors), highlights: ntPresetList(raw.highlights) };
}

/* ---------- 富文本解析 ---------- */
function ntRichHex(v){
  return /^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/.test(String(v || '')) ? String(v) : null;
}
function ntRichSize(v){
  const n = parseFloat(v);
  if (!isFinite(n) || n < 0.5 || n > 3) return null;
  return String(Math.round(n * 100) / 100);
}
/* 把一段文字切成 [{t,c,bg,s}]；非法/未闭合标签按普通文字保留 */
function ntParseRich(text){
  const src = String(text == null ? '' : text);
  const runs = [];
  const stack = [];
  let buf = '';
  const styleNow = () => {
    const st = { c: null, bg: null, s: null };
    for (let i = 0; i < stack.length; i++){
      if (stack[i].k === 'c') st.c = stack[i].v;
      else if (stack[i].k === 'hl') st.bg = stack[i].v;
      else st.s = stack[i].v;
    }
    return st;
  };
  const flush = () => {
    if (!buf) return;
    const st = styleNow();
    runs.push({ t: buf, c: st.c, bg: st.bg, s: st.s });
    buf = '';
  };
  const re = /\[(c|hl|s)=([^\[\]\s]{1,32})\]|\[\/(c|hl|s)\]/g;
  let last = 0, m;
  while ((m = re.exec(src))){
    buf += src.slice(last, m.index);
    last = re.lastIndex;
    if (m[1]){
      const v = (m[1] === 's') ? ntRichSize(m[2]) : ntRichHex(m[2]);
      if (v == null){ buf += m[0]; continue; }
      flush();
      stack.push({ k: m[1], v: v });
    } else {
      const k = m[3];
      let idx = -1;
      for (let i = stack.length - 1; i >= 0; i--){ if (stack[i].k === k){ idx = i; break; } }
      if (idx < 0){ buf += m[0]; continue; }
      flush();
      stack.splice(idx, 1);
    }
  }
  buf += src.slice(last);
  flush();
  if (!runs.length) runs.push({ t: '', c: null, bg: null, s: null });
  return runs;
}
/* #rgb / #rrggbb → rgba(...)，高亮用半透明荧光笔效果 */
function ntRgba(hex, a){
  let h = String(hex || '').replace('#', '');
  if (h.length === 3 || h.length === 4) h = h.slice(0, 3).split('').map(c => c + c).join('');
  if (!/^[0-9a-fA-F]{6}$/.test(h)) return 'rgba(255,255,255,' + (a == null ? 1 : a) + ')';
  const n = parseInt(h, 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + (a == null ? 1 : a) + ')';
}
/* 一个 run 的内联样式（运行时与编辑器预览共用，保证「所见即所得」）
   —— 高亮用「荧光笔」横条，但位置/粗细必须用 em 而不是百分比：
      百分比是相对每个 span 自己的内容框高度算的，遇到 [s=1.42] 这种大字号，
      内容框被撑高、基线位置不变，横条就会整体上移且变粗，和正常字号对不齐。
      改成 em 定位后，横条始终在基线下同一位置、粗细随字号等比缩放。
      line-height:1 是为了防止「字号 1.42 继承 line-height:2」把整行撑高。 */
function ntRunStyle(r){
  const out = [];
  if (r.c) out.push('color:' + r.c);
  if (r.bg){
    const col = ntRgba(r.bg, 0.62);
    out.push('background-image:linear-gradient(180deg,transparent .64em,' + col + ' .64em,' + col + ' 1.08em,transparent 1.08em)');
    out.push('-webkit-box-decoration-break:clone');
    out.push('box-decoration-break:clone');
  }
  if (r.s){
    out.push('font-size:' + r.s + 'em');
    out.push('line-height:1');
  }
  return out.join(';');
}
/* 编辑器预览用：把富文本转成安全的 HTML 字符串 */
function ntRichHtml(text){
  const E = s => String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  return ntParseRich(text).map(r => {
    const st = ntRunStyle(r);
    return st ? '<span style="' + st + '">' + E(r.t) + '</span>' : E(r.t);
  }).join('');
}

/* ============ NPC 角色卡 ============ */
/* portrait = 对话里的小立绘（胸像）；card.full = 角色卡里的全身立绘 */
function ntDefaultNpcCard(){
  return { title: '', full: null, intro: '', fields: [] };
}
function ntEnsureNpcCard(npc){
  if (!npc) return null;
  const c = npc.card = Object.assign(ntDefaultNpcCard(), npc.card || {});
  if (typeof c.title !== 'string') c.title = '';
  if (typeof c.intro !== 'string') c.intro = '';
  if (c.full === undefined) c.full = null;
  if (!Array.isArray(c.fields)) c.fields = [];
  c.fields = c.fields.filter(f => f && typeof f === 'object').map(f => ({
    k: String(f.k == null ? '' : f.k).slice(0, 40),
    v: String(f.v == null ? '' : f.v).slice(0, 400)
  }));
  return c;
}
function ntNpcHasCard(npc){
  const c = npc && npc.card;
  if (!c) return false;
  return !!(c.full || c.title || c.intro || (Array.isArray(c.fields) && c.fields.some(f => f.k || f.v)));
}

/* ============ 头像裁切（对话行里的小头像） ============ */
/* 胸像不一定是正方形构图（比如一个圆滚滚的团子，脸只占中间一小块），
   所以每个 NPC 带一组「框形状 + 缩放 + 横向/纵向取景」参数，作者自己把脸卡到框中间。 */
const NT_AVATAR_SHAPES = [
  { v: 'round', t: '圆形' },
  { v: 'square', t: '方形' },
  { v: 'tall', t: '竖长（3:4）' }
];
function ntDefaultAvatar(){
  /* 默认对准胸像的中心：多数人传的是胸像，脸在画面中间偏上 */
  return { shape: 'round', zoom: 1, x: 50, y: 46 };
}
function ntEnsureAvatar(npc){
  if (!npc) return ntDefaultAvatar();
  const a = npc.avatar = Object.assign(ntDefaultAvatar(), npc.avatar || {});
  if (!NT_AVATAR_SHAPES.some(s => s.v === a.shape)) a.shape = 'round';
  const z = +a.zoom;
  a.zoom = (isFinite(z) && z > 0) ? Math.min(3, Math.max(0.6, z)) : 1;
  const x = +a.x, y = +a.y;
  a.x = isFinite(x) ? Math.min(100, Math.max(0, x)) : 50;
  a.y = isFinite(y) ? Math.min(100, Math.max(0, y)) : 12;
  return a;
}
/* 内联样式：object-position 定取景中心，transform 定缩放（以同一个点为中心，方便卡头部） */
function ntAvatarStyle(npc){
  const a = ntEnsureAvatar(npc);
  const px = a.x.toFixed(1), py = a.y.toFixed(1);
  return 'object-position:' + px + '% ' + py + '%;' +
    'transform:scale(' + a.zoom.toFixed(2) + ');' +
    'transform-origin:' + px + '% ' + py + '%';
}
/* 头像框的额外类名（形状） */
function ntAvatarShape(npc){
  return 'shape-' + ntEnsureAvatar(npc).shape;
}

/* ============ 立绘差分（表情拆分） ============ */
/* 对话里写【林晚2】= 林晚的 2 号差分；数字只是序号，显示名字仍然是「林晚」。
   没配这个序号就往前退（3 → 2 → 1），一个都没有就用 NPC 的基础立绘。 */
function ntSplitAlt(who){
  const s = String(who == null ? '' : who).trim();
  const m = s.match(/^(.*?)(\d{1,2})$/);
  if (m && m[1]) return { base: m[1], key: m[2] };
  return { base: s, key: '' };
}
function ntNpcAlts(npc){
  if (!npc) return [];
  if (!Array.isArray(npc.alts)) npc.alts = [];
  return npc.alts;
}
function ntNpcAlt(npc, key){
  if (!npc || !key) return null;
  const k = parseInt(key, 10);
  if (!isFinite(k)) return null;
  const list = ntNpcAlts(npc).filter(a => a && a.k);
  for (let i = k; i >= 1; i--){
    const hit = list.find(a => String(a.k) === String(i));
    if (hit) return hit;
  }
  return null;
}
/* 差分里没传图的那一格，逐级回退到基础立绘 */
function ntNpcBust(npc, key){
  if (!npc) return null;
  const a = ntNpcAlt(npc, key);
  return (a && a.portrait) || npc.portrait || null;
}
function ntNpcFull(npc, key){
  if (!npc) return null;
  const a = ntNpcAlt(npc, key);
  return (a && a.full) || (npc.card && npc.card.full) || npc.portrait || null;
}
/* 舞台立绘的 who 支持 "npc_1#2" 这种写法（id 里本来就有数字，所以用 # 分隔） */
function ntCastWho(cast){
  const raw = String((cast && cast.who) || '');
  const i = raw.indexOf('#');
  return i > 0 ? { who: raw.slice(0, i), key: raw.slice(i + 1) } : { who: raw, key: '' };
}

/* ============ 演出（舞台）背景库 ============ */
function ntStageBgs(story){
  const s = story && story.settings;
  return (s && s.stage && Array.isArray(s.stage.bgs)) ? s.stage.bgs : [];
}
function ntStageBg(story, id){
  return ntStageBgs(story).find(b => b.id === id) || null;
}
/* 节点是否真的走演出模式 */
function ntHasStage(n){
  if (!n || !n.stage || n.stage.on === false) return false;
  return !!(n.stage.bg || (Array.isArray(n.stage.cast) && n.stage.cast.length));
}
function ntDefaultStage(){
  return { on: true, bg: null, cast: [] };
}
/* 舞台立绘：优先全身立绘，退回对话胸像；'__hero' 是主角 */
const NT_HERO_CAST = '__hero';
function ntCastImage(story, cast, heroPortrait){
  if (!cast) return null;
  if (cast.who === NT_HERO_CAST) return heroPortrait || null;
  const p = ntCastWho(cast);
  const npc = (story.npcs || []).find(n => n.id === p.who) || (story.npcs || []).find(n => n.name === p.who)
    || (story.npcs || []).find(n => n.name === ntSplitAlt(p.who).base);
  if (!npc) return null;
  return ntNpcFull(npc, p.key);
}
const NT_CAST_POS = [
  { v: 'left', t: '左' }, { v: 'center', t: '中' }, { v: 'right', t: '右' }
];
/* pos 只是快捷档位，真正的横向位置看 x（百分比，0=最左 100=最右） */
const NT_CAST_X = { left: 24, center: 50, right: 76 };
function ntCastX(cast){
  const raw = cast && cast.x;
  const x = (raw === null || raw === undefined || raw === '') ? NaN : +raw;
  if (isFinite(x) && x >= 0 && x <= 100) return Math.round(x);
  const pos = (cast && cast.pos) || 'center';
  return NT_CAST_X[pos] == null ? 50 : NT_CAST_X[pos];
}
/* 主角的立绘一律排在右半边 */
function ntCastIsHero(cast){ return !!cast && cast.who === NT_HERO_CAST; }
/* 立绘的纵向微调：y = 底边抬起（正）/压下（负）的百分比；h = 立绘高度百分比（100 = 占满舞台） */
function ntCastY(cast){
  const raw = cast && cast.y;
  const v = (raw === null || raw === undefined || raw === '') ? NaN : +raw;
  return isFinite(v) ? Math.min(45, Math.max(-30, Math.round(v))) : 0;
}
function ntCastH(cast){
  const raw = cast && cast.h;
  const v = (raw === null || raw === undefined || raw === '') ? NaN : +raw;
  return isFinite(v) ? Math.min(140, Math.max(50, Math.round(v))) : 100;
}

/* ============ 打字音效 ============ */
/* 预设都是运行时用 Web Audio 合成的，工程里不存音频文件；只有「自定义」需要内嵌 dataURL。 */
const NT_SFX_PRESETS = [
  { v: 'off', t: '静音' },
  { v: 'type', t: '打字机（RPG 常用）' },
  { v: 'soft', t: '轻敲' },
  { v: 'beep', t: '电子音' },
  { v: 'wood', t: '木鱼' },
  { v: 'bell', t: '铃' },
  { v: 'custom', t: '自定义音频' }
];
function ntSfxPreset(v){
  return NT_SFX_PRESETS.find(p => p.v === v) || NT_SFX_PRESETS[0];
}
function ntDefaultSfx(){
  return { typing: 'off', volume: 0.4, data: null, name: '' };
}
/* 卡片上的 sfx 为空 = 跟随全局；'off' = 这张卡静音；其它 = 覆盖全局 */
function ntSfxOf(story, node){
  const g = (story && story.settings && story.settings.sfx) || ntDefaultSfx();
  const key = (node && node.sfx) || '';
  const typing = key && key !== 'inherit' ? key : (g.typing || 'off');
  return {
    typing: typing,
    volume: g.volume == null ? 0.4 : +g.volume,
    data: g.data || null,
    name: g.name || ''
  };
}

/* 导入校验：只接受安全的变量名/变量值，避免主题包破坏页面 */
function ntSanitizeThemePack(raw, story){
  const errs = [];
  let pack = raw;
  if (typeof pack === 'string'){
    try { pack = JSON.parse(pack); } catch(e){ return { ok: false, errors: ['JSON 解析失败：' + e.message], pack: null }; }
  }
  if (!pack || typeof pack !== 'object' || Array.isArray(pack)) return { ok: false, errors: ['主题包必须是一个 JSON 对象'], pack: null };
  const fmt = pack.format || NT_THEME_PACK_FORMAT;
  if (fmt !== NT_THEME_PACK_FORMAT) errs.push('format 必须是 "' + NT_THEME_PACK_FORMAT + '"（当前：' + fmt + '）');
  const name = String(pack.name == null ? '' : pack.name).trim();
  if (!name) errs.push('缺少 name（主题显示名）');
  let id = String(pack.id == null ? '' : pack.id).trim().toLowerCase().replace(/\s+/g, '-');
  if (!id) id = 'custom-' + Math.random().toString(36).slice(2, 7);
  if (!/^[a-z0-9][a-z0-9_-]{1,23}$/.test(id)) errs.push('id 只能用小写字母 / 数字 / - / _，长度 2–24（当前：' + id + '）');
  if (NT_THEME_IDS.includes(id)) errs.push('id「' + id + '」和内置主题重名，请换一个');
  const varsIn = pack.vars || pack.cssVars || {};
  if (!varsIn || typeof varsIn !== 'object' || Array.isArray(varsIn)) errs.push('vars 必须是一个对象（CSS 变量 → 值）');
  const vars = {};
  Object.keys(varsIn || {}).forEach(k => {
    const key = String(k).startsWith('--') ? String(k) : '--' + String(k);
    if (!/^--[a-zA-Z0-9-]{1,40}$/.test(key)){ errs.push('变量名不合法：' + k); return; }
    let v = String(varsIn[k] == null ? '' : varsIn[k]).trim();
    if (!v) return;
    if (/[;{}<>\\]/.test(v)){ errs.push('变量 ' + key + ' 的值里有非法字符（; { } < > \\），只能写纯 CSS 值'); return; }
    if (v.length > 200) v = v.slice(0, 200);
    vars[key] = v;
  });
  const missing = NT_THEME_REQUIRED_VARS.filter(k => !vars[k]);
  if (missing.length) errs.push('缺少必需的变量：' + missing.join('、'));
  let css = pack.css == null ? '' : String(pack.css);
  if (css){
    if (css.length > 60000) errs.push('css 太长了（上限 60KB）');
    if (/<\/?\s*script|<\/?\s*style|javascript:|expression\s*\(/i.test(css)) errs.push('css 里不允许出现脚本 / style 标签 / javascript:');
    if (!/\{scope\}|\{body\}/.test(css)) errs.push('css 里必须用 {scope}（=.ui-主题id）或 {body}（=body.ui-主题id）占位符');
  }
  let textPresets = null;
  if (pack.textPresets && typeof pack.textPresets === 'object'){
    const pick = list => (Array.isArray(list) ? list : []).map(x => {
      if (Array.isArray(x)) return { t: String(x[0] || '').slice(0, 12), v: ntRichHex(x[1]) };
      if (x && typeof x === 'object') return { t: String(x.t || x.name || '').slice(0, 12), v: ntRichHex(x.v || x.value) };
      return null;
    }).filter(x => x && x.v).slice(0, 12);
    const c = pick(pack.textPresets.colors);
    const h = pick(pack.textPresets.highlights);
    if (c.length || h.length) textPresets = { colors: c, highlights: h };
  }
  const ct = ntCustomThemes(story);
  if (ct.length >= 20) errs.push('自定义主题最多 20 套，请先删掉用不到的');
  if (errs.length) return { ok: false, errors: errs, pack: null };
  return {
    ok: true, errors: [],
    pack: {
      id: id,
      name: name.slice(0, 24),
      desc: String(pack.desc || '').slice(0, 60),
      author: String(pack.author || '').slice(0, 40),
      vars: vars,
      css: css,
      textPresets: textPresets
    }
  };
}
/* 生成自定义主题的样式表（编辑器与导出共用这一份） */
function ntCustomThemeCss(story){
  const list = ntCustomThemes(story);
  if (!list.length) return '';
  return list.map(t => {
    const sel = '.ui-' + t.id;
    const bodySel = 'body.ui-' + t.id;
    const vars = Object.keys(t.vars || {}).map(k => k + ':' + t.vars[k] + ';').join('');
    let out = '/* ===== 自定义主题：' + String(t.name || t.id).replace(/[*\/]/g, '') + ' ===== */\n';
    out += bodySel + ',' + sel + '{' + vars + '}\n';
    if (t.css) out += t.css.replace(/\{scope\}/g, sel).replace(/\{body\}/g, bodySel) + '\n';
    return out;
  }).join('');
}

const NT_UI_SCALES = [0.75, 0.8, 0.9, 1, 1.1, 1.25, 1.5];
function ntUiScaleKey(view){ return 'nt_ui_scale_' + (view === 'player' ? 'player' : 'editor'); }
function ntUiScaleGet(view){
  try {
    const v = parseFloat(localStorage.getItem(ntUiScaleKey(view)));
    if (isFinite(v) && v >= 0.5 && v <= 2) return v;
  } catch(e){}
  return 1;
}
function ntUiScaleSet(view, v){
  const s = Math.min(2, Math.max(0.5, +v || 1));
  try { localStorage.setItem(ntUiScaleKey(view), String(s)); } catch(e){}
  return s;
}
function ntUiScaleApply(view){
  const el = document.getElementById('app');
  const v = ntUiScaleGet(view);
  if (el) el.style.zoom = String(v);
  return v;
}
function ntUiScalePct(view){ return Math.round(ntUiScaleGet(view) * 100) + '%'; }

function ntMakeNode(type, id, x, y){
  const base = { id, type, x: Math.round(x), y: Math.round(y), title: '', chapter: '', time: null, stage: null, pageLines: 0 };
  switch(type){
    case 'story':
      return { ...base, title: '新剧情', text: '', effects: [], next: null };
    case 'choice':
      return { ...base, title: '新选项', text: '', lockedMode: 'hide', choices: [
        { text: '选项一', conditions: [], effects: [], next: null },
        { text: '选项二', conditions: [], effects: [], next: null }
      ]};
    case 'check':
      return { ...base, title: '新检定', text: '',
        check: { die: 20, bonus: { type: 'none', id: null }, dc: 12, showRoll: true, successNext: null, failNext: null } };
    case 'effect':
      return { ...base, title: '数值变更', text: '', effects: [], next: null };
    case 'quest':
      return { ...base, title: '任务变更', text: '',
        quest: { action: 'start', id: 'q1', name: '新任务', desc: '' }, next: null };
    case 'ending':
      return { ...base, title: '新结局', text: '', ending: { name: '新结局', desc: '' } };
    case 'jump':
      return { ...base, title: '章节跳转', text: '', target: null };
    case 'random':
      return { ...base, title: '随机事件', text: '',
        outcomes: [ { next: null, weight: 50 }, { next: null, weight: 50 } ] };
    case 'cg':
      return { ...base, title: '新插图', image: null, caption: '', text: '', effects: [], next: null };
    case 'battle':
      return { ...base, title: '新战斗', text: '', effects: [], battle: {
        enemy: { name: '拦路者', hp: 30, atk: 6, def: 1 },
        hpAttr: null,
        atkBonus: { type: 'none', id: null },
        defBonus: { type: 'none', id: null },

/* 读取当前主题下的 CSS 变量（主题类挂在 body 上） */
function ntCssVar(name, fallback){
  try {
    const v = getComputedStyle(document.body).getPropertyValue(name).trim();
    return v || fallback;
  } catch(e){ return fallback; }
}

/* 当前主题的节点类型色 */
function ntNodePalette(){
  const out = {};
  for (const k in NT_NODE_TYPES) out[k] = ntCssVar('--tc-' + k, NT_NODE_TYPES[k].color);
  return out;
}

  return NT_TILES.map(t => ntCssVar('--tile-' + t.v, t.c));

/* SVG 立绘：编码成 dataURI（encodeURIComponent 会处理 # 等字符） */
function ntSvgUri(svg){
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(String(svg).replace(/\s+/g, ' ').trim());
}

/* 按目标尺寸重建地图字符串（保留左上角重叠部分） */function ntResizeTiles(old, cols, rows){
  const out = [];
  for (let y = 0; y < rows; y++){
    const src = String((old && old[y]) || '');
    let line = '';
    for (let x = 0; x < cols; x++){
      const ch = src[x];
      line += (ch >= '1' && ch <= '5') ? ch : '0';
    }
    out.push(line);
  }
  return out;
}

/* 导入图片：压缩到 maxSide 以内，输出 dataURL（内嵌进 story.json，导出不丢） */
function ntImportImage(file, maxSide, cb, mode){
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, (maxSide || 512) / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      const mime = (mode && mode.mime) || 'image/png';
      cb(mode && mode.quality !== undefined
        ? cv.toDataURL(mime, mode.quality)
        : cv.toDataURL(mime));
    };
    img.onerror = () => { if (typeof ntToast !== 'undefined') ntToast('图片读取失败', 'warn'); };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

/* 补齐 story 的可选字段（npcs / settings / 地图），兼容旧版本存档 */
function ntEnsureSettings(story){
  if (!story.meta) story.meta = { title: '', counters: {} };
  const meta = story.meta;
  meta.counters = Object.assign(
    { node: 0, quest: 0, attr: 0, skill: 0, item: 0, eq: 0, npc: 0, poi: 0, cat: 0, ch: 0, bg: 0 },
    meta.counters || {});
  if (!story.character) story.character = {};
  if (!Array.isArray(story.character.attributes)) story.character.attributes = [];
  if (!Array.isArray(story.character.skills)) story.character.skills = [];
  if (!Array.isArray(story.character.items)) story.character.items = [];
  if (!Array.isArray(story.character.equipment)) story.character.equipment = [];
  if (!story.character.currency) story.character.currency = { id: 'cred', name: '货币', value: 0 };
  if (story.character.currency.id === undefined) story.character.currency.id = 'cred';
  story.character.attributes.forEach(a => { if (a.alloc === undefined) a.alloc = false; });
  /* 技能：除检定值外，还能当战斗技能用（combat 打开才出现在战斗菜单） */
  story.character.skills.forEach(s => {
    if (s.alloc === undefined) s.alloc = false;
    s.combat = !!s.combat;
    s.power = Math.max(0, Math.round(+s.power || 0));
    s.cost = Math.max(0, Math.round(+s.cost || 0));
    s.costAttr = s.costAttr || null;
    s.heal = Math.max(0, Math.round(+s.heal || 0));
    if (s.line == null) s.line = '';
  });
  /* 道具：可以带一个战斗内效果 */
  story.character.items.forEach(it => {
    if (!it.use || typeof it.use !== 'object') it.use = { kind: 'none', attr: null, value: 0 };
    if (['none', 'heal', 'damage', 'cure'].indexOf(it.use.kind) < 0) it.use.kind = 'none';
    it.use.attr = it.use.attr || null;
    it.use.value = Math.round(+it.use.value || 0);
  });
  story.character.equipment.forEach(e => {
    if (!e.id) e.id = 'eq_' + Math.random().toString(36).slice(2, 7);
    if (!e.name) e.name = '新装备';
    if (e.desc === undefined) e.desc = '';
    if (!['weapon', 'armor', 'accessory'].includes(e.slot)) e.slot = 'weapon';
    e.atk = +e.atk || 0;
    e.def = +e.def || 0;
  });
  if (!Array.isArray(story.npcs)) story.npcs = [];
  story.npcs = story.npcs.filter(n => n && typeof n === 'object');
  story.npcs.forEach(n => {
    if (!n.id) n.id = 'npc_' + Math.random().toString(36).slice(2, 7);
    if (n.name === undefined || n.name === null) n.name = '新角色';
    if (n.portrait === undefined) n.portrait = null;
    ntEnsureNpcCard(n);
    ntEnsureAvatar(n);
    /* 差分（表情拆分）：k 是序号，1 开始 */
    if (!Array.isArray(n.alts)) n.alts = [];
    n.alts = n.alts.filter(a => a && a.k !== undefined && a.k !== null && String(a.k) !== '')
      .map(a => ({
        k: String(Math.max(1, Math.min(99, parseInt(a.k, 10) || 1))),
        portrait: a.portrait || null,
        full: a.full || null
      }))
      .sort((a, b) => +a.k - +b.k).slice(0, 30);
  });
  const s = story.settings = story.settings || {};
  s.portraits = s.portraits !== false;
  s.features = Object.assign(
    { inventory: true, equipment: true, quests: true, gallery: true, npcCard: true }, s.features || {});
  ['inventory', 'equipment', 'quests', 'gallery', 'npcCard'].forEach(k => {
    if (typeof s.features[k] !== 'boolean') s.features[k] = true;
  });
  /* 自定义 UI 主题：先清洗，再参与 ui 合法性校验 */
  if (!Array.isArray(s.customThemes)) s.customThemes = [];
  s.customThemes = s.customThemes.filter(t => t && typeof t === 'object' && t.id && t.vars)
    .slice(0, 20).map(t => {
      const vars = {};
      Object.keys(t.vars || {}).forEach(k => {
        const key = String(k).startsWith('--') ? String(k) : '--' + k;
        if (/^--[a-zA-Z0-9-]{1,40}$/.test(key)) vars[key] = String(t.vars[k] == null ? '' : t.vars[k]);
      });
      return {
        id: String(t.id).toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 24),
        name: String(t.name || t.id).slice(0, 24),
        desc: String(t.desc || '').slice(0, 60),
        author: String(t.author || '').slice(0, 40),
        vars: vars,
        css: typeof t.css === 'string' ? t.css : '',
        textPresets: (t.textPresets && typeof t.textPresets === 'object') ? t.textPresets : null
      };
    }).filter(t => t.id && !NT_THEME_IDS.includes(t.id));
  /* 演出背景库 */
  s.stage = Object.assign({ bgs: [] }, s.stage || {});
  if (!Array.isArray(s.stage.bgs)) s.stage.bgs = [];
  s.stage.bgs = s.stage.bgs.filter(b => b && b.id && b.image).map(b => ({
    id: String(b.id), name: String(b.name || '背景').slice(0, 40), image: b.image
  }));
  s.charCreation = Object.assign(
    { enabled: false, points: 10, intro: '', portraits: [], profileCats: [] }, s.charCreation || {});
  if (!Array.isArray(s.charCreation.portraits)) s.charCreation.portraits = [];
  if (!Array.isArray(s.charCreation.profileCats)) s.charCreation.profileCats = [];
  s.charCreation.profileCats.forEach(c => {
    if (!c.name) c.name = '类别';
    if (c.type !== 'text' && c.type !== 'select') c.type = 'select';
    if (!Array.isArray(c.options)) c.options = [];
  });
  s.time = Object.assign(
    { enabled: false, startDay: 1, startHour: 9, startMin: 0 }, s.time || {});
  /* 打字音效（全局默认，卡片可覆盖） */
  s.sfx = Object.assign(ntDefaultSfx(), s.sfx || {});
  if (!NT_SFX_PRESETS.some(p => p.v === s.sfx.typing)) s.sfx.typing = 'off';
  s.sfx.volume = Math.min(1, Math.max(0, isFinite(+s.sfx.volume) ? +s.sfx.volume : 0.4));
  if (typeof s.sfx.data !== 'string') s.sfx.data = null;
  if (typeof s.sfx.name !== 'string') s.sfx.name = '';
  s.ui = Object.assign({ editor: 'cyber', player: 'cyber' }, s.ui || {});
  const THEMES = NT_THEME_IDS.concat(s.customThemes.map(t => t.id));
  ['editor', 'player'].forEach(k => {
    if (s.ui[k] === 'ff14') s.ui[k] = 'gilt';          // v3.1：ff14 更名为 gilt
    if (!THEMES.includes(s.ui[k])) s.ui[k] = 'cyber';
  });
  if (!Array.isArray(story.chapters)) story.chapters = [];
  story.chapters.forEach(c => {
    if (!c.id) c.id = 'ch_' + Math.random().toString(36).slice(2, 7);
    if (!c.color) c.color = '#378ADD';
  });
  if (!Array.isArray(story.nodes)) story.nodes = [];
  story.nodes.forEach(n => {
    if (n.chapter === undefined || n.chapter === null) n.chapter = '';
    if (n.time === undefined) n.time = null;
    /* 演出分页：0 = 按对话框高度自动分页，N = 每页最多 N 段 */
    n.pageLines = Math.max(0, Math.min(20, Math.round(+n.pageLines || 0)));
    if (!NT_NODE_TYPES[n.type]) n.type = 'story';          // 未知类型兜底，避免旧档/手改档渲染崩
    /* 卡片级打字音效：'' = 跟随全局 */
    const sfxKeys = NT_SFX_PRESETS.map(p => p.v);
    n.sfx = (n.sfx && n.sfx !== 'inherit' && sfxKeys.indexOf(n.sfx) >= 0) ? n.sfx : '';
    /* 演出（舞台）配置 */
    if (n.stage && typeof n.stage === 'object'){
      n.stage = Object.assign(ntDefaultStage(), n.stage);
      if (n.stage.bg && !ntStageBg(story, n.stage.bg)) n.stage.bg = null;
      if (!Array.isArray(n.stage.cast)) n.stage.cast = [];
      n.stage.cast = n.stage.cast.filter(c => c && c.who).map(c => {
        const x = (c.x === null || c.x === undefined || c.x === '') ? NaN : +c.x;
        const y = (c.y === null || c.y === undefined || c.y === '') ? NaN : +c.y;
        const hh = (c.h === null || c.h === undefined || c.h === '') ? NaN : +c.h;
        return {
          who: String(c.who),
          pos: NT_CAST_POS.some(p => p.v === c.pos) ? c.pos : 'center',
          /* x 是自由调的位置（百分比）；null = 用 pos 档位换算 */
          x: (isFinite(x) && x >= 0 && x <= 100) ? Math.round(x) : null,
          /* y 纵向微调（正数抬高，让头露出来）；h 立绘大小 */
          y: isFinite(y) ? Math.min(45, Math.max(-30, Math.round(y))) : 0,
          h: isFinite(hh) ? Math.min(140, Math.max(50, Math.round(hh))) : 100
        };
      }).slice(0, 4);
    } else n.stage = null;
    if (n.type === 'cg'){
      if (n.image === undefined) n.image = null;
      if (n.caption === undefined) n.caption = '';
      /* 画面填充：默认铺满整屏（和演出模式一样），想完整显示可改成 contain */
      n.cgFit = (n.cgFit === 'contain') ? 'contain' : 'cover';
      if (!Array.isArray(n.effects)) n.effects = [];
      if (n.next === undefined) n.next = null;
    }
    if (n.type === 'battle'){
      const b = n.battle = Object.assign({
        enemy: {}, hpAttr: null,
        atkBonus: { type: 'none', id: null }, defBonus: { type: 'none', id: null },
        winNext: null, loseNext: null,
        attackLines: [], hurtLines: [], winLine: '', loseLine: ''
      }, n.battle || {});
      b.enemy = Object.assign({ name: '拦路者', hp: 30, atk: 6, def: 1, image: null }, b.enemy || {});
      if (b.enemy.image === undefined) b.enemy.image = null;
      /* 战斗演出：敌人立绘放舞台正中；没有图片时退回普通卡片 */
      b.stage = !!b.stage;
      if (!Array.isArray(b.attackLines) || !b.attackLines.length) b.attackLines = ntBattleDefaultLines('attack');
      if (!Array.isArray(b.hurtLines) || !b.hurtLines.length) b.hurtLines = ntBattleDefaultLines('hurt');
      if (b.hpAttr === undefined) b.hpAttr = null;
      if (!b.atkBonus) b.atkBonus = { type: 'none', id: null };
      if (!b.defBonus) b.defBonus = { type: 'none', id: null };
      if (b.winNext === undefined) b.winNext = null;
      if (b.loseNext === undefined) b.loseNext = null;
      if (b.winLine == null) b.winLine = '';
      if (b.loseLine == null) b.loseLine = '';
      if (!Array.isArray(n.effects)) n.effects = [];
    }
  });
  const m = s.map = Object.assign(
    { enabled: false, title: '地图', cols: 24, rows: 14, travelMode: 'visited', pois: [] }, s.map || {});
  if (m.travelMode !== 'always' && m.travelMode !== 'visited') m.travelMode = 'visited';  m.cols = Math.min(40, Math.max(6, parseInt(m.cols, 10) || 24));
  m.rows = Math.min(30, Math.max(4, parseInt(m.rows, 10) || 14));
  const rows = Array.isArray(m.tiles) ? m.tiles : [];
  const tilesOk = rows.length === m.rows && rows.every(r =>
    typeof r === 'string' && r.length === m.cols && /^[0-5]+$/.test(r));
  if (!tilesOk) m.tiles = ntResizeTiles(rows, m.cols, m.rows);
  if (!Array.isArray(m.pois)) m.pois = [];
  m.pois = m.pois.filter(p => p && p.x >= 0 && p.y >= 0 && p.x < m.cols && p.y < m.rows);
  m.pois.forEach(p => {
    if (!p.id) p.id = 'poi_' + Math.random().toString(36).slice(2, 7);
    if (p.node === undefined) p.node = '';
    if (!p.name) p.name = '地点';
  });
  return story;
}

/* 计数器回填（导入/加载后调用，保证自动 id 不冲突） */
function ntRecalcCounters(story){
  const c = story.meta.counters = story.meta.counters || { node:0, quest:0, attr:0, skill:0, item:0, eq:0 };
  c.npc = c.npc || 0; c.poi = c.poi || 0; c.cat = c.cat || 0; c.ch = c.ch || 0; c.eq = c.eq || 0; c.bg = c.bg || 0;
  (story.chapters || []).forEach(ch => {
    const m = String(ch.id).match(/ch_(\d+)/); if (m) c.ch = Math.max(c.ch, +m[1]);
  });
  story.nodes.forEach(n => {
    const m = String(n.id).match(/nd_(\d+)/);
    if (m) c.node = Math.max(c.node, +m[1]);
    if (n.type === 'quest' && n.quest && n.quest.id){
      const q = String(n.quest.id).match(/^q(\d+)$/);
      if (q) c.quest = Math.max(c.quest, +q[1]);
    }
  });
  (story.character.attributes||[]).forEach(a => {
    const m = String(a.id).match(/attr_(\d+)/); if (m) c.attr = Math.max(c.attr, +m[1]);
  });
  (story.character.skills||[]).forEach(s => {
    const m = String(s.id).match(/skill_(\d+)/); if (m) c.skill = Math.max(c.skill, +m[1]);
  });
  (story.character.items||[]).forEach(it => {
    const m = String(it.id).match(/item_(\d+)/); if (m) c.item = Math.max(c.item, +m[1]);
  });
  c.eq = c.eq || 0;
  (story.character.equipment||[]).forEach(eq => {
    const m = String(eq.id).match(/eq_(\d+)/); if (m) c.eq = Math.max(c.eq, +m[1]);
  });
  (story.npcs||[]).forEach(n => {
    const m = String(n.id).match(/npc_(\d+)/); if (m) c.npc = Math.max(c.npc, +m[1]);
  });
  const st = story.settings || {};
  if (st.map && Array.isArray(st.map.pois)) st.map.pois.forEach(p => {
    const m = String(p.id).match(/poi_(\d+)/); if (m) c.poi = Math.max(c.poi, +m[1]);
  });
  if (st.charCreation && Array.isArray(st.charCreation.profileCats)) st.charCreation.profileCats.forEach(cat => {
    const m = String(cat.id).match(/cat_(\d+)/); if (m) c.cat = Math.max(c.cat, +m[1]);
  });
  if (st.stage && Array.isArray(st.stage.bgs)) st.stage.bgs.forEach(b => {
    const m = String(b.id).match(/bg_(\d+)/); if (m) c.bg = Math.max(c.bg, +m[1]);
  });
  return story;
}

/* ============ 通用描述工具（编辑器预览 / 运行时提示共用） ============ */

function ntEffectDesc(story, e){
  const ch = story.character;
  if (e.type === 'attr'){
    const a = (ch.attributes||[]).find(x => x.id === e.id);
    return `${a ? a.name : e.id} ${e.op==='='?'设为':e.op==='-'?'-':'+'}${e.value}`;
  }
  if (e.type === 'skill'){
    const s = (ch.skills||[]).find(x => x.id === e.id);
    return `${s ? s.name : e.id} ${e.op==='='?'设为':e.op==='-'?'-':'+'}${e.value}`;
  }
  if (e.type === 'currency'){
    return `${ch.currency ? ch.currency.name : '货币'} ${e.op==='='?'设为':e.op==='-'?'-':'+'}${e.value}`;
  }
  if (e.type === 'item'){
    const it = (ch.items||[]).find(x => x.id === e.id);
    return `${e.op==='add'?'获得':'失去'}${it ? it.name : e.id}`;
  }
  if (e.type === 'equip'){
    const eq = (ch.equipment||[]).find(x => x.id === e.id);
    return `${e.op==='add'?'获得装备':'失去装备'}${eq ? eq.name : e.id}`;
  }
  return '?';
}

function ntConditionDesc(story, c){
  const ch = story.character;
  if (c.type === 'attr'){
    const a = (ch.attributes||[]).find(x => x.id === c.id);
    return `${a ? a.name : c.id} ${c.op} ${c.value}`;
  }
  if (c.type === 'skill'){
    const s = (ch.skills||[]).find(x => x.id === c.id);
    return `${s ? s.name : c.id} ${c.op} ${c.value}`;
  }
  if (c.type === 'currency'){
    return `${ch.currency ? ch.currency.name : '货币'} ${c.op} ${c.value}`;
  }
  if (c.type === 'item'){
    const it = (ch.items||[]).find(x => x.id === c.id);
    return `${c.op==='has'?'拥有':'未拥有'}${it ? it.name : c.id}`;
  }
  if (c.type === 'equip'){
    const eq = (ch.equipment||[]).find(x => x.id === c.id);
    return `${c.op==='has'?'拥有装备':'未拥有装备'}${eq ? eq.name : c.id}`;
  }
  if (c.type === 'quest'){
    return `任务「${c.id}」${c.op==='active'?'进行中':c.op==='done'?'已完成':'未开始'}`;
  }
  return '?';
}

  </svg>`);
}

function ntCheckFormula(story, check){
  const ch = story.character;
  let bonus = '';
  if (check.bonus && check.bonus.type === 'attr'){
    const a = (ch.attributes||[]).find(x => x.id === check.bonus.id);
    bonus = ' + ' + (a ? a.name : check.bonus.id);
  } else if (check.bonus && check.bonus.type === 'skill'){
    const s = (ch.skills||[]).find(x => x.id === check.bonus.id);
    bonus = ' + ' + (s ? s.name : check.bonus.id);
  }
  return `1d${check.die}${bonus} ≥ ${check.dc}`;
}
